<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>금융상품 통합조회 | 미래에셋증권</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===========================================================================
   미래에셋증권 금융상품 통합조회 — 디자인 토큰 (Mirae Asset Design System)
   Primary #F58220 · Secondary #043B72 · Table header #FAB072 · 1px 오렌지 룰
   =========================================================================== */
:root{
  --orange:#F58220; --orange-active:#CB6015; --orange-soft:#FAB072;
  --blue:#043B72; --blue-mid:#0086B8; --cyan:#00A9CE;
  --tan:#F0B26B; --terra:#AD624E; --soft-blue:#7E9FC3; --gray-series:#84888B;
  --canvas:#FFFFFF; --surface-soft:#ECEFF4; --surface-subtle:#F7F8FA;
  --hairline:#CDCECB; --hairline-soft:#E5E4E1; --disabled:#D7D7D7;
  --ink:#1A1A1A; --body-strong:#2C2C2C; --body:#3D3D3D; --muted:#6C6C6C; --muted-soft:#84888B;
  --up:#C62828; --down:#043B72; --success:#2E8540; --warning:#D4A017;
  --font-kr:'Spoqa Han Sans Neo','Noto Sans KR',sans-serif;
  --font-en:'Inter','Aptos','Segoe UI',system-ui,sans-serif;
  --font-num:'Inter','SF Mono',monospace;
  --space-xxs:5px; --space-xs:10px; --space-sm:14px; --space-md:19px;
  --space-lg:28px; --space-xl:38px; --space-xxl:56px; --space-section:72px;
  --r-xs:2px; --r-sm:4px;
  --aside:288px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--canvas);color:var(--body);font-family:var(--font-kr);
  font-size:17px;line-height:1.6;font-feature-settings:"tnum";}
html[lang="en"] body{font-family:var(--font-en)}
h1,h2,h3{margin:0;color:var(--ink);letter-spacing:-.3px}
h1{font-size:34px;font-weight:700;line-height:1.25}
h2{font-size:26px;font-weight:600;line-height:1.3;letter-spacing:0}
h3{font-size:19px;font-weight:600;line-height:1.3;letter-spacing:0}
p{margin:0}
a{color:var(--blue)}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--ink)}
.num{font-variant-numeric:tabular-nums;font-family:var(--font-num)}
.page{max-width:1440px;margin:0 auto;padding:0 32px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

/* ------------------------------------------------------------------ 헤더 */
.top{border-bottom:1px solid var(--hairline)}
.top-in{display:flex;align-items:center;gap:var(--space-md);padding:18px 0}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand-mark{font-size:19px;font-weight:700;color:var(--orange);letter-spacing:-.3px}
.brand-sub{font-size:14px;color:var(--muted)}
.top-act{display:flex;align-items:center;gap:var(--space-xs)}
.btn{border:1px solid var(--hairline);background:var(--canvas);border-radius:var(--r-xs);
  padding:9px 15px;font-size:15px;font-weight:500;color:var(--body-strong);white-space:nowrap}
.btn:hover{background:var(--surface-subtle);color:var(--ink)}
.btn-primary{background:var(--orange);border-color:var(--orange);color:#fff}
.btn-primary:hover{background:var(--orange-active);border-color:var(--orange-active);color:#fff}
.btn-sm{padding:6px 11px;font-size:14px}
/* 한/영 토글 — 우상단, 스크롤 고정 안 함 */
.lang-toggle{display:inline-flex;border:1px solid var(--hairline);border-radius:var(--r-xs);
  overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);background:#fff}
.lang-toggle button{border:0;background:#fff;color:var(--muted);padding:10px 17px;height:38px;
  font-family:var(--font-en);font-size:14px;font-weight:500;letter-spacing:.5px}
.lang-toggle button+button{border-left:1px solid var(--hairline)}
.lang-toggle button:hover{background:var(--surface-subtle);color:var(--ink)}
.lang-toggle button[aria-checked="true"]{background:var(--orange);color:#fff}

/* ------------------------------------------------------------------ 히어로 */
.hero{padding:var(--space-xl) 0 var(--space-lg)}
.hero-rule{height:1px;background:var(--orange);margin-bottom:var(--space-md)}
.hero-lead{font-size:19px;line-height:1.65;color:var(--body);max-width:78ch;margin-top:var(--space-sm)}
.hero-meta{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-xs);margin-top:var(--space-md)}
.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hairline);
  border-radius:var(--r-xs);padding:4px 9px;font-size:14px;color:var(--muted)}
.tag-warn{border-color:var(--orange-soft);background:#FEF6EF;color:var(--orange-active)}
/* 데이터 출처 표시 — 상품군별 실데이터/미연동 상태 */
.prov{display:flex;flex-wrap:wrap;gap:8px;margin-top:var(--space-sm)}
.prov-item{display:flex;align-items:center;gap:7px;border:1px solid var(--hairline-soft);
  border-radius:var(--r-xs);padding:5px 10px;font-size:14px;background:#fff;line-height:1.35}
.prov-item b{font-weight:600;color:var(--ink)}
.prov-item .dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.prov-live .dot{background:var(--success)} .prov-live{border-color:#B6D7BE;background:#F4FAF5}
.prov-none .dot{background:var(--muted-soft)}
.prov-fail .dot{background:var(--up)} .prov-fail{border-color:#EBC3C3;background:#FDF6F6}
.prov-item a{font-size:13px;color:var(--blue)}
.prov-item .why{color:var(--muted)}
.diag{margin-top:var(--space-sm);border:1px solid var(--hairline);border-radius:var(--r-sm);
  background:var(--surface-subtle);padding:var(--space-sm);font-size:14px;overflow-x:auto}
.diag[hidden]{display:none}
.diag table{width:100%;border-collapse:collapse;font-size:13px}
.diag th,.diag td{text-align:left;padding:4px 8px;border-bottom:1px solid var(--hairline-soft);
  vertical-align:top;font-family:var(--font-num);word-break:break-all}
.diag th{color:var(--muted);font-weight:600;white-space:nowrap}
.diag .bad{color:var(--up)} .diag .good{color:var(--success)}
.diag pre{margin:8px 0 0;font-size:12px;white-space:pre-wrap;color:var(--body)}

/* ------------------------------------------------------------------ 검색 */
.search{background:var(--surface-subtle);border-top:1px solid var(--hairline-soft);
  border-bottom:1px solid var(--hairline-soft);padding:var(--space-lg) 0}
.search-row{display:flex;gap:var(--space-xs);align-items:stretch}
.search-field{position:relative;flex:1}
.search-field input{width:100%;height:52px;padding:0 16px 0 44px;font-size:18px;
  border:1px solid var(--hairline);border-radius:var(--r-sm);background:#fff}
.search-field input:focus{border-color:var(--orange);outline:none}
.search-ico{position:absolute;left:15px;top:50%;transform:translateY(-50%);pointer-events:none}
.search .btn{height:52px;padding:0 24px;font-size:17px}
.ac{position:absolute;z-index:40;left:0;right:0;top:54px;background:#fff;border:1px solid var(--hairline);
  border-radius:var(--r-sm);box-shadow:0 8px 24px rgba(0,0,0,.10);max-height:320px;overflow:auto}
.ac[hidden]{display:none}
.ac button{display:flex;width:100%;gap:10px;align-items:baseline;border:0;background:#fff;
  text-align:left;padding:10px 14px;font-size:16px;border-bottom:1px solid var(--hairline-soft)}
.ac button:hover,.ac button.on{background:var(--surface-subtle)}
.ac .ac-cat{font-size:13px;color:var(--orange-active);flex:0 0 76px}
.ac .ac-code{margin-left:auto;font-size:13px;color:var(--muted)}
.quick{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:var(--space-sm)}
.quick-label{font-size:14px;color:var(--muted);margin-right:4px}
.chip{border:1px solid var(--hairline);background:#fff;border-radius:var(--r-xs);
  padding:6px 12px;font-size:14px;color:var(--body-strong)}
.chip:hover{background:#fff;border-color:var(--orange);color:var(--orange-active)}
.chip[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#fff}

/* ------------------------------------------------------------------ KPI */
.kpi{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--hairline-soft);
  border:1px solid var(--hairline-soft);margin:var(--space-lg) 0 0}
.kpi-cell{background:#fff;padding:var(--space-md) var(--space-md) var(--space-sm)}
.kpi-label{font-size:14px;font-weight:500;letter-spacing:.6px;color:var(--muted);text-transform:none}
.kpi-value{font-size:34px;font-weight:700;line-height:1.1;color:var(--ink);margin-top:6px;white-space:nowrap}
.kpi-value.o{color:var(--orange-active)} .kpi-value.b{color:var(--blue)}
.kpi-unit{font-size:16px;font-weight:500;color:var(--muted);margin-left:3px}

/* ------------------------------------------------------------------ 탭 */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--hairline);margin-top:var(--space-lg);
  overflow-x:auto;scrollbar-width:thin}
.tab{border:0;background:transparent;padding:14px 18px;font-size:17px;font-weight:500;
  color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--orange)}
.tab .cnt{font-size:14px;color:var(--muted-soft);margin-left:6px;font-variant-numeric:tabular-nums}
.tab[aria-selected="true"] .cnt{color:var(--orange-active)}

/* ------------------------------------------------------------------ 본문 그리드 */
.main{display:grid;grid-template-columns:var(--aside) 1fr;gap:var(--space-xl);
  padding:var(--space-lg) 0 var(--space-xxl);align-items:start}
/* 그리드 자식의 min-width:auto 때문에 표가 페이지를 밀어내지 않도록 고정 */
.main>*{min-width:0}
.aside{position:sticky;top:var(--space-md);max-height:calc(100vh - 40px);overflow-y:auto;
  padding-right:6px;scrollbar-width:thin}
.aside-head{display:flex;align-items:center;justify-content:space-between;
  padding-bottom:10px;border-bottom:1px solid var(--orange)}
.aside-title{font-size:19px;font-weight:700;color:var(--ink)}
.fgroup{border-bottom:1px solid var(--hairline-soft);padding:var(--space-sm) 0}
.fgroup-head{display:flex;width:100%;align-items:center;justify-content:space-between;
  border:0;background:transparent;padding:0;font-size:16px;font-weight:600;color:var(--ink)}
.fgroup-head .caret{color:var(--muted);font-size:12px}
.fgroup-body{margin-top:10px}
.fgroup[data-open="0"] .fgroup-body{display:none}
.fopts{display:grid;gap:6px}
.fopts[data-cols="2"]{grid-template-columns:1fr 1fr}
.fopts[data-cols="3"]{grid-template-columns:repeat(3,1fr)}
.fopts[data-cols="4"]{grid-template-columns:repeat(4,1fr)}
.fopt{display:flex;align-items:center;gap:7px;font-size:15px;color:var(--body);
  border:1px solid var(--hairline-soft);border-radius:var(--r-xs);padding:6px 8px;background:#fff;
  text-align:left;line-height:1.25}
.fopt:hover{border-color:var(--orange);color:var(--ink)}
.fopt[aria-pressed="true"]{border-color:var(--orange);background:#FEF6EF;color:var(--orange-active);font-weight:500}
.fopt .box{width:13px;height:13px;flex:0 0 13px;border:1px solid var(--hairline);border-radius:1px;background:#fff}
.fopt[aria-pressed="true"] .box{background:var(--orange);border-color:var(--orange)}
.frange{display:flex;align-items:center;gap:6px}
.frange input{width:100%;min-width:0;height:34px;padding:0 8px;font-size:15px;text-align:right;
  border:1px solid var(--hairline);border-radius:var(--r-xs);font-variant-numeric:tabular-nums}
.frange .tilde{color:var(--muted)}
.frange .unit{font-size:13px;color:var(--muted);white-space:nowrap}
.applied{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.applied-chip{display:inline-flex;align-items:center;gap:6px;background:#FEF6EF;color:var(--orange-active);
  border:1px solid var(--orange-soft);border-radius:var(--r-xs);padding:3px 8px;font-size:13px}
.applied-chip button{border:0;background:transparent;padding:0;line-height:1;color:inherit;font-size:14px}
.applied-none{font-size:14px;color:var(--muted-soft);margin-top:8px}
.watchbox{margin-top:var(--space-lg)}
.watch-list{display:flex;flex-direction:column;gap:5px;margin-top:10px}
.watch-item{display:flex;gap:6px;align-items:center;border:1px solid var(--hairline-soft);
  border-radius:var(--r-xs);padding:6px 8px;background:#fff;font-size:14px;text-align:left;line-height:1.3}
.watch-item:hover{border-color:var(--orange)}
.watch-item .star{color:var(--orange)}
.watch-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint{font-size:14px;color:var(--muted-soft);line-height:1.5}

/* ------------------------------------------------------------------ 결과 툴바 */
.res-head{display:flex;align-items:flex-end;gap:var(--space-md);flex-wrap:wrap;
  padding-bottom:10px;border-bottom:1px solid var(--orange)}
.res-title{font-size:26px;font-weight:600;color:var(--ink)}
.res-count{font-size:16px;color:var(--muted)}
.res-count b{color:var(--orange-active);font-weight:700}
.res-tools{display:flex;align-items:center;gap:var(--space-xs);margin-left:auto}
.res-tools select{height:36px;border:1px solid var(--hairline);border-radius:var(--r-xs);
  padding:0 10px;font-size:15px;background:#fff}
.seg{display:inline-flex;border:1px solid var(--hairline);border-radius:var(--r-xs);overflow:hidden}
.seg button{border:0;background:#fff;padding:7px 13px;font-size:14px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--hairline)}
.seg button[aria-pressed="true"]{background:var(--orange);color:#fff}

/* ------------------------------------------------------------------ 표 */
.twrap{overflow-x:auto;border:1px solid var(--hairline);border-top:0}
table.data{width:100%;border-collapse:collapse;font-size:16px;min-width:940px}
table.data th,table.data td{border-bottom:1px solid var(--hairline-soft);padding:10px 12px;text-align:left}
table.data thead th{background:var(--orange-soft);color:#1A1A1A;font-weight:700;font-size:15px;
  white-space:nowrap;border-bottom:1px solid var(--hairline);position:sticky;top:0;z-index:2}
table.data thead th.sortable{cursor:pointer}
table.data thead th.sortable:hover{background:#F7A75C}
table.data tbody tr:hover{background:var(--surface-subtle)}
table.data tbody tr.picked{background:#FEF6EF}
table.data th.n{text-align:right}
table.data td.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--font-num);white-space:nowrap}
table.data td.c{text-align:center}
.pname{display:block;border:0;background:transparent;padding:0;text-align:left;font-size:16px;
  font-weight:600;color:var(--ink);line-height:1.35;max-width:38ch}
.pname:hover{color:var(--orange-active);text-decoration:underline}
.psub{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:3px}
.badge{display:inline-block;border:1px solid var(--hairline);border-radius:var(--r-xs);
  padding:1px 6px;font-size:12px;color:var(--muted);white-space:nowrap}
.badge-cat{border-color:var(--orange-soft);background:#FEF6EF;color:var(--orange-active)}
.badge-open{border-color:var(--success);color:var(--success)}
.badge-closing{border-color:var(--up);color:var(--up);font-weight:600}
.badge-closed{background:var(--disabled);border-color:var(--disabled);color:#4a4a4a}
.grade{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:14px}
.grade i{width:22px;height:22px;border-radius:var(--r-xs);display:inline-grid;place-items:center;
  font-style:normal;font-size:13px;font-weight:700;color:#fff;font-family:var(--font-num)}
.g1{background:#C62828}.g2{background:#CB6015}.g3{background:var(--orange)}
.g4{background:var(--blue-mid)}.g5{background:var(--blue)}.g6{background:var(--muted-soft)}
.up{color:var(--up);font-weight:600}.down{color:var(--down);font-weight:600}.flat{color:var(--muted)}
.star-btn{border:0;background:transparent;padding:2px 4px;font-size:17px;color:var(--disabled);line-height:1}
.star-btn:hover{color:var(--orange-soft)}
.star-btn[aria-pressed="true"]{color:var(--orange)}
.cbox{width:17px;height:17px;accent-color:var(--orange)}
.spark{display:block}
.empty{border:1px solid var(--hairline);border-top:0;padding:var(--space-xxl) var(--space-md);
  text-align:center;color:var(--muted);font-size:17px}

/* ------------------------------------------------------------------ 카드 보기 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:var(--space-sm);
  margin-top:var(--space-sm)}
.card{border:1px solid var(--hairline);border-radius:var(--r-sm);padding:var(--space-sm) var(--space-md);background:#fff}
.card:hover{border-color:var(--orange)}
.card-top{display:flex;gap:8px;align-items:flex-start}
.card-metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px;
  border-top:1px solid var(--hairline-soft);padding-top:10px}
.card-metrics div{min-width:0}
.card-metrics dt{font-size:13px;color:var(--muted)}
.card-metrics dd{margin:2px 0 0;font-size:18px;font-weight:700;color:var(--ink);
  font-variant-numeric:tabular-nums;font-family:var(--font-num)}
.card-foot{display:flex;align-items:center;gap:8px;margin-top:12px}

/* ------------------------------------------------------------------ 페이지네이션 */
.pager{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:var(--space-md)}
.pager button{border:1px solid var(--hairline);background:#fff;border-radius:var(--r-xs);
  min-width:36px;height:36px;padding:0 10px;font-size:15px;color:var(--body-strong)}
.pager button[aria-current="true"]{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:700}
.pager button:disabled{color:var(--disabled);cursor:default}
.pager .info{font-size:14px;color:var(--muted);margin-left:10px}

/* ------------------------------------------------------------------ 하단 섹션 */
.section{padding-top:var(--space-section)}
.section-rule{height:1px;background:var(--orange);margin-bottom:var(--space-md)}
.section-lead{font-size:17px;color:var(--muted);margin-top:8px}
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:var(--space-sm);margin-top:var(--space-md)}
.cal-item{border:1px solid var(--hairline);border-left:3px solid var(--orange);border-radius:var(--r-xs);
  padding:var(--space-sm);background:#fff;text-align:left;display:block;width:100%}
.cal-item:hover{background:var(--surface-subtle)}
.cal-item.soon{border-left-color:var(--up)}
.cal-d{font-size:20px;font-weight:700;color:var(--orange-active);font-family:var(--font-num)}
.cal-item.soon .cal-d{color:var(--up)}
.cal-name{font-size:16px;font-weight:600;color:var(--ink);margin-top:4px;line-height:1.35}
.cal-meta{font-size:14px;color:var(--muted);margin-top:4px}
.notices{margin-top:var(--space-md);display:grid;gap:10px}
.notices li{font-size:19px;line-height:1.65;color:var(--body);padding-left:16px;position:relative;list-style:none}
.notices li:before{content:"";position:absolute;left:0;top:12px;width:6px;height:1px;background:var(--orange)}
.notices{padding:0;margin-left:0}
footer{border-top:1px solid var(--hairline);margin-top:var(--space-xxl);padding:var(--space-lg) 0 var(--space-xxl)}
.foot-note{font-size:14px;color:var(--muted-soft);line-height:1.6}

/* ------------------------------------------------------------------ 비교 트레이 */
.tray{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;
  border-top:1px solid var(--orange);box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.tray[hidden]{display:none}
.tray-in{display:flex;align-items:center;gap:var(--space-sm);padding:12px 32px;max-width:1440px;margin:0 auto}
.tray-title{font-size:15px;font-weight:700;color:var(--ink);white-space:nowrap}
.tray-items{display:flex;gap:8px;flex:1;overflow-x:auto}
.tray-item{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--hairline);
  border-radius:var(--r-xs);padding:6px 10px;font-size:14px;white-space:nowrap;background:var(--surface-subtle)}
.tray-item button{border:0;background:transparent;padding:0;color:var(--muted);font-size:15px}
.tray-item button:hover{color:var(--up)}

/* ------------------------------------------------------------------ 드로어/모달 */
.scrim{position:fixed;inset:0;background:rgba(26,26,26,.42);z-index:70}
.scrim[hidden]{display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(660px,100%);background:#fff;z-index:80;
  display:flex;flex-direction:column;border-left:1px solid var(--hairline)}
.drawer[hidden]{display:none}
.drawer-head{padding:var(--space-md) var(--space-lg);border-bottom:1px solid var(--orange)}
.drawer-body{overflow-y:auto;padding:var(--space-md) var(--space-lg) var(--space-xxl);flex:1}
.drawer-foot{border-top:1px solid var(--hairline);padding:12px var(--space-lg);display:flex;gap:10px}
.dclose{border:1px solid var(--hairline);background:#fff;border-radius:var(--r-xs);width:34px;height:34px;
  display:grid;place-items:center;font-size:16px;color:var(--muted)}
.dclose:hover{color:var(--ink);background:var(--surface-subtle)}
.modal{position:fixed;inset:24px;max-width:1160px;margin:0 auto;background:#fff;z-index:80;
  display:flex;flex-direction:column;border:1px solid var(--hairline);border-top:3px solid var(--orange)}
.modal[hidden]{display:none}
.dsec{margin-top:var(--space-lg)}
.dsec-rule{height:1px;background:var(--orange);margin-bottom:12px}
.dsec h3{margin-bottom:10px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--hairline-soft);
  border:1px solid var(--hairline-soft)}
.mcell{background:#fff;padding:12px 14px}
.mcell dt{font-size:13px;color:var(--muted);letter-spacing:.4px}
.mcell dd{margin:4px 0 0;font-size:22px;font-weight:700;color:var(--ink);
  font-variant-numeric:tabular-nums;font-family:var(--font-num);line-height:1.15}
.mcell dd.sm{font-size:17px;font-family:var(--font-kr)}
html[lang="en"] .mcell dd.sm{font-family:var(--font-en)}
table.kv{width:100%;border-collapse:collapse;font-size:16px}
table.kv th{text-align:left;font-weight:500;color:var(--muted);width:40%;padding:8px 10px;
  border-bottom:1px solid var(--hairline-soft);background:var(--surface-subtle)}
table.kv td{padding:8px 10px;border-bottom:1px solid var(--hairline-soft);color:var(--ink)}
.gradebar{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin:8px 0 6px}
.gradebar div{height:26px;border-radius:1px;background:var(--surface-soft);display:grid;place-items:center;
  font-size:12px;color:var(--muted);font-family:var(--font-num)}
/* 해당 등급 칸만 등급색으로 채움 — .gradebar div 보다 우선순위가 높아야 한다 */
.gradebar div.on{color:#fff;font-weight:700}
.gradebar div.g1{background:#C62828}.gradebar div.g2{background:var(--orange-active)}
.gradebar div.g3{background:var(--orange)}.gradebar div.g4{background:var(--blue-mid)}
.gradebar div.g5{background:var(--blue)}.gradebar div.g6{background:var(--muted-soft)}
.gradenote{font-size:15px;color:var(--muted)}
.bars{display:grid;gap:8px;margin-top:6px}
.bar-row{display:grid;grid-template-columns:104px 1fr 58px;align-items:center;gap:10px;font-size:15px}
.bar-track{height:14px;background:var(--surface-soft);border-radius:1px;overflow:hidden}
.bar-fill{height:100%;background:var(--orange)}
.bar-val{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--font-num);color:var(--body)}
.chartbox{position:relative;border:1px solid var(--hairline-soft);background:var(--surface-subtle);
  border-radius:var(--r-sm);padding:12px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px;font-size:14px;color:var(--body)}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:6px}
.tip{position:absolute;z-index:5;background:var(--ink);color:#fff;font-size:13px;line-height:1.45;
  padding:7px 9px;border-radius:var(--r-xs);pointer-events:none;white-space:nowrap;
  font-variant-numeric:tabular-nums}
.tip[hidden]{display:none}
.doclist{display:flex;flex-wrap:wrap;gap:8px}
.doclist a{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hairline);
  border-radius:var(--r-xs);padding:7px 12px;font-size:15px;color:var(--body-strong);text-decoration:none}
.doclist a:hover{border-color:var(--orange);color:var(--orange-active)}
.cmp-scroll{overflow:auto;flex:1;padding:var(--space-md) var(--space-lg) var(--space-lg)}
table.cmp{width:100%;border-collapse:collapse;font-size:16px;min-width:720px}
table.cmp th,table.cmp td{border:1px solid var(--hairline-soft);padding:9px 12px;vertical-align:top}
table.cmp thead th{background:var(--orange-soft);color:var(--ink);font-size:15px;text-align:left}
table.cmp thead th:first-child{width:168px}
table.cmp tbody th{background:var(--surface-subtle);text-align:left;font-weight:500;color:var(--muted);white-space:nowrap}
table.cmp td{font-variant-numeric:tabular-nums}
table.cmp td.best{background:var(--disabled);font-weight:700;color:var(--ink)}

/* ------------------------------------------------------------------ 반응형 */
@media (max-width:1180px){
  .kpi{grid-template-columns:repeat(3,1fr)}
  .main{grid-template-columns:1fr;gap:var(--space-lg)}
  .aside{position:static}
  .aside-collapse[data-open="0"] .aside-inner{display:none}
}
@media (max-width:768px){
  .page{padding:0 20px}
  h1{font-size:26px} h2{font-size:22px}

  .hero-lead,.notices li{font-size:17px}
  .search-row{flex-wrap:wrap}
  .search-field{flex:1 0 100%}   /* 검색창은 한 줄 전체 — 버튼은 아래로 내린다 */
  .search .btn{flex:1}

  .res-tools{margin-left:0;width:100%;flex-wrap:wrap}
  .tray-in{padding:10px 20px}
  .drawer{width:100%}
  .modal{inset:0}
  .mgrid{grid-template-columns:repeat(2,1fr)}
  .top-in{flex-wrap:wrap}
}
@media (min-width:1181px){ .aside-toggle{display:none} }

/* ------------------------------------------------------------------ 인쇄 */
@media print{
  .lang-toggle,.top-act,.search,.tabs,.aside,.res-tools,.tray,.scrim,.drawer,.modal,

}

  function finalize(p) {

    var steps = [];
    if (stepKnown) {
      for (var i = 0; i < n; i++) steps.push(Math.max(60, (p.barrier || 90) - i * 5));
    } else {
      steps.push(p.barrier);
    }
    var lo = 30, hi = 110;
    function X(i) { return pad.l + (i + 0.5) / n * (W - pad.l - pad.r); }
    function Y(v) { return pad.t + (1 - (v - lo) / (hi - lo)) * (H - pad.t - pad.b); }
    var g = ['<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="display:block;height:auto"' +
      ' role="img" aria-label="' + esc(T('detail.payoff')) + '">'];
    [100, 80, 60, 40].forEach(function (v) {
      g.push('<line x1="' + pad.l + '" y1="' + Y(v) + '" x2="' + (W - pad.r) + '" y2="' + Y(v) +
        '" stroke="#A0A6A8" stroke-dasharray="3 3" stroke-width="1"/>');
      g.push('<text x="' + (pad.l - 6) + '" y="' + (Y(v) + 4) + '" text-anchor="end" font-size="11" fill="#6C6C6C">' + v + '</text>');
    });
    /* 배리어 계단 */
    steps.forEach(function (v, i) {
      var x0 = pad.l + i / n * (W - pad.l - pad.r), x1 = pad.l + (i + 1) / n * (W - pad.l - pad.r);
      g.push('<rect x="' + x0 + '" y="' + Y(v) + '" width="' + (x1 - x0) + '" height="' + (Y(lo) - Y(v)) +
        '" fill="#F58220" opacity="0.08"/>');
      g.push('<line x1="' + x0 + '" y1="' + Y(v) + '" x2="' + x1 + '" y2="' + Y(v) + '" stroke="#F58220" stroke-width="2.4"/>');
      g.push('<text x="' + X(i) + '" y="' + (Y(v) - 7) + '" text-anchor="middle" font-size="11" fill="#CB6015" font-weight="700">' + v + '%</text>');
      if (known) {
        g.push('<text x="' + X(i) + '" y="' + (H - 9) + '" text-anchor="middle" font-size="11" fill="#6C6C6C">' +
          (i + 1) * p.earlyM + (state.lang === 'ko' ? '개월' : 'M') + '</text>');
      }
    });
    if (p.knockIn) {
      g.push('<rect x="' + pad.l + '" y="' + Y(p.knockIn) + '" width="' + (W - pad.l - pad.r) + '" height="' +
        (Y(lo) - Y(p.knockIn)) + '" fill="#84888B" opacity="0.14"/>');
      g.push('<line x1="' + pad.l + '" y1="' + Y(p.knockIn) + '" x2="' + (W - pad.r) + '" y2="' + Y(p.knockIn) +
        '" stroke="#C62828" stroke-width="1.8" stroke-dasharray="6 4"/>');
      g.push('<text x="' + (pad.l + 6) + '" y="' + (Y(p.knockIn) - 6) + '" font-size="11" fill="#C62828" font-weight="700">' +
        esc(T('val.knockIn', p.knockIn)) + '</text>');
    }
    g.push('</svg>');
    var box = el('div', 'chartbox');
    box.innerHTML = g.join('');
    host.appendChild(box);
  }

  function renderFilters() {
    var host = $('#filters'); host.innerHTML = '';

    schema.forEach(function (f) {
      var open = openGroups[f.id] !== false;
      var g = el('div', 'fgroup'); g.dataset.open = open ? '1' : '0';
      var head = el('button', 'fgroup-head');
      head.type = 'button';
      head.setAttribute('aria-expanded', String(open));
      head.innerHTML = '<span>' + esc(L(f.label)) + '</span><span class="caret">' + (open ? '▲' : '▼') + '</span>';
      head.addEventListener('click', function () {
        openGroups[f.id] = !(openGroups[f.id] !== false);
        renderFilters();
      });
      g.appendChild(head);
      var body = el('div', 'fgroup-body');
      if (f.type === 'chips') {
        var wrap = el('div', 'fopts');
        wrap.dataset.cols = String(f.cols || 1);
        f.options.forEach(function (o) {
          var cur = (state.filters[f.id] && state.filters[f.id].sel) || [];
          var on = cur.indexOf(o.id) >= 0;
          var b = el('button', 'fopt');
          b.type = 'button';
          b.setAttribute('aria-pressed', String(on));
          b.innerHTML = '<span class="box"></span><span>' + esc(L(o.label)) + '</span>';
          b.addEventListener('click', function () {
            var st = state.filters[f.id] || (state.filters[f.id] = { sel: [] });
            if (!st.sel) st.sel = [];
            var i = st.sel.indexOf(o.id);
            if (i >= 0) st.sel.splice(i, 1); else st.sel.push(o.id);
            if (!st.sel.length) delete state.filters[f.id];
            state.page = 1; render();
          });
          wrap.appendChild(b);
        });
        body.appendChild(wrap);
      } else {
        var cur2 = state.filters[f.id] || {};
        var r = el('div', 'frange');
        var i1 = el('input'); i1.type = 'number'; i1.step = String(f.step || 1);
        i1.placeholder = T('filter.min'); i1.value = cur2.min != null ? cur2.min : '';
        i1.setAttribute('aria-label', L(f.label) + ' ' + T('filter.min'));
        var i2 = el('input'); i2.type = 'number'; i2.step = String(f.step || 1);
        i2.placeholder = T('filter.max'); i2.value = cur2.max != null ? cur2.max : '';
        i2.setAttribute('aria-label', L(f.label) + ' ' + T('filter.max'));
        function apply() {
          var st = state.filters[f.id] || {};
          st.min = i1.value === '' ? null : Number(i1.value);
          st.max = i2.value === '' ? null : Number(i2.value);
          if (st.min == null && st.max == null) delete state.filters[f.id];
          else state.filters[f.id] = st;
          state.page = 1; render();
        }
        i1.addEventListener('change', apply); i2.addEventListener('change', apply);
        r.appendChild(i1);
        r.appendChild(el('span', 'tilde', '~'));
        r.appendChild(i2);
        r.appendChild(el('span', 'unit', L(f.unit)));
        body.appendChild(r);
      }
      g.appendChild(body);
      host.appendChild(g);
    });

          id: id
        });
      }
    });
    Object.keys(state.quick).forEach(function (k) {
      if (state.quick[k]) chips.push({ txt: T('quick.' + k), quick: k });

          '<div><dt>' + esc(T(p.mgmtFee != null ? 'col.mgmtfee' : 'col.fee')) + '</dt><dd>' + pctPlain(p.fee != null ? p.fee : p.mgmtFee) + '</dd></div>' +
          '<div><dt>' + esc(T('col.min')) + '</dt><dd style="font-size:15px">' + esc(minAmt(p.minAmount)) + '</dd></div>' +
          '</dl>' +
          '<div class="card-foot">' + spark(p.series, 96, 26) +
          '<span style="margin-left:auto;display:flex;align-items:center;gap:6px;font-size:14px;color:#6C6C6C">' +
          esc(T('col.act')) + cmpHtml(p) + '</span></div>';
        cards.appendChild(c);
      });
      host.appendChild(cards);
    }

    /* 페이지네이션 */
    var pg = $('#pager'); pg.innerHTML = '';
    function pbtn(label, page, cur, dis) {
      var b = el('button', null, label);
      if (cur) b.setAttribute('aria-current', 'true');
      if (dis) b.disabled = true;
      else b.addEventListener('click', function () { state.page = page; render(); window.scrollTo({ top: $('#tabs').offsetTop - 12, behavior: 'smooth' }); });
      pg.appendChild(b);
    }
    pbtn(T('page.prev'), state.page - 1, false, state.page <= 1);
    var from = Math.max(1, state.page - 2), to = Math.min(pages, from + 4);
    from = Math.max(1, to - 4);
    for (var i = from; i <= to; i++) pbtn(String(i), i, i === state.page, false);
    pbtn(T('page.next'), state.page + 1, false, state.page >= pages);
    var info = el('span', 'info', T('result.of',
      ((state.page - 1) * state.per + 1) + '-' + Math.min(total, state.page * state.per),
      total.toLocaleString('en-US')));
    pg.appendChild(info);
  }

  /* ------------------------------------------------------------------ 캘린더 */
  function renderCalendar() {
    var host = $('#calList'); host.innerHTML = '';
    var rows = ALL.filter(function (p) { return p.deadlineD != null && p.deadlineD >= 0; })
      .sort(function (a, b) { return a.deadlineD - b.deadlineD; }).slice(0, 8);
    if (!rows.length) { host.appendChild(el('p', 'hint', T('cal.empty'))); return; }
    rows.forEach(function (p) {
      var b = el('button', 'cal-item' + (p.deadlineD <= 7 ? ' soon' : ''));
      b.type = 'button';
      b.innerHTML = '<span class="cal-d">' + esc(p.deadlineD === 0 ? T('cal.today') : T('cal.dleft', p.deadlineD)) + '</span>' +
        '<span class="cal-name">' + esc(L(p.name)) + '</span>' +
        '<span class="cal-meta">' + esc(T('col.coupon')) + ' <b class="num">' + pctPlain(p.coupon) + '</b> · ' +
        esc((p.underlying || []).map(function (u) { return code2label(D.UNDERLYING, u); }).join(', ')) + '</span>' +
        '<span class="cal-meta">' + esc(T('col.deadline')) + ' ' + dt(p.subEnd) + '</span>';
      b.addEventListener('click', function () { openDetail(p); });
      host.appendChild(b);
    });
  }

  /* ------------------------------------------------------------------ 상세 드로어 */
  /* 미래에셋증권 공개 페이지의 실제 링크 패턴.
     각 URL 은 해당 화면 소스(hks4116/r01.do, hks4023/n01.do, hks4023/r01.do,
     hks4318/n01_21.do, hks4036/r01.do)에서 직접 확인한 값이다.
     확인되지 않은 패턴은 만들어 쓰지 않는다. */
  var MAS = 'https://securities.miraeasset.com';
  var KRCODE = /^KR[0-9A-Z]{10}$/i;

  function productLinks(p) {
    var out = [];
    var code = String(p.code || '').trim();
    var note = '';
    var specific = false;   /* 이 상품 하나를 가리키는 링크가 있는지 */
    function add(label, url, isOne) {
      out.push({ label: label, url: url });
      if (isOne) specific = true;
    }

    if (!p.live) {
      /* 예시 데이터에는 실제 서류가 없다. 있는 척하지 않는다. */
      note = T('doc.noteSample');
    }

    if (p.cat === 'fund') {
      var fdCd = String(p.fdCd || (KRCODE.test(code) ? code : '')).trim();
      if (p.live && fdCd) {
        add(T('doc.fundDetail'), MAS + '/hks/hks4116/p11.do?fd_cd=' + encodeURIComponent(fdCd), true);
        note = T('doc.noteFund');
      }
      add(T('doc.fundSearch'), MAS + '/hks/hks4116/r01.do');
    } else if (p.cat === 'els') {
      if (p.live && p.itmNo) {
        add(T('doc.elsDetail'), MAS + '/hks/hks4023/p02.do?item_cd=' + encodeURIComponent(p.itmNo) +
          '&hlv_fn_ivst_pd_yn=' + (p.highRisk ? '1' : '0') +
          '&cpt_r=&apy_a=&omkt_drvs_pcd_nm=&omkt_drv_mult_ern_r_yn=', true);
      } else if (p.live) {
        note = T('doc.noteEls');
      }
      add(T('doc.elsList'), MAS + '/hks/hks4023/n01.do');
      add(T('doc.elsPrice'), MAS + '/hks/hks4023/r01.do');
      add(T('doc.elsCal'), MAS + '/hks/hks4022/n01.do');
    } else if (p.cat === 'etf') {
      /* ETN 종목번호(5xxxxx)는 투자설명서 PDF 가 공개되어 있다 */
      if (/^5\d{5}$/.test(code)) add(T('doc.etnPdf'), MAS + '/public/hks4000/T' + code + '.pdf', true);
      add(T('doc.etnList'), MAS + '/hks/hks4318/n01_21.do');
      if (p.live && p.sourceUrl) add(T('doc.krx'), p.sourceUrl);
    } else if (p.cat === 'bond') {
      if (KRCODE.test(code)) add(T('doc.bondDetail'), MAS + '/hks/hks4036/v01.do?itemCode=' + encodeURIComponent(code), true);
      add(T('doc.bondList'), MAS + '/hks/hks4036/r01.do');
    } else if (p.cat === 'rp') {
      add(T('doc.rpList'), MAS + '/hks/hks4033/n01.do');
      add(T('doc.cma'), MAS + '/hks/hks4311/n01.do');
    } else if (p.cat === 'wrap') {
      add(T('doc.wrap'), MAS + '/hks/hks4125/n11.do');
      add(T('doc.trust'), MAS + '/hks/hks4041/n01.do');
    } else {
      add(T('doc.finMain'), MAS + '/financeMain.do');
    }
    /* 투자설명서 원문 공시처 — 미래에셋증권 사이트 하단 '상품공시실' 과 동일 */
    add(T('doc.kofia'), 'https://dis.kofia.or.kr/');
    return { links: out, note: note, specific: specific };
  }

  function metricCells(p) {
    var out = [];
    function add(label, val, sm, cls) { out.push({ l: label, v: val, sm: sm, cls: cls }); }
    if (p.cat === 'els') {
      /* 제시수익률 0 은 '0%' 가 아니라 만기조건에 따른다는 뜻이다(원 화면과 동일) */
      add(T('col.coupon'), p.coupon == null ? DASH
        : p.coupon === 0 ? T('detail.byMaturity') : pctPlain(p.coupon), p.coupon === 0, 'up');
      if (p.maxLoss != null) add(T('detail.maxLoss'), pctPlain(p.maxLoss), false, 'down');
      if (p.pcaGrte != null) add(T('detail.pcaGrte'), pctPlain(p.pcaGrte), false);
      add(T(p.barrierIsLowest ? 'col.barrierLow' : 'col.barrier'), p.barrier == null ? DASH : p.barrier + '%');
      /* 표와 동일한 원칙: 낙인 정보가 없으면 '노낙인' 이라고 단정하지 않는다 */
      add(T('col.knockin'), p.knockIn != null ? T('val.knockIn', p.knockIn)
        : (p.knockInKnown || p.barrier != null) ? T('val.noKnockIn') : DASH, true);
      add(T('detail.obs'), p.earlyText ? p.earlyText
        : p.earlyM == null ? DASH
        : p.earlyM === 1 ? T('val.month') : T('val.everyM', p.earlyM), true);
      add(T('col.maturity'), p.maturityText ? p.maturityText : months(p.maturityM), true);
      add(T('col.deadline'), dt(p.subEnd), true);
      add(T('detail.dLeft'), days(p.deadlineD), true);
      if (p.statusText || p.progressText) add(T('detail.status'), p.statusText || p.progressText, true);
    } else if (p.cat === 'bond') {
      add(T('col.ytm'), pctPlain(p.ytm), false, 'up');
      add(T('col.coupon'), pctPlain(p.coupon));
      add(T('col.rating'), p.rating, true);
      add(T('col.residual'), years(p.residualY), true);
      add(T('col.maturity'), dt(p.maturity), true);
      add(T('col.cycle'), months(p.cycle), true);
    } else if (p.cat === 'rp') {
      add(T('col.rate'), pctPlain(p.rate), false, 'up');
      add(T('col.term'), days(p.termD), true);
      add(T('detail.ccy'), p.currency, true);
      add(T('detail.min'), minAmt(p.minAmount), true);
      add(T('col.aum'), eok(p.aum), true);
      add(T('detail.status'), code2label(D.STATUS, p.status), true);
    } else {
      /* 기간 수익률은 '응답에 있는 것만' 보여준다. 1년/3개월은 기준 항목이라
         값이 없어도 자리를 유지하고, 나머지는 값이 있을 때만 노출한다. */
      add(T('col.ret1y'), pct(p.ret1y), false, signCls(p.ret1y));
      add(T('col.ret3m'), pct(p.ret3m), false, signCls(p.ret3m));
      if (p.ret1m != null) add(T('col.ret1m'), pct(p.ret1m), false, signCls(p.ret1m));
      if (p.ret6m != null) add(T('col.ret6m'), pct(p.ret6m), false, signCls(p.ret6m));
      if (p.ret3y != null) add(T('col.ret3y'), pct(p.ret3y), false, signCls(p.ret3y));
      if (p.sinceLaunch != null) add(T('detail.sinceLaunch'), pct(p.sinceLaunch), false, signCls(p.sinceLaunch));
      if (p.excess != null) add(T('detail.excess'), pct(p.excess), false, signCls(p.excess));
      if (p.fee != null || p.mgmtFee != null)
        add(T(p.mgmtFee != null ? 'col.mgmtfee' : 'col.fee'), pctPlain(p.fee != null ? p.fee : p.mgmtFee));
      if (p.frontFee != null) add(T('col.frontFeeShort'), pctPlain(p.frontFee));
      add(T('col.aum'), eok(p.aum), true);
    }
    return out;
  }

  function openDetail(p) {
    var d = $('#drawer');
    var h = [];
    h.push('<div class="drawer-head"><div style="display:flex;gap:12px;align-items:flex-start">' +
      '<div style="flex:1">' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px">' +
      '<span class="badge badge-cat">' + esc(code2label(D.CATEGORIES, p.cat)) + '</span>' + statusBadge(p) +
      '<span class="badge num">' + esc(p.code) + '</span></div>' +
      '<h2 id="drawerTitle" style="font-size:22px">' + esc(L(p.name)) + '</h2>' +
      '<p style="font-size:15px;color:#6C6C6C;margin-top:4px">' + esc(L(p.provider)) + ' · ' + gradeHtml(p.risk) + '</p>' +
      '</div><button class="dclose" id="dClose" aria-label="' + esc(T('detail.close')) + '">✕</button>' +
      '</div></div><div class="drawer-body">');

    /* 핵심지표 */
    h.push('<div class="dsec" style="margin-top:0"><div class="dsec-rule"></div><h3>' + esc(T('detail.key')) + '</h3><dl class="mgrid">');
    metricCells(p).forEach(function (m) {
      h.push('<div class="mcell"><dt>' + esc(m.l) + '</dt><dd class="' + (m.sm ? 'sm ' : '') + (m.cls || '') + '">' + esc(m.v) + '</dd></div>');
    });
    h.push('</dl></div>');

    /* 수익률 추이 — 실데이터 상품은 시계열을 이 시점에 조회한다(전체 선조회는 요청 과다) */
    var canSeries = p.series || (p.live && p.isin && window.MASPSRC);
    if (canSeries) {
      h.push('<div class="dsec"><div class="dsec-rule"></div><h3>' + esc(T('detail.perf')) + '</h3>' +
        '<p class="hint" style="margin-bottom:10px">' + esc(T('detail.perfNote')) + '</p><div id="dChart"></div></div>');
    }
    /* 위험 */
    h.push('<div class="dsec"><div class="dsec-rule"></div><h3>' + esc(T('detail.risk')) + '</h3><div class="gradebar">');
    for (var g = 1; g <= 6; g++) {
      h.push('<div class="' + (g === p.risk ? 'on g' + g : '') + '">' + g + '</div>');
    }
    h.push('</div><p class="gradenote">' + esc(code2label(D.RISK, String(p.risk))) + '</p>');
    if (p.stdev != null) {
      h.push('<table class="kv" style="margin-top:12px">' +
        '<tr><th>' + esc(T('detail.sd')) + '</th><td class="num">' + pctPlain(p.stdev, 1) + '</td></tr>' +
        '<tr><th>' + esc(T('detail.sharpe')) + '</th><td class="num">' + p.sharpe.toFixed(2) + '</td></tr>' +
        '<tr><th>' + esc(T('detail.mdd')) + '</th><td class="num down">' + pctPlain(p.mdd, 1) + '</td></tr></table>');
    }
    h.push('</div>');

    /* ELS 손익구조 · 기초자산 — 배리어가 없어도 기초자산은 항상 보여준다 */
    if (p.cat === 'els') {
      /* row1_cn 등은 기초자산 코드다. 해석된 이름이 있으면 그것을 먼저 쓴다. */
      var uText = (p.underlying || []).map(function (u) { return code2label(D.UNDERLYING, u); }).join(' · ')
        || ((p.uastRows && p.uastRows.length) ? p.uastRows.join(' · ') : '');
      var ub = [];
      ub.push('<div class="dsec"><div class="dsec-rule"></div><h3>' + esc(T('detail.payoff')) + '</h3>');
      if (p.barrier) {
        ub.push('<p class="hint" style="margin-bottom:10px">' +
          esc(T(p.barrierIsLowest ? 'detail.payoffLowNote' : 'detail.payoffNote')) + '</p><div id="dPayoff"></div>');
      }
      ub.push('<table class="kv"' + (p.barrier ? ' style="margin-top:12px"' : '') + '>' +
        '<tr><th>' + esc(T('detail.underlying')) + '</th><td>' + (uText ? esc(uText) : DASH) + '</td></tr>' +
        (p.uastText ? '<tr><th>' + esc(T('detail.elsDesc')) + '</th><td>' + esc(p.uastText) + '</td></tr>' : '') +
        '</table></div>');
      h.push(ub.join(''));
    }
    /* 자산 구성 */
    if (p.holdings) {
      h.push('<div class="dsec"><div class="dsec-rule"></div><h3>' + esc(T('detail.comp')) + '</h3><div class="bars">');
      p.holdings.forEach(function (row, i) {
        h.push('<div class="bar-row"><span>' + esc(L(row[0])) + '</span>' +
          '<span class="bar-track"><span class="bar-fill" style="width:' + row[1] + '%;background:' +
          CHART_COLORS[i % CHART_COLORS.length] + '"></span></span>' +
          '<span class="bar-val">' + row[1] + '%</span></div>');
      });
      h.push('</div></div>');
    }
    /* 비용·가입조건 */
    h.push('<div class="dsec"><div class="dsec-rule"></div><h3>' + esc(T('detail.cost')) + '</h3><table class="kv">');
    var kv = [
      [T('detail.min'), minAmt(p.minAmount)],
      [T(p.mgmtFee != null ? 'col.mgmtfee' : 'col.fee'), pctPlain(p.fee != null ? p.fee : p.mgmtFee)],
      [T('detail.ccy'), p.currency || DASH],
      [T('col.tax'), (p.tax || []).map(function (c) { return code2label(D.TAX, c); }).join(', ') || DASH],
      [T('detail.channel'), (p.channel || []).map(function (c) { return code2label(D.CHANNEL, c); }).join(', ') || DASH],
      [T('detail.launch'), dt(p.launch)],
      [T('detail.provider'), L(p.provider)],
      [T('detail.code'), p.code]
    ];
    if (p.cat === 'els') {
      var ins = [[T('detail.sub'), dt(p.subStart) + ' ~ ' + dt(p.subEnd)]];
      if (p.round) ins.push([T('detail.round'), p.round]);
      if (p.elsTypeName) ins.push([T('detail.elsType'), p.elsTypeName]);
      if (p.coolTarget || p.coolEnd) ins.push([T('detail.coolEnd'), dt(p.coolEnd)]);
      if (p.offerLimit != null) ins.push([T('detail.offerLimit'), won(p.offerLimit)]);
      if (p.subAmount != null) ins.push([T('detail.subAmount'), won(p.subAmount)]);
      if (p.compRate != null) ins.push([T('detail.compRate'), p.compRate.toFixed(2)]);
      ins.push([T('detail.highRisk'), T(p.highRisk ? 'val.yes' : 'val.no')]);
      Array.prototype.splice.apply(kv, [1, 0].concat(ins));
    }
    if (p.cat === 'fund') {
      var fins = [];
      if (p.className) fins.push([T('detail.className'), p.className]);
      if (p.frontFee != null) fins.push([T('col.frontFee'), pctPlain(p.frontFee)]);
      if (p.online != null) fins.push([T('detail.online'), T(p.online ? 'val.yes' : 'val.no')]);
      if (p.highDifficulty != null) fins.push([T('detail.highRisk'), T(p.highDifficulty ? 'val.yes' : 'val.no')]);
      if (fins.length) Array.prototype.splice.apply(kv, [1, 0].concat(fins));
    }
    if (p.taxCredit) kv.splice(1, 0, [T('col.taxcredit'), minAmt(p.taxCredit)]);
    kv.forEach(function (r) { h.push('<tr><th>' + esc(r[0]) + '</th><td>' + esc(r[1]) + '</td></tr>'); });
    h.push('</table></div>');

    /* 수신 원문 — 응답에 무엇이 왔는지 그대로 확인할 수 있게 한다 */
    if (p.raw) {
      var rk = Object.keys(p.raw).filter(function (k) {
        var v = p.raw[k];
        return v != null && String(v).trim() !== '' && typeof v !== 'object';
      });
      if (rk.length) {
        h.push('<div class="dsec"><div class="dsec-rule"></div>' +
          '<details><summary style="cursor:pointer;font-weight:600;font-size:15px">' +
          esc(T('detail.raw')) + ' (' + rk.length + ')</summary>' +
          '<p class="hint" style="margin:10px 0">' + esc(T('detail.rawNote')) + '</p><table class="kv">' +
          rk.map(function (k) {
            return '<tr><th style="white-space:nowrap">' + esc(k) + '</th><td>' + esc(String(p.raw[k]).trim()) + '</td></tr>';
          }).join('') + '</table></details></div>');
      }
    }

    /* 서류·공시 — 실제로 존재하는 URL 만 버튼으로 만든다 */
    var dl = productLinks(p);
    var docUrl = dl.links.length ? dl.links[0].url : 'https://securities.miraeasset.com/financeMain.do';
    var hasOneLink = dl.specific;
    h.push('<div class="dsec"><div class="dsec-rule"></div><h3>' + esc(T('detail.doc')) + '</h3><div class="doclist">' +
      dl.links.map(function (x) {
        return '<a href="' + esc(x.url) + '" target="_blank" rel="noopener">' + esc(x.label) + '</a>';
      }).join('') + '</div>' +
      (dl.note ? '<p class="hint" style="margin-top:10px">' + esc(dl.note) + '</p>' : '') + '</div>');

    h.push('</div><div class="drawer-foot">' +
      '<button class="btn" id="dWatch" aria-pressed="' + (state.watch.indexOf(p.id) >= 0) + '">' +
      (state.watch.indexOf(p.id) >= 0 ? '★ ' : '☆ ') + esc(T('watch.title')) + '</button>' +
      '<button class="btn" id="dCmp">' + esc(T(state.cmp.indexOf(p.id) >= 0 ? 'detail.incmp' : 'detail.addcmp')) + '</button>' +
      '<a class="btn btn-primary" style="margin-left:auto;text-decoration:none;display:grid;place-items:center" href="' +
      esc(docUrl) + '" target="_blank" rel="noopener">' +
      esc(T(hasOneLink ? 'detail.act' : 'detail.openSite')) + '</a></div>');

    d.innerHTML = h.join('');
    d.hidden = false; $('#scrim').hidden = false;
    function drawPerf() {
      var host = $('#dChart', d);
      if (!host) return;
      host.innerHTML = '';
      var sets = [{ name: L(p.name).slice(0, 22), color: CHART_COLORS[0], data: p.series }];
      if (p.bench) sets.push({ name: L(p.benchName), color: CHART_COLORS[1], data: p.bench, dash: true });
      lineChart(host, sets, { aria: T('detail.perf'), h: 210 });
    }
    if (p.series) drawPerf();
    else if (canSeries) {
      var host = $('#dChart', d);
      host.innerHTML = '<p class="hint">' + esc(T('src.loading')) + '</p>';
      MASPSRC.loadSeries(p.isin, new Date()).then(function (s) {
        p.series = s;
        p.ret1y = Math.round((s[s.length - 1] / s[0] - 1) * 1000) / 10;
        finalize(p);
        if (!$('#drawer').hidden && $('#dChart')) drawPerf();
      }).catch(function (e) {
        if (host) host.innerHTML = '<p class="hint">' + esc(T('src.fail') + ' — ' + String(e.message || e)) + '</p>';
      });
    }
    if ($('#dPayoff', d)) payoffChart($('#dPayoff', d), p);
    $('#dClose', d).addEventListener('click', closeOverlays);
    $('#dWatch', d).addEventListener('click', function () { toggleWatch(p.id); openDetail(p); });
    $('#dCmp', d).addEventListener('click', function () { toggleCmp(p.id); openDetail(p); });
    $('#dClose', d).focus();
  }

  /* ------------------------------------------------------------------ 비교 모달 */
  function openCompare() {
    var list = state.cmp.map(byId).filter(Boolean);
    var m = $('#modal');
    var h = ['<div class="drawer-head" style="display:flex;align-items:flex-start;gap:12px">' +
      '<div style="flex:1"><h2 id="modalTitle">' + esc(T('cmp.title')) + '</h2>' +
      '<p class="hint">' + esc(T('tray.hint')) + '</p></div>' +
      '<button class="dclose" id="mClose" aria-label="' + esc(T('detail.close')) + '">✕</button></div>'];
    h.push('<div class="cmp-scroll">');
    if (list.length < 2) {
      h.push('<p class="hint" style="font-size:17px">' + esc(T('cmp.need')) + '</p>');
    } else {
      h.push('<div class="dsec" style="margin-top:0"><div class="dsec-rule"></div><h3>' + esc(T('cmp.chart')) + '</h3>' +
        '<p class="hint" style="margin-bottom:10px">' + esc(T('cmp.rebase')) + '</p><div id="cChart"></div></div>');
      var ROWS = [
        [T('col.cat'), function (p) { return code2label(D.CATEGORIES, p.cat); }, null],
        [T('col.provider'), function (p) { return L(p.provider); }, null],
        [T('col.risk'), function (p) { return code2label(D.RISK, String(p.risk)); }, function (p) { return p.risk; }],
        [T('col.keyrate'), function (p) { return keyRate(p).txt; }, function (p) { return keyRate(p).v; }],
        [T('col.ret3m'), function (p) { return pct(p.ret3m); }, function (p) { return p.ret3m; }],
        [T('col.ret1y'), function (p) { return pct(p.ret1y); }, function (p) { return p.ret1y; }],
        [T('col.ret3y'), function (p) { return pct(p.ret3y); }, function (p) { return p.ret3y; }],
        [T('detail.mdd'), function (p) { return p.mdd == null ? DASH : pctPlain(p.mdd, 1); }, function (p) { return p.mdd; }],
        [T('detail.sharpe'), function (p) { return p.sharpe == null ? DASH : p.sharpe.toFixed(2); }, function (p) { return p.sharpe; }],
        [T('col.fee'), function (p) { return pctPlain(p.fee != null ? p.fee : p.mgmtFee); }, function (p) { return -(p.fee != null ? p.fee : p.mgmtFee); }],
        [T('col.aum'), function (p) { return eok(p.aum); }, function (p) { return p.aum; }],
        [T('col.min'), function (p) { return minAmt(p.minAmount); }, function (p) { return -p.minAmount; }],
        [T('col.tax'), function (p) { return (p.tax || []).map(function (c) { return code2label(D.TAX, c); }).join(', '); }, null],
        [T('detail.channel'), function (p) { return (p.channel || []).map(function (c) { return code2label(D.CHANNEL, c); }).join(', '); }, null],
        [T('detail.ccy'), function (p) { return p.currency; }, null],
        [T('col.status'), function (p) { return code2label(D.STATUS, p.status); }, null]
      ];
      h.push('<div class="dsec"><div class="dsec-rule"></div><h3>' + esc(T('cmp.metric')) + '</h3>' +
        '<div style="overflow-x:auto"><table class="cmp"><thead><tr><th>' + esc(T('cmp.metric')) + '</th>' +
        list.map(function (p, i) {
          return '<th><span style="display:inline-block;width:10px;height:10px;background:' + CHART_COLORS[i] +
            ';border:1px solid rgba(26,26,26,.35);margin-right:6px"></span>' + esc(L(p.name)) + '</th>';
        }).join('') + '</tr></thead><tbody>');
      ROWS.forEach(function (r) {
        var best = null;
        if (r[2]) {
          var vals = list.map(r[2]).filter(function (v) { return v != null && !isNaN(v); });
          if (vals.length) best = r[0] === T('col.risk') ? Math.max.apply(null, vals) : Math.max.apply(null, vals);
        }
        h.push('<tr><th>' + esc(r[0]) + '</th>' + list.map(function (p) {
          var isBest = r[2] && best != null && r[2](p) === best && list.length > 1;
          return '<td class="' + (isBest ? 'best' : '') + '">' + esc(r[1](p)) + '</td>';
        }).join('') + '</tr>');
      });
      h.push('</tbody></table></div></div>');
    }
    h.push('</div>');
    m.innerHTML = h.join('');
    m.hidden = false; $('#scrim').hidden = false;
    if (list.length >= 2) {
      var sets = list.filter(function (p) { return p.series; }).map(function (p, i) {
        return { name: L(p.name).slice(0, 24), color: CHART_COLORS[i], data: p.series };
      });
      if (sets.length) lineChart($('#cChart', m), sets, { aria: T('cmp.chart'), h: 250 });
      else $('#cChart', m).innerHTML = '<p class="hint">' + esc(T('val.dash')) + '</p>';
    }
    $('#mClose', m).addEventListener('click', closeOverlays);
    $('#mClose', m).focus();
  }
  function closeOverlays() {
    $('#drawer').hidden = true; $('#modal').hidden = true; $('#scrim').hidden = true;
  }

  /* ------------------------------------------------------------------ 트레이 */
  function renderTray() {
    var t = $('#tray');
    t.hidden = state.cmp.length === 0;
    var box = $('#trayItems'); box.innerHTML = '';
    state.cmp.forEach(function (id, i) {
      var p = byId(id); if (!p) return;
      var s = el('span', 'tray-item');
      s.innerHTML = '<span style="display:inline-block;width:9px;height:9px;background:' + CHART_COLORS[i] + '"></span>' +
        '<span>' + esc(L(p.name).slice(0, 30)) + '</span><button type="button" aria-label="remove">✕</button>';
      s.querySelector('button').addEventListener('click', function () { toggleCmp(id); });
      box.appendChild(s);
    });
    document.body.style.paddingBottom = state.cmp.length ? '72px' : '0';
  }

  function toggleWatch(id) {
    var i = state.watch.indexOf(id);
    if (i >= 0) state.watch.splice(i, 1); else state.watch.push(id);
    LS.set('watch', state.watch); render();
  }
  function toggleCmp(id) {
    var i = state.cmp.indexOf(id);
    if (i >= 0) state.cmp.splice(i, 1);
    else { if (state.cmp.length >= 4) state.cmp.shift(); state.cmp.push(id); }
    LS.set('cmp', state.cmp); render();
    if (!$('#modal').hidden) openCompare();
  }

  /* ------------------------------------------------------------------ 자동완성 */
  function renderAc(q) {
    var ac = $('#ac');
    if (!q || q.length < 1) { ac.hidden = true; $('#q').setAttribute('aria-expanded', 'false'); return; }
    var lq = q.toLowerCase();
    var hits = ALL.filter(function (p) { return p.searchKey.indexOf(lq) >= 0; }).slice(0, 8);
    if (!hits.length) { ac.hidden = true; $('#q').setAttribute('aria-expanded', 'false'); return; }
    ac.innerHTML = hits.map(function (p) {
      return '<button type="button" role="option" data-id="' + p.id + '">' +
        '<span class="ac-cat">' + esc(code2label(D.CATEGORIES, p.cat)) + '</span>' +
        '<span>' + esc(L(p.name)) + '</span><span class="ac-code num">' + esc(p.code) + '</span></button>';
    }).join('');
    ac.hidden = false; $('#q').setAttribute('aria-expanded', 'true');
    $$('button', ac).forEach(function (b) {
      b.addEventListener('click', function () {
        ac.hidden = true;
        openDetail(byId(b.dataset.id));
      });
    });
  }

  /* ------------------------------------------------------------------ CSV */
  function exportCsv() {
    var rows = sorted(filtered());
    var keys = COLS[state.cat] || COLS.all;
    keys = keys.filter(function (k) { return k !== 'watch' && k !== 'act' && k !== 'trend'; });
    var head = keys.map(function (k) { return T(C[k].k); });
    var strip = function (html) { return String(html).replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim(); };
    var lines = [head.join(',')];
    rows.forEach(function (p) {
      lines.push(keys.map(function (k) { return '"' + strip(C[k].r(p)).replace(/"/g, '""') + '"'; }).join(','));
    });
    var blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'mirae-products-' + state.cat + '-' + D.AS_OF + '.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
  }

  /* ============================================================ 실데이터 연동 */
  /* 공개 소스(KRX)에서 받은 상품군은 통째로 교체하고, 소스가 없는 상품군은
     예시 데이터를 유지한다. 어느 쪽인지는 화면에 항상 표시한다.            */
  function applyLive(results) {
    var byCat = {};
    Object.keys(results).forEach(function (sid) {
      var r = results[sid];
      if (!r.ok || !r.rows.length) return;
      r.rows.forEach(function (p) {
        (byCat[p.cat] = byCat[p.cat] || []).push(p);
      });
    });
    var now = new Date();
    var stamp = now.getFullYear() + '-' + ('0' + (now.getMonth() + 1)).slice(-2) + '-' +
      ('0' + now.getDate()).slice(-2) + ' ' + ('0' + now.getHours()).slice(-2) + ':' +
      ('0' + now.getMinutes()).slice(-2);

    var next = [];
    D.CATEGORIES.forEach(function (c) {
      var cat = c[0];
      if (cat === 'all') return;
      if (byCat[cat] && byCat[cat].length) {
        next = next.concat(byCat[cat]);
        PROV[cat] = { mode: 'live', source: byCat[cat][0].source, count: byCat[cat].length, at: stamp,
          url: byCat[cat][0].sourceUrl };
      } else {
        var kept = D.PRODUCTS.filter(function (p) { return p.cat === cat; });
        next = next.concat(kept);
        var failed = Object.keys(results).some(function (sid) {
          var s = MASPSRC.CATALOG.filter(function (x) { return x.id === sid; })[0];
          return s && s.cats.indexOf(cat) >= 0 && !results[sid].ok;
        });
        PROV[cat] = {
          mode: failed ? 'fail' : 'sample', count: kept.length, at: stamp,
          error: failed ? firstError(results, cat) : null,
          why: MASPSRC.NO_SOURCE[cat] ? L(MASPSRC.NO_SOURCE[cat]) : null
        };
      }
    });
    setAll(next);
  }
  function firstError(results, cat) {
    var msg = null;
    MASPSRC.CATALOG.forEach(function (s) {
      if (s.cats.indexOf(cat) >= 0 && results[s.id] && results[s.id].error && !msg) msg = results[s.id].error;
    });
    return msg;
  }

  function renderProv() {
    var host = $('#prov'); host.innerHTML = '';
    D.CATEGORIES.forEach(function (c) {
      if (c[0] === 'all') return;
      var pv = PROV[c[0]] || { mode: 'sample', count: 0 };
      /* KRX(보조) 담당 상품군의 실패는 오류가 아니라 '선택 사항 미연결' 이다 */
      var isAux = window.MASPSRC && MASPSRC.auxCats()[c[0]];
      var cls = pv.mode === 'live' ? 'prov-live'
        : (pv.mode === 'fail' && !isAux) ? 'prov-fail' : 'prov-none';
      /* 파일을 직접 연 경우는 '연결 실패' 가 아니라 '서버 미접속' 이 정확한 설명이다 */
      var fileMode = window.MASPSRC && MASPSRC.isFileMode();
      var label = pv.mode === 'live' ? (isAux ? T('src.auxLive') : T('src.live'))
        : pv.mode === 'fail' ? (fileMode ? T('src.noServer') : isAux ? T('src.auxOff') : T('src.fail'))
        : (pv.why ? T('src.nosrc') : T('src.sample'));
      var s = el('span', 'prov-item ' + cls);
      var html = '<span class="dot"></span><b>' + esc(L([c[1], c[2]])) + '</b>' +
        '<span>' + esc(label) + '</span>' +
        /* 실데이터가 아닌 건수는 "예시"를 붙여 실적 수치로 오해되지 않게 한다 */
        '<span class="num">' + (pv.mode === 'live' ? '' : esc(T('src.estimated')) + ' ') +
        esc(T('src.cnt', pv.count.toLocaleString('en-US'))) + '</span>';
      if (pv.mode === 'live') {
        html += '<span class="why">' + esc(pv.source) + '</span>';
        if (pv.url) html += '<a href="' + pv.url + '" target="_blank" rel="noopener">' + esc(T('src.source')) + '</a>';
      } else if (pv.why) {
        html += '<span class="why">' + esc(pv.why) + '</span>';
      } else if (pv.mode === 'fail' && isAux && !fileMode) {
        html += '<span class="why">' + esc(T('src.auxWhy')) + '</span>';
      }
      s.innerHTML = html;
      if (pv.error) s.title = pv.error;
      host.appendChild(s);
    });
  }

  function renderDiag() {
    var box = $('#diagBox');
    var rows = MASPSRC.getDiag();
    var h = ['<b>' + esc(T('src.diagTitle')) + '</b><p class="hint" style="margin:6px 0 10px">' +
      esc(T('src.diagHint')) + '</p>'];
    if (!rows.length) {
      h.push('<p class="hint">' + esc(T('src.loading')) + '</p>');
    } else {
      h.push('<table><thead><tr><th>source</th><th>proxy</th><th>result</th><th>detail</th></tr></thead><tbody>');
      rows.forEach(function (r) {
        h.push('<tr><td>' + esc(r.bld || '') + '</td><td>' + esc(r.proxy || '-') + '</td>' +
          '<td class="' + (r.ok ? 'good' : 'bad') + '">' + (r.ok ? 'OK' : 'FAIL') + '</td>' +
          '<td>' + esc(r.msg || r.warn || '') + (r.keys ? '<br><span class="hint">keys: ' + esc(r.keys) + '</span>' : '') +
          '</td></tr>');
      });
      h.push('</tbody></table>');
    }
    h.push('<pre>' + esc(T('src.csvHelp')) + '</pre>');
    box.innerHTML = h.join('');
  }

  function setLoadTag(txt, warn) {
    var t = $('#loadTag');
    t.hidden = !txt;
    t.textContent = txt || '';
    t.className = 'tag' + (warn ? ' tag-warn' : '');
  }

  function loadLive() {
    setLoadTag(T('src.loading'));
    renderDiag();
    return MASPSRC.loadAll(new Date()).then(function (results) {
      applyLive(results);
      var live = 0;
      Object.keys(PROV).forEach(function (k) { if (PROV[k].mode === 'live') live += PROV[k].count; });
      setLoadTag(live ? T('src.loaded', live.toLocaleString('en-US'))
        : (window.MASPSRC && MASPSRC.isFileMode() ? T('src.fileMode') : T('src.noInternal')), !live);
      renderDiag();
      render();
    }).catch(function (e) {
      setLoadTag(T('src.noneLoaded'), true);
      renderDiag();
      render();
    });
  }

  function importCsv(file) {
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var rows = MASPSRC.fromCsv(String(fr.result));
        /* CSV 로 들어온 상품군은 해당 상품군을 교체한다 */
        var cats = {};
        rows.forEach(function (p) { cats[p.cat] = true; });
        var kept = ALL.filter(function (p) { return !cats[p.cat]; });
        setAll(kept.concat(rows));
        var now = new Date();
        Object.keys(cats).forEach(function (c) {
          PROV[c] = { mode: 'live', source: 'CSV', at: now.toISOString().slice(0, 16).replace('T', ' '),
            count: rows.filter(function (p) { return p.cat === c; }).length };
        });
        setLoadTag(T('src.csvOk', rows.length.toLocaleString('en-US')));
        renderDiag(); render();
      } catch (e) {
        setLoadTag(T('src.csvErr', String(e.message || e)), true);
        renderDiag();
      }
    };
    fr.onerror = function () { setLoadTag(T('src.csvErr', 'read error'), true); };
    fr.readAsText(file, 'utf-8');
  }

  /* ------------------------------------------------------------------ 렌더 총괄 */
  function render() {
    renderStatic();
    /* 탭 카운트는 카테고리 조건만 제외하고 계산 (faceted search) */
    var base = ALL.filter(function (p) { return passes(p, true); });
    renderTabs(base);
    var rows = sorted(filtered());
    renderKpi(rows);
    renderFilters();
    renderApplied();
    renderWatch();
    renderResults(rows);
    renderCalendar();
    renderTray();
    renderProv();
  }

  /* ------------------------------------------------------------------ 이벤트 */
  $('#tabs').addEventListener('click', function (e) {
    var b = e.target.closest('.tab'); if (!b) return;
    if (state.cat !== b.dataset.cat) {
      /* 상품군을 바꾸면 해당 상품군 전용 조건은 초기화하고 공통 조건은 유지 */
      var commonIds = FILTER_COMMON.map(function (f) { return f.id; });
      Object.keys(state.filters).forEach(function (id) {
        if (commonIds.indexOf(id) < 0) delete state.filters[id];
      });
      state.cat = b.dataset.cat; state.page = 1; render();
    }
  });
  $$('.lang-toggle button').forEach(function (b) {
    b.addEventListener('click', function () {
      state.lang = b.dataset.lang; LS.set('lang', state.lang);
      closeOverlays(); render();
    });
  });
  $('#results').addEventListener('click', function (e) {
    var w = e.target.closest('[data-watch]');
    if (w) { toggleWatch(w.dataset.watch); return; }
    var o = e.target.closest('[data-open]');
    if (o) { openDetail(byId(o.dataset.open)); return; }
  });
  $('#results').addEventListener('change', function (e) {
    var c = e.target.closest('[data-cmp]');
    if (c) toggleCmp(c.dataset.cmp);
  });
  var qEl = $('#q');
  qEl.addEventListener('input', function () { renderAc(qEl.value.trim()); });
  qEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { state.q = qEl.value.trim(); state.page = 1; $('#ac').hidden = true; render(); }
    if (e.key === 'Escape') { $('#ac').hidden = true; }
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.search-field')) $('#ac').hidden = true;
  });
  $('#btnSearch').addEventListener('click', function () {
    state.q = qEl.value.trim(); state.page = 1; $('#ac').hidden = true; render();
  });
  $('#btnResetAll').addEventListener('click', function () {
    state.q = ''; qEl.value = ''; state.filters = {}; state.quick = {}; state.cat = 'all'; state.page = 1; render();
  });
  $('#btnClearFilters').addEventListener('click', function () {
    state.filters = {}; state.quick = {}; state.page = 1; render();
  });
  $('#btnClearWatch').addEventListener('click', function () {
    state.watch = []; LS.set('watch', state.watch); render();
  });
  $$('[data-quick]').forEach(function (b) {
    b.addEventListener('click', function () {
      var k = b.dataset.quick;
      state.quick[k] = !state.quick[k];
      if (!state.quick[k]) delete state.quick[k];
      b.setAttribute('aria-pressed', String(!!state.quick[k]));
      state.page = 1; render();
    });
  });
  $('#sort').addEventListener('change', function () { state.sort = this.value; state.page = 1; render(); });
  $('#per').addEventListener('change', function () { state.per = Number(this.value); state.page = 1; render(); });
  $('#viewTable').addEventListener('click', function () {
    state.view = 'table'; this.setAttribute('aria-pressed', 'true');
    $('#viewCard').setAttribute('aria-pressed', 'false'); render();
  });
  $('#viewCard').addEventListener('click', function () {
    state.view = 'card'; this.setAttribute('aria-pressed', 'true');
    $('#viewTable').setAttribute('aria-pressed', 'false'); render();
  });
  $('#btnCompare').addEventListener('click', openCompare);
  $('#btnTrayClear').addEventListener('click', function () { state.cmp = []; LS.set('cmp', state.cmp); render(); });
  $('#btnPrint').addEventListener('click', function () { window.print(); });
  $('#btnCsv').addEventListener('click', exportCsv);
  $('#scrim').addEventListener('click', closeOverlays);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeOverlays(); });
  $('#asideToggle').addEventListener('click', function () {
    var w = $('#asideWrap'), open = w.dataset.open === '1';
    w.dataset.open = open ? '0' : '1';
    this.setAttribute('aria-expanded', String(!open));
  });

  $('#btnReload').addEventListener('click', loadLive);
  $('#csvFile').addEventListener('change', function () {
    if (this.files && this.files[0]) importCsv(this.files[0]);
    this.value = '';
  });
  $('#btnDiag').addEventListener('click', function () {
    var box = $('#diagBox'), open = !box.hidden;
    box.hidden = open;
    this.setAttribute('aria-expanded', String(!open));
    if (!open) renderDiag();
  });

  /* 첫 렌더 */
  $$('[data-quick]').forEach(function (b) { b.setAttribute('aria-pressed', String(!!state.quick[b.dataset.quick])); });
  render();
  /* 실데이터는 화면을 먼저 그린 뒤 비동기로 덮어쓴다 (조회 실패해도 화면은 항상 뜬다) */
  if (window.MASPSRC) loadLive();
})();
</script>
</body>
</html>

<style>
  :root{--primary:#F58220;--primary-active:#CB6015;--secondary:#043B72;--canvas:#FFFFFF;--surface-subtle:#F7F8FA;--hairline:#CDCECB;--hairline-soft:#E5E4E1;--ink:#1A1A1A;--body:#3D3D3D;--muted:#6C6C6C;--muted-soft:#84888B;--font-kr:'Noto Sans KR','Spoqa Han Sans Neo','Apple SD Gothic Neo','Malgun Gothic',sans-serif;--font-en:'Inter','Aptos','Segoe UI',system-ui,-apple-system,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  html[lang="ko"] body{font-family:var(--font-kr)} html[lang="en"] body{font-family:var(--font-en)}
  body{background:var(--canvas);color:var(--body);line-height:1.65;-webkit-font-smoothing:antialiased}
  .page{max-width:1200px;margin:0 auto;padding:0 32px}
  .hidden{display:none!important}

  .head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:30px 0 26px}

  .head-titles p{font-size:16px;color:var(--muted);margin-top:8px;max-width:640px}

  .lang-toggle button+button{border-left:1px solid var(--hairline)}
  .lang-toggle button.active{background:var(--primary);color:#fff}

  @media (max-width:820px){.grid{grid-template-columns:1fr}}
  .card{display:flex;flex-direction:column;border:1px solid var(--hairline);border-radius:4px;padding:26px 28px;background:#fff;transition:border-color .12s,box-shadow .12s;height:100%;cursor:pointer;text-align:left;font:inherit;color:inherit}

  .card:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
  .card-top{display:flex;align-items:center;gap:12px}
  .cat{font-size:12px;font-weight:600;letter-spacing:.6px;color:#fff;background:var(--secondary);padding:3px 9px;border-radius:2px;text-transform:uppercase}
  .num{margin-left:auto;font-family:var(--font-en);font-size:15px;font-weight:600;color:var(--muted-soft)}
  .card h2{font-size:21px;font-weight:700;color:var(--ink);margin:10px 0 6px;line-height:1.25}
  .card p{font-size:15px;color:var(--body);flex:1}
  .tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
  .tag{font-size:12px;color:var(--muted);background:var(--surface-subtle);border:1px solid var(--hairline-soft);padding:3px 9px;border-radius:2px}
  .cnote{font-size:12px;color:var(--muted-soft);margin-top:12px}
  .open{display:inline-flex;align-items:center;gap:6px;margin-top:16px;font-size:15px;font-weight:600;color:var(--primary-active)}
  .foot{margin:36px 0 60px;padding-top:20px;border-top:1px solid var(--hairline-soft)}
  .foot p{font-size:13px;color:var(--muted-soft);line-height:1.55}
  /* viewer */
  #viewer{position:fixed;inset:0;background:#fff;z-index:100;display:flex;flex-direction:column}
  .vbar{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--hairline);flex:0 0 auto}
  .backBtn{font:inherit;font-size:15px;font-weight:600;padding:9px 16px;border:1px solid var(--hairline);border-radius:2px;background:#fff;color:var(--ink);cursor:pointer}
  .backBtn:hover{background:var(--surface-subtle)}
  .vname{font-size:16px;font-weight:700;color:var(--ink)}
  .vcat{font-size:12px;font-weight:600;color:#fff;background:var(--secondary);padding:3px 9px;border-radius:2px;text-transform:uppercase}
  .frames{flex:1;position:relative;background:#fff}
  .toolframe{position:absolute;inset:0;width:100%;height:100%;border:none}
</style>
</head>

  <style>
    /* ===== 팔레트 (dataviz 레퍼런스 팔레트, 라이트/다크) ===== */
    :root {

    /* ===== 상단 검색 바 ===== */
    .topbar {

    }
    .chip:hover { border-color: var(--series-1); color: var(--text-primary); }
    .chip .x { color: var(--text-muted); font-weight: 700; }
    .chip .x:hover { color: var(--up); }

    /* ===== 리포트 컨테이너 ===== */
    .report { max-width: 1120px; margin: 16px auto 60px; padding: 0 20px; }
    .card {
      background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius);

    .section-title {

    .badge.sample { color: var(--series-3); border-color: color-mix(in srgb, var(--series-3) 45%, transparent); }

    .summary { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 18px 34px; }

    .price { font-size: 30px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }

    .toggles { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }

    /* ===== 투자의견 ===== */
    .target-track { position: relative; height: 10px; border-radius: 999px; margin: 34px 0 30px;
      background: linear-gradient(90deg, var(--down), var(--text-muted), var(--up)); opacity: .9; }

    /* ===== 리스트 ===== */

    .op-pill.hold { background: color-mix(in srgb, var(--series-3) 18%, transparent); color: var(--series-3); }
    .op-pill.sell { background: color-mix(in srgb, var(--series-6) 15%, transparent); color: var(--series-6); }
    .rt { text-align: right; white-space: nowrap; }
    .rt .tgt { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .rt .tgt-k { font-size: 11px; color: var(--text-muted); }

    /* ===== 테이블 ===== */
    table.fin { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
    table.fin th, table.fin td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
    table.fin th:first-child, table.fin td:first-child { text-align: left; color: var(--text-secondary); }
    table.fin thead th { color: var(--text-muted); font-weight: 600; font-size: 12px; }

    .state { text-align: center; padding: 80px 20px; color: var(--text-secondary); }

    @media print {

      body { background: #fff; }
      .report { margin: 0; max-width: none; padding: 0; }
      .card { box-shadow: none; border-color: #ddd; break-inside: avoid; margin-bottom: 10px; padding: 12px 14px; }
      .chart-wrap { height: 210px; } .chart-wrap.small { height: 90px; } .chart-wrap.mid { height: 160px; }
    }
  </style>

<body>
  <header class=&quot;topbar&quot;>

  const last = close[close.length - 1];
  const prevClose = close[close.length - 2] || last;
  const change = last - prevClose;
  const changePct = +((change / prevClose) * 100).toFixed(2);
  const high52 = Math.max.apply(null, close);
  const low52 = Math.min.apply(null, close);
  const eps = Math.round(last / p.per);

  // --- 투자의견 / 목표주가 ---
  const upside = 0.05 + rng() * 0.35; // 5~40% 상승여력
  const targetMean = Math.round((last * (1 + upside)) / 100) * 100;
  const targetHigh = Math.round((targetMean * (1.08 + rng() * 0.12)) / 100) * 100;
  const targetLow = Math.round((targetMean * (0.78 + rng() * 0.1)) / 100) * 100;
  const nAnalysts = 8 + Math.floor(rng() * 22);
  const strongBuy = Math.floor(nAnalysts * (0.25 + rng() * 0.25));
  const buy = Math.floor(nAnalysts * (0.2 + rng() * 0.2));
  const hold = Math.max(0, nAnalysts - strongBuy - buy - Math.floor(rng() * 3));
  const sell = Math.max(0, nAnalysts - strongBuy - buy - hold);
  const dist = { strongBuy, buy, hold, sell, strongSell: 0 };
  const ratingText = strongBuy + buy >= hold + sell ? &quot;매수(Buy)&quot; : &quot;중립(Hold)&quot;;

  // --- 증권사 레포트 리스트 ---
  const reportTitles = [
    &quot;실적 개선 모멘텀 지속&quot;,
    &quot;밸류에이션 매력 부각&quot;,
    &quot;하반기 이익 반등 기대&quot;,
    &quot;업황 회복 국면 진입&quot;,
    &quot;목표주가 상향 조정&quot;,
    &quot;신사업 성장성 주목&quot;,
    &quot;수급 개선과 이익 안정성&quot;,
    &quot;구조적 성장 스토리 유효&quot;
  ];
  const reports = [];
  const brokerPool = BROKERS.slice().sort(() => rng() - 0.5);
  for (let i = 0; i < 6; i++) {
    const t = round(targetMean * (0.9 + rng() * 0.25), 100);
    reports.push({
      broker: brokerPool[i % brokerPool.length],
      title: `[${ticker.name}] ${reportTitles[Math.floor(rng() * reportTitles.length)]}`,
      opinion: OPINIONS[Math.floor(rng() * OPINIONS.length)],
      target: t,
      date: isoDaysAgo(2 + Math.floor(rng() * 40))
    });
  }

  // --- 시황 / 뉴스 ---
  const newsTemplates = [
    { t: `${ticker.name}, ${p.sector} 업황 회복 기대감에 강세`, s: &quot;한국경제&quot; },
    { t: `${ticker.name} 2분기 실적 시장 기대치 부합`, s: &quot;매일경제&quot; },
    { t: `외국인·기관 ${ticker.name} 동반 순매수`, s: &quot;연합인포맥스&quot; },

    { t: `${ticker.name}, 신규 투자·수주 소식에 투자심리 개선`, s: &quot;서울경제&quot; },
    { t: `${p.sector} 대장주 ${ticker.name} 수급 점검`, s: &quot;머니투데이&quot; }
  ];
  const news = newsTemplates.map((n, i) => ({
    title: n.t,
    source: n.s,
    date: isoDaysAgo(Math.floor(rng() * 7)),
    url: `https://news.google.com/search?q=${encodeURIComponent(ticker.name)}&amp;hl=ko`,
    summary: `${ticker.name} 관련 최신 동향 요약입니다. (샘플 데이터)`
  }));

  // --- 재무제표(최근 4개 연도, 억원) ---
  const years = [];
  const revenue = [];
  const operatingIncome = [];
  const netIncome = [];
  const assets = [];
  const liabilities = [];
  const equity = [];
  const roe = [];
  const debtRatio = [];
  const thisYear = new Date().getFullYear();
  for (let i = 3; i >= 0; i--) {
    const y = thisYear - 1 - i;
    years.push(String(y));
    const g = 1 + (rng() - 0.4) * 0.25; // 연도별 성장률 변동
    const rev = round(p.rev * (0.8 + (3 - i) * 0.08) * g, 1);
    const op = round(rev * p.opm * (0.7 + rng() * 0.6), 1);
    const net = round(op * (0.7 + rng() * 0.25), 1);
    const eq = round(rev * (0.9 + rng() * 0.6), 1);
    const liab = round(eq * (0.4 + rng() * 0.8), 1);
    revenue.push(rev);
    operatingIncome.push(op);
    netIncome.push(net);
    equity.push(eq);
    liabilities.push(liab);
    assets.push(eq + liab);
    roe.push(+((net / eq) * 100).toFixed(1));
    debtRatio.push(+((liab / eq) * 100).toFixed(1));
  }

  // --- 외국인/기관 수급 (최근 20거래일, 순매수 대금 억원 추정) ---
  const flowDates = dates.slice(-20);
  const foreign = [], inst = [], indiv = [], foreignRatio = [];
  let fr = 35 + rng() * 20; // 외국인 지분율(%) 시작
  const flowScale = Math.max(20, p.cap * 0.0015);
  for (let i = 0; i < flowDates.length; i++) {
    const f = Math.round((rng() - 0.47) * flowScale);
    const o = Math.round((rng() - 0.5) * flowScale * 0.8);
    foreign.push(f);
    inst.push(o);
    indiv.push(-(f + o)); // 개인은 외국인+기관의 반대(수급 균형 근사)
    fr += (f / flowScale) * 0.15;
    foreignRatio.push(+Math.max(5, Math.min(70, fr)).toFixed(2));
  }

  // --- 동종 시장 지수 시계열(리베이스/상대수익률용) ---
  const idxName = ticker.market === &quot;KOSDAQ&quot; ? &quot;KOSDAQ&quot; : &quot;KOSPI&quot;;
  const idxClose = [];
  let iv = (idxName === &quot;KOSDAQ&quot; ? 850 : 2600) * (0.92 + rng() * 0.08);
  for (let i = 0; i < dates.length; i++) {
    iv = iv * (1 + (rng() - 0.5) * 0.011);
    idxClose.push(+iv.toFixed(2));
  }

  return {
    quote: {
      price: last,
      prevClose,
      change,
      changePct,
      marketCap: Math.round(p.cap * 1e8), // 억원 -> 원
      per: p.per,
      pbr: p.pbr,
      eps,
      high52,
      low52,
      currency: &quot;KRW&quot;
    },
    chart: { dates, close, volume },
    investorTrend: { dates: flowDates, foreign: foreign, inst: inst, indiv: indiv, foreignRatio: foreignRatio },
    index: { name: idxName, dates: dates.slice(), close: idxClose },
    recommendation: {
      targetMean,
      targetHigh,
      targetLow,
      currentPrice: last,
      numberOfAnalysts: nAnalysts,
      dist,
      ratingText
    },
    reports,
    news,
    financials: {
      years,
      revenue,
      operatingIncome,
      netIncome,
      assets,
      liabilities,
      equity,
      roe,
      debtRatio
    },
    currency: &quot;KRW&quot;,
    sector: p.sector
  };
};

    /* ================= 데이터 레이어 ================= */
    var PROXIES = [
      function (u) { return u; }, // 직접(대상이 CORS 허용 시)

      function (u) { return &quot;https://thingproxy.freeboard.io/fetch/&quot; + u; },

    ];
    var PROXY_NAMES = [&quot;직접&quot;, &quot;codetabs&quot;, &quot;corsproxy.io&quot;, &quot;allorigins&quot;, &quot;cors.eu.org&quot;, &quot;thingproxy&quot;, &quot;jina&quot;];
    var DIAG = []; // 데이터 진단용: 각 요청의 성공여부/경로/원문 일부 캡처
    function withTimeout(promise, ms) {

    // 캐시 무력화: 프록시/CDN이 오래된 응답을 돌려주지 않도록 매 호출 고유 파라미터 부여
    function bust(url) { return url + (url.indexOf(&quot;?&quot;) >= 0 ? &quot;&amp;&quot; : &quot;?&quot;) + &quot;_ts=&quot; + Date.now(); }
    // 프록시를 병렬 시도하고 가장 먼저 성공하는 응답을 사용(폴백 지연 최소화, 각 시도 4초 타임아웃)
    // validate(t): 유효하지 않으면 throw → 그 프록시 시도는 탈락(에러 페이지가 경쟁에서 이기지 못하게 함)
    function fetchText(url, validate) {
      var orig = url;

      var attempts = PROXIES.map(function (w, i) {
        return withTimeout(
          fetch(w(url), { headers: { Accept: &quot;application/json, text/plain, */*&quot; }, cache: &quot;no-store&quot; })
            .then(function (r) { if (!r.ok) throw new Error(&quot;HTTP &quot; + r.status); return r.text(); })

    }
    // JSON 엔드포인트: 각 프록시 응답이 파싱 가능한 JSON일 때만 채택
    function fetchJson(url) {
      return fetchText(url, function (t) {
        var s = t.replace(/^﻿/, &quot;&quot;).trim();
        if (s[0] !== &quot;{&quot; &amp;&amp; s[0] !== &quot;[&quot;) throw new Error(&quot;not json&quot;);

      }).then(function (t) { return JSON.parse(t.replace(/^﻿/, &quot;&quot;).trim()); });
    }
    function num(v) { if (v == null) return null; var n = parseFloat(String(v).replace(/,/g, &quot;&quot;)); return isNaN(n) ? null : n; }
    function raw(o) { return o &amp;&amp; typeof o === &quot;object&quot; &amp;&amp; &quot;raw&quot; in o ? o.raw : o; }
    // 한국식 금액 문자열(&quot;504조 1,234억원&quot;, &quot;5,041,234&quot;(억 단위), 원 숫자)을 원 단위로 변환
    function parseKMoney(v) {
      if (v == null) return null;
      var s = String(v);
      var jo = s.match(/([\d,.]+)\s*조/), eok = s.match(/([\d,.]+)\s*억/);
      if (jo || eok) { var w = 0; if (jo) w += parseFloat(jo[1].replace(/,/g, &quot;&quot;)) * 1e12; if (eok) w += parseFloat(eok[1].replace(/,/g, &quot;&quot;)) * 1e8; return Math.round(w); }
      var n = num(s); if (n == null) return null;
      // 네이버 marketValue는 대체로 '억원' 단위 정수(예: 5041234 → 504.1조)
      return Math.round(n * 1e8);
    }

    /* --- 네이버 모바일 API (한국 데이터 정확) --- */
    var NAVER = &quot;https://m.stock.naver.com/api/stock/&quot;;
    function fetchNaver(ticker) {
      var c = ticker.code;
      return Promise.all([
        fetchJson(NAVER + c + &quot;/basic&quot;).catch(function () { return null; }),

        fetchJson(NAVER + c + &quot;/trend&quot;).catch(function () { return null; })
      ]).then(function (arr) { return normalizeNaver(arr[0], arr[1], arr[2], ticker); });
    }
    function normalizeNaver(basic, priceRes, trend, ticker) {
      // 가격 시계열

      var price = close[close.length - 1], prevClose = close[close.length - 2] || price;

      if (basic) {
        if (num(basic.closePrice) != null) q.price = num(basic.closePrice);
        if (num(basic.compareToPreviousClosePrice) != null) q.change = num(basic.compareToPreviousClosePrice);
        if (num(basic.fluctuationsRatio) != null) q.changePct = num(basic.fluctuationsRatio);
        // 하락 방향 부호 보정
        var dir = basic.compareToPreviousPrice ? (basic.compareToPreviousPrice.code || basic.compareToPreviousPrice.text || &quot;&quot;) : &quot;&quot;;
        if (/하락|down|▼/.test(String(dir)) || (basic.risefall &amp;&amp; String(basic.risefall).indexOf(&quot;4&quot;) === 0) || (basic.risefall &amp;&amp; String(basic.risefall).indexOf(&quot;5&quot;) === 0)) {

        var eps = basic.eps != null ? basic.eps : getInfo(/(^|[^a-z])eps([^a-z]|$)|EPS/i); if (num(eps) != null) q.eps = num(eps);

      var data = { quote: q, chart: { dates: dates, close: close, volume: volume },

    }
    function round1(v) { return v == null || isNaN(v) ? 0 : Math.round(v); }

    /* --- Yahoo (보조) --- */
    function fetchYahoo(ticker) {
      var symbol = window.toYahooSymbol(ticker);
      var chartUrl = &quot;https://query1.finance.yahoo.com/v8/finance/chart/&quot; + symbol + &quot;?range=1y&amp;interval=1d&quot;;
      var qsUrl = &quot;https://query1.finance.yahoo.com/v10/finance/quoteSummary/&quot; + symbol +
        &quot;?modules=price,summaryDetail,defaultKeyStatistics,financialData,recommendationTrend,incomeStatementHistory,balanceSheetHistory&quot;;
      return Promise.all([fetchJson(chartUrl), fetchJson(qsUrl).catch(function () { return null; })])
        .then(function (a) { return normalizeYahoo(a[0], a[1]); });
    }
    function normalizeYahoo(chartJson, qsJson) {
      var r = chartJson &amp;&amp; chartJson.chart &amp;&amp; chartJson.chart.result &amp;&amp; chartJson.chart.result[0];

      var meta = r.meta, ts = r.timestamp || [], q = (r.indicators &amp;&amp; r.indicators.quote &amp;&amp; r.indicators.quote[0]) || {};
      var dates = [], close = [], volume = [];

      L.push(&quot;&quot;);
      L.push(&quot;--- 원본 응답 캡처 (&quot; + DIAG.length + &quot;건, 각 앞부분 1400자) ---&quot;);

  }

    var wrap = document.getElementById(&quot;chips&quot;);

  function fitFor(p){

  function renderCompare(){
    var body = document.getElementById(&quot;cmpBody&quot;);

    var sel = STATE.sel[STATE.tab];
    var prods = DATA[STATE.tab].filter(function(p){return sel.indexOf(p.id)>=0;});
    // keep selection order
    prods.sort(function(a,b){return sel.indexOf(a.id)-sel.indexOf(b.id);});

    var ivName = INVESTORS.filter(function(x){return x.key===STATE.investor})[0][STATE.lang];
    sub.textContent = prods.length + I18N.subSuffix[STATE.lang] + &quot; · &quot; + ivName;

    if(prods.length===0){
      body.innerHTML = '<div class=&quot;empty&quot;>'+I18N.emptyPick[STATE.lang]+'</div>';
      return;
    }

    var metrics = METRICS[STATE.tab];
    var html = '<div class=&quot;table-wrap&quot;><table><thead><tr><th>'+(STATE.lang===&quot;ko&quot;?&quot;항목&quot;:&quot;Item&quot;)+'</th>';
    prods.forEach(function(p){ html += '<th>'+esc(T(p.name))+'</th>'; });
    html += '</tr></thead><tbody>';

    // suitability row
    html += '<tr><th>'+(STATE.lang===&quot;ko&quot;?&quot;적합성&quot;:&quot;Suitability&quot;)+'</th>';
    prods.forEach(function(p){
      var ok = fitFor(p);
      html += '<td class=&quot;val&quot;><span class=&quot;fit '+(ok?&quot;ok&quot;:&quot;no&quot;)+'&quot;>'+(ok?I18N.fitOk[STATE.lang]:I18N.fitNo[STATE.lang])+'</span></td>';
    });
    html += '</tr>';

    // risk grade row
    html += '<tr><th>'+(STATE.lang===&quot;ko&quot;?&quot;위험등급&quot;:&quot;Risk grade&quot;)+'<br><span class=&quot;rowhint&quot;>'+(STATE.lang===&quot;ko&quot;?&quot;1(고위험)~6(저위험)&quot;:&quot;1 high – 6 low&quot;)+'</span></th>';
    prods.forEach(function(p){ html += '<td class=&quot;val&quot;><span class=&quot;v&quot;>'+p.risk+(STATE.lang===&quot;ko&quot;?&quot;등급&quot;:&quot;&quot;)+'</span></td>'; });
    html += '</tr>';

    // metric rows
    metrics.forEach(function(m){
      var bestId = null;
      if(m.better){
        var best=null;
        prods.forEach(function(p){
          var r = m.raw(p);
          if(r==null) return;
          if(best==null || (m.better===&quot;high&quot; ? r>best.v : r<best.v)){ best={v:r,id:p.id}; }
        });
        if(best &amp;&amp; prods.length>1) bestId = best.id;
      }
      var hint = m.hint ? '<br><span class=&quot;rowhint&quot;>'+m.hint[STATE.lang]+'</span>' : '';
      html += '<tr><th>'+m.label[STATE.lang]+hint+'</th>';
      prods.forEach(function(p){
        var isBest = p.id===bestId;
        html += '<td class=&quot;val'+(isBest?&quot; best&quot;:&quot;&quot;)+'&quot;><span class=&quot;v&quot;>'+esc(m.fmt(p))+'</span>'+(isBest?'<span class=&quot;tag best&quot;>'+I18N.best[STATE.lang]+'</span>':'')+'</td>';
      });
      html += '</tr>';
    });

    html += '</tbody></table></div>';
    body.innerHTML = html;
  }

  function esc(s){ return String(s==null?&quot;&quot;:s).replace(/[&amp;<>&quot;]/g,function(c){return ({&quot;&amp;&quot;:&quot;&amp;amp;&quot;,&quot;<&quot;:&quot;&amp;lt;&quot;,&quot;>&quot;:&quot;&amp;gt;&quot;,'&quot;':&quot;&amp;quot;&quot;})[c];}); }

  function renderAll(){ applyI18n(); renderInvestor(); renderTabs(); renderChips(); renderCompare(); }

  renderAll();
})();

    --success:#2E8540; --warning:#D4A017; --error:#C62828;
    --font-kr:'Noto Sans KR','Spoqa Han Sans Neo','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    --font-en:'Inter','Aptos','Segoe UI',system-ui,-apple-system,sans-serif;
    --space-block:56px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html[lang=&quot;ko&quot;] body{font-family:var(--font-kr)}
  html[lang=&quot;en&quot;] body{font-family:var(--font-en)}
  body{background:var(--canvas);color:var(--body);line-height:1.65;-webkit-font-smoothing:antialiased}
  .page{max-width:1200px;margin:0 auto;padding:0 32px}
  h1,h2,h3{color:var(--ink);letter-spacing:-0.3px}
  .num{font-variant-numeric:tabular-nums}

  header{border-bottom:1px solid var(--hairline)}
  .head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:26px 0 22px}
  .head-titles h1{font-size:30px;font-weight:700;line-height:1.15}
  .head-titles p{font-size:15px;color:var(--muted);margin-top:6px}

  .lang-toggle{display:inline-flex;border:1px solid var(--hairline);border-radius:2px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);flex:0 0 auto}
  .lang-toggle button{font-family:var(--font-en);font-size:14px;font-weight:500;letter-spacing:.5px;padding:10px 17px;background:#fff;color:var(--muted);border:none;cursor:pointer}
  .lang-toggle button+button{border-left:1px solid var(--hairline)}
  .lang-toggle button.active{background:var(--primary);color:#fff}
  .lang-toggle button:not(.active):hover{background:var(--surface-subtle);color:var(--ink)}

  .grid{display:grid;grid-template-columns:minmax(340px,420px) 1fr;gap:38px;margin:30px 0 var(--space-block)}
  @media (max-width:860px){ .grid{grid-template-columns:1fr;gap:28px} }

  .section-rule{height:1px;background:var(--primary);margin-bottom:16px}
  .section-title{font-size:20px;font-weight:700;margin-bottom:2px}
  .section-sub{font-size:13px;color:var(--muted);margin-bottom:18px}

  /* Inputs */
  .field{margin-bottom:18px}
  .field label{display:block;font-size:14px;font-weight:500;color:var(--ink);margin-bottom:7px}
  .field .hint{font-size:12px;color:var(--muted-soft);font-weight:400}
  .in-wrap{display:flex;align-items:center;border:1px solid var(--hairline);border-radius:2px;overflow:hidden}
  .in-wrap:focus-within{border-color:var(--primary)}
  .in-wrap input{flex:1;font:inherit;font-size:17px;font-variant-numeric:tabular-nums;text-align:right;padding:10px 12px;border:none;outline:none;color:var(--ink);min-width:0}
  .in-wrap .unit{padding:0 13px;font-size:14px;color:var(--muted);background:var(--surface-subtle);align-self:stretch;display:flex;align-items:center;border-left:1px solid var(--hairline)}
  .seg{display:flex;gap:8px;flex-wrap:wrap}
  .seg button{font:inherit;font-size:14px;padding:8px 14px;border:1px solid var(--hairline);border-radius:2px;background:#fff;color:var(--body);cursor:pointer}
  .seg button.active{background:var(--secondary);color:#fff;border-color:var(--secondary)}
  .seg button:not(.active):hover{background:var(--surface-subtle)}

  /* Results */
  .stat-card{border:1px solid var(--hairline);border-radius:4px;padding:24px 26px;margin-bottom:18px}
  .stat-card.accent{background:var(--primary);border-color:var(--primary)}
  .stat-label{font-size:14px;font-weight:500;letter-spacing:.4px;color:var(--muted)}
  .accent .stat-label{color:#ffe8d4}
  .stat-hero{font-size:44px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums;margin-top:6px;color:var(--secondary)}
  .accent .stat-hero{color:#fff}
  .stat-note{font-size:14px;color:var(--muted);margin-top:8px}
  .accent .stat-note{color:#ffe8d4}

  .kv{display:grid;grid-template-columns:1fr auto;gap:10px 16px;border:1px solid var(--hairline);border-radius:4px;padding:18px 22px;margin-bottom:18px}
  .kv .k{font-size:15px;color:var(--body)}
  .kv .v{font-size:15px;font-weight:600;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
  .kv .full{grid-column:1/3;height:1px;background:var(--hairline-soft);margin:2px 0}

  .callout{border-left:3px solid var(--primary);background:var(--surface-subtle);padding:14px 18px;border-radius:0 4px 4px 0;margin-bottom:18px;font-size:15px;color:var(--body)}
  .callout strong{color:var(--primary-active)}
  .callout.ok{border-left-color:var(--success)}
  .callout.ok strong{color:var(--success)}

  .foot{margin-bottom:60px;padding-top:20px;border-top:1px solid var(--hairline-soft)}
  .foot p{font-size:13px;color:var(--muted-soft);line-height:1.55}
  .btn{font:inherit;font-size:15px;font-weight:500;padding:10px 19px;height:42px;border:none;border-radius:2px;background:var(--primary);color:#fff;cursor:pointer;margin-top:6px}
  .btn:hover{background:var(--primary-active)}

  @media print{ .lang-toggle,.btn{display:none!important} .grid{grid-template-columns:1fr 1fr} body{font-size:13px} }
</style>
</head>
<body>
<header>
  <div class=&quot;page&quot;>
    <div class=&quot;head-row&quot;>
      <div class=&quot;head-titles&quot;>
        <h1 data-i18n=&quot;title&quot;>연금·절세 시뮬레이터</h1>
        <p data-i18n=&quot;subtitle&quot;>연금저축·IRP·ISA 납입에 따른 세액공제 환급액과 장기 과세이연 효과를 계산합니다</p>
      </div>
      <div class=&quot;lang-toggle&quot; role=&quot;radiogroup&quot; aria-label=&quot;language&quot;>
        <button id=&quot;ko&quot; class=&quot;active&quot; role=&quot;radio&quot; aria-checked=&quot;true&quot;>KO</button>
        <button id=&quot;en&quot; role=&quot;radio&quot; aria-checked=&quot;false&quot;>EN</button>
      </div>
    </div>
  </div>
</header>

<div class=&quot;page&quot;>
  <div class=&quot;grid&quot;>
    <!-- INPUTS -->
    <div>
      <div class=&quot;section-rule&quot;></div>
      <h2 class=&quot;section-title&quot; data-i18n=&quot;inTitle&quot;>입력</h2>
      <p class=&quot;section-sub&quot; data-i18n=&quot;inSub&quot;>단위: 만원 / 연간 기준</p>

      <div class=&quot;field&quot;>
        <label data-i18n=&quot;lSalary&quot;>총급여 (연)</label>
        <div class=&quot;in-wrap&quot;><input id=&quot;salary&quot; type=&quot;number&quot; min=&quot;0&quot; value=&quot;5000&quot; /><span class=&quot;unit&quot;>만원</span></div>
        <div class=&quot;hint&quot; id=&quot;rateHint&quot;></div>
      </div>

      <div class=&quot;field&quot;>
        <label data-i18n=&quot;lPs&quot;>연금저축 납입액 <span class=&quot;hint&quot; data-i18n=&quot;lPsHint&quot;>(공제한도 600)</span></label>
        <div class=&quot;in-wrap&quot;><input id=&quot;ps&quot; type=&quot;number&quot; min=&quot;0&quot; value=&quot;600&quot; /><span class=&quot;unit&quot;>만원</span></div>
      </div>

      <div class=&quot;field&quot;>
        <label data-i18n=&quot;lIrp&quot;>IRP 납입액 <span class=&quot;hint&quot; data-i18n=&quot;lIrpHint&quot;>(연금저축 합산 900)</span></label>
        <div class=&quot;in-wrap&quot;><input id=&quot;irp&quot; type=&quot;number&quot; min=&quot;0&quot; value=&quot;300&quot; /><span class=&quot;unit&quot;>만원</span></div>
      </div>

      <div class=&quot;field&quot;>
        <label data-i18n=&quot;lIsa&quot;>ISA 만기 전환액 <span class=&quot;hint&quot; data-i18n=&quot;lIsaHint&quot;>(전환액의 10%, 최대 300 추가공제)</span></label>
        <div class=&quot;in-wrap&quot;><input id=&quot;isa&quot; type=&quot;number&quot; min=&quot;0&quot; value=&quot;0&quot; /><span class=&quot;unit&quot;>만원</span></div>
      </div>

      <div class=&quot;section-rule&quot; style=&quot;margin-top:30px&quot;></div>
      <h2 class=&quot;section-title&quot; data-i18n=&quot;projTitle&quot;>장기 시뮬레이션 (가정)</h2>
      <p class=&quot;section-sub&quot; data-i18n=&quot;projSub&quot;>매년 동일 납입 가정</p>

      <div class=&quot;field&quot;>
        <label data-i18n=&quot;lYears&quot;>납입 기간</label>
        <div class=&quot;in-wrap&quot;><input id=&quot;years&quot; type=&quot;number&quot; min=&quot;1&quot; max=&quot;50&quot; value=&quot;20&quot; /><span class=&quot;unit&quot; data-i18n=&quot;uYear&quot;>년</span></div>
      </div>
      <div class=&quot;field&quot;>
        <label data-i18n=&quot;lReturn&quot;>가정 연 수익률</label>
        <div class=&quot;in-wrap&quot;><input id=&quot;ret&quot; type=&quot;number&quot; min=&quot;0&quot; max=&quot;30&quot; step=&quot;0.1&quot; value=&quot;5.0&quot; /><span class=&quot;unit&quot;>%</span></div>
      </div>

      <div class=&quot;field&quot;>
        <label data-i18n=&quot;lAge&quot;>연금 수령 개시 연령</label>
        <div class=&quot;seg&quot; id=&quot;ageSeg&quot;></div>
      </div>
    </div>

    <!-- RESULTS -->
    <div>
      <div class=&quot;section-rule&quot;></div>
      <h2 class=&quot;section-title&quot; data-i18n=&quot;outTitle&quot;>결과</h2>
      <p class=&quot;section-sub&quot; id=&quot;basisNote&quot;>2025년 세법 기준</p>

      <div class=&quot;stat-card accent&quot;>
        <div class=&quot;stat-label&quot; data-i18n=&quot;rRefund&quot;>올해 예상 세액공제 환급</div>
        <div class=&quot;stat-hero&quot; id=&quot;refund&quot;>-</div>
        <div class=&quot;stat-note&quot; id=&quot;refundNote&quot;></div>
      </div>

      <div id=&quot;roomCallout&quot;></div>

      <div class=&quot;kv&quot;>
        <div class=&quot;k&quot; data-i18n=&quot;kBase&quot;>세액공제 대상금액</div><div class=&quot;v&quot; id=&quot;kBase&quot;>-</div>
        <div class=&quot;k&quot; data-i18n=&quot;kRate&quot;>적용 공제율</div><div class=&quot;v&quot; id=&quot;kRate&quot;>-</div>
        <div class=&quot;full&quot;></div>
        <div class=&quot;k&quot; id=&quot;kPrincipalLabel&quot;>누적 납입원금</div><div class=&quot;v&quot; id=&quot;kPrincipal&quot;>-</div>
        <div class=&quot;k&quot; data-i18n=&quot;kGain&quot;>예상 운용수익 (가정)</div><div class=&quot;v&quot; id=&quot;kGain&quot;>-</div>
        <div class=&quot;k&quot; data-i18n=&quot;kFv&quot;>예상 적립금 (세전)</div><div class=&quot;v&quot; id=&quot;kFv&quot;>-</div>
        <div class=&quot;k&quot; data-i18n=&quot;kTaxSaved&quot;>세액공제 누계 (환급 합계)</div><div class=&quot;v&quot; id=&quot;kTaxSaved&quot;>-</div>
      </div>

      <div class=&quot;stat-card&quot;>
        <div class=&quot;stat-label&quot; data-i18n=&quot;rWithdraw&quot;>연금 수령 시 예상 세율</div>
        <div class=&quot;stat-hero&quot; id=&quot;wrate&quot; style=&quot;color:var(--primary-active)&quot;>-</div>
        <div class=&quot;stat-note&quot; id=&quot;wrateNote&quot;></div>
      </div>

      <button class=&quot;btn&quot; id=&quot;printBtn&quot; data-i18n=&quot;printBtn&quot;>인쇄 / PDF 저장</button>
    </div>
  </div>

  <div class=&quot;foot&quot;>
    <p data-i18n=&quot;disclaimer&quot;>본 계산은 2025년 세법(연금계좌 세액공제 통합한도 900만원, 공제율 13.2%/16.5%, ISA 전환 추가공제 최대 300만원, 연금소득세 연령별 3.3~5.5%) 기준의 단순 추정이며, 개인별 소득·공제 상황에 따라 실제와 다를 수 있습니다. 운용수익률은 가정치이며 원금·수익을 보장하지 않습니다. 정확한 세무는 세무 전문가·국세청 기준을 확인하십시오.</p>
  </div>
</div>

<script>
(function(){
  &quot;use strict&quot;;

  var I18N = {
    title:{ko:&quot;연금·절세 시뮬레이터&quot;,en:&quot;Pension &amp; Tax Simulator&quot;},
    subtitle:{ko:&quot;연금저축·IRP·ISA 납입에 따른 세액공제 환급액과 장기 과세이연 효과를 계산합니다&quot;,en:&quot;Estimate tax-credit refunds and long-term tax-deferral from pension savings, IRP and ISA contributions&quot;},
    inTitle:{ko:&quot;입력&quot;,en:&quot;Inputs&quot;},
    inSub:{ko:&quot;단위: 만원 / 연간 기준&quot;,en:&quot;Unit: 10K KRW / annual&quot;},
    lSalary:{ko:&quot;총급여 (연)&quot;,en:&quot;Annual gross salary&quot;},
    lPs:{ko:&quot;연금저축 납입액&quot;,en:&quot;Pension savings&quot;},
    lPsHint:{ko:&quot;(공제한도 600)&quot;,en:&quot;(limit 600)&quot;},
    lIrp:{ko:&quot;IRP 납입액&quot;,en:&quot;IRP contribution&quot;},
    lIrpHint:{ko:&quot;(연금저축 합산 900)&quot;,en:&quot;(combined cap 900)&quot;},
    lIsa:{ko:&quot;ISA 만기 전환액&quot;,en:&quot;ISA maturity rollover&quot;},
    lIsaHint:{ko:&quot;(전환액의 10%, 최대 300 추가공제)&quot;,en:&quot;(10% of rollover, +300 max)&quot;},
    projTitle:{ko:&quot;장기 시뮬레이션 (가정)&quot;,en:&quot;Long-term projection (assumed)&quot;},
    projSub:{ko:&quot;매년 동일 납입 가정&quot;,en:&quot;Assumes equal annual contribution&quot;},
    lYears:{ko:&quot;납입 기간&quot;,en:&quot;Contribution period&quot;},
    lReturn:{ko:&quot;가정 연 수익률&quot;,en:&quot;Assumed annual return&quot;},
    lAge:{ko:&quot;연금 수령 개시 연령&quot;,en:&quot;Pension start age&quot;},
    outTitle:{ko:&quot;결과&quot;,en:&quot;Results&quot;},
    rRefund:{ko:&quot;올해 예상 세액공제 환급&quot;,en:&quot;Est. tax-credit refund (this year)&quot;},
    kBase:{ko:&quot;세액공제 대상금액&quot;,en:&quot;Deductible base&quot;},
    kRate:{ko:&quot;적용 공제율&quot;,en:&quot;Credit rate&quot;},
    kPrincipal:{ko:&quot;누적 납입원금&quot;,en:&quot;Cumulative principal&quot;},
    kGain:{ko:&quot;예상 운용수익 (가정)&quot;,en:&quot;Est. investment gain&quot;},
    kFv:{ko:&quot;예상 적립금 (세전)&quot;,en:&quot;Projected balance (pre-tax)&quot;},
    kTaxSaved:{ko:&quot;세액공제 누계 (환급 합계)&quot;,en:&quot;Cumulative tax credit&quot;},
    rWithdraw:{ko:&quot;연금 수령 시 예상 세율&quot;,en:&quot;Est. pension income tax rate&quot;},
    printBtn:{ko:&quot;인쇄 / PDF 저장&quot;,en:&quot;Print / Save PDF&quot;},
    basis:{ko:&quot;2025년 세법 기준&quot;,en:&quot;Based on 2025 tax rules&quot;},
    disclaimer:{ko:&quot;본 계산은 2025년 세법(연금계좌 세액공제 통합한도 900만원, 공제율 13.2%/16.5%, ISA 전환 추가공제 최대 300만원, 연금소득세 연령별 3.3~5.5%) 기준의 단순 추정이며, 개인별 소득·공제 상황에 따라 실제와 다를 수 있습니다. 운용수익률은 가정치이며 원금·수익을 보장하지 않습니다. 정확한 세무는 세무 전문가·국세청 기준을 확인하십시오.&quot;,en:&quot;Estimates use 2025 tax rules (pension-account credit cap KRW 9M, rate 13.2%/16.5%, ISA rollover extra credit up to KRW 3M, pension income tax 3.3–5.5% by age) and may differ by individual circumstances. Returns are assumptions and not guaranteed. Confirm with a tax professional / NTS guidance.&quot;},
    uYear:{ko:&quot;년&quot;,en:&quot;y&quot;},
    // dynamic
    rateLow:{ko:&quot;총급여 5,500만원 이하 → 16.5% 적용&quot;,en:&quot;Salary ≤ 55M → 16.5%&quot;},
    rateHigh:{ko:&quot;총급여 5,500만원 초과 → 13.2% 적용&quot;,en:&quot;Salary > 55M → 13.2%&quot;},
    roomFull:{ko:&quot;공제 한도를 모두 채웠습니다. 최대 환급을 받고 있습니다.&quot;,en:&quot;Deduction limit fully used — maximum refund achieved.&quot;},
    ageNote:{ko:&quot;{a}세 이상 수령 기준. 사적연금 연 1,500만원 초과 시 종합과세 또는 16.5% 분리과세 선택.&quot;,en:&quot;For age {a}+. Private pension over KRW 15M/yr: global taxation or 16.5% separate taxation.&quot;}
  };

  var AGES = [
    {v:65, floor:70, ko:&quot;55~69세&quot;, en:&quot;55–69&quot;},
    {v:75, floor:70, ko:&quot;70~79세&quot;, en:&quot;70–79&quot;},
    {v:82, floor:80, ko:&quot;80세 이상&quot;, en:&quot;80+&quot;}
  ];
  // 연금소득세율(지방세 포함): <70 5.5%, 70~79 4.4%, >=80 3.3%
  function withdrawRate(band){ return band<70 ? 5.5 : band<80 ? 4.4 : 3.3; }

  var STATE = { lang:&quot;ko&quot;, ageBand:65 };

  function fmtMan(v){ // v in 만원 -> localized
    if(STATE.lang===&quot;en&quot;) return &quot;KRW &quot;+Math.round(v*1e4).toLocaleString();
    if(v>=10000) return (v/10000).toLocaleString(undefined,{maximumFractionDigits:2})+&quot;억원&quot;;
    return Math.round(v).toLocaleString()+&quot;만원&quot;;
  }
  function fmtWon(man){ // small refund amounts, show 원
    if(STATE.lang===&quot;en&quot;) return &quot;KRW &quot;+Math.round(man*1e4).toLocaleString();
    return Math.round(man*1e4).toLocaleString()+&quot;원&quot;;
  }

  function val(id){ var n=parseFloat(document.getElementById(id).value); return isNaN(n)||n<0?0:n; }

  function compute(){
    var salary=val(&quot;salary&quot;), ps=val(&quot;ps&quot;), irp=val(&quot;irp&quot;), isa=val(&quot;isa&quot;),
        years=Math.max(1,val(&quot;years&quot;)||1), ret=val(&quot;ret&quot;)/100;

    var psElig=Math.min(ps,600);
    var combined=Math.min(psElig+irp, 900);
    var isaBonus=Math.min(isa*0.10, 300);
    var base=combined+isaBonus;                 // 만원
    var rate=salary<=5500 ? 0.165 : 0.132;
    var refund=base*rate;                        // 만원

    // remaining room to 900 (연금계좌 본납입 기준)
    var combinedRoom=Math.max(0, 900-combined);

    // projection: annual contribution = ps+irp (실제 납입)
    var annual=ps+irp;
    var fv = ret>0 ? annual*((Math.pow(1+ret,years)-1)/ret) : annual*years;
    var principal=annual*years;
    var gain=fv-principal;
    var taxCum=refund*years;

    return {salary,ps,irp,isa,years,ret,base,rate,refund,combinedRoom,annual,fv,principal,gain,taxCum};
  }

  function render(){
    var L=STATE.lang, c=compute();
    // rate hint under salary
    document.getElementById(&quot;rateHint&quot;).textContent = c.salary<=5500 ? I18N.rateLow[L] : I18N.rateHigh[L];

    document.getElementById(&quot;refund&quot;).textContent = fmtWon(c.refund);
    document.getElementById(&quot;refundNote&quot;).textContent =
      (L===&quot;ko&quot; ? &quot;세액공제 대상 &quot;+fmtMan(c.base)+&quot; × &quot;+ (c.rate*100).toFixed(1)+&quot;%&quot;
                : &quot;base &quot;+fmtMan(c.base)+&quot; × &quot;+(c.rate*100).toFixed(1)+&quot;%&quot;);

    // room callout
    var rc=document.getElementById(&quot;roomCallout&quot;);
    if(c.combinedRoom>0){
      var extra=c.combinedRoom*c.rate;
      rc.innerHTML= L===&quot;ko&quot;

    tabMisu:{ko:&quot;미수거래&quot;,en:&quot;Unsettled (Misu)&quot;},
    unitNote:{ko:&quot;금액 단위: 만원&quot;,en:&quot;Amounts in 10K KRW&quot;},
    opt:{ko:&quot;(선택)&quot;,en:&quot;(optional)&quot;},
    printBtn:{ko:&quot;인쇄 / PDF 저장&quot;,en:&quot;Print / Save PDF&quot;},
    // credit
    cIn:{ko:&quot;신용융자 입력&quot;,en:&quot;Margin Loan Inputs&quot;},
    cBuy:{ko:&quot;신용 매수금액&quot;,en:&quot;Margin buy amount&quot;},
    cPrice:{ko:&quot;매수 단가&quot;,en:&quot;Buy price&quot;},
    cMargin:{ko:&quot;신용 증거금률&quot;,en:&quot;Initial margin rate&quot;},
    cChg:{ko:&quot;현재 등락률&quot;,en:&quot;Current change&quot;},
    cChgHint:{ko:&quot;(매수가 대비, 하락은 −)&quot;,en:&quot;(vs buy price, − for drop)&quot;},
    cMaint:{ko:&quot;담보유지비율&quot;,en:&quot;Maintenance ratio&quot;},
    cCash:{ko:&quot;추가 현금담보&quot;,en:&quot;Extra cash collateral&quot;},
    cInt:{ko:&quot;융자 연이자율&quot;,en:&quot;Loan rate (p.a.)&quot;},
    cDays:{ko:&quot;융자 기간&quot;,en:&quot;Loan period&quot;},
    cOut:{ko:&quot;신용융자 결과&quot;,en:&quot;Margin Loan Result&quot;},
    cOutSub:{ko:&quot;담보비율이 유지비율 미만이면 반대매매 대상&quot;,en:&quot;Below maintenance ratio triggers forced sell&quot;},
    cRatioL:{ko:&quot;현재 담보비율&quot;,en:&quot;Current collateral ratio&quot;},
    cTrigL:{ko:&quot;반대매매 발생 수준&quot;,en:&quot;Forced-sell trigger&quot;},
    cLoan:{ko:&quot;융자금액&quot;,en:&quot;Loan amount&quot;},
    cOwn:{ko:&quot;신용 증거금(자기자금)&quot;,en:&quot;Own margin&quot;},
    cVal:{ko:&quot;현재 담보평가액&quot;,en:&quot;Current collateral value&quot;},
    cBuffer:{ko:&quot;반대매매까지 추가하락 여력&quot;,en:&quot;Buffer to forced sell&quot;},
    cInt2:{ko:&quot;예상 융자이자&quot;,en:&quot;Est. loan interest&quot;},
    uDay:{ko:&quot;일&quot;,en:&quot;d&quot;},
    // misu
    mIn:{ko:&quot;미수거래 입력&quot;,en:&quot;Unsettled-Trade Inputs&quot;},
    mDep:{ko:&quot;예수금(가용 증거금)&quot;,en:&quot;Cash deposit (available)&quot;},
    mMargin:{ko:&quot;증거금률&quot;,en:&quot;Margin rate&quot;},
    mBuy:{ko:&quot;매수 주문금액&quot;,en:&quot;Buy order amount&quot;},
    mOut:{ko:&quot;미수거래 결과&quot;,en:&quot;Unsettled-Trade Result&quot;},
    mOutSub:{ko:&quot;미수금은 결제일(T+2)까지 입금해야 합니다&quot;,en:&quot;Unsettled amount must be funded by T+2&quot;},
    mMaxL:{ko:&quot;최대 미수 매수가능금액&quot;,en:&quot;Max buyable with misu&quot;},
    mNeed:{ko:&quot;필요 증거금&quot;,en:&quot;Required margin&quot;},
    mDebt:{ko:&quot;미수금 (결제 필요액)&quot;,en:&quot;Unsettled amount (to fund)&quot;},
    mRatio:{ko:&quot;실질 레버리지&quot;,en:&quot;Effective leverage&quot;}
  };

  var TABS=[{key:&quot;credit&quot;,k:&quot;tabCredit&quot;},{key:&quot;misu&quot;,k:&quot;tabMisu&quot;}];
  var STATE={lang:&quot;ko&quot;,tab:&quot;credit&quot;};

  function val(id){var n=parseFloat(document.getElementById(id).value);return isNaN(n)?0:n;}
  function fmtMan(v){
    if(STATE.lang===&quot;en&quot;) return &quot;KRW &quot;+Math.round(v*1e4).toLocaleString();
    var neg=v<0; v=Math.abs(v); var s;
    if(v>=10000) s=(v/10000).toLocaleString(undefined,{maximumFractionDigits:2})+&quot;억원&quot;;
    else s=Math.round(v).toLocaleString()+&quot;만원&quot;;
    return (neg?&quot;−&quot;:&quot;&quot;)+s;
  }
  function fmtWon(won){ return (STATE.lang===&quot;en&quot;?&quot;KRW &quot;:&quot;&quot;)+Math.round(won).toLocaleString()+(STATE.lang===&quot;ko&quot;?&quot;원&quot;:&quot;&quot;); }
  function pp(v){ return (v>0?&quot;+&quot;:&quot;&quot;)+v.toFixed(1)+&quot;%p&quot;; }

  /* ---------- CREDIT ---------- */
  function calcCredit(){
    var P0=val(&quot;c_buy&quot;), price=val(&quot;c_price&quot;), m=val(&quot;c_margin&quot;)/100,
        chg=val(&quot;c_chg&quot;)/100, R=val(&quot;c_maint&quot;)/100, C=val(&quot;c_cash&quot;),
        i=val(&quot;c_int&quot;)/100, days=val(&quot;c_days&quot;);
    var L=P0*(1-m);                    // 융자금
    var own=P0*m;                      // 자기자금
    var V=P0*(1+chg);                  // 현재 평가액
    var collat=V+C;                    // 담보평가액
    var ratio=L>0 ? collat/L*100 : 0;
    // 반대매매 트리거: (Vtrig + C)/L = R -> Vtrig = R*L - C ; 매수가 대비 등락률
    var Vtrig=R*L - C;
    var chgTrig=P0>0 ? (Vtrig/P0 - 1)*100 : 0;   // % vs 매수가
    var interest=L*i*days/365;         // 만원
    var addNeed=collat < R*L ? (R*L - collat) : 0; // 마진콜 시 추가 담보
    return {P0,price,m,chg:chg*100,R:R*100,C,L,own,V,collat,ratio,Vtrig,chgTrig,interest,addNeed,i,days};
  }

  function renderCredit(){
    var L=STATE.lang, c=calcCredit();
    var safe=c.ratio>=c.R;

    var rc=document.getElementById(&quot;c_ratioCard&quot;);
    rc.className=&quot;stat-card&quot;+(safe?&quot;&quot;:&quot; danger&quot;);
    document.getElementById(&quot;c_ratio&quot;).textContent=c.ratio.toFixed(1)+&quot;%&quot;;
    document.getElementById(&quot;c_ratioNote&quot;).textContent=(L===&quot;ko&quot;
      ? &quot;담보유지비율 &quot;+c.R.toFixed(0)+&quot;% 기준&quot;
      : &quot;vs &quot;+c.R.toFixed(0)+&quot;% maintenance&quot;);

    var co=document.getElementById(&quot;c_callout&quot;);
    if(safe){
      co.innerHTML='<div class=&quot;callout ok&quot;>'+(L===&quot;ko&quot;
        ? '현재 담보비율이 유지비율을 <strong>'+(c.ratio-c.R).toFixed(1)+'%p</strong> 상회합니다. 매수가 대비 약 <strong>'+Math.abs(c.chgTrig).toFixed(1)+'%</strong> 하락 시 반대매매 위험 구간에 진입합니다.'
        : 'Ratio exceeds maintenance by <strong>'+(c.ratio-c.R).toFixed(1)+'%p</strong>. Forced-sell risk near <strong>'+Math.abs(c.chgTrig).toFixed(1)+'%</strong> drop from buy price.')+'</div>';
    } else {
      co.innerHTML='<div class=&quot;callout warn&quot;>'+(L===&quot;ko&quot;
        ? '<strong>담보 부족(마진콜)</strong> — 유지비율 미달 상태입니다. 반대매매를 피하려면 현금담보 <strong>'+fmtMan(c.addNeed)+'</strong>을 추가 입금하거나 상환이 필요합니다.'
        : '<strong>Margin call</strong> — below maintenance. Add <strong>'+fmtMan(c.addNeed)+'</strong> collateral or repay to avoid forced sell.')+'</div>';
    }

    // 반대매매 발생 수준
    var trigEl=document.getElementById(&quot;c_trig&quot;), trigNote=document.getElementById(&quot;c_trigNote&quot;);
    if(c.price>0){
      var trigPrice=c.price*(1+c.chgTrig/100);
      trigEl.textContent=fmtWon(trigPrice);
      trigNote.textContent=(L===&quot;ko&quot;
        ? &quot;매수가 &quot;+fmtWon(c.price)+&quot; 대비 &quot;+c.chgTrig.toFixed(1)+&quot;% (현재가 &quot;+fmtWon(c.price*(1+c.chg/100))+&quot;)&quot;
        : &quot;vs buy &quot;+fmtWon(c.price)+&quot;, &quot;+c.chgTrig.toFixed(1)+&quot;%&quot;);
    } else {
      trigEl.textContent=c.chgTrig.toFixed(1)+&quot;%&quot;;
      trigNote.textContent=(L===&quot;ko&quot;?&quot;매수가 대비 하락률 기준&quot;:&quot;drop vs buy price&quot;);
    }

    document.getElementById(&quot;c_loan&quot;).textContent=fmtMan(c.L);
    document.getElementById(&quot;c_own&quot;).textContent=fmtMan(c.own);
    document.getElementById(&quot;c_val&quot;).textContent=fmtMan(c.collat);
    document.getElementById(&quot;c_buffer&quot;).textContent = safe ? (L===&quot;ko&quot;?&quot;약 &quot;:&quot;~&quot;)+(c.chg - c.chgTrig).toFixed(1)+&quot;%p&quot; : (L===&quot;ko&quot;?&quot;해당없음&quot;:&quot;n/a&quot;);
    document.getElementById(&quot;c_intLabel&quot;).textContent=I18N.cInt2[L];
    document.getElementById(&quot;c_intVal&quot;).textContent=fmtWon(c.interest*1e4);
  }

  /* ---------- MISU ---------- */
  function calcMisu(){
    var D=val(&quot;m_dep&quot;), m=val(&quot;m_margin&quot;)/100, P=val(&quot;m_buy&quot;);
    var maxBuy = m>0 ? D/m : 0;
    var need = P*m;
    var debt = Math.max(0, P-D);            // 결제일까지 채워야 할 미수금
    var over = P>maxBuy;                     // 증거금 부족 주문불가
    var lev = D>0 ? P/D : 0;
    return {D,m,P,maxBuy,need,debt,over,lev};
  }

  function renderMisu(){
    var L=STATE.lang, x=calcMisu();
    document.getElementById(&quot;m_max&quot;).textContent=fmtMan(x.maxBuy);
    document.getElementById(&quot;m_maxNote&quot;).textContent=(L===&quot;ko&quot;
      ? &quot;예수금 &quot;+fmtMan(x.D)+&quot; ÷ 증거금률 &quot;+(x.m*100).toFixed(0)+&quot;%&quot;
      : &quot;deposit &quot;+fmtMan(x.D)+&quot; ÷ &quot;+(x.m*100).toFixed(0)+&quot;%&quot;);

    var mc=document.getElementById(&quot;m_callout&quot;);
    if(x.over){
      mc.innerHTML='<div class=&quot;callout warn&quot;>'+(L===&quot;ko&quot;
        ? '<strong>증거금 부족</strong> — 주문금액이 최대 매수가능금액('+fmtMan(x.maxBuy)+')을 초과해 주문이 거부됩니다.'
        : '<strong>Insufficient margin</strong> — order exceeds max buyable ('+fmtMan(x.maxBuy)+') and will be rejected.')+'</div>';
    } else if(x.debt>0){
      mc.innerHTML='<div class=&quot;callout&quot;>'+(L===&quot;ko&quot;
        ? '미수금 <strong>'+fmtMan(x.debt)+'</strong>이 발생합니다. 결제일(T+2)까지 미입금 시 <strong>익영업일 오전 동시호가에 하한가로 반대매매</strong>되고, 계좌는 30일간 미수동결계좌로 지정됩니다.'
        : 'Unsettled amount <strong>'+fmtMan(x.debt)+'</strong> arises. If not funded by T+2, it is <strong>force-sold at the next-day opening auction</strong> and the account is frozen for 30 days.')+'</div>';
    } else {
      mc.innerHTML='<div class=&quot;callout ok&quot;>'+(L===&quot;ko&quot;
        ? '예수금 내 매수로 <strong>미수금이 없습니다.</strong>'
        : 'Fully funded — <strong>no unsettled amount.</strong>')+'</div>';
    }

    document.getElementById(&quot;m_need&quot;).textContent=fmtMan(x.need);
    document.getElementById(&quot;m_debt&quot;).textContent=fmtMan(x.debt);
    document.getElementById(&quot;m_lev&quot;).textContent=x.lev.toFixed(2)+(L===&quot;ko&quot;?&quot;배&quot;:&quot;x&quot;);
  }

  /* ---------- shell ---------- */
  function renderTabs(){
    var tb=document.getElementById(&quot;tabbar&quot;); tb.innerHTML=&quot;&quot;;
    TABS.forEach(function(t){
      var b=document.createElement(&quot;button&quot;);
      b.textContent=I18N[t.k][STATE.lang];
      if(t.key===STATE.tab) b.className=&quot;active&quot;;
      b.onclick=function(){ STATE.tab=t.key; renderTabs(); renderPanels(); };
      tb.appendChild(b);
    });
  }
  function renderPanels(){
    document.getElementById(&quot;panelCredit&quot;).classList.toggle(&quot;hidden&quot;,STATE.tab!==&quot;credit&quot;);
    document.getElementById(&quot;panelMisu&quot;).classList.toggle(&quot;hidden&quot;,STATE.tab!==&quot;misu&quot;);
    renderCredit(); renderMisu();
  }
  function applyI18n(){
    document.documentElement.lang=STATE.lang;
    document.querySelectorAll(&quot;[data-i18n]&quot;).forEach(function(el){
      var k=el.getAttribute(&quot;data-i18n&quot;); if(I18N[k]) el.textContent=I18N[k][STATE.lang];
    });
    document.querySelectorAll(&quot;.unit[data-i18n=uDay]&quot;).forEach(function(el){el.textContent=I18N.uDay[STATE.lang];});
    document.getElementById(&quot;ko&quot;).classList.toggle(&quot;active&quot;,STATE.lang===&quot;ko&quot;);
    document.getElementById(&quot;en&quot;).classList.toggle(&quot;active&quot;,STATE.lang===&quot;en&quot;);
    document.getElementById(&quot;ko&quot;).setAttribute(&quot;aria-checked&quot;,STATE.lang===&quot;ko&quot;);
    document.getElementById(&quot;en&quot;).setAttribute(&quot;aria-checked&quot;,STATE.lang===&quot;en&quot;);
  }
  function renderAll(){ applyI18n(); renderTabs(); renderPanels(); }

  function setLang(l){ STATE.lang=l; try{localStorage.setItem(&quot;mr_lang&quot;,l);}catch(e){} renderAll(); }
  document.getElementById(&quot;ko&quot;).onclick=function(){setLang(&quot;ko&quot;);};
  document.getElementById(&quot;en&quot;).onclick=function(){setLang(&quot;en&quot;);};
  document.getElementById(&quot;printBtn&quot;).onclick=function(){window.print();};
  document.getElementById(&quot;printBtn2&quot;).onclick=function(){window.print();};
  [&quot;c_buy&quot;,&quot;c_price&quot;,&quot;c_margin&quot;,&quot;c_chg&quot;,&quot;c_maint&quot;,&quot;c_cash&quot;,&quot;c_int&quot;,&quot;c_days&quot;].forEach(function(id){
    document.getElementById(id).addEventListener(&quot;input&quot;,renderCredit);
  });
  [&quot;m_dep&quot;,&quot;m_margin&quot;,&quot;m_buy&quot;].forEach(function(id){
    document.getElementById(id).addEventListener(&quot;input&quot;,renderMisu);
  });

  try{ var sv=localStorage.getItem(&quot;mr_lang&quot;); if(sv===&quot;ko&quot;||sv===&quot;en&quot;) STATE.lang=sv; }catch(e){}
  renderAll();
})();
</script>

<script>
(function(){

  var I18N={
    title:{ko:"영업 지원 도구",en:"Sales Toolkit"},
    subtitle:{ko:"상담·제안·리스크 관리에 쓰는 도구 모음입니다. 이 파일 하나로 모든 도구가 실행됩니다.",en:"Tools for consulting, proposals and risk management — all in this single file."},
    open:{ko:"열기",en:"Open"}, back:{ko:"← 도구 목록",en:"← Tools"},
    disclaimer:{ko:"본 도구의 데이터·수치는 시연용 예시 또는 공개 규칙 기반 추정이며 투자 권유·자문이 아닙니다. 상품·세무·거래 조건은 최신 규정과 상품설명서, 회사 기준을 확인하십시오.",en:"Figures here are sample data or estimates from public rules and are not investment advice. Verify against the latest rules, prospectuses and company guidance."}
  };
  var L=0; // 0 ko,1 en
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c];});}
  function lang(){return L?"en":"ko";}

  function renderHome(){
    document.documentElement.lang=lang();
    document.querySelectorAll("[data-i18n]").forEach(function(el){var k=el.getAttribute("data-i18n");if(I18N[k])el.textContent=I18N[k][lang()];});
    document.getElementById("ko").classList.toggle("active",L===0);
    document.getElementById("en").classList.toggle("active",L===1);
    var g=document.getElementById("grid");g.innerHTML="";
    TOOLS.forEach(function(t,i){
      var b=document.createElement("button");b.className="card";b.setAttribute("data-key",t.key);
      var tags=t.tags[L].map(function(x){return '<span class="tag">'+esc(x)+'</span>';}).join("");
      var note=t.note?'<div class="cnote">'+esc(t.note[L])+'</div>':'';
      b.innerHTML='<div class="card-top"><span class="cat">'+esc(t.cat[L])+'</span><span class="num">0'+(i+1)+'</span></div>'+
        '<h2>'+esc(t.name[L])+'</h2><p>'+esc(t.desc[L])+'</p><div class="tags">'+tags+'</div>'+note+
        '<div class="open">'+esc(I18N.open[L])+' &rarr;</div>';
      b.onclick=function(){openTool(t);};
      g.appendChild(b);
    });
  }
  function openTool(t){
    document.querySelectorAll(".toolframe").forEach(function(f){f.classList.add("hidden");});
    var fr=document.getElementById("frame-"+t.key);
    if(!fr.getAttribute("srcdoc")){ fr.srcdoc=fr.getAttribute("data-srcdoc"); } // lazy load once
    fr.classList.remove("hidden");
    document.getElementById("vCat").textContent=t.cat[L];
    document.getElementById("vName").textContent=t.name[L];
    document.getElementById("viewer").classList.remove("hidden");
    document.body.style.overflow="hidden";
  }
  function closeTool(){document.getElementById("viewer").classList.add("hidden");document.body.style.overflow="";}
  document.getElementById("backBtn").onclick=closeTool;
  document.getElementById("ko").onclick=function(){L=0;renderHome();};
  document.getElementById("en").onclick=function(){L=1;renderHome();};
  document.addEventListener("keydown",function(e){if(e.key==="Escape")closeTool();});
  renderHome();
})();
</script>

<!--

-->
<noscript>
  <div style="max-width:560px;margin:0 auto;padding:28px 20px;font-family:sans-serif;color:#1A1A1A;line-height:1.7">

      카카오톡·메일·파일 관리자의 내장 미리보기가 대개 그렇습니다.
    </p>
    <p style="font-size:15px;font-weight:bold;margin:0 0 8px">웹 브라우저로 열어 주세요</p>

      <li style="margin-bottom:6px">파일을 길게 눌러 <strong>연결 프로그램 / 다른 앱으로 열기</strong>를 고릅니다.</li>

    </ol>
    <p style="font-size:14px;color:#6C6C6C;margin:0">
      브라우저로 열었는데도 이 문구가 보이면 브라우저 설정에서 JavaScript 가 꺼져 있는지 확인하세요.
      (Chrome → 설정 → 사이트 설정 → JavaScript → 허용)
    </p>
  </div>

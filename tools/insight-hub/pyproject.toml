# Vercel 배포용. 로컬·Windows 판은 이 파일을 쓰지 않는다(표준 라이브러리만으로 server.py 를 돌린다).
[project]
name = "center-insight"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2,<4",
]

# Vercel 은 루트의 server.py 를 입구로 먼저 집어 가므로, WSGI 감싸개(api/index.py 의 app)를 입구로 못 박는다
[tool.vercel]
entrypoint = "api.index:app"

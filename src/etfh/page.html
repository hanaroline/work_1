<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이 ETF는 무엇을 담고 있나</title>
<style>/*__CSS__*/</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div>
      <h1 id="h-title"></h1>
      <div class="sub" id="h-sub"></div>
    </div>
    <div class="top-r">
      <button class="btn" id="btn-print" type="button"></button>
      <div class="lang" role="radiogroup" aria-label="Language">
        <button type="button" role="radio" data-lang="ko" aria-checked="true">KO</button><button type="button" role="radio" data-lang="en" aria-checked="false">EN</button>
      </div>
    </div>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" aria-controls="p-find"></button>
    <button role="tab" aria-selected="false" aria-controls="p-cmp" disabled></button>
    <button role="tab" aria-selected="false" aria-controls="p-rev" disabled></button>
    <button role="tab" aria-selected="false" aria-controls="p-rank" disabled></button>
    <button role="tab" aria-selected="false" aria-controls="p-audit" disabled></button>
    <button role="tab" aria-selected="false" aria-controls="p-basis" disabled></button>
    <button role="tab" aria-selected="false" aria-controls="p-howto" disabled></button>
  </nav>

  <section class="panel on" id="p-find" role="tabpanel">
    <h2 id="find-h"></h2>
    <p class="lead" id="find-lead"></p>
    <input class="search" id="q" type="search" autocomplete="off">
    <div class="filters" id="filters"></div>
    <div class="bar2">
      <label><span id="lbl-period"></span><select id="period"></select></label>
      <label><input type="checkbox" id="lev"><span id="lbl-lev"></span></label>
      <label><input type="checkbox" id="hold" checked><span id="lbl-hold"></span></label>
      <span class="count" id="count"></span>
      <button class="btn" id="btn-reset" type="button"></button>
    </div>
    <div class="band" id="band-period" hidden></div>
    <div class="tw" id="tbl"></div>
    <button class="btn more" id="more" type="button" hidden></button>
  </section>
</div>
<script type="application/json" id="etfh-data">/*__DATA__*/</script>
<script>/*__JS__*/</script>
</body>
</html>

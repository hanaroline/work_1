 <!DOCTYPE html>
  <html lang="ko">
  <head>
    <meta charset="utf-8">
    <title>서비스 이용 안내</title>
    <style>
      body {
        font-family: sans-serif;
        text-align: center;
        padding-top: 100px;
        background-color: #fafafa;
        color: #333;
      }
      .notice-container {
        background-color: #ffffff;
        max-width: 500px;
        margin: 0 auto;
        padding: 40px 20px;
        border: 1px solid #ddd;
      }
      h2 {
        color: #495057; /* 위협적인 빨간색 대신 차분한 톤 사용 */
        margin-bottom: 20px;
      }
      p {
        line-height: 1.6;
        margin-bottom: 15px;
        color: #555;
      }
      .contact {
        font-weight: bold;
        margin-top: 30px;
        color: #212529;
      }
    </style>
  </head>
  <body>
    
    <div class="notice-container">
      <h2>요청 하신 페이지를 찾을 수 없습니다.</h2>
      
      <!-- 차단 및 에러 상황을 모두 아우르는 포괄적인 문구 -->
      <p>서비스이용에 불편을 드려 대단히 죄송합니다.<br>요청하신 페이지가 존재 하지 않습니다.</p>
      <p>올바른 방법으로 접근하시기 바랍니다.<br>
    </div>

  </body>
  </html>

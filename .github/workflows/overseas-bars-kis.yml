name: 해외 상장 주식 다년 일봉 수집 (한국투자증권)

# 국내 상장분은 kr-bars-kis.yml 로 10 해치를 받아, 상품을 여러 해의 위험조정
# 성과로 고를 수 있게 됐다. 그런데 **해외주식 100 종만 아직 1 해치**다 —
# 원천(us100-data)이 500 봉만 주기 때문이다. 그래서 제안서에서 해외주식만
# 「1해 실측」으로 남는다.
#
# 클로드 세션에서는 KIS 에 못 붙는다(9443·29443 은 이그레스 프록시가 비-443
# 포트를 지원하지 않는다). 그래서 러너 몫이다.
#
# **오래 걸린다.** 모의투자는 초당 한 건이라 100 종 × 10 해면 25~40 분쯤이다.
# 수집기는 다섯 종목마다 파일에 쓰고, 다시 돌리면 이미 받은 것을 건너뛴다.
# 시간 제한에 걸려도 받은 만큼은 커밋되도록 커밋 단계를 always() 로 둔다.
#
# **거래소를 모르면 찾아낸다.** 원천에 심볼만 있고 거래소가 없는데, 거래소를
# 틀리면 오류가 아니라 빈 응답이 온다. 그래서 NAS→NYS→AMS 로 찔러 보고,
# 찾은 것은 산출물에 적어 두어 다음 판에는 찔러 보지 않는다.
#
# **필요한 Secrets** — KIS_APP_KEY / KIS_APP_SECRET

on:
  workflow_dispatch:
    inputs:
      years:
        description: '몇 해치 (기본 10)'
        required: false
        default: '10'
      limit:
        description: '몇 종만 (0=전부, 규모 큰 것부터)'
        required: false
        default: '0'
      env:
        description: '어느 앱키로 (vps=모의, prod=실전)'
        required: false
        default: 'vps'
        type: choice
        options: ['vps', 'prod']

permissions:
  contents: write

concurrency:
  group: overseas-bars-kis-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 엑셀을 만들려면 openpyxl 이 있어야 한다. 첫 판에서는 이것이 없어
      # 엑셀 재생성이 3 초 만에 조용히 실패했고(|| true 가 삼켰다), 화면만
      # 새 자료로 바뀌고 엑셀은 옛 자료인 채로 커밋됐다.
      - name: 엑셀을 만들 채비
        run: python3 -m pip install --quiet openpyxl

      - name: 앱키가 들어 있는지 먼저 본다
        run: |
          if [ -z "${{ secrets.KIS_APP_KEY }}" ] || [ -z "${{ secrets.KIS_APP_SECRET }}" ]; then
            echo "::error::KIS_APP_KEY / KIS_APP_SECRET 이 저장소 Secrets 에 없습니다."
            exit 1
          fi

      # 받을 종목을 유니버스에서 고르므로 유니버스가 먼저 있어야 한다.
      - name: 상품 유니버스 먼저 모으기
        run: |
          git fetch origin us100-data kr100-data claude/fund-search-tool --depth 1
          python3 scripts/build_proposal_universe.py

      - name: 다년 일봉 받기
        id: fetch
        continue-on-error: true      # 시간 제한에 걸려도 받은 만큼은 커밋한다
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_TOKEN_CACHE: ${{ runner.temp }}/kis-token.json
        run: |
          python3 scripts/fetch_overseas_bars_kis.py \
            --env "${{ inputs.env || 'vps' }}" \
            --years "${{ inputs.years || '10' }}" \
            --limit "${{ inputs.limit || '0' }}"

      # 받은 일봉을 유니버스에 실제로 붙여 둔다. 이것이 없으면 봉만 저장소에
      # 쌓이고 제안서는 그대로 1 해짜리로 남는다 — 수집한 보람이 없다.
      #
      # **|| true 로 삼키지 않는다.** 첫 판에서 그렇게 두었다가 엑셀 두 개가
      # 조용히 실패했고, 화면만 새 자료로 바뀌고 엑셀은 옛 자료인 채로
      # 커밋됐다. 산출물끼리 어긋나는 것이 아예 안 만들어지는 것보다 나쁘다.
      - name: 유니버스·산출물 다시 만들기
        if: always()
        run: |
          set -e
          python3 scripts/build_proposal_universe.py
          python3 scripts/build_proposal_page.py
          python3 scripts/build_proposal_xlsx.py
          python3 scripts/build_proposal_xlsm.py

      - name: 결과 커밋
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/proposal proposal.html 고객제안서_자산배분.xlsx \
                  고객제안서_자산배분_매크로.xlsm || true
          if git diff --cached --quiet; then
            echo "바뀐 것이 없다 — 커밋 생략"
            exit 0
          fi
          git commit -m "data(proposal): 해외 상장 주식 다년 일봉 수집 ($(date -u +%Y-%m-%d\ %H:%M))"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push 거절 — 원격 변경을 받아 재시도 ($i/5)"
            git pull --rebase origin "${{ github.ref_name }}" || exit 1
          done
          exit 1

      - name: 요약
        if: always()
        run: |
          {
            echo "### 해외 상장 주식 다년 일봉 수집"
            echo ""
            if [ -f data/proposal/overseas_bars_report.md ]; then
              cat data/proposal/overseas_bars_report.md
            else
              echo "산출물이 없습니다 — 수집 단계 로그를 보세요."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # 수집이 실패로 끝났으면 작업도 실패로 남긴다 — 커밋은 위에서 이미 했다.
      - name: 수집 결과 반영
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::warning::수집이 도중에 끝났습니다. 같은 워크플로를 다시 돌리면 "\
               "이미 받은 종목은 건너뛰고 남은 것만 받습니다."

name: 종목별 수급 수집

# 종목별 외국인·기관 순매수를 모아 data/flows/kr100.json 에 **쌓는다.**
#
# **뒤로 못 간다.** 네이버가 종목별 수급을 길게 내주지 않으므로, 오늘부터 날마다
# 모아 쌓는 수밖에 없다. 그래서 하루를 거르면 그날은 영영 빈다 — 예약이 늦거나
# 실패했을 때를 대비해 두 번 걸고, 실패하면 시끄럽게 끝낸다.
#
# **처음 도는 날이 시험대다.** 이 수집기는 만든 자리에서 살아 있는 응답에 대고
# 돌려 본 적이 없다(그 세션은 네이버로 나가는 길이 막혀 있었다). 필드 이름과
# 표의 칸 차례가 맞는지는 verify_stock_flows.py 가 여기서 처음으로 답한다.
# 통과하지 못하면 **커밋하지 않는다** — 틀리게 읽은 자료를 쌓으면 나중에
# 어디부터 틀렸는지 가릴 수 없게 된다.

on:
  schedule:
    # 17:00 KST = 08:00 UTC — 장 마감 뒤, 신호 산출(17:40)보다 앞
    - cron: '0 8 * * 1-5'
    # 위가 늦을 때를 대비한 두 번째 — 18:00 KST
    - cron: '0 9 * * 1-5'

  # (파서를 확인하려고 이 가지에 push 방아쇠를 잠시 붙여 네 번 돌렸고, 확인이
  #  끝나 뗐다. 이제 예약과 단추로만 돈다 — 방아쇠를 남겨 두면 이 파일을 고칠
  #  때마다 네이버를 백 번씩 두드린다.)

  workflow_dispatch:
    inputs:
      pages:
        description: 'frgn.naver 를 몇 쪽까지 긁을지 (0 이면 JSON 만). 처음 채울 때만 크게'
        required: false
        default: '0'
      limit:
        description: '몇 종목만 (0 이면 전부)'
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: stock-flows
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 종가 대조에 쓴다 — 실린 종가가 일봉과 맞는지 보아야 날짜를 잘못 짚었거나
      # 표의 칸이 밀린 것을 잡을 수 있다.
      - name: 종목 일봉 가지 받기
        run: |
          for i in 1 2 3 4; do
            git fetch --depth 1 origin '+refs/heads/kr100-data:refs/remotes/origin/kr100-data' \
              && exit 0
            sleep $((i * i * 2))
          done
          echo "::error::kr100-data 가지를 받지 못했습니다"; exit 1

      # 네트워크 없이 할 수 있는 시험 — 파서가 가정한 꼴을 제대로 읽는지,
      # 그리고 **검산기가 일부러 심은 흠을 실제로 잡는지.**
      - name: 자체 시험 (네트워크 없이)
        run: python3 scripts/check_stock_flows.py

      - name: 수급 모으기
        run: |
          python3 scripts/fetch_stock_flows.py \
            --pages "${{ github.event.inputs.pages || '0' }}" \
            --limit "${{ github.event.inputs.limit || '0' }}"

      # **검산이 막았을 때도 받은 것을 내보낸다.** 막힌 자료를 못 보면 무엇이
      # 어긋났는지 가릴 수가 없다 — 실제로 첫 판에서 종가 일치율 84% 를 만나
      # 자료를 볼 길이 없어 한 번 더 돌려야 했다.
      - name: 받은 것 내보내기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-flows-raw
          path: |
            data/flows/kr100.json
            data/flows/verify.txt
          if-no-files-found: warn

      # **검산이 커밋을 막는다.** 종가가 일봉과 맞는지, KR100 합이 시장 전체
      # 수급과 같이 움직이는지를 본다. 후자가 제일 세다 — 내 파싱 가정과
      # 아무 관련 없는 출처와 맞대 보는 유일한 자리다.
      - name: 재검산
        run: python3 scripts/verify_stock_flows.py

      - name: 커밋
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/flows
          if git diff --staged --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "종목별 수급 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"

          # **돌고 있는 가지로 민다.** `git push` 와 `origin main` 을 박아 두면
          # 기능 가지에서 돌릴 때 엉뚱한 곳을 되받는다. GITHUB_REF_NAME 을 쓴다.
          BR="${GITHUB_REF_NAME}"
          for i in 1 2 3 4 5; do
            git push origin "HEAD:refs/heads/$BR" && exit 0
            echo "거절됨 — 되받아 다시 시도한다 ($i/5)"
            git pull --rebase --no-edit origin "$BR" || { git rebase --abort || true; \
              echo "::error::되받기 충돌 — 손으로 확인하십시오"; exit 1; }
            sleep $((i * 5))
          done
          echo "::error::다섯 번 밀어 봤지만 모두 거절됐습니다"; exit 1

      - name: 요약
        if: always()
        run: |
          if [ -f data/flows/kr100.json ]; then
            python3 - <<'PY'
          import json
          d = json.load(open('data/flows/kr100.json', encoding='utf-8'))
          c = d['coverage']
          print("::notice::종목 %d · 날짜 %d (%s ~ %s) · 오늘 받은 종목 %d"
                % (c['stocks'], c['days'], c['from'], c['to'], c['fetched_today']))
          if c['days'] < 60:
              print("::warning::아직 %d 일뿐입니다 — 수급 축의 가중치는 사전값 쪽에 "
                    "머물고, 자료가 쌓이는 만큼 저절로 올라갑니다" % c['days'])
          PY
          fi

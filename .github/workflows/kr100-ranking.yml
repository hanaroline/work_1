name: 국내 100대 기업 목록 점검

# 대상 목록(kr-top100.html 의 COMPANIES)이 지금 시가총액 상위 100 과 얼마나 어긋났는지
# 확인해 **후보만 알려 준다**. 목록을 자동으로 갈아치우지는 않는다 — 새 종목의 검색
# 키워드·기업 개요를 사람이 채워야 화면이 비지 않기 때문이다
# (scripts/check_kr100_ranking.py).
#
# 왜 전체 수집(kr100-data.yml)과 떼어 두나
#   점검에 필요한 것은 한국거래소 전종목 시세뿐이고 1~2분이면 끝난다. 8분 걸리는
#   전체 수집에 매달아 두면, 수집이 느려지거나 실패한 날에는 점검도 함께 못 돈다.
#
# 한국거래소가 응답하지 않으면 ranking.json 을 쓰지 않고 경고만 남긴다(반쯤 맞는
# 순위를 올리면 화면이 "목록이 일치합니다" 라고 잘못 말하게 된다). 그래서 올리는
# 단계는 파일이 실제로 만들어졌을 때만 돈다.

on:
  schedule:
    - cron: '10 7 * * 1-5'          # 16:10 KST — 국내 장 마감·전체 수집 다음

  push:
    paths:
      - 'scripts/check_kr100_ranking.py'
      - '.github/workflows/kr100-ranking.yml'
      - 'data/kr100/RANK_REFRESH'

  workflow_dispatch:

permissions:
  contents: write
  issues: write                      # 갱신 후보를 이슈 하나에 적어 둔다(같은 글을 갱신)

concurrency:
  group: kr100-ranking-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 데이터 브랜치에서 최신 스냅샷 받기
        # 우리 목록의 시총은 최근 수집분에서 읽는다(요청을 아끼고, 같은 판의 값으로 순위를 매긴다)
        run: |
          mkdir -p data/kr100
          if git fetch --quiet origin "+refs/heads/kr100-data:refs/remotes/origin/kr100-data" 2>/dev/null; then
            git show origin/kr100-data:data/kr100/latest.json > data/kr100/latest.json || true
          fi
          python - <<'PY'
          import json, os
          p = 'data/kr100/latest.json'
          if os.path.exists(p) and os.path.getsize(p) > 1000:
              d = json.load(open(p, encoding='utf-8'))
              print('스냅샷 %s · %d종목' % (d.get('fetchedAt'), len(d.get('companies') or {})))
          else:
              print('::warning::스냅샷이 없다 — 우리 목록의 시총은 스크리너 값에만 의존한다')
          PY

      - name: 목록 점검
        env:
          KR100_RANK_ISSUE: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_kr100_ranking.py

      - name: 점검 결과가 나왔는지 확인
        id: made
        run: |
          if [ -s data/kr100/ranking.json ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ranking.json 이 만들어지지 않았다 — 올리지 않는다"
          fi

      - name: 데이터 브랜치에 올리기
        if: steps.made.outputs.ok == 'true'
        env:
          COMMIT_LABEL: 목록점검
          PUBLISH_FILES: ranking.json
        run: bash scripts/publish_kr100_data.sh

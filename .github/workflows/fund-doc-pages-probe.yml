name: 펀드 투자설명서 쪽 구성 조사 (읽기만)

# 펀드 쪽 지도를 만들기 전에 두 가지를 본다.
#   ① 투자설명서 안에 핵심(요약)설명서가 포함돼 있나
#   ② 운용사가 다르면 쪽 구성도 다른가
#      ELS 는 한 발행사가 같은 서식으로 찍어 쪽이 거의 같았다. 펀드는 운용사가
#      제각각이라 같으리라는 보장이 없다 — 이걸 모르고 만들면 헛수고가 된다.
#
# 아무것도 커밋하지 않는다.

on:
  workflow_dispatch:
    inputs:
      count:
        description: '표본 종목 수 (운용사 골고루)'
        type: string
        default: '40'
      title_key:
        description: '제목 원문을 찍어 볼 자리 (trade/fee/tax… · 비우면 안 찍음)'
        type: string
        default: ''
      title_word:
        description: '그 자리의 핵심 낱말 정규식 (예: 환\s*매)'
        type: string
        default: '환\s*매'
      part2_why:
        description: '제2부를 못 찾은 까닭만 펼쳐 본다 (적중률 조사는 건너뜀)'
        type: boolean
        default: false
      skipped:
        description: '차례가 어긋나 버려진 종목의 원문을 펼쳐 본다 (적중률 조사는 건너뜀)'
        type: boolean
        default: false
      codes:
        description: '그때 볼 표준코드 (빈칸이면 전량 5차가 찍어 준 10종목)'
        type: string
        default: ''
      partnum:
        description: '「제N부」 를 어떤 글자로 적었는지 센다 (로마숫자 조사 · 적중률 조사는 건너뜀)'
        type: boolean
        default: false
  push:
    branches:
      - 'claude/els-**'
    paths:
      - 'scripts/probe_fund_doc_pages.mjs'
      - 'scripts/probe_fund_pages_sample.mjs'
      - 'scripts/probe_fund_tax.mjs'
      - 'scripts/probe_fund_title.mjs'
      - 'scripts/fund_doc_anchors.mjs'
      - '.github/workflows/fund-doc-pages-probe.yml'

permissions:
  contents: read

concurrency:
  group: fund-doc-pages-probe-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: pdfjs 설치
        run: npm install --no-save pdfjs-dist@3.11.174

      # 1차 조사(구조 파악)는 이미 답을 줬다 — 핵심요약설명서는 없고, 쪽 구성은
      # 종목마다 다르다. 이제 표준 서식 번호 제목으로 적중률을 본다.
      # 과세가 두 번 고쳐도 0% 였던 이유는 원문 확인으로 끝났다 — 제목이
      # 「14. 이익배분 및 과세에 관한 사항」 이었다. probe_fund_tax.mjs 는 기록으로
      # 남겨 두고, 필요할 때만 수동으로 돌린다.
      # 적중률이 낮은 자리는 정규식을 짐작으로 고치면 반드시 또 틀린다. 과세가
      # 그랬다 — 두 번 고쳐도 0% 였고, 원문을 찍고 나서야 제목이 「14. 이익배분 및
      # 과세에 관한 사항」 인 것을 알았다. 그 한 번으로 끝났다.
      # 못 찾은 종목의 제목 원문만 골라 찍는다.
      - name: 제목 원문 확인 (못 찾은 종목만)
        if: inputs.title_key != ''
        run: node scripts/probe_fund_title.mjs "${{ inputs.title_key }}" "${{ inputs.title_word }}" "${{ inputs.count || '40' }}"

      # 제2부 인식이 75% 에서 멈춰 규칙을 세 번 고쳤는데 움직이지 않았다.
      # 「못 찾았다」 만 보고 정규식을 또 고치면 짐작이다 — 과세에서 두 번 그렇게
      # 틀렸다. 판정에 쓰이는 사실을 자리마다 펼쳐 놓고 눈으로 가른다.
      - name: 제2부를 못 찾은 까닭 펼치기
        if: inputs.part2_why
        run: node scripts/probe_fund_part2_why.mjs "${{ inputs.count || '40' }}"

      # 전량 5차에서 108종목이 「요약정보가 제1부보다 뒤」 하나로 통째로 버려졌다.
      # 요약정보·제1부는 보조 자리인데 그 하나 때문에 창구가 짚는 일곱 자리까지
      # 버리는 것이 맞는지 가려야 한다. 통계로는 못 가른다 — 잡힌 쪽의 글을 본다.
      - name: 버려진 종목의 원문 펼치기
        if: inputs.skipped
        # 입력을 명령줄에 바로 끼우지 않는다. 표준코드는 영숫자뿐이므로 그 밖의
        # 글자를 털어 내고 넘긴다 — 빈칸이면 스크립트가 기본 10종목을 쓴다.
        env:
          CODES: ${{ inputs.codes }}
        run: |
          clean=$(printf '%s' "$CODES" | tr -c 'A-Za-z0-9' ' ')
          node scripts/probe_fund_skipped.mjs $clean

      # 한국밸류의 목차 쪽은 「제I부」 를 로마숫자로 적어 목차 판정이 못 잡는다.
      # 「로마숫자도 받자」 는 한 줄이면 되지만 그 줄이 목차 판정을 건드린다 —
      # 지금까지 네 번 말썽을 낸 자리다. 고치기 전에 얼마나 흔한지부터 센다.
      - name: 「제N부」 표기 조사
        if: inputs.partnum
        env:
          CODES: ${{ inputs.codes }}
          COUNT: ${{ inputs.count }}
        run: |
          clean=$(printf '%s' "$CODES" | tr -c 'A-Za-z0-9' ' ')
          if [ -n "$(printf '%s' "$clean" | tr -d ' ')" ]; then
            node scripts/probe_fund_partnum.mjs $clean
          else
            node scripts/probe_fund_partnum.mjs --sample "$(printf '%s' "${COUNT:-60}" | tr -cd '0-9')"
          fi

      - name: 표본 적중률
        if: ${{ !inputs.part2_why && !inputs.skipped && !inputs.partnum }}
        run: node scripts/probe_fund_pages_sample.mjs "${{ inputs.count || '40' }}"

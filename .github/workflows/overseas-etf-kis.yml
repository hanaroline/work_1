name: 해외 ETF 일봉 수집 (한국투자증권)

# 고객 제안서의 마지막 자산군을 채운다.
#
# us100-data 에는 **미국 주식 100 종목**만 있고 ETF 가 없다. 그래서 해외ETF 는
# 제안서에서 비중 0 으로 빠져 있고, 그 몫이 해외펀드로 넘어간다 — 세 산출물이
# 모두 그 사실을 적고 있다. 이 워크플로가 그 칸을 채운다.
#
# 클로드 세션에서는 KIS 에 못 붙는다 — 9443·29443 은 이그레스 프록시가 비-443
# 포트를 지원하지 않고, 443 은 CONNECT 403 이다. 그래서 러너 몫이다.
#
# 전 종목을 받지 않는다. 제안서에 올릴 것은 자산군을 대표하는 소수의 큰 ETF 이고,
# 겹치는 것을 나란히 올리면 고객은 분산됐다고 믿는데 실제로는 같은 것을 두 번
# 산 것이 된다. 주식·채권·대체·배당 19 종을 골라 두었다(scripts 안에 목록).
#
# **필요한 Secrets** — KIS_APP_KEY / KIS_APP_SECRET
#
# 이 워크플로는 자료만 커밋한다. 제안서 산출물(HTML·엑셀·PPT)은 노드·openpyxl·
# 리브레오피스가 필요해 여기서 만들지 않는다 — 자료가 들어오면 사람이(또는
# 클로드가) scripts/build_proposal_*.py 를 돌려 다시 만든다.

on:
  workflow_dispatch:
    inputs:
      years:
        description: '몇 해치 (기본 3)'
        required: false
        default: '3'
      env:
        description: '어느 앱키로 (vps=모의, prod=실전)'
        required: false
        default: 'vps'
        type: choice
        options: ['vps', 'prod']

permissions:
  contents: write

concurrency:
  group: overseas-etf-kis-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 앱키가 들어 있는지 먼저 본다
        run: |
          if [ -z "${{ secrets.KIS_APP_KEY }}" ] || [ -z "${{ secrets.KIS_APP_SECRET }}" ]; then
            echo "::error::KIS_APP_KEY / KIS_APP_SECRET 이 저장소 Secrets 에 없습니다."
            exit 1
          fi

      - name: 해외 ETF 일봉 받기
        id: fetch
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_TOKEN_CACHE: ${{ runner.temp }}/kis-token.json
        run: |
          python3 scripts/fetch_overseas_etf_kis.py \
            --env "${{ inputs.env || 'vps' }}" \
            --years "${{ inputs.years || '3' }}"

      # 유니버스까지 여기서 다시 만든다. 자료만 커밋해 두면 제안서가 아직 옛
      # 유니버스를 들고 있어 「해외ETF 없음」이라고 적힌 채로 남는다.
      - name: 상품 유니버스 다시 모으기
        run: |
          git fetch origin us100-data kr100-data claude/fund-search-tool --depth 1
          python3 scripts/build_proposal_universe.py

      - name: 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/proposal || true
          if git diff --cached --quiet; then
            echo "바뀐 것이 없다 — 커밋 생략"
            exit 0
          fi
          git commit -m "data(proposal): 해외 ETF 일봉 수집 ($(date -u +%Y-%m-%d\ %H:%M))"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push 거절 — 원격 변경을 받아 재시도 ($i/5)"
            git pull --rebase origin "${{ github.ref_name }}" || exit 1
          done
          exit 1

      # 요약은 수집기가 data/proposal/overseas_etf_report.md 로 적어 둔다.
      # 여기서 파이썬 heredoc 을 쓰면 YAML 들여쓰기가 깨진다.
      - name: 요약
        if: always()
        run: |
          {
            echo "### 해외 ETF 일봉 수집"
            echo ""
            if [ -f data/proposal/overseas_etf_report.md ]; then
              cat data/proposal/overseas_etf_report.md
            else
              echo "산출물이 없습니다 — 수집 단계 로그를 보세요."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

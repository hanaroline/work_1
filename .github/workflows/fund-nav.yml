name: 펀드 기준가 계열 수집 (네이버)

# 제안서 곳곳에 「펀드는 원천이 기준가를 7 거래일만 주므로 변동성·낙폭을 못
# 잰다」고 적어 두었는데 **틀렸다.** 그 7 거래일은 `prices/daily` 한 곳의
# 얘기였고(size 상한 10), 같은 원천에 `base-price/chart` 가 따로 있다.
#
#     term=3m  하루 간격 64 점 · term=1y  주 간격 52 점 · term=5y  달 간격 60 점
#
# 5 해치가 달 간격으로 온다. 달 60 점이면 월수익률 기반 연변동성(×√12)과
# 최대낙폭을 셈할 수 있다.
#
# **계단을 조심한다.** 기준가에는 재산정(974 → 3,356)과 결산·분배(3,000 →
# 1,000)로 나는 점프가 있다. 그냥 나누면 하루 만에 244% 가 나오고 그 숫자가
# 고객 자료에 실린다 — 실제로 겪은 고장이다. 수집기가 계단을 찾아 앞뒤를
# 이어 붙인다.
#
# 클로드 세션에서는 네이버에 못 붙는다(이그레스 프록시가 막는다). 러너 몫이다.
# 앱키는 필요 없다 — 공개 시세다.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: '몇 종만 (0=전부)'
        required: false
        default: '0'
      sleep:
        description: '호출 사이 쉬는 초 (원천을 때리지 않게)'
        required: false
        default: '0.12'
      rebuild:
        description: '유니버스·산출물까지 다시 만들기'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: fund-nav-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 엑셀을 만들 채비
        run: python3 -m pip install --quiet openpyxl

      # 받을 펀드를 유니버스에서 고르므로 유니버스가 먼저 있어야 한다.
      - name: 상품 유니버스 먼저 모으기
        run: |
          git fetch origin us100-data kr100-data claude/fund-search-tool --depth 1
          python3 scripts/build_proposal_universe.py

      - name: 기준가 계열 받기
        id: fetch
        continue-on-error: true      # 시간 제한에 걸려도 받은 만큼은 커밋한다
        run: |
          python3 scripts/fetch_fund_nav.py \
            --limit "${{ inputs.limit || '0' }}" \
            --sleep "${{ inputs.sleep || '0.12' }}"

      - name: 유니버스·산출물 다시 만들기
        if: ${{ always() && inputs.rebuild != 'false' }}
        run: |
          set -e
          python3 scripts/build_proposal_universe.py
          python3 scripts/build_proposal_page.py
          python3 scripts/build_proposal_xlsx.py
          python3 scripts/build_proposal_xlsm.py

      - name: 결과 커밋
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/proposal proposal.html 고객제안서_자산배분.xlsx \
                  고객제안서_자산배분_매크로.xlsm || true
          if git diff --cached --quiet; then
            echo "바뀐 것이 없다 — 커밋 생략"
            exit 0
          fi
          git commit -m "data(proposal): 펀드 기준가 계열 수집 ($(date -u +%Y-%m-%d\ %H:%M))"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push 거절 — 원격 변경을 받아 재시도 ($i/5)"
            git pull --rebase origin "${{ github.ref_name }}" || exit 1
          done
          exit 1

      - name: 요약
        if: always()
        run: |
          {
            echo "### 펀드 기준가 계열 수집"
            echo ""
            if [ -f data/proposal/fund_nav_report.md ]; then
              cat data/proposal/fund_nav_report.md
            else
              echo "산출물이 없습니다 — 수집 단계 로그를 보세요."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 수집 결과 반영
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::warning::수집이 도중에 끝났습니다. 다시 돌리면 이미 받은 "\
               "펀드는 건너뛰고 남은 것만 받습니다."

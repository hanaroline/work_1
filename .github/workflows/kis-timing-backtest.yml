name: 매매 타이밍 백테스트 (전략빌더 10종)

# **예약으로 돌리지 않는다.** signals-backtest.yml 이 세워 둔 규율을 그대로 따른다 —
# 성적이 날마다 조용히 바뀌면, 어제 「+3.85%p」를 보고 판단한 사람과 오늘
# 「+3.11%p」를 보는 사람이 서로 다른 자료를 쓰게 된다.
#
# 여기에는 까닭이 하나 더 있다. **이 성적표가 합의 멤버를 고른다.** 학습·검증 두
# 구간 모두 초과수익이 양수인 전략만 남기는데, 봉이 하루 자랄 때마다 그 판정이
# 뒤집히면 **오늘 산 종목의 근거가 내일 사라진다.** 전략을 고치거나 비용 가정을
# 바꿨을 때만 손으로 돌린다.
#
# 40초~2분쯤 걸린다(265종목 × 전략 9 × 학습/검증/전구간 3벌 + 합의 K 3단).

on:
  workflow_dispatch:

  # 전략이나 비용 가정을 고치면 성적도 다시 재야 한다. PR 에서는 **재기만 하고
  # 커밋하지 않는다** — 성적표를 언제 갈아 끼울지는 사람이 정한다.
  pull_request:
    paths:
      - 'scripts/kis_strategy_lib.py'
      - 'scripts/kis_timing_backtest.py'
      - 'scripts/kis_timing_data.py'

permissions:
  contents: write

concurrency:
  group: kis-timing-backtest
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # refspec 을 손으로 적는 까닭은 kis-timing.yml 의 같은 단계 주석과 같다.
      - name: 미국 주식 일봉 가지 받기
        run: |
          for i in 1 2 3 4; do
            if git fetch --depth 1 origin \
                 '+refs/heads/us100-data:refs/remotes/origin/us100-data'; then
              git rev-parse --verify origin/us100-data >/dev/null
              echo "받음 (시도 $i)"; exit 0
            fi
            echo "실패 — 다시 시도한다 ($i/4)"; sleep $((i * i * 2))
          done
          echo "::error::us100-data 가지를 받지 못했습니다"
          exit 1

      # 판정은 기업 자료를 겹치므로 kr100-data 가지가 있어야 한다. 없으면 실적 겹이
      # 통째로 비고, 그 판정이 그대로 커밋된다. refspec 을 손으로 적는 까닭은 위와 같다.
      - name: 국내 기업 자료 가지 받기
        run: |
          for i in 1 2 3 4; do
            if git fetch --depth 1 origin \
                 '+refs/heads/kr100-data:refs/remotes/origin/kr100-data'; then
              git rev-parse --verify origin/kr100-data >/dev/null
              echo "받음 (시도 $i)"; exit 0
            fi
            echo "실패 — 다시 시도한다 ($i/4)"; sleep $((i * i * 2))
          done
          echo "::error::kr100-data 가지를 받지 못했습니다"
          exit 1

      - name: 성적표를 다시 잰다
        run: |
          python3 scripts/kis_timing_backtest.py 2>&1 | tee /tmp/bt.txt
          exit ${PIPESTATUS[0]}

      - name: 그 성적표로 세팅과 판정을 내고 검산한다
        # 성적표만 갈아 끼우고 나머지를 그대로 두면 **화면의 멤버와 성적이 어긋난다.**
        #
        # **이 자리에서 실제로 한 번 어긋났다.** 처음에는 성적표와 세팅 둘만 한 벌로
        # 보고 여기 적어 두었는데, 뒤에 판정(verdict.json)이 생기면서 셋이 됐다.
        # 그런데 이 단계는 둘만 낸 채였다. 2026-09-20 우주를 278 → 395종으로 넓히고
        # 단추를 눌렀더니 세팅의 합의 멤버는 새 성적표를 따라갔고 판정은 어제 멤버에
        # 머물러, 같은 ETF 가 매매 타이밍에서는 「매수」, 판정에서는 「관찰」이 됐다.
        # verify_verdict.py 의 「두 화면이 같은 말을 하는가」가 그것을 잡았다.
        #
        # 그래서 **한 벌을 셋으로 적고, 검산도 둘 다 여기서 돈다.** 어느 하나를
        # 빼먹으면 다음 사람이 같은 자리에서 같은 것을 겪는다.
        run: |
          python3 scripts/build_kis_timing.py
          python3 scripts/build_verdict.py
          python3 scripts/verify_kis_timing.py | tee /tmp/verify-kis.txt
          a=${PIPESTATUS[0]}
          python3 scripts/verify_verdict.py | tee /tmp/verify-verdict.txt
          b=${PIPESTATUS[0]}
          exit $(( a > b ? a : b ))

      - name: 요약
        if: always()
        run: |
          {
            echo '### 전략별 성적 (전 구간 │ 학습 │ 검증)'
            echo '```'
            grep -E '^\[|초과|합의' /tmp/bt.txt || cat /tmp/bt.txt
            echo '```'
            echo '### 전략빌더 10종 재검산'
            echo '```'
            cat /tmp/verify-kis.txt 2>/dev/null || echo '(돌지 않음)'
            echo '```'
            echo '### 종목 판정 재검산'
            echo '```'
            cat /tmp/verify-verdict.txt 2>/dev/null || echo '(돌지 않음)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # PR 에서는 커밋하지 않는다 — 재 보기만 하고, 갈아 끼울지는 사람이 정한다.
      # **거절당하면 되받지 않는다. 남의 판을 받아 그 위에서 다시 잰다.**
      #
      # 까닭은 kis-timing.yml 의 같은 자리 주석과 똑같다 — 산출물이 한 줄짜리
      # JSON 이라 두 판이 부딪히면 되받기가 반드시 충돌한다. 그리고 이 판은
      # **저장소 자료의 함수**다. 남의 커밋 위에서 통째로 다시 내면 그만이고,
      # 반쯤 기운 것을 만들 까닭이 없다.
      #
      # 다시 잴 때는 **넷을 다** 돌린다. 성적표만 갈아 끼우고 세팅·판정을 두면
      # 화면의 멤버와 성적이 어긋난다 — 위 「그 성적표로…」 단계의 주석이 적어 둔,
      # 이 저장소에서 실제로 한 번 난 사고다. && 로 잇는 까닭은 kis-timing.yml 과
      # 같다(`if !` 자리에서는 -e 가 함수 안까지 꺼진다).
      - name: 커밋 (단추로 돌렸을 때만)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          한벌() {
            python3 scripts/kis_timing_backtest.py >/tmp/bt.txt 2>&1 &&
            python3 scripts/build_kis_timing.py    >/dev/null &&
            python3 scripts/build_verdict.py       >/dev/null &&
            python3 scripts/verify_kis_timing.py   >/tmp/verify-kis.txt &&
            python3 scripts/verify_verdict.py      >/tmp/verify-verdict.txt
          }

          for i in 1 2 3 4 5; do
            git add data/kis_timing
            if git diff --staged --quiet; then
              echo "변경 없음"
              exit 0
            fi
            git commit -q -m "매매 타이밍 성적표 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            if git push; then
              echo "밀어 넣음 (시도 $i)"; exit 0
            fi

            echo "거절됨 — 남의 판을 받아 그 위에서 다시 잰다 ($i/5)"
            if ! git fetch origin '+refs/heads/main:refs/remotes/origin/main'; then
              echo "::error::main 을 받지 못했습니다"; exit 1
            fi
            git reset --hard origin/main
            if ! 한벌; then
              echo "::error::다시 잰 판을 검산이 막았습니다 — 손으로 확인하십시오"
              exit 1
            fi
            # **요약에 적힌 수는 다시 셈하기 전의 것이다.** 위 단계들이 이미
            # $GITHUB_STEP_SUMMARY 에 써 버렸으므로 되물릴 수 없다. 그러니
            # 실린 것이 무엇인지 아래에 덧붙인다 — 읽는 사람이 두 벌을 보고
            # 어느 것이 실렸는지 알 수 있어야 한다.
            {
              echo "### 다시 셈했습니다 (밀어 넣기 $i 번째)"
              echo
              echo "위의 재검산은 **다시 셈하기 전**의 것입니다. 실제로 실린 것은 아래입니다."
              echo '```'
              grep -E '^\[|초과|합의' /tmp/bt.txt || cat /tmp/bt.txt
              cat /tmp/verify-kis.txt /tmp/verify-verdict.txt 2>/dev/null || echo '(없음)'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            sleep $((i * 5))
          done
          echo "::error::다섯 번 밀어 봤지만 모두 거절됐습니다"
          exit 1

name: value-screener-probe (temporary)
on:
  push:
    branches: [claude/value-leaders-map]
    paths: [scripts/probe_value_screener.py, .github/workflows/value-screener-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 scripts/probe_value_screener.py

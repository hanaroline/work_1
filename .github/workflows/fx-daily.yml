name: 원/달러 일별 환율 수집

# 해외 종목의 일봉은 **달러**다. 그대로 재면 달러 기준 수익률·변동성이 나오는데
# 고객은 **원화로 사고 원화로 판다.** 애플이 달러로 20% 올라도 그해 원화가
# 10% 절상되면 고객 손에 남는 것은 8% 다. 그 차이를 빼놓고 「연평균 24%」라고
# 적으면 고객이 겪을 숫자가 아니다.
#
# 클로드 세션에서는 야후에 못 붙는다(이그레스 프록시가 403 을 준다). 러너 몫이다.
#
# 앱키가 필요 없다 — 야후 공개 시세다. 몇 초면 끝난다.

on:
  workflow_dispatch:
    inputs:
      years:
        description: '몇 해치 (기본 10)'
        required: false
        default: '10'
      rebuild:
        description: '유니버스·산출물까지 다시 만들기'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: fx-daily-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 엑셀을 만들 채비
        run: python3 -m pip install --quiet openpyxl

      - name: 환율 받기
        run: |
          python3 scripts/fetch_fx_daily.py --years "${{ inputs.years || '10' }}"

      # 환율만 받아 두면 제안서는 그대로 달러 기준이다 — 받은 보람이 없다.
      # **|| true 로 삼키지 않는다.** 앞서 그렇게 두었다가 엑셀 두 개가 조용히
      # 실패했고, 화면만 새 자료로 바뀌고 엑셀은 옛 자료인 채로 커밋됐다.
      - name: 유니버스·산출물 다시 만들기
        if: ${{ inputs.rebuild != 'false' }}
        run: |
          set -e
          git fetch origin us100-data kr100-data claude/fund-search-tool --depth 1
          python3 scripts/build_proposal_universe.py
          python3 scripts/build_proposal_page.py
          python3 scripts/build_proposal_xlsx.py
          python3 scripts/build_proposal_xlsm.py

      - name: 결과 커밋
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/proposal proposal.html 고객제안서_자산배분.xlsx \
                  고객제안서_자산배분_매크로.xlsm || true
          if git diff --cached --quiet; then
            echo "바뀐 것이 없다 — 커밋 생략"
            exit 0
          fi
          git commit -m "data(proposal): 원/달러 일별 환율 수집 ($(date -u +%Y-%m-%d\ %H:%M))"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push 거절 — 원격 변경을 받아 재시도 ($i/5)"
            git pull --rebase origin "${{ github.ref_name }}" || exit 1
          done
          exit 1

      - name: 요약
        if: always()
        run: |
          {
            echo "### 원/달러 일별 환율"
            echo ""
            python3 - <<'PY'
          import json, os
          p = "data/proposal/fx_daily.json"
          if not os.path.exists(p):
              print("산출물이 없습니다 — 수집 단계 로그를 보세요.")
          else:
              d = json.load(open(p, encoding="utf-8"))
              print("원천: %s" % d["source"])
              print("")
              print("| 봉 | 처음 | 마지막 | 처음 환율 | 마지막 환율 |")
              print("|---|---|---|---|---|")
              print("| %d | %s | %s | %.2f | %.2f |"
                    % (d["count"], d["from"], d["to"], d["r"][0], d["r"][-1]))
              print("")
              print("마지막 봉은 24 시간 시세라 진행 중인 호가일 수 있습니다.")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

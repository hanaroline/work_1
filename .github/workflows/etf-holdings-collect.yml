name: ETF 편입종목 수집

# 세션 컨테이너에서는 네이버·야후가 막혀(CONNECT 403) 러너가 받는다.
# 국내 전 종목(네이버 + 야후 .KS 분배금)과 해외 상위(야후 + 동방재부 목록)를
# data/etfh/{kr,global}.json 에 쓴다.
#
# 수집기는 수집률이 70% 에 못 미치면 파일을 쓰지 않고 2 로 끝난다 — 그때는 지난
# 판이 그대로 남고, 이 잡은 빨갛게 끝나 사람이 보게 된다.

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/elegant-mendel-**'
    paths:
      - 'scripts/etfh_collect_kr.mjs'
      - 'scripts/etfh_collect_global.mjs'
      - 'scripts/etfh_lib.mjs'
      - '.github/workflows/etf-holdings-collect.yml'
      - 'data/etfh/REFRESH'

permissions:
  contents: write

concurrency:
  group: etf-holdings-collect-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 계산 단위시험
        run: node scripts/etfh_test.mjs

      - name: 해외 상위
        id: global
        continue-on-error: true
        run: node scripts/etfh_collect_global.mjs

      - name: 국내 전 종목
        id: kr
        continue-on-error: true
        run: node scripts/etfh_collect_kr.mjs

      - name: 결과 커밋
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/etfh/*.json data/etfh/*.log.txt || true
          if git diff --cached --quiet; then
            echo "남길 결과가 없습니다"
          else
            git commit -m "chore(etf): 편입종목 수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
            ok=0
            for i in 1 2 3 4 5; do
              if git push; then ok=1; break; fi
              git pull --rebase origin "${{ github.ref_name }}" || exit 1
            done
            [ "$ok" = 1 ] || exit 1
          fi
          if [ "${{ steps.kr.outcome }}" != "success" ] || [ "${{ steps.global.outcome }}" != "success" ]; then
            echo "::error::수집 하나 이상이 실패했거나 수집률 미달입니다 (국내 ${{ steps.kr.outcome }}, 해외 ${{ steps.global.outcome }})"
            exit 1
          fi

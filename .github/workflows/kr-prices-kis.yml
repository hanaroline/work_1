name: 국내 일봉 심판 (한국투자증권 원본으로 야후·네이버 가리기)

# 정기 수집기가 아니다. **한 번 돌려 답을 내는 것이 목적**이다.
#
# 풀려는 막다른 골목 — data/prices_naver/verify.txt 가 이렇게 끝나 있다:
#
#     두 출처가 종가를 91.9% 만 같게 봅니다(어긋난 1565 건, 중앙 0.96% · 최대 34.93%).
#     상대의 고저 범위를 벗어난 종가는 네이버 629 건 · 야후 629 건입니다.
#     어느 쪽으로도 쏠리지 않아 이 자료만으로는 심판할 수 없습니다.
#
# 629 대 629 는 둘을 맞대는 것만으로 더 갈 수 없다는 뜻이다. 증권사가 직접 주는
# 시세를 제3의 잣대로 놓으면 가려진다.
#
# 러너에서만 돈다. 클로드 세션은 KIS 로 나가지 못한다 — 9443·29443 은 이그레스
# 프록시가 비-443 포트를 지원하지 않고, 443 은 CONNECT 403 이다.
#
# **모의투자 앱키로 이 TR 이 되는지 먼저 확인한다.** kis-probe.yml 을 돌려
# tools/kis-discovery/report.md 에서 「국내주식기간별시세」가 정상인지 본 뒤 이것을
# 돌리는 편이 낫다. 막혀 있으면 여기서 빈 응답만 쌓인다.
#
# **필요한 Secrets** — Settings > Secrets and variables > Actions
#   KIS_APP_KEY / KIS_APP_SECRET

on:
  workflow_dispatch:
    inputs:
      limit:
        description: '몇 종목만 (0 이면 전부 100)'
        required: false
        default: '0'
      adj:
        description: '수정주가 (0=수정주가, 1=원주가)'
        required: false
        default: '0'
        type: choice
        options: ['0', '1']
      env:
        description: '어느 앱키로 (vps=모의, prod=실전)'
        required: false
        default: 'vps'
        type: choice
        options: ['vps', 'prod']

permissions:
  contents: write

concurrency:
  group: kr-prices-kis-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 앱키가 들어 있는지 먼저 본다
        run: |
          if [ -z "${{ secrets.KIS_APP_KEY }}" ] || [ -z "${{ secrets.KIS_APP_SECRET }}" ]; then
            echo "::error::KIS_APP_KEY / KIS_APP_SECRET 이 저장소 Secrets 에 없습니다."
            exit 1
          fi

      # 심판하려면 세 자료가 다 있어야 한다. 야후는 자료 가지에 있다.
      - name: 야후 일봉 가지 받기
        run: git fetch origin kr100-data --depth 1

      - name: 대조 상대 확인
        run: |
          test -f data/prices_naver/kr100.json || {
            echo "::error::네이버 일봉이 없습니다 — kr-prices-naver.yml 을 먼저 돌리세요."
            exit 1
          }
          git show origin/kr100-data:data/kr100/chart/005930.KS.json > /dev/null || {
            echo "::error::야후 일봉 가지를 읽지 못했습니다."
            exit 1
          }
          echo "네이버·야후 모두 준비됨."

      - name: 한국투자증권 일봉 받기
        id: fetch
        continue-on-error: true
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_TOKEN_CACHE: ${{ runner.temp }}/kis-token.json
        run: |
          python3 scripts/fetch_kr_prices_kis.py \
            --env "${{ inputs.env || 'vps' }}" \
            --adj "${{ inputs.adj || '0' }}" \
            --limit "${{ inputs.limit || '0' }}"

      - name: 심판
        id: judge
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        run: python3 scripts/verify_kr_prices_kis.py

      - name: 결과 커밋
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices_kis || true
          if git diff --cached --quiet; then
            echo "남은 것이 없다 — 커밋 생략"
            exit 0
          fi
          git commit -m "data(kis): 국내 일봉 심판 ($(date -u +%Y-%m-%d\ %H:%M))"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push 거절 — 원격 변경을 받아 재시도 ($i/5)"
            git pull --rebase origin "${{ github.ref_name }}" || exit 1
          done
          exit 1

      - name: 요약
        if: always()
        run: |
          {
            echo "### 국내 일봉 심판 — 야후 · 네이버 · 한국투자증권"
            echo ""
            if [ -f data/prices_kis/verdict.txt ]; then
              echo '```'
              head -c 60000 data/prices_kis/verdict.txt
              echo '```'
            else
              echo "판정문이 없습니다. 수집 단계가 실패했을 수 있습니다."
              echo ""
              echo "모의투자 앱키로 국내주식기간별시세(FHKST03010100)가 막혀 있다면"
              echo "먼저 **한국투자증권 오픈API 관찰** 워크플로를 돌려 확인하세요."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 수집 실패 시 잡 실패 처리
        if: always() && steps.fetch.outcome != 'success'
        run: |
          echo "::error::KIS 일봉 수집이 실패했습니다. 위 로그와 요약을 보세요."
          exit 1

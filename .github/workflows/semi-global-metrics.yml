name: 해외 반도체 소부장 맵 지표 갱신

# semi-us.html · semi-jp.html · semi-cn.html 의 기업별 시장 지표(현재가·시총·PER·PBR·
# EPS·BPS·배당수익률·수익률·52주 위치)를 각 시장 마감 뒤에 한 번 받아 넣는다.
#
# 클로드 세션에서는 야후에 못 붙는다. 그래서 러너 몫이다.
# 수집기는 scripts/fetch_semi_global.py — 못 받은 값은 비워 두고 지어내지 않는다.
# 야후 이름이 데이터 파일 영문명과 이어지지 않는 회사는 통째로 비운다.
#
# schedule 은 기본 가지(main)에서만 발동한다.

on:
  schedule:
    # 미국: 평일 21:30 UTC — 16:00 ET 마감(서머타임 20:00 · 평시 21:00 UTC) 뒤
    - cron: '30 21 * * 1-5'
    # 일본·중국: 평일 07:20 UTC — 도쿄 15:30 JST(06:30 UTC)·상하이/선전 15:00 CST(07:00 UTC) 마감 뒤
    - cron: '20 7 * * 1-5'
  workflow_dispatch:
    inputs:
      market:
        description: '나라 (us · jp · cn · all)'
        required: false
        default: 'all'
      limit:
        description: '앞의 몇 곳만 — 시험용, 0 이 아니면 파일을 쓰지 않는다'
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: semi-global-metrics-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 113곳 × (일봉 1회 + 쉼) + quote 묶음 몇 번 ≈ 2~3분.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 나라 고르기
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            '30 21 * * 1-5') m=us ;;
            '20 7 * * 1-5')  m='jp cn' ;;
            *)               m="${{ inputs.market || 'all' }}" ;;
          esac
          [ "$m" = all ] && m='us jp cn'
          for x in $m; do
            case "$x" in us|jp|cn) ;; *) echo "알 수 없는 나라: $x"; exit 1 ;; esac
          done
          echo "markets=$m" >> "$GITHUB_OUTPUT"
          echo "대상: $m"

      - name: 지표 받기
        run: |
          rc=0
          for m in ${{ steps.pick.outputs.markets }}; do
            python3 scripts/fetch_semi_global.py --market "$m" --limit "${{ inputs.limit || '0' }}" || rc=1
          done
          exit $rc

      - name: 결과 커밋
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/semi-global-*.json data/semi-global-*-report.md semi-us.html semi-jp.html semi-cn.html 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "바뀐 것이 없다 — 커밋 생략"
            exit 0
          fi
          git commit -m "data(semi-global): 해외 소부장 맵 지표 갱신 [${{ steps.pick.outputs.markets }}] ($(date -u +%Y-%m-%d\ %H:%M))"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push 거절 — 원격 변경을 받아 재시도 ($i/5)"
            git pull --rebase origin "${{ github.ref_name }}" || exit 1
          done
          exit 1

      - name: 요약
        if: always()
        run: |
          {
            echo "### 해외 반도체 소부장 맵 지표 갱신"
            for m in ${{ steps.pick.outputs.markets }}; do
              echo ""
              if [ -f "data/semi-global-$m-report.md" ]; then
                cat "data/semi-global-$m-report.md"
              else
                echo "$m: 보고서가 없습니다 — 수집 단계 로그를 보세요."
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

name: 자산배분 ETF 신호

# 표(2026-09-18 기준 자산배분ETF 종목 LIST)의 ETF 76종을 받아 신호를 낸다.
# ETN 6종은 지시대로 뺐다.
#
# 국내 55종은 네이버, 해외 21종은 야후에서 받는다. 국내 일봉 기준을 네이버로 옮긴
# 2026-09-18 의 결정을 그대로 따른다.
#
# **이름을 맞대는 것이 이 판의 첫 검사다.** 티커를 사진에서 옮겨 적었고, 코드 한
# 자가 틀리면 빈 응답이 아니라 남의 멀쩡한 응답이 온다 — 지표 검산으로는 못 잡는다.
#
# 예약은 걸지 않는다. 이 표는 한 번 보자고 만든 것이지 날마다 돌릴 것이 아니다.
# 다시 볼 때 단추로 돌린다.

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'KR 또는 OV 만 (비우면 전부)'
        required: false
        default: ''
      years:
        description: '몇 해치 (비우면 지금 파일과 같은 해치 — 줄이려면 아래 단추도 켜야 한다)'
        required: false
        default: ''
      allow_shrink:
        description: '이력이 줄어도 쓴다 (상장폐지·통합처럼 원천이 정말 줄였을 때만)'
        type: boolean
        required: false
        default: false

  # (첫 판을 돌리려고 `push: branches: ['claude/**']` 방아쇠를 잠시 붙였고, 76종을
  #  모두 받은 것을 확인한 뒤 뗐다. 남겨 두면 이 파일이나 수집기를 손볼 때마다
  #  네이버와 야후를 일흔여섯 번씩 두드린다.
  #
  #  단추(workflow_dispatch)는 이 파일이 **기본 가지에 올라간 뒤** 생긴다 — 깃허브가
  #  기본 가지의 정의만 보고 단추를 만든다. main 에 합치기 전에 다시 돌려야 하면
  #  위 push 방아쇠를 잠시 되붙이는 것이 가장 빠르다.)

permissions:
  contents: write

concurrency:
  group: etf-signals
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 길 전체를 망 없이 한 번 통과시킨다. 수집기가 첫 줄에서 죽으면 뒤의 어떤
      # 검산도 돌지 못한다 — 이 저장소에서 실제로 한 번 그랬다.
      - name: 사전 시험 (네트워크 없이)
        run: python3 scripts/check_etf_signals.py

      # **햇수를 비우면 지금 파일과 같은 해치로 받는다** (0 이 그 뜻이다). 예전에는
      # 여기 기본값 3 이 박혀 있었고, 2026-09-20 아무것도 넣지 않고 단추를 눌렀더니
      # 8해치 이력이 3해치로 잘렸다 — 봉 79,575 → 45,383. 수집기가 이제 그것을
      # 막지만, 애초에 줄여 부르지 않는 것이 먼저다.
      - name: 일봉 받기
        run: |
          python3 scripts/fetch_etf_prices.py \
            --only "${{ github.event.inputs.only || '' }}" \
            --years "${{ github.event.inputs.years || '0' }}" \
            ${{ github.event.inputs.allow_shrink == 'true' && '--allow-shrink' || '' }}

      - name: 신호 내기
        run: python3 scripts/build_etf_signals.py

      # **검산이 막아도 받은 것을 내보낸다.** 막힌 자료를 못 보면 무엇이 잘못됐는지
      # 가릴 수 없다. 막혔다는 사실은 요약과 주석으로 남긴다.
      - name: 검산
        id: verify
        continue-on-error: true
        run: |
          python3 scripts/verify_etf_signals.py 2>&1 | tee /tmp/verify.txt
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: 요약
        run: |
          {
            echo '## 자산배분 ETF 신호'
            echo
            echo '```'
            cat /tmp/verify.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.verify.outputs.rc }}" != "0" ]; then
            echo "::warning::검산이 막았습니다 — data/etf/*.json 을 그대로 읽지 마십시오"
          fi
          grep -c '^  ! ' /tmp/verify.txt || true

      # **거절당하면 되받지 않는다. 두 스냅숏 가운데 새것을 남긴다.**
      #
      # 산출물이 한 줄짜리 JSON 이라 같은 수집기의 두 판이 부딪히면 되받기가
      # 반드시 충돌한다(kis-timing.yml 의 같은 자리 주석). 그런데 이 판은 매매
      # 타이밍과 달라 **다시 셈할 수가 없다** — 어느 시각에 망에서 받아 온
      # 스냅숏이라, 다시 내려면 일흔여섯 종을 다시 두드려야 한다. 비싸고, 이미
      # 받아 둔 것이 있으니 더 옳지도 않다.
      #
      # 그래서 받아 온 시각(generated_at_kst)으로 새것을 가린다. 시계는
      # prices.json 하나만 본다 — signals.json 은 그 함수라 **짝으로 움직여야**
      # 하기 때문이다. 둘을 따로 가리면 3해치 봉 위에 8해치 신호가 앉는다.
      #
      # 예전 판은 밀기 → 자기 → 되받기 순서라 **되받은 뒤 다시 커밋하지 않았다.**
      # 그래서 두 바퀴째의 밀기는 언제나 같은 것을 다시 밀었다.
      - name: 커밋
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # 변수 이름은 ASCII 여야 한다 — bash 는 함수 이름과 달리 변수 이름에
          # 한글을 받지 않는다.
          BR="${GITHUB_REF_NAME}"
          CLOCK=data/etf/prices.json                  # 시계는 이 파일 하나
          MINE="${RUNNER_TEMP:-/tmp}/etf-mine"        # 이번에 받아 온 한 벌

          for i in 1 2 3 4 5; do
            git add -A data/etf
            if git diff --cached --quiet; then
              echo '바뀐 것 없음'; exit 0
            fi
            git commit -q -m "자산배분 ETF 신호 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
            if git push origin HEAD:"$BR"; then
              echo "밀어 넣음 (시도 $i)"; exit 0
            fi

            echo "거절됨 — 남의 판과 내 판 가운데 새것을 남긴다 ($i/5)"
            rm -rf "$MINE"; mkdir -p "$MINE"
            cp -a data/etf/. "$MINE"/
            if ! git fetch origin "+refs/heads/$BR:refs/remotes/origin/$BR"; then
              echo "::error::$BR 을 받지 못했습니다"; exit 1
            fi
            git reset --hard "origin/$BR"
            set +e
            python3 scripts/keep_newer_snapshot.py "$CLOCK" "$MINE/prices.json"
            rc=$?
            set -e
            case $rc in
              0) cp -a "$MINE/." data/etf/ ;;  # 내 판이 새롭다 — 한 벌째 되돌린다
              3) : ;;                          # 남의 판이 새롭다 — 그대로 둔다
              *) echo "::error::새것을 가리지 못했습니다"; exit 1 ;;
            esac
            sleep $((i * i * 2))
          done
          echo '::error::다섯 번 밀어 봤지만 모두 거절됐습니다'; exit 1

      - name: 검산이 막았으면 판을 빨갛게
        if: steps.verify.outputs.rc != '0'
        run: exit 1

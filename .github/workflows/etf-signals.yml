name: 자산배분 ETF 신호

# 표(2026-09-18 기준 자산배분ETF 종목 LIST)의 ETF 76종을 받아 신호를 낸다.
# ETN 6종은 지시대로 뺐다.
#
# 국내 55종은 네이버, 해외 21종은 야후에서 받는다. 국내 일봉 기준을 네이버로 옮긴
# 2026-09-18 의 결정을 그대로 따른다.
#
# **이름을 맞대는 것이 이 판의 첫 검사다.** 티커를 사진에서 옮겨 적었고, 코드 한
# 자가 틀리면 빈 응답이 아니라 남의 멀쩡한 응답이 온다 — 지표 검산으로는 못 잡는다.
#
# 예약은 걸지 않는다. 이 표는 한 번 보자고 만든 것이지 날마다 돌릴 것이 아니다.
# 다시 볼 때 단추로 돌린다.

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'KR 또는 OV 만 (비우면 전부)'
        required: false
        default: ''
      years:
        description: '몇 해치'
        required: false
        default: '3'

  # (첫 판을 돌리려고 `push: branches: ['claude/**']` 방아쇠를 잠시 붙였고, 76종을
  #  모두 받은 것을 확인한 뒤 뗐다. 남겨 두면 이 파일이나 수집기를 손볼 때마다
  #  네이버와 야후를 일흔여섯 번씩 두드린다.
  #
  #  단추(workflow_dispatch)는 이 파일이 **기본 가지에 올라간 뒤** 생긴다 — 깃허브가
  #  기본 가지의 정의만 보고 단추를 만든다. main 에 합치기 전에 다시 돌려야 하면
  #  위 push 방아쇠를 잠시 되붙이는 것이 가장 빠르다.)

permissions:
  contents: write

concurrency:
  group: etf-signals
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 길 전체를 망 없이 한 번 통과시킨다. 수집기가 첫 줄에서 죽으면 뒤의 어떤
      # 검산도 돌지 못한다 — 이 저장소에서 실제로 한 번 그랬다.
      - name: 사전 시험 (네트워크 없이)
        run: python3 scripts/check_etf_signals.py

      - name: 일봉 받기
        run: |
          python3 scripts/fetch_etf_prices.py \
            --only "${{ github.event.inputs.only || '' }}" \
            --years "${{ github.event.inputs.years || '3' }}"

      - name: 신호 내기
        run: python3 scripts/build_etf_signals.py

      # **검산이 막아도 받은 것을 내보낸다.** 막힌 자료를 못 보면 무엇이 잘못됐는지
      # 가릴 수 없다. 막혔다는 사실은 요약과 주석으로 남긴다.
      - name: 검산
        id: verify
        continue-on-error: true
        run: |
          python3 scripts/verify_etf_signals.py 2>&1 | tee /tmp/verify.txt
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: 요약
        run: |
          {
            echo '## 자산배분 ETF 신호'
            echo
            echo '```'
            cat /tmp/verify.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.verify.outputs.rc }}" != "0" ]; then
            echo "::warning::검산이 막았습니다 — data/etf/*.json 을 그대로 읽지 마십시오"
          fi
          grep -c '^  ! ' /tmp/verify.txt || true

      - name: 커밋
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A data/etf
          git diff --cached --quiet && { echo '바뀐 것 없음'; exit 0; }
          git commit -m "자산배분 ETF 신호 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          for i in 1 2 3 4; do
            git push origin HEAD:"${GITHUB_REF_NAME}" && exit 0
            sleep $((i * i * 2))
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
          done
          echo '::error::밀어 넣지 못했습니다'; exit 1

      - name: 검산이 막았으면 판을 빨갛게
        if: steps.verify.outputs.rc != '0'
        run: exit 1

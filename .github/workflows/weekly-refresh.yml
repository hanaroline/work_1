name: 월요일 일괄 갱신 (상품설명의무 스크립트)

# 창구가 월요일 아침에 여는 파일이 **그 주의 값**이 되게 한다.
#
# 왜 하나로 묶나
#   갱신은 다섯 갈래인데 순서에 뜻이 있다. 판독기는 카탈로그가 가진 설명서 주소를
#   읽으므로 카탈로그보다 먼저 돌면 지난주 주소로 읽는다. 저마다 예약을 걸어 두면
#   앞 것이 늦어진 날 순서가 뒤집히고, 다섯이 같은 브랜치에 밀어 넣어 push 가 부딪힌다.
#   여기서는 한 줄로 세워 앞 잡이 끝나야 다음이 시작한다.
#
#   마지막에 배포본을 다시 만드는 것까지가 한 묶음이다. 데이터가 아무리 새것이어도
#   창구가 여는 것은 sales-script-expl-standalone.html 한 파일이고, 그 파일을 다시
#   만들지 않으면 갱신은 창구에 닿지 않는다. (그 단계의 정의는 build-standalone.yml
#   한 곳에 있고, 그쪽은 매일 10:30 에도 따로 돈다.)
#
# 앞 잡이 실패해도 뒤는 돈다 (if: !cancelled()). ELS 사이트가 한 번 응답하지
# 않았다고 펀드 3,200건 갱신까지 걸러 버리면 안 된다. 실패한 잡은 그 잡만 빨갛고,
# 그 데이터는 직전 값을 그대로 유지한다.

on:
  workflow_dispatch:
  schedule:
    # 매주 월요일 07:30 KST (일요일 22:30 UTC).
    # 전 구간이 15분 남짓이라 창구가 문을 여는 08:30 전에 끝난다. GitHub 예약은
    # 30~90분씩 늦을 때가 있어(이 저장소에서 겪었다) 여유를 한 시간 두었다.
    - cron: '30 22 * * 0'

  # 표시 파일을 고쳐 밀면 돈다 — Actions 를 부를 수단이 없는 자리를 위한 길이다.
  #   date -u >> data/WEEKLY_REFRESH && git commit -am '갱신 요청' && git push
  push:
    branches:
      - 'claude/els-**'
      - 'claude/complete-sales-script-**'
    paths:
      - 'data/WEEKLY_REFRESH'

# 예약은 기본 브랜치(main)의 워크플로만 발동한다 — GitHub 규칙이다.
# 병합 전까지는 Routine(세션 예약)이 매주 월요일 이 워크플로를 작업 브랜치에서
# workflow_dispatch 로 발동한다. README 「자동 갱신 시각」 참고.

permissions:
  contents: write

concurrency:
  group: weekly-refresh-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # ── 1. ELS·DLS 상품 목록 (미래에셋증권 캘린더) ──────────────────
  els:
    name: '1. ELS 상품 목록'
    uses: ./.github/workflows/els-weekly.yml
    permissions:
      contents: write

  # ── 2. ELS 투자설명서 (DART 일괄신고추가서류) ───────────────────
  # 목록 다음이어야 한다 — 새로 올라온 회차의 설명서를 받아야 하므로.
  els_prospectus:
    name: '2. ELS 투자설명서'
    needs: els
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/els-prospectus.yml
    permissions:
      contents: write
    with:
      # 주 1회 도니 지난 한 주를 덮고도 남게 넉넉히 본다
      days_back: '45'

  # ── 3. 펀드 카탈로그 — 신규·청산 ────────────────────────────────
  fund_catalog:
    name: '3. 펀드 카탈로그'
    needs: els_prospectus
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/fund-catalog.yml
    permissions:
      contents: write

  # ── 4. 설명서 주소가 없는 종목 보완 (금투협 전자공시) ───────────
  fund_kofia:
    name: '4. 금투협 보완'
    needs: fund_catalog
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/fund-prospectus-kofia.yml
    permissions:
      contents: write
    with:
      scope: 'missing'
      limit: '0'

  # ── 5. 펀드 투자설명서 판독 (바뀐 것만) ─────────────────────────
  # 반드시 3·4 다음이다. 판독은 카탈로그의 설명서 주소를 읽는다.
  fund_prospectus:
    name: '5. 펀드 투자설명서 판독'
    needs: fund_kofia
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/fund-prospectus.yml
    permissions:
      contents: write
    with:
      mode: 'incremental'
      limit: '0'
      # 규칙 지문이 바뀌었으면 3시간짜리 전량 판독으로 승격하지 말고 멈춘다
      guard_rules: true

  # ── 6. 창구가 여는 단일 파일을 다시 만든다 ──────────────────────
  # 정의는 build-standalone.yml 한 곳에만 둔다 — 그쪽은 매일 10:30 에도 따로
  # 돈다(그날 수집이 끝난 뒤). 여기서 베껴 두면 두 벌이 어긋난다.
  build:
    name: '6. 배포본 재빌드'
    needs: fund_prospectus
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/build-standalone.yml
    permissions:
      contents: write

  # ── 이번 주에 무엇이 됐고 무엇이 안 됐는지 한 장으로 ────────────
  summary:
    name: '이번 주 갱신 요약'
    needs: [els, els_prospectus, fund_catalog, fund_kofia, fund_prospectus, build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: 요약
        run: |
          {
            echo "### 월요일 일괄 갱신"
            echo ""
            echo "| 단계 | 결과 |"
            echo "|---|---|"
            echo "| 1. ELS 상품 목록 | ${{ needs.els.result }} |"
            echo "| 2. ELS 투자설명서 | ${{ needs.els_prospectus.result }} |"
            echo "| 3. 펀드 카탈로그 | ${{ needs.fund_catalog.result }} |"
            echo "| 4. 금투협 보완 | ${{ needs.fund_kofia.result }} |"
            echo "| 5. 펀드 설명서 판독 | ${{ needs.fund_prospectus.result }} |"
            echo "| 6. 배포본 재빌드 | ${{ needs.build.result }} |"
            echo ""
            echo "담긴 값은 **6. 배포본 재빌드** 잡의 요약에 적혀 있습니다."
          } >> "$GITHUB_STEP_SUMMARY"

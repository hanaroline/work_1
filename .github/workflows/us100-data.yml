name: 미국 100대 기업 시세 수집

# `us-top100.html` 은 브라우저에서 야후에 직접 붙지만, 사내망·CORS 로 막히는 곳이
# 많다. Claude 세션도 이그레스 정책 때문에 야후에 못 붙는다. GitHub 러너는 그
# 정책 밖에서 돌므로 여기서 대신 받아 data/us100/ 에 커밋하고, 화면은 그 스냅샷을
# 먼저 그린 뒤 브라우저가 실시간으로 받아오면 그 위에 덮어쓴다.
#
# 주의: schedule 이벤트는 기본 브랜치(main)의 워크플로만 발동한다. 작업 브랜치에서는
# 아래 push 트리거(data/us100/REFRESH 한 줄 수정)나 수동 실행으로 돌린다.

on:
  schedule:
    # 미국 정규장 마감(16:00 ET) 뒤 — 21:30 UTC. ET 가 EST 인 겨울에는 22:30 것이 받는다.
    - cron: '30 21 * * 2-6'
    - cron: '30 22 * * 2-6'

  # 세션·사람이 직접 부르는 길. 세션 토큰에는 Actions 쓰기 권한이 없어
  # workflow_dispatch 를 API 로 부르지 못하지만(403), git push 는 된다.
  push:
    paths:
      - 'data/us100/REFRESH'
      - '.github/workflows/us100-data.yml'
      - 'scripts/fetch_us100.py'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: us100-data-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 시세 수집
        run: python scripts/fetch_us100.py

      - name: 커밋
        # 수집 중에 같은 브랜치로 다른 커밋이 들어오는 일이 실제로 있었다(사람이 화면을
        # 고치는 동안 수집이 돈다). rebase 로 붙이려다 data/us100 에서 충돌이 나
        # 커밋이 통째로 날아간 적이 있어, 아예 충돌이 날 수 없는 방식으로 붙인다:
        # 받아 둔 데이터를 따로 빼놓고 원격 최신을 그대로 체크아웃한 뒤 데이터만 다시 얹는다.
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- data/us100 && git diff --cached --quiet -- data/us100 \
             && [ -z "$(git ls-files --others --exclude-standard data/us100)" ]; then
            echo "변경 없음"
            exit 0
          fi
          TMP=$(mktemp -d)
          cp -a data/us100/. "$TMP/"
          for attempt in 1 2 3; do
            git fetch --quiet origin "${GITHUB_REF_NAME}"
            # 받아 둔 데이터는 TMP 에 있으니, 작업 트리는 원격 최신 그대로 맞춘다
            git reset --hard --quiet "origin/${GITHUB_REF_NAME}"
            rm -rf data/us100
            mkdir -p data/us100
            cp -a "$TMP/." data/us100/
            git add data/us100
            if git diff --staged --quiet; then
              echo "원격과 같아 커밋할 것이 없다"
              exit 0
            fi
            git commit --quiet -m "미국 100대 기업 시세 수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            if git push --quiet origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "커밋 완료 (시도 $attempt)"
              exit 0
            fi
            echo "밀어넣기 실패 — 원격을 다시 받아 시도한다 ($attempt/3)" >&2
            git reset --hard --quiet "origin/${GITHUB_REF_NAME}" || true
            sleep 5
          done
          echo "세 번 시도했지만 밀어넣지 못했다" >&2
          exit 1

      - name: 요약
        if: always()
        continue-on-error: true       # 요약이 깨져도 수집·커밋 결과를 실패로 만들지 않는다
        run: |
          if [ -f data/us100/latest.json ]; then
            python - <<'PY'
          import json
          try:
              d = json.load(open('data/us100/latest.json', encoding='utf-8'))
          except Exception as e:
              print(f"::warning::latest.json 을 읽지 못했다 — {e}")
              raise SystemExit(0)
          s = d.get('summary', {})
          print(f"::notice::시세 {s.get('chartOk')}/{s.get('symbols')} · 지표 {s.get('summaryOk')}/{s.get('symbols')}"
                f" · 뉴스 {s.get('newsOk')}/{s.get('symbols')} · crumb {s.get('crumb')}")
          bad = [k for k, v in d.get('sources', {}).items()
                 if isinstance(v, dict) and v.get('chart') is not True]
          if bad:
              print("::warning::시세 실패 " + ", ".join(bad[:20]))
          PY
          fi

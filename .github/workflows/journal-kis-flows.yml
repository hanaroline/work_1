name: 시장일지 — 종목별 수급 (KIS 확정 금액)

# 종목별 외국인·기관 순매수를 증권사 원본에서 **확정 금액으로** 받는다.
# 네이버는 금액을 주지 않아 시장일지가 수량 × 종가로 어림해 왔고, 그 어림이
# 확정치와 11% 어긋난 적이 있다(2026-09-21 삼성전자 ≈9,977억 대 11,063억).
#
# **저녁에 돈다.** 2026-09-22 에 여섯 번 재어 보니 KIS 도 15:37~19:33 은
# 잠정치였고 22:05 에 바뀌었다. 바뀐 뒤 값은 네이버 확정치와 정확히 일치했다.
# 두 원천은 같은 거래소 자료를 보므로 이 수집기가 발행을 앞당기지는 못한다 —
# **금액을 얻는 것**이 목적이다.
#
# 종목 하나씩 부르므로 오래 걸린다. 모의 앱키는 초당 1건이라 시장별 200종목
# (합 400)에 7분 남짓이다. 그래서 시장일지 워크플로에 붙이지 않고 따로 돈다 —
# 이 판이 늦거나 실패해도 시장일지는 네이버로 제때 나간다.

on:
  schedule:
    # 확정치가 오는 구간(19:33~22:05 사이)을 덮는다. 모두 KST.
    - cron: '30 11 * * 1-5'  # 20:30
    - cron: '30 12 * * 1-5'  # 21:30
    - cron: '30 13 * * 1-5'  # 22:30 — 마지막
  push:
    paths:
      - 'data/journal/KIS_FLOWS'
  workflow_dispatch:
    inputs:
      per_market:
        description: '시장별로 거래대금 상위 몇 종목을 부를지'
        type: string
        default: '200'

permissions:
  contents: write

concurrency:
  group: journal-kis-flows-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 400 종목 7분 + 여유. 시장일지(12분)보다 넉넉히 준다.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 앱키 확인
        run: |
          if [ -z "${{ secrets.KIS_APP_KEY }}" ] || [ -z "${{ secrets.KIS_APP_SECRET }}" ]; then
            echo "::error::KIS_APP_KEY / KIS_APP_SECRET 이 저장소 Secrets 에 없습니다."
            exit 1
          fi

      - name: 종목별 수급 수집
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ENV: ${{ vars.KIS_ENV || 'vps' }}
          KIS_TOKEN_CACHE: ${{ runner.temp }}/kis-token.json
        run: |
          N="${{ inputs.per_market || '200' }}"
          python3 scripts/fetch_journal_kis.py --per-market "$N"

      - name: 커밋
        if: always()
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/journal/kis-flows.json 2>/dev/null || true
          if git diff --staged --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "종목별 수급(KIS) $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          BR="${GITHUB_REF_NAME}"
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:$BR"; then echo "밀어 넣음 (시도 $i)"; exit 0; fi
            # 되받기가 아니라 합치기로 받는다 — 되받기는 앞선 **병합 커밋**을
            # 다시 펴다가 add/add 충돌을 낸다(2026-09-22 08:10 에 실제로 그랬다).
            git pull --no-rebase --no-edit origin "$BR" || { git merge --abort || true; \
              echo "::error::합치기 충돌 — 손으로 확인하십시오"; exit 1; }
            sleep $((i * 5))
          done
          echo "::error::다섯 번 밀어 봤지만 모두 거절됐습니다"
          exit 1

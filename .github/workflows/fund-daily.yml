name: 공모펀드 수집 (매일)

# 이 저장소의 세션은 이그레스 정책 때문에 네이버에 직접 못 붙는다
# (CONNECT 403). 러너는 그 정책 밖이므로 여기서 대신 받아 저장소에 커밋한다.

on:
  workflow_dispatch:
  schedule:
    # 펀드 기준가는 국내 마감 뒤 저녁에 확정되고, 원천은 **직전 영업일** 기준으로
    # 싣는다(tradeDate 가 어제로 온다). 그래서 아침에 한 번이면 충분하다.
    #   08:30 KST = 23:30 UTC 전일
    - cron: '30 23 * * 0-4'
  # 수집기·빌드·감사를 고쳤을 때 바로 검증되도록
  push:
    branches:
      - 'claude/fund-**'
    paths:
      - 'scripts/collect_fund_kr.mjs'
      - 'scripts/collect_fund_region.mjs'
      - 'scripts/build_fund_data.mjs'
      - 'scripts/audit_fund_data.mjs'
      - 'scripts/build_fund_page.mjs'
      - 'scripts/test_fund_page.mjs'
      - 'scripts/test_fund_lib.mjs'
      - 'scripts/etf_lib.mjs'
      - 'fund.html'
      - '.github/workflows/fund-daily.yml'

permissions:
  contents: write

concurrency:
  group: fund-daily-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 수집 실패는 잡을 실패시키지 않는다. 수집기는 수집률이 기준에 못 미치면
      # **파일을 건드리지 않고** 끝나므로, 실패해도 직전 수집분이 그대로 남는다.
      # 반쪽짜리로 어제 데이터를 덮는 것이 제일 나쁘다.
      #
      # 호출은 목록 160 + 펀드당 5회 ≈ 16,000회다. 동시 6개로 15~20분 걸린다.
      - name: 공모펀드 수집 (네이버 Npay 증권)
        id: collect
        continue-on-error: true
        timeout-minutes: 45
        run: node scripts/collect_fund_kr.mjs

      # 투자지역은 **1차 출처(금융투자협회)** 에서 따로 받는다.
      #
      # 처음에는 네이버 유형명 앞머리에서 읽었는데 재검증에서 표본 318개 중
      # 34개(10.7%)가 1차 출처와 어긋났다. 금투협은 지역을 국내·해외·혼합
      # 셋으로 나누는데 네이버 유형명의 "혼합" 은 자산을 뜻하기 때문이다.
      # 투자지역은 이 화면의 주축이므로 1차 출처를 쓴다.
      #
      # 실패하면 빌드가 지역을 비운다 — 네이버 값으로 되돌아가지 않는다.
      # 10.7% 틀린다는 것을 알면서 쓰는 것은 아는 거짓을 싣는 것이다.
      - name: 투자지역 수집 (금융투자협회)
        id: region
        continue-on-error: true
        timeout-minutes: 30
        run: |
          npm i -D playwright@1.56.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
          node scripts/collect_fund_region.mjs

      # 수집이 실패해도 기존 파일로 다시 만든다. 파일이 아예 없으면 예시
      # 데이터로 만들고 화면에 "예시 데이터" 배지가 붙는다.
      - name: 데이터 빌드
        run: node scripts/build_fund_data.mjs

      # 값을 만드는 함수들의 회귀 시험. 원자료 없이 몇 밀리초면 끝나고,
      # 이번에 값을 치르고 알아낸 것(주말이 낀 계단, 아주 작은 비중, 계단을
      # 먹은 값과 보정한 값의 구별)을 계속 지키는지 붙잡아 둔다.
      - name: 수집기 회귀 시험
        run: node scripts/test_fund_lib.mjs

      # ── 관문 ────────────────────────────────────────────────────────────
      # 화면에 실리는 모든 숫자를 전수 감사한다. **커밋 앞**에 둔다 — 오류가
      # 있는 채로 커밋하면 다음 사람이 또 눈으로 찾아야 한다.
      #
      # 이걸 만든 이유: 원천이 단기채권 펀드의 1개월 수익률을 +244.94% 로 준다.
      # 기준가 계열에 재산정 계단이 있고 네이버가 그것을 수익률로 계산한 값이다.
      # 3,200개 중에서 이런 것을 눈으로 찾을 수는 없다.
      #
      # 감사는 바깥 자료에 붙지 않는다. data/fund.js 안에서 서로 어긋나는 것만
      # 잡는다 — 안에서 앞뒤가 안 맞는 숫자는 바깥을 볼 것도 없이 틀린 것이다.
      # 오류가 하나라도 있으면 종료 코드 1 로 끝나고, 여기서 잡이 멈춘다.
      - name: 자료 전수 감사 (커밋 관문)
        run: node scripts/audit_fund_data.mjs

      - name: 단일 파일 빌드
        run: node scripts/build_fund_page.mjs

      # 실제 데이터를 넣은 화면이 열리는지 브라우저로 확인한다.
      # 여기서 걸리면 커밋하지 않는다 — 깨진 화면을 배포하지 않으려는 것이다.
      - name: 페이지 연기 시험
        run: |
          npm i -D playwright@1.56.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
          node scripts/test_fund_page.mjs
          node scripts/test_fund_page.mjs --built

      - name: 진단 자료 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fund-collect-debug
          path: |
            tools/discovery/fund_audit.md
            tools/discovery/fund_audit.json
            tools/discovery/fund_page.png
            data/fund-kr.js
          retention-days: 7

      # 감사와 화면 시험을 모두 통과한 뒤에만 커밋한다.
      - name: 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fund-kr.js data/fund-region.js data/fund.js fund-search.html 2>/dev/null || true
          git add tools/discovery/fund_audit.md tools/discovery/fund_audit.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore(fund): 공모펀드 데이터 갱신 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
            git push
          fi

      # 수집이 실패했으면 잡을 빨간불로 남긴다. 데이터는 지키되, 며칠씩
      # 조용히 낡아 가는 것은 막아야 한다.
      - name: 수집 실패 여부 확인
        if: steps.collect.outcome == 'failure'
        run: |
          echo "펀드 수집이 실패했습니다. 원천이 바뀌었는지 확인이 필요합니다."
          exit 1

name: 시장일지 수집

# 시장일지는 한국 정규장 마감(15:30 KST) 기준으로 16:00 에 나간다. 그 재료
# 가운데 **종목 순위**는 이 워크플로가 받는다(지수·환율·금리·예탁금은
# 「시세 수집」이 받는다). 세션은 네이버에 직접 못 붙으므로(CONNECT 403)
# 러너가 대신 받아 저장소에 커밋하고, 세션은 커밋된 파일을 읽는다.
#
# 예약은 제때 돌지 않는다 — 「시세 수집」에서 95분 늦은 적이 있다. 그래서
# 마감 뒤 판을 두 번 걸고, 세션은 예약을 믿지 말고 파일의 기준일을 직접
# 확인한 뒤 낡았으면 data/journal/REFRESH 를 건드려 발동하십시오.
#
# schedule 은 기본 브랜치(main)에 있는 판만 돈다. 작업 브랜치에서는
# push(REFRESH) 와 수동 실행만 된다.

on:
  schedule:
    # 마감 직후 — 15:40 KST = 06:40 UTC. 받아 두기만 한다.
    - cron: '40 6 * * 1-5'
    # 발행 판. **여러 번 거는 까닭**: 마감 시각이 지났다고 자료가 다 찬 것이
    # 아니다. 2026-09-21 16:07 에 외국인은 당일 잠정치였는데 기관은 아직
    # 전 거래일 것이었다. 그래서 짓기 전에 scripts/check_journal_ready.py 가
    # 「둘 다 오늘 확정치인가」를 보고, 아니면 내지 않고 다음 판을 기다린다.
    # 먼저 낸 판이 있으면 뒤의 판은 스스로 물러선다.
    - cron: '0 7 * * 1-5'    # 16:00 KST
    - cron: '20 7 * * 1-5'   # 16:20
    - cron: '45 7 * * 1-5'   # 16:45
    - cron: '15 8 * * 1-5'   # 17:15
    - cron: '0 9 * * 1-5'    # 18:00
    # **기관 종목별은 늦게 찬다.** 2026-09-21 에 16:52 까지도 전 거래일
    # 기준이었다. 이 저장소의 「종목별 수급 수집」이 19:00·20:30·22:00 에
    # 도는 것도 같은 까닭으로 보인다. 그 뒤로 판을 더 건다.
    - cron: '20 10 * * 1-5'  # 19:20
    - cron: '0 12 * * 1-5'   # 21:00 — 마지막 기회
  push:
    paths:
      - 'data/journal/REFRESH'
  workflow_dispatch:
    inputs:
      publish:
        description: '시장일지를 짓고 커밋할지 (아니면 자료만 받는다)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: market-journal-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 종목 순위 수집
        run: python3 scripts/fetch_journal.py

      # **여기서는 막지 않는다.** 받은 것은 받은 대로 남기고, 발행을 막는
      # 자리는 빌드 쪽이다(scripts/verify_journal.py 를 인자 없이 부른다).
      # 장중에 확인하려고 돌리면 경고가 나는 것이 정상이라, 그때마다 수집분을
      # 통째로 버리면 곤란하다.
      - name: 검산 (경고만)
        continue-on-error: true
        run: python3 scripts/verify_journal.py --warn-only

      # ── 여기부터가 발행 ────────────────────────────────────────────
      # 15:40 판은 **받아만 둔다.** 짓는 것은 16:00 뒤의 판과 손으로 부른
      # 실행이고, 그것도 scripts/check_journal_ready.py 가 「자료가 다 찼다」고
      # 할 때만이다. 시각이 아니라 자료가 발행을 정한다.
      - name: 발행 후보인가 (판 갈래만)
        id: pre
        run: |
          PUB=no
          case "${{ github.event.schedule }}" in
            "40 6 * * 1-5") PUB=no ;;
            "") ;;                       # 예약이 아닌 발동
            *) PUB=yes ;;
          esac
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PUB="${{ inputs.publish && 'yes' || 'no' }}"
          fi
          if [ "${{ github.event_name }}" = "push" ]; then PUB=yes; fi
          echo "candidate=$PUB" >> "$GITHUB_OUTPUT"
          echo "발행 후보: $PUB"

      # 시장일지의 절반은 시세 파일에서 온다(지수·환율·금리·예탁금). 그 파일이
      # 낡았으면 **금요일 종가를 월요일 것이라 말하는 판**이 나간다. 러너는
      # 원천에 붙을 수 있으므로 낡았으면 여기서 직접 받는다 — 「시세 수집」
      # 예약이 늦게 도는 일이 잦아 기다리기만 할 수 없다.
      #
      # **발행 여부를 가리기 전에 돈다.** 가림 조건에 「시세 파일도 오늘
      # 것인가」가 들어 있어서, 받기 전에 물으면 늘 아니라고 답한다.
      - name: 시세 파일이 오늘 것인지 확인
        if: steps.pre.outputs.candidate == 'yes'
        run: |
          if python3 scripts/check_market_fresh.py close; then
            echo "시세 파일이 오늘 마감분이다"
          else
            echo "::warning::시세 파일이 낡아 이 러너에서 직접 받는다"
            python3 scripts/fetch_market.py || \
              echo "::warning::시세 수집에 실패했습니다"
          fi

      # 자료가 정말 다 찼는지 본다. 손으로 부른 실행은 잠정치를 눈감을 수
      # 있게 하되, 기준일이 어긋나는 것은 그때도 막는다.
      - name: 자료가 다 찼는가
        id: gate
        if: always()
        run: |
          PUB="${{ steps.pre.outputs.candidate }}"
          if [ "$PUB" = "yes" ]; then
            EXTRA=""
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              EXTRA="--allow-estimated"
            fi
            set +e
            python3 scripts/check_journal_ready.py $EXTRA
            RC=$?
            set -e
            case "$RC" in
              0) ;;
              2) echo "::notice::오늘 판이 이미 있습니다 — 다시 짓지 않습니다"; PUB=no ;;
              *) echo "::notice::자료가 아직 덜 찼습니다 — 다음 판을 기다립니다"; PUB=no ;;
            esac
          fi
          echo "publish=$PUB" >> "$GITHUB_OUTPUT"
          echo "발행 여부: $PUB"

      # **여기서는 막는다.** 오류가 하나라도 있으면 짓지 않는다 —
      # 자료를 고치거나 그 수치를 빼는 것이 먼저다(fin-data-integrity 3단계).
      - name: 검산 (발행 관문)
        if: steps.gate.outputs.publish == 'yes'
        run: python3 scripts/verify_journal.py

      - name: 시장일지 짓기
        if: steps.gate.outputs.publish == 'yes'
        run: python3 scripts/build_journal.py

      # 「A4 네 장」은 이 자료의 약속이다. 눈이 아니라 자로 잰다. 그리고
      # 같은 크로미움으로 **PDF 를 굽는다** — 텔레그램으로 건네는 것이 이것이다.
      # 넘쳐도 발행은 막지 않되(경고만), 다음 판에서 줄 수를 줄인다.
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.publish == 'yes'
        with:
          node-version: '20'
      - name: 쪽 넘침 확인 · PDF 굽기
        if: steps.gate.outputs.publish == 'yes'
        continue-on-error: true
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          D=$(python3 -c "import json;print(json.load(open('data/market/latest.json'))['indices']['kospi']['date'])")
          node scripts/check_journal_fit.mjs "docs/journal/$D.html" \
            || echo "::warning::시장일지가 A4 를 넘쳤습니다 — 표의 줄 수를 줄이십시오"
          # 구운 뒤 쪽 수를 세어 `.sheet` 개수와 맞는지 본다. 어긋나면 경고만
          # 하고 PDF 는 남긴다 — 첨부가 없는 것보다 꼬리 쪽이 붙은 편이 낫다.
          node scripts/journal_to_pdf.mjs "docs/journal/$D.html" \
            || echo "::warning::PDF 쪽 수가 장 수와 다릅니다 — 표의 줄 수를 줄이십시오"

      # 텔레그램은 **비밀값이 있을 때만** 보낸다. 없으면 조용히 건너뛰고
      # 산출물은 저장소에 남는다 — 보내지 못한 것을 보낸 척하지 않는다.
      - name: 텔레그램 전송
        if: steps.gate.outputs.publish == 'yes'
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN·TELEGRAM_CHAT_ID 가 없어 전송을 건너뜁니다"
            exit 0
          fi
          python3 scripts/send_journal_telegram.py

      # 검산 관문에서 막혀도 **받아 둔 자료는 남긴다.** 다음 판이 그 자료로
      # 되짚을 수 있어야 하고, 무엇이 걸렸는지도 파일에 남아 있어야 한다.
      - name: 커밋
        if: always()
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/journal docs/journal data/market 2>/dev/null || git add data/journal
          if git diff --staged --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "시장일지 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          # 시세 수집·리포트 수집과 겹칠 수 있다. 되받아서 다시 민다 —
          # 서로 다른 갈래를 건드리므로 되받기는 거의 언제나 깨끗하다.
          BR="${GITHUB_REF_NAME}"
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:$BR"; then echo "밀어 넣음 (시도 $i)"; exit 0; fi
            echo "거절됨 — 되받아 다시 시도한다 ($i/5)"
            if ! git pull --rebase --no-edit origin "$BR"; then
              git rebase --abort || true
              echo "::error::되받기 충돌 — 손으로 확인하십시오"
              exit 1
            fi
            sleep $((i * 5))
          done
          echo "::error::다섯 번 밀어 봤지만 모두 거절됐습니다"
          exit 1

      - name: 요약
        if: always()
        run: |
          if [ -f data/journal/latest.json ]; then
            python3 - <<'PY'
          import json
          d = json.load(open('data/journal/latest.json', encoding='utf-8'))
          s = d.get('summary', {})
          print(f"::notice::기준일 {d.get('bizdate')} · 원천 {s.get('sources_ok')}/{s.get('sources_tried')} 성공 · 표본 {d.get('universe', {}).get('표본')} 종목")
          for k, v in sorted((d.get('sources') or {}).items()):
              if not v.get('ok'):
                  print(f"::warning::{k} 실패 — {v.get('error', '사유 없음')}")
          PY
          fi

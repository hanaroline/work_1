name: 매매 신호 백테스트

# **예약으로 돌리지 않는다.** 성적이 날마다 조용히 바뀌면, 어제 「−22%p」를 보고
# 판단한 사람과 오늘 「−19%p」를 보는 사람이 서로 다른 자료를 쓰게 된다. 모델을
# 고쳤을 때만 손으로 돌려 data/signals/backtest.json 을 갱신한다.
#
# 10분쯤 걸린다(200종목 × 시계 4 × 설정 2 × 부트스트랩 2000회).

on:
  workflow_dispatch:
    inputs:
      markets:
        description: '시장 (KR,US)'
        required: false
        default: 'KR,US'
      horizons:
        description: '시계 (쉼표)'
        required: false
        default: '5,10,20,60'

  # 모델을 고치면 성적도 다시 재야 한다. 자동으로 커밋하지는 않고 결과만 남긴다.
  pull_request:
    paths:
      - 'scripts/signal_lib.py'
      - 'scripts/signal_backtest.py'

permissions:
  contents: write

concurrency:
  group: signals-backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 종목 일봉 가지 받기
        run: |
          for br in kr100-data us100-data; do
            ok=0
            for i in 1 2 3 4; do
              if git fetch --depth 1 origin "+refs/heads/$br:refs/remotes/origin/$br"; then
                ok=1; break
              fi
              sleep $((i * i * 2))
            done
            [ "$ok" = 1 ] || { echo "::error::$br 가지를 받지 못했습니다"; exit 1; }
          done

      - name: 백테스트
        run: |
          python3 scripts/signal_backtest.py \
            --market "${{ github.event.inputs.markets || 'KR,US' }}" \
            --h "${{ github.event.inputs.horizons || '5,10,20,60' }}" \
            --out data/signals/backtest.json

      - name: 판정 요약
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('data/signals/backtest.json', encoding='utf-8'))
          print("::notice::%s" % d['summary_ko'].replace('**', '')[:900])
          v = d.get('verdict') or {}
          if not v.get('survivors'):
              print("::warning::여러 번 시험한 것을 보정하면 유의한 조합이 없습니다 "
                    "— 「이 신호가 값을 한다」고 적어서는 안 됩니다")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: signal-backtest
          path: data/signals/backtest.json

      # 사람이 직접 돌렸을 때만 커밋한다. PR 에서는 결과만 붙여 두고 판단은 사람이 한다.
      - name: 커밋
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/signals/backtest.json
          if git diff --staged --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "신호 백테스트 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase --no-edit origin main || { git rebase --abort || true; exit 1; }
            sleep $((i * 5))
          done
          exit 1

name: 증권사 리포트 수집

# 시세 수집(market-data.yml)의 형제 워크플로다. 브리핑을 만드는 Claude 세션은
# 사내 이그레스 정책 때문에 네이버 리서치에 직접 붙지 못하므로, 러너가 대신
# 받아 저장소에 커밋하고 세션·화면은 커밋된 data/reports/latest.json 을 읽는다.
#
# 주의: schedule 이벤트는 기본 브랜치(main)에 있는 워크플로만 발동한다.
# 다른 브랜치에서는 push·수동 실행만 된다.

on:
  schedule:
    # 국내 리서치는 아침에 쏟아진다. 대부분 07:00~08:30 KST 에 올라오므로
    # 개장(09:00) 전에 한 번 받아 둔다 — 08:40 KST = 23:40 UTC 전일.
    - cron: '40 23 * * 0-4'
    # 예약은 제때 돌지 않는다(시세 워크플로에서 최대 95분 지연을 봤다).
    # 그래서 판마다 두 번씩 건다 — 09:10 KST = 00:10 UTC.
    - cron: '10 0 * * 1-5'
    # 마감 뒤 판. 오후에 올라온 리포트와 그날 조회수까지 받는다 —
    # 17:10 KST = 08:10 UTC, 그리고 늦을 때를 대비해 18:00 KST = 09:00 UTC.
    - cron: '10 8 * * 1-5'
    - cron: '0 9 * * 1-5'

  # 브리핑 세션이 직접 부르는 길. 세션 토큰에는 Actions 쓰기 권한이 없어
  # workflow_dispatch 를 API 로 부르지 못하지만(403), git push 는 됩니다.
  # scripts/request_reports_refresh.sh 가 이 파일만 건드려 밀어 넣습니다.
  #
  # 파서를 고쳤을 때도 곧바로 다시 받습니다 — 목록·상세 구조가 바뀌면
  # 고친 즉시 실제 HTML 에 대고 확인해야 하기 때문입니다.
  push:
    paths:
      - 'data/reports/REFRESH'
      - 'scripts/fetch_reports.py'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reports-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 리포트 수집
        run: python scripts/fetch_reports.py

      - name: 오래된 덤프 정리
        run: |
          # 파싱 실패 시에만 남기는 원본이다. 7일 지난 것은 지운다.
          find data/reports/raw -name '*.html' -mtime +7 -delete 2>/dev/null || true

      - name: 커밋
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/reports
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "리포트 수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            for wait in 0 2 4 8 16; do
              [ "$wait" -gt 0 ] && sleep "$wait"
              git push && exit 0
              git pull --rebase origin "$GITHUB_REF_NAME" || true
            done
            echo "::error::커밋을 밀어넣지 못했다"
            exit 1
          fi

      - name: 요약
        if: always()
        run: |
          if [ -f data/reports/latest.json ]; then
            python - <<'PY'
          import json
          d = json.load(open('data/reports/latest.json', encoding='utf-8'))
          s, x = d['summary'], d.get('extraction', {})
          print(f"::notice::리포트 {s['count_collected']}건 (오늘 {s['count_today']}건) "
                f"· 본문 {x.get('detail_opened', 0)}건 중 {x.get('summarized', 0)}건 요약")
          for k, v in sorted(d['sources'].items()):
              if not v['ok']:
                  print(f"::warning::{k} 실패 — {v['error']}")
          if x.get('warning'):
              print(f"::warning::{x['warning']}")
          PY
          fi

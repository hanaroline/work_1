name: 증권사 리포트 수집

# 시세 수집(market-data.yml)의 형제 워크플로다. 브리핑을 만드는 Claude 세션은
# 사내 이그레스 정책 때문에 네이버 리서치에 직접 붙지 못하므로, 러너가 대신
# 받아 저장소에 커밋하고 세션·화면은 커밋된 data/reports/latest.json 을 읽는다.
#
# 주의: schedule 이벤트는 기본 브랜치(main)에 있는 워크플로만 발동한다.
# 다른 브랜치에서는 push·수동 실행만 된다.

on:
  # 평일 네 판. 시각은 9/10 에 지난 열흘 기록을 뽑아 정했다 — 어림이 아니라
  # 「수집 시각 ↔ 그날 건수」를 실제로 세어 보고 골랐다.
  #
  #   08:46 판 30~34건  →  09:2x 판 48~58건   (9/8·9/9·9/10 모두 +67~84%)
  #
  # 아침 물량은 09:20 께라야 거의 다 올라온다. 예전 08:40·09:10 두 판은
  # 둘 다 이르러 그날 자의 절반쯤만 담겼다.
  schedule:
    # ① 08:40 KST = 23:40 UTC 전일. 이른 판이지만 남겨 둔다 — 하나증권이
    #    아침에 자주 끊겨서(9/7·9/8·9/9·9/10 나흘 내리), 판이 하나뿐이면
    #    그날 그 원천이 통째로 빠진다. 두 판이면 겹쳐 쌓기로 메워진다.
    - cron: '40 23 * * 0-4'
    # ② 09:25 KST = 00:25 UTC. 본진. 그날 아침 물량의 대부분이 여기서 들어온다.
    - cron: '25 0 * * 1-5'
    # ③ 13:00 KST = 04:00 UTC. 오전 늦게 올라온 것.
    - cron: '0 4 * * 1-5'
    # ④ 17:20 KST = 08:20 UTC. 마감 뒤 — 오후 리포트와 그날 조회수까지.
    #    그날 자 리포트의 절반 남짓은 아침 판 뒤에 올라온다(9/2 32% · 9/4 29% ·
    #    9/7 44% 만 그날 판에 잡혔다). 이 판이 그것을 회수한다.
    - cron: '20 8 * * 1-5'

  # 브리핑 세션이 직접 부르는 길. 세션 토큰에는 Actions 쓰기 권한이 없어
  # workflow_dispatch 를 API 로 부르지 못하지만(403), git push 는 됩니다.
  # scripts/request_reports_refresh.sh 가 이 파일만 건드려 밀어 넣습니다.
  #
  # 파서를 고쳤을 때도 곧바로 다시 받습니다 — 목록·상세 구조가 바뀌면
  # 고친 즉시 실제 HTML 에 대고 확인해야 하기 때문입니다.
  push:
    paths:
      - 'data/reports/REFRESH'
      - 'scripts/fetch_reports.py'
      - 'scripts/probe_reports.py'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reports-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 원천 탐색 (작업 브랜치 전용)
        # 새 원천을 수집기에 넣기 전에 어디가 응답하는지 먼저 본다.
        # 정기 실행(main)에서는 돌지 않는다.
        if: github.ref_name != 'main'
        continue-on-error: true
        run: |
          mkdir -p data/reports
          python scripts/probe_reports.py > data/reports/probe.txt 2>&1
          tail -20 data/reports/probe.txt

      - name: 리포트 수집
        run: python scripts/fetch_reports.py

      - name: 재검산
        # 실린 숫자를 원자료에서 다시 세고, 실린 문장이 리포트 본문에 그대로
        # 있는지 대조한다. 흠이 있어도 수집물은 커밋한다 — 어긋난 자리를
        # 눈으로 봐야 고칠 수 있고, 결과는 verify.txt 에 남는다.
        continue-on-error: true
        run: |
          python scripts/verify_reports.py data/reports/latest.json \
            > data/reports/verify.txt 2>&1 || true
          tail -25 data/reports/verify.txt

      - name: 오래된 덤프 정리
        run: |
          # 파싱 실패 시에만 남기는 원본이다. 7일 지난 것은 지운다.
          find data/reports/raw -name '*.html' -mtime +7 -delete 2>/dev/null || true

      - name: 커밋
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/reports
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "리포트 수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            for wait in 0 2 4 8 16; do
              [ "$wait" -gt 0 ] && sleep "$wait"
              git push && exit 0
              git pull --rebase origin "$GITHUB_REF_NAME" || true
            done
            echo "::error::커밋을 밀어넣지 못했다"
            exit 1
          fi

      - name: 요약
        if: always()
        run: |
          if [ -f data/reports/latest.json ]; then
            python - <<'PY'
          import json
          d = json.load(open('data/reports/latest.json', encoding='utf-8'))
          s, x = d['summary'], d.get('extraction', {})
          print(f"::notice::리포트 {s['count_collected']}건 "
                f"({s['report_date']} 자 {s['count_report_date']}건) "
                f"· 본문 {x.get('detail_opened', 0)}건 중 {x.get('summarized', 0)}건 요약")
          # 원천 칸에 낯선 항목이 끼어도 요약이 죽어서는 안 된다. 이 단계가
          # 죽으면 커밋 단계까지 함께 넘어가 그날 수집물이 통째로 날아간다.
          for k, v in sorted(d['sources'].items()):
              if isinstance(v, dict) and v.get('ok') is False:
                  print(f"::warning::{k} 실패 — {v.get('error', '(사유 없음)')}")
          if x.get('warning'):
              print(f"::warning::{x['warning']}")
          PY
          fi

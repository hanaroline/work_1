name: 장외채권 수집 (매일)

# 채권은 펀드·ELS 와 달리 수집 원천이 없어 창구에서 종목마다 손으로 넣어야 했다.
# 탐색으로 찾아낸 미래에셋증권 장외채권 화면에서 매일 목록을 받아
# data/bond-catalog.js 로 만든다 — 종목만 고르면 종목명·발행사·발행일·만기일·
# 표면금리·위험등급·매수금리·세후수익률·매매단가가 채워진다.
#
# 시세가 매일 바뀌므로 매일 받는다. 개발 PC 는 외부 접속이 막혀 있어 러너에서 돈다.

on:
  workflow_dispatch:
    inputs:
      dry:
        description: '받아만 보고 파일은 쓰지 않기'
        type: boolean
        default: false
  schedule:
    # 매일 09:20 KST (00:20 UTC) — 장 시작 뒤 시세가 붙은 뒤
    - cron: '20 0 * * *'
  push:
    branches:
      - 'claude/complete-sales-script-**'
    paths:
      - 'scripts/collect_bonds.mjs'
      - '.github/workflows/bond-daily.yml'

permissions:
  contents: write

concurrency:
  group: bond-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 장외채권 받기
        run: node scripts/collect_bonds.mjs ${{ inputs.dry && '--dry' || '' }}

      - name: 단일 파일 다시 빌드
        if: ${{ !inputs.dry }}
        run: node scripts/build_sales_script.mjs sales-script-standalone-v2.html

      - name: 결과 커밋
        if: ${{ !inputs.dry }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A data/bond-catalog.js sales-script-standalone-v2.html
          if [ -n "$(git diff --cached --name-only)" ]; then
            git commit -m "chore(채권): 장외채권 목록 갱신"
            git pull --rebase --autostash origin "${{ github.ref_name }}" || true
            git push
          else
            echo '변경 없음'
          fi

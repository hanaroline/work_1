name: 교부문서 쪽 지도 만들기 (테스트판)

# 창구가 고객 앞에서 짚을 쪽 번호를 만든다. 기존 배포본은 건드리지 않는다 —
# data/doc-pages.js 는 새 파일이고, 테스트판 화면만 이 파일을 참조한다.
#
# 쪽 번호는 회차마다 다를 수 있어(뒤쪽 투자설명서 부분이 1~5쪽씩 밀린다)
# 상품 목록이 갱신될 때마다 다시 만들어야 한다.

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    # 매일 08:50 KST (23:50 UTC).
    #
    # ELS 상품 목록(08:00)·투자설명서(08:30) 다음이어야 한다 — 쪽 지도는 그날
    # 목록에 오른 회차의 교부본을 읽는다. 앞서 돌면 어제 목록으로 만든다.
    # 펀드 카탈로그(09:30)보다는 앞이라 같은 가지에 밀어 넣는 순서가 엇갈리지 않는다.
    #
    # 왜 매일인가 — 쪽 번호는 회차마다 다르다(뒤쪽 투자설명서가 1~5쪽씩 밀린다).
    # 새 회차가 하루 걸러 올라오는데 주 1회로 두면, 그 회차는 다음 월요일까지
    # 쪽 표시가 비어 창구가 문서를 직접 넘겨야 한다.
    - cron: '50 23 * * *'
  push:
    branches:
      - 'claude/els-**'
    paths:
      - 'scripts/build_doc_pages.mjs'
      - '.github/workflows/doc-pages.yml'

permissions:
  contents: write

concurrency:
  group: doc-pages-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Playwright 설치
        run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium

      - name: 쪽 지도 생성
        run: node scripts/build_doc_pages.mjs

      # 쪽 번호는 고객 앞에서 짚는 값이다. 지도가 반쯤 비었으면 담지 않는다.
      - name: 지도 점검
        run: |
          node -e "
          const g={}; new Function('window', require('fs').readFileSync('data/doc-pages.js','utf8'))(g);
          const d=g.DOC_PAGES, items=Object.values(d.items), n=items.length;
          if (!n) { console.log('::error::한 건도 없습니다'); process.exit(1); }
          /* 두 가지를 갈라서 본다.
             MUST — 이게 무너지면 **규칙이 깨진 것**이다. 실패시킨다.
                    (지금까지 관측: 전부 97~100%)
             SOFT — 문서마다 표현이 달라 못 찾을 수 있는 자리. 못 찾으면 그 상품만
                    표시가 비고, 빈칸은 설계상 안전하다. 실패시키지 않고 적어만 둔다.
             한 자리가 안 잡힌다고 지도 전체를 버리면, 잘 잡힌 나머지까지 창구가
             못 쓰게 된다.

             ★ 잣대를 백분율에서 **건수**로 바꾼다 (2026-09-30) ★

             옛 잣대는 「95% 미만이면 실패」 였다. 이것이 회차가 늘수록 저절로
             엄해진다 — 20건일 때도 1건까지, 38건일 때도 1건까지만 봐준다.
             실제로 2026-09-29·30 이틀 동안 midRedeem 36/38(94.74%) 하나 때문에
             지도가 통째로 안 담겼고, 그 사이 신규 18회차는 쪽 표시가 전부
             빈칸이었다. 다른 필수 자리는 그때도 100% 였다.

             제목 규칙이 진짜 깨지면 적중률은 0% 가까이 떨어진다. 100% 인 자리
             다섯 곳 옆에서 한 자리가 95%→94.7% 로 내려앉는 것은 규칙이 깨진
             것이 아니라 문서 몇 건이 그 항목을 달리 적은 것이다.

             그래서 「비운 건수가 3건을 넘고, 동시에 적중률이 90% 아래일 때」 만
             실패시킨다. 둘을 함께 걸어 두 방향을 다 막는다.
               · 회차가 적을 때(20건) 3건이 비면 85% → 실패한다
               · 회차가 많을 때(200건) 규칙이 깨져 20건이 비면 90% → 실패한다
               · 지금처럼 2건 비는 것은 통과하고, 그 2건만 빈칸이 된다
             빈칸은 설계상 안전하다 — 직원을 문서로 보낼 뿐, 틀린 쪽을 짚게
             하지 않는다. 그래서 통과시키되 **어느 회차가 비었는지 반드시
             적어 둔다.** 조용히 넘어가면 다음 사람이 못 본다. */
          const MUST=['docStart','payoff','payoffChart','sim','midRedeem','caution'];
          const SOFT=['fixDate','lossCase','target'];
          const got=k=>items.filter(it=>it.at[k]);
          const pct=k=>100*got(k).length/n;
          const missNames=k=>Object.entries(d.items).filter(([,it])=>!it.at[k])
                                .map(([code,it])=>(it.name||code).replace('미래에셋증권',''));
          let bad=0;
          console.log('[필수]');
          for (const k of MUST) {
            const p=pct(k), miss=n-got(k).length;
            console.log('  '+k.padEnd(14)+got(k).length+'/'+n+' ('+p.toFixed(1)+'%)'+(miss?'  비움 '+miss+'건: '+missNames(k).join(' '):''));
            if (miss > 3 && p < 90) {
              console.log('::error::'+k+' 가 '+miss+'건 비었습니다 ('+p.toFixed(1)+'%) — 제목 규칙이 깨졌습니다');
              bad++;
            } else if (miss) {
              console.log('::warning title=필수 자리에 빈칸::'+k+' '+miss+'건 — 그 회차만 표시가 비고 나머지는 담습니다 ('+missNames(k).join(' ')+')');
            }
          }
          console.log('[보조 — 못 찾으면 그 상품만 빈칸]');
          for (const k of SOFT) {
            const miss=n-got(k).length;
            console.log('  '+k.padEnd(14)+got(k).length+'/'+n+' ('+pct(k).toFixed(1)+'%)'+(miss?'  비움 '+miss+'건':''));
          }
          if (bad) process.exit(1);
          console.log('필수 자리 모두 성합니다 — 담습니다 (빈 자리는 그 회차만 표시가 빕니다)');
          "

      - name: 결과 커밋
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A data/doc-pages.js
          if [ -z "$(git diff --cached --name-only)" ]; then
            echo '변경 없음'; exit 0
          fi
          git commit -m "chore(els): 교부문서 쪽 지도 갱신"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push 거절 — 원격 변경을 받아 재시도 ($i/5)"
            git pull --rebase --autostash origin "${{ github.ref_name }}" || exit 1
          done
          echo '5회 시도 후에도 push 실패'; exit 1

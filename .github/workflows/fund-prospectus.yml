name: 펀드 투자설명서 판독

# 카탈로그가 갖고 있는 투자설명서 PDF 주소를 받아 미리 판독한다.
# 브라우저는 다른 도메인의 PDF 를 앱이 직접 읽지 못하고, 이 도구는 인터넷이 없는
# 업무용PC 에서 쓴다 — 그래서 ELS 와 같이 판독을 러너에서 해 두고 결과만 싣는다.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: '판독할 건수 (0 = 제한 없음)'
        type: string
        default: '0'
      mode:
        description: '판독 범위'
        type: choice
        default: 'incremental'
        options:
          - incremental   # 설명서가 바뀐 종목만 (보통 수십 건 · 몇 분)
          - full          # 전량 약 3,200건 (두 시간 넘음)
      seed_refs:
        description: '(전환용) 옛 판독 결과에 설명서 참조를 채울 카탈로그 경로 — 한 번만 필요'
        type: string
        default: ''
      codes:
        description: '표준코드만 다시 읽어 끼워 넣기 (쉼표로 구분) — 규칙의 좁은 구멍을 막았을 때. 규칙 지문은 올리지 않는다'
        type: string
        default: ''
  # 월요일 일괄 갱신(weekly-refresh.yml)이 순서를 지켜 부른다.
  # 부를 때는 guard_rules 를 켜서 예약과 똑같은 안전장치를 받게 한다 —
  # 사람이 손으로 돌리는 것과 달리, 자동 실행이 3시간짜리 전량 판독으로
  # 조용히 승격해서는 안 된다.
  workflow_call:
    inputs:
      limit:
        description: '판독할 건수 (0 = 제한 없음)'
        type: string
        required: false
        default: '0'
      mode:
        description: '판독 범위 (incremental | full)'
        type: string
        required: false
        default: 'incremental'
      seed_refs:
        type: string
        required: false
        default: ''
      codes:
        type: string
        required: false
        default: ''
      guard_rules:
        description: '규칙 지문이 바뀌었으면 전량 승격을 막는다 (예약 실행과 같은 안전장치)'
        type: boolean
        required: false
        default: false
  schedule:
    # 매일 10:10 KST (01:10 UTC).
    #
    # 카탈로그(09:30)·금투협 보완(09:50) 뒤여야 한다 — 판독은 카탈로그가 가진
    # 설명서 주소(docT/docG)를 읽으므로, 그보다 먼저 돌면 어제 주소로 읽는다.
    #
    # 예약은 언제나 --incremental 이다. 설명서가 바뀐 종목만 다시 읽으므로
    # 하루치면 1분 안에 끝난다 (2026-08-31 → 09-06 한 주에 51건이었다).
    # 주 1회로 두면 바뀐 설명서를 최대 6일 늦게 반영하고, 그동안 창구는
    # 옛 문구를 읽는다 — 그것이 이 판독기를 만든 이유다.
    - cron: '10 1 * * *'

# 전량 판독은 3,000건 × 2.6초 = 3시간 가까이 걸린다. 규칙을 손볼 때마다 자동으로
# 돌면 러너를 붙잡고 있는 데다 규칙이 덜 다듬어진 상태로 결과가 덮인다.
# 그래서 전량은 예약하지 않고, 규칙을 확정한 뒤 손으로 돌린다
# (규칙 개발용 표본은 fund-prospectus-sample.yml 이 몇 분에 받아 준다).
#
# ★ 예약이 3시간을 조용히 태우지 않게 막는 장치가 아래 「예약 안전장치」 단계다 ★
#   --incremental 은 규칙 지문이 바뀌면 스스로 전량 재판독으로 승격한다.
#   그 승격은 사람이 규칙을 고친 직후에 의도적으로 하는 것이지, 새벽 예약이
#   대신 할 일이 아니다.

permissions:
  contents: write

concurrency:
  group: fund-prospectus
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          # seed_refs 로 옛 카탈로그를 꺼내 쓸 수 있어야 한다 (git:<커밋> 형태)
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: pdfjs 설치
        run: npm install --no-save pdfjs-dist@3.11.174

      # 사람 손을 거치지 않는 실행에만 건다 — 예약(schedule)과 월요일 일괄 갱신
      # (guard_rules=true). 손으로 돌리는 것은 사람이 무엇을 하는지 아는 것이므로 막지 않는다.
      - name: 예약 안전장치 — 규칙이 바뀌었으면 전량 승격을 막는다
        if: github.event_name == 'schedule' || inputs.guard_rules
        run: |
          # 지문은 판독기에게 물어본다. 여기서 다시 계산하면 계산법이 두 벌이 되어
          # 언젠가 어긋난다 — 실제로 참조 조립을 두 벌로 두었다가 전량 판독 두 시간을
          # 태운 적이 있다. 가르는 기준은 한 군데에만 둔다.
          NOW=$(node scripts/fetch_fund_prospectus.mjs --print-stamp)
          NOW="$NOW" node -e "
          const fs = require('fs');
          const now = process.env.NOW;
          const g = {};
          new Function('window', fs.readFileSync('data/fund-prospectus.js', 'utf8'))(g);
          const was = g.FUND_PROSPECTUS.rulesStamp || '(기록 없음)';
          if (was === now) {
            console.log('규칙 지문 그대로 (' + now + ') — 바뀐 설명서만 읽습니다.');
            process.exit(0);
          }
          console.log('::error title=판독 규칙이 바뀌었습니다::예약(--incremental)이 전량 재판독 3시간으로 승격되려 합니다. 사람이 손으로 돌려야 합니다.');
          console.log('');
          console.log('  담긴 결과의 규칙 지문 : ' + was);
          console.log('  지금 규칙의 지문      : ' + now);
          console.log('');
          console.log('  --incremental 은 규칙이 바뀌면 「설명서가 그대로라도 결과가 달라진다」 며');
          console.log('  전량(3,014건 · 약 3시간)을 다시 읽습니다. 그 판단은 맞지만, 규칙을 고친');
          console.log('  사람이 결과를 보며 할 일이지 새벽 예약이 대신 할 일이 아닙니다.');
          console.log('');
          console.log('  할 일 — Actions 탭에서 이 워크플로를 mode=full · limit=0 으로 직접 실행하십시오.');
          console.log('  (규칙을 다듬는 중이라면 fund-prospectus-sample.yml 로 표본을 먼저 보십시오)');
          console.log('  전량이 한 번 돌아 지문이 맞춰지면 이 예약은 다시 조용히 굴러갑니다.');
          process.exit(1);
          "

      # 표본 60건으로 추출률을 먼저 확인했다 (계약기간·환매가능·유동성 100%,
      # 환매수수료 97%, 투자전략 82%, 주요위험 72/70%, 보수 68/50%).
      # 이제 전량을 돌린다 — 약 3,000건 × 2.6초 = 2시간 안.
      - name: 판독
        env:
          LIMIT: ${{ inputs.limit || '0' }}
          MODE: ${{ inputs.mode || 'incremental' }}
          SEED_REFS: ${{ inputs.seed_refs || '' }}
          CODES: ${{ inputs.codes || '' }}
        run: |
          set -- --limit "$LIMIT"
          # codes 를 주면 그 종목만 읽는다 — mode 는 보지 않는다
          if [ -n "$CODES" ]; then
            set -- "$@" --codes "$CODES"
          elif [ "$MODE" != 'full' ]; then
            set -- "$@" --incremental
          fi
          if [ -n "$SEED_REFS" ]; then
            case "$SEED_REFS" in
              git:*)
                rev="${SEED_REFS#git:}"
                git show "$rev:data/fund-catalog.js" > /tmp/seed-catalog.js
                echo "옛 카탈로그를 $rev 에서 꺼냈습니다 ($(wc -c < /tmp/seed-catalog.js) 바이트)"
                set -- "$@" --seed-refs /tmp/seed-catalog.js
                ;;
              *) set -- "$@" --seed-refs "$SEED_REFS" ;;
            esac
          fi
          echo "인자: $*"
          node scripts/fetch_fund_prospectus.mjs "$@"

      - name: 추출 품질 확인
        run: |
          node -e "
          const g={}; new Function('window', require('fs').readFileSync('data/fund-prospectus.js','utf8'))(g);
          const I=g.FUND_PROSPECTUS.items, K=Object.keys(I);
          console.log('판독', K.length, '건');
          const cnt={};
          K.forEach(k=>Object.keys(I[k]).forEach(f=>cnt[f]=(cnt[f]||0)+1));
          Object.entries(cnt).sort((a,b)=>b[1]-a[1]).forEach(([f,n])=>console.log('  '+f.padEnd(14), n+'건', (100*n/K.length).toFixed(0)+'%'));
          console.log('표본:', JSON.stringify(I[K[0]], null, 1).slice(0, 900));
          "

      # 쪽 번호는 고객 앞에서 짚는 값이다. 그런데 **못 찾은 자리는 비어 있을 뿐**이고,
      # 빈칸은 직원을 문서로 보낼 뿐 고객 앞에서 엉뚱한 곳을 가리키게 하지 않는다.
      # 그래서 이 점검이 막아야 할 것은 「한 자리가 좀 덜 잡히는 것」 이 아니라
      # 「규칙이 깨져 지도가 통째로 못 쓰게 된 것」 이다.
      #
      # 이 구분을 처음엔 못 박지 못해, 2시간 45분짜리 전량 판독 결과 2,922건을
      # 통째로 버린 적이 있다. 그때 숫자가 이랬다 —
      #   투자목적 100 · 투자대상 99 · 투자전략 99 · 투자위험 100 · 보수 100 · 과세 100
      #   매입환매 76  ← 이 하나 때문에 나머지 여섯까지 창구에 못 갔다
      # 76% 는 규칙이 깨진 것이 아니라 제목 변형 하나를 아직 못 덮은 것이다.
      #
      # 그래서 이렇게 가른다.
      #   ① 한 건도 없음            → 실패 (판독 자체가 안 된 것)
      #   ② 필수 자리가 40% 아래     → 실패 (그 정규식이 깨진 것)
      #   ③ 필수 자리 셋 이상이 85% 아래 → 실패 (서식이 통째로 바뀐 것)
      #   그 밖에 85% 아래인 자리는 **경고**로 적고 담는다 — 고칠 거리는 남기되,
      #   잘 잡힌 자리까지 창구에서 빼앗지 않는다.
      - name: 쪽 지도 점검
        run: |
          node -e "
          const g={}; new Function('window', require('fs').readFileSync('data/fund-doc-pages.js','utf8'))(g);
          const D=g.FUND_DOC_PAGES, keys=D.anchors.map(a=>a.key), rows=Object.values(D.rows), n=rows.length;
          if (!n) { console.log('::error::쪽 지도가 한 건도 없습니다 — 판독이 되지 않았습니다'); process.exit(1); }
          const at=(r,k)=>r[keys.indexOf(k)+1];
          const MUST=['object','target','strategy','risk','trade','fee','tax'];
          const SOFT=['summary','part1','manager'];
          const what=k=>(D.anchors.find(a=>a.key===k)||{}).what||k;
          let broken=0, weak=[];
          console.log('쪽 지도 '+n+'건');

          /* ★ 본문 자리는 제2부를 찾은 종목에서만 셀 수 있다 ★
             본문은 제2부부터 찾으므로, 제2부를 못 찾으면 일곱 자리가 **함께** 빈다.
             전체를 분모로 삼으면 일곱 자리가 똑같은 숫자로 내려앉고, 「세 자리 넘게
             85% 아래면 서식이 바뀐 것」 이라는 규칙에 통째로 걸린다. 실제로 그 일이
             났다 — 일곱 자리가 모두 77% 로 같았고(=제2부 77%), 차례는 0건으로
             멀쩡한 지도였는데 점검이 막아 두 시간을 버렸다.
             원인이 하나(제2부)인데 일곱 번 센 것이다. 제2부를 찾은 종목만 분모로
             삼으면 규칙이 깨졌는지 아닌지가 그대로 보인다. */
          const p2=rows.filter(r=>at(r,'part2'));
          const cov=100*p2.length/n;
          console.log('[본문 시작 — 제2부] '+p2.length+'/'+n+'건 ('+cov.toFixed(0)+'%)');
          if (cov < 40) { console.log('::error::제2부를 '+cov.toFixed(0)+'% 밖에 못 찾았습니다 — 찾는 규칙이 깨졌습니다'); broken++; }
          else if (cov < 85) console.log('::warning title=제2부를 못 찾은 종목::'+(100-cov).toFixed(0)+'% 는 본문 쪽이 통째로 빈칸입니다 (틀린 쪽은 아닙니다)');

          console.log('[필수 — 창구가 짚는 자리 · 제2부를 찾은 '+p2.length+'건 기준]');
          for (const k of MUST) {
            const p=p2.length?100*p2.filter(r=>at(r,k)).length/p2.length:0;
            console.log('  '+what(k).padEnd(22)+p.toFixed(0)+'%');
            if (p < 40) { console.log('::error::'+what(k)+' 가 '+p.toFixed(0)+'% 뿐입니다 — 이 자리의 규칙이 깨졌습니다'); broken++; }
            else if (p < 85) weak.push(what(k)+' '+p.toFixed(0)+'%');
          }
          console.log('[보조 — 못 찾으면 그 종목만 빈칸]');
          for (const k of SOFT) console.log('  '+what(k).padEnd(22)+(100*rows.filter(r=>at(r,k)).length/n).toFixed(0)+'%');
          if (weak.length) console.log('::warning title=덜 잡힌 자리::'+weak.join(' / ')+' — 그 종목만 빈칸입니다. 제목 변형을 probe_fund_title.mjs 로 확인해 채우십시오');
          if (weak.length >= 3) { console.log('::error::제2부를 찾고도 필수 자리 '+weak.length+'곳이 85% 아래입니다 — 서식이 통째로 바뀐 것으로 보입니다'); broken++; }

          /* ★ 차례 검산 — 적중률이 못 보는 것 ★
             적중률은 「무언가 찾았나」 만 센다. 실제로 요약 구간의 절 제목을 본문으로
             잘못 짚은 2,924종목이 자리마다 99~100% 로 이 점검을 통과했다. 창구가
             「보수는 6쪽」 하고 편 곳에 요약 한 줄만 있는 값이었다.
             본문 자리는 반드시 제2부 뒤에 온다 — 앞이면 그건 요약 구간이다. */
          const BODY=['object','target','strategy','risk','trade','fee','tax'];
          const withP2=rows.filter(r=>at(r,'part2'));
          let outOfOrder=0;
          for (const r of withP2) if (BODY.some(k=>at(r,k) && at(r,k) < at(r,'part2'))) outOfOrder++;
          console.log('[차례 검산] 제2부를 찾은 '+withP2.length+'건 중 본문 자리가 제2부보다 앞선 것 '+outOfOrder+'건');
          if (outOfOrder) { console.log('::error::'+outOfOrder+'건이 요약 구간을 본문으로 짚고 있습니다 — 쪽 번호가 틀렸습니다'); broken++; }
          const overflow=rows.filter(r=>r.slice(1).some(v=>v>r[0])).length;
          if (overflow) { console.log('::error::쪽 번호가 문서 쪽수를 넘는 줄 '+overflow+'건'); broken++; }

          if (broken) process.exit(1);
          console.log('담습니다' + (weak.length ? ' (덜 잡힌 자리 '+weak.length+'곳은 해당 종목만 빈칸)' : ''));
          "

      # 단일 파일은 여기서 만들지 않는다 (fund-catalog.yml 의 같은 자리 설명 참고).
      - name: 결과 커밋
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A data/fund-prospectus.js data/fund-doc-pages.js
          if [ -z "$(git diff --cached --name-only)" ]; then
            echo '변경 없음'; exit 0
          fi
          git commit -m "chore(fund): 투자설명서 판독 결과·쪽 지도 갱신"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push 거절 — 원격 변경을 받아 재시도 ($i/5)"
            git pull --rebase --autostash origin "${{ github.ref_name }}" || exit 1
          done
          echo '5회 시도 후에도 push 실패'; exit 1

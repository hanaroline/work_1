name: 펀드 투자설명서 판독

# 카탈로그가 갖고 있는 투자설명서 PDF 주소를 받아 미리 판독한다.
# 브라우저는 다른 도메인의 PDF 를 앱이 직접 읽지 못하고, 이 도구는 인터넷이 없는
# 업무용PC 에서 쓴다 — 그래서 ELS 와 같이 판독을 러너에서 해 두고 결과만 싣는다.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: '판독할 건수 (0 = 제한 없음)'
        type: string
        default: '0'
      mode:
        description: '판독 범위'
        type: choice
        default: 'incremental'
        options:
          - incremental   # 설명서가 바뀐 종목만 (보통 수십 건 · 몇 분)
          - full          # 전량 약 3,200건 (두 시간 넘음)
      seed_refs:
        description: '(전환용) 옛 판독 결과에 설명서 참조를 채울 카탈로그 경로 — 한 번만 필요'
        type: string
        default: ''
      codes:
        description: '표준코드만 다시 읽어 끼워 넣기 (쉼표로 구분) — 규칙의 좁은 구멍을 막았을 때. 규칙 지문은 올리지 않는다'
        type: string
        default: ''
  # 월요일 일괄 갱신(weekly-refresh.yml)이 순서를 지켜 부른다.
  # 부를 때는 guard_rules 를 켜서 예약과 똑같은 안전장치를 받게 한다 —
  # 사람이 손으로 돌리는 것과 달리, 자동 실행이 3시간짜리 전량 판독으로
  # 조용히 승격해서는 안 된다.
  workflow_call:
    inputs:
      limit:
        description: '판독할 건수 (0 = 제한 없음)'
        type: string
        required: false
        default: '0'
      mode:
        description: '판독 범위 (incremental | full)'
        type: string
        required: false
        default: 'incremental'
      seed_refs:
        type: string
        required: false
        default: ''
      codes:
        type: string
        required: false
        default: ''
      guard_rules:
        description: '규칙 지문이 바뀌었으면 전량 승격을 막는다 (예약 실행과 같은 안전장치)'
        type: boolean
        required: false
        default: false
  schedule:
    # 매일 10:10 KST (01:10 UTC).
    #
    # 카탈로그(09:30)·금투협 보완(09:50) 뒤여야 한다 — 판독은 카탈로그가 가진
    # 설명서 주소(docT/docG)를 읽으므로, 그보다 먼저 돌면 어제 주소로 읽는다.
    #
    # 예약은 언제나 --incremental 이다. 설명서가 바뀐 종목만 다시 읽으므로
    # 하루치면 1분 안에 끝난다 (2026-08-31 → 09-06 한 주에 51건이었다).
    # 주 1회로 두면 바뀐 설명서를 최대 6일 늦게 반영하고, 그동안 창구는
    # 옛 문구를 읽는다 — 그것이 이 판독기를 만든 이유다.
    - cron: '10 1 * * *'

# 전량 판독은 3,000건 × 2.6초 = 3시간 가까이 걸린다. 규칙을 손볼 때마다 자동으로
# 돌면 러너를 붙잡고 있는 데다 규칙이 덜 다듬어진 상태로 결과가 덮인다.
# 그래서 전량은 예약하지 않고, 규칙을 확정한 뒤 손으로 돌린다
# (규칙 개발용 표본은 fund-prospectus-sample.yml 이 몇 분에 받아 준다).
#
# ★ 예약이 3시간을 조용히 태우지 않게 막는 장치가 아래 「예약 안전장치」 단계다 ★
#   --incremental 은 규칙 지문이 바뀌면 스스로 전량 재판독으로 승격한다.
#   그 승격은 사람이 규칙을 고친 직후에 의도적으로 하는 것이지, 새벽 예약이
#   대신 할 일이 아니다.

permissions:
  contents: write

concurrency:
  group: fund-prospectus
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          # seed_refs 로 옛 카탈로그를 꺼내 쓸 수 있어야 한다 (git:<커밋> 형태)
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: pdfjs 설치
        run: npm install --no-save pdfjs-dist@3.11.174

      # 사람 손을 거치지 않는 실행에만 건다 — 예약(schedule)과 월요일 일괄 갱신
      # (guard_rules=true). 손으로 돌리는 것은 사람이 무엇을 하는지 아는 것이므로 막지 않는다.
      - name: 예약 안전장치 — 규칙이 바뀌었으면 전량 승격을 막는다
        if: github.event_name == 'schedule' || inputs.guard_rules
        run: |
          # 지문은 판독기에게 물어본다. 여기서 다시 계산하면 계산법이 두 벌이 되어
          # 언젠가 어긋난다 — 실제로 참조 조립을 두 벌로 두었다가 전량 판독 두 시간을
          # 태운 적이 있다. 가르는 기준은 한 군데에만 둔다.
          NOW=$(node scripts/fetch_fund_prospectus.mjs --print-stamp)
          NOW="$NOW" node -e "
          const fs = require('fs');
          const now = process.env.NOW;
          const g = {};
          new Function('window', fs.readFileSync('data/fund-prospectus.js', 'utf8'))(g);
          const was = g.FUND_PROSPECTUS.rulesStamp || '(기록 없음)';
          if (was === now) {
            console.log('규칙 지문 그대로 (' + now + ') — 바뀐 설명서만 읽습니다.');
            process.exit(0);
          }
          console.log('::error title=판독 규칙이 바뀌었습니다::예약(--incremental)이 전량 재판독 3시간으로 승격되려 합니다. 사람이 손으로 돌려야 합니다.');
          console.log('');
          console.log('  담긴 결과의 규칙 지문 : ' + was);
          console.log('  지금 규칙의 지문      : ' + now);
          console.log('');
          console.log('  --incremental 은 규칙이 바뀌면 「설명서가 그대로라도 결과가 달라진다」 며');
          console.log('  전량(3,014건 · 약 3시간)을 다시 읽습니다. 그 판단은 맞지만, 규칙을 고친');
          console.log('  사람이 결과를 보며 할 일이지 새벽 예약이 대신 할 일이 아닙니다.');
          console.log('');
          console.log('  할 일 — Actions 탭에서 이 워크플로를 mode=full · limit=0 으로 직접 실행하십시오.');
          console.log('  (규칙을 다듬는 중이라면 fund-prospectus-sample.yml 로 표본을 먼저 보십시오)');
          console.log('  전량이 한 번 돌아 지문이 맞춰지면 이 예약은 다시 조용히 굴러갑니다.');
          process.exit(1);
          "

      # 표본 60건으로 추출률을 먼저 확인했다 (계약기간·환매가능·유동성 100%,
      # 환매수수료 97%, 투자전략 82%, 주요위험 72/70%, 보수 68/50%).
      # 이제 전량을 돌린다 — 약 3,000건 × 2.6초 = 2시간 안.
      - name: 판독
        env:
          LIMIT: ${{ inputs.limit || '0' }}
          MODE: ${{ inputs.mode || 'incremental' }}
          SEED_REFS: ${{ inputs.seed_refs || '' }}
          CODES: ${{ inputs.codes || '' }}
        run: |
          set -- --limit "$LIMIT"
          # codes 를 주면 그 종목만 읽는다 — mode 는 보지 않는다
          if [ -n "$CODES" ]; then
            set -- "$@" --codes "$CODES"
          elif [ "$MODE" != 'full' ]; then
            set -- "$@" --incremental
          fi
          if [ -n "$SEED_REFS" ]; then
            case "$SEED_REFS" in
              git:*)
                rev="${SEED_REFS#git:}"
                git show "$rev:data/fund-catalog.js" > /tmp/seed-catalog.js
                echo "옛 카탈로그를 $rev 에서 꺼냈습니다 ($(wc -c < /tmp/seed-catalog.js) 바이트)"
                set -- "$@" --seed-refs /tmp/seed-catalog.js
                ;;
              *) set -- "$@" --seed-refs "$SEED_REFS" ;;
            esac
          fi
          echo "인자: $*"
          node scripts/fetch_fund_prospectus.mjs "$@"

      - name: 추출 품질 확인
        run: |
          node -e "
          const g={}; new Function('window', require('fs').readFileSync('data/fund-prospectus.js','utf8'))(g);
          const I=g.FUND_PROSPECTUS.items, K=Object.keys(I);
          console.log('판독', K.length, '건');
          const cnt={};
          K.forEach(k=>Object.keys(I[k]).forEach(f=>cnt[f]=(cnt[f]||0)+1));
          Object.entries(cnt).sort((a,b)=>b[1]-a[1]).forEach(([f,n])=>console.log('  '+f.padEnd(14), n+'건', (100*n/K.length).toFixed(0)+'%'));
          console.log('표본:', JSON.stringify(I[K[0]], null, 1).slice(0, 900));
          "

      # 쪽 번호는 고객 앞에서 짚는 값이다. 지도가 반쯤 비었으면 규칙이 깨진 것이므로
      # 담지 않는다. ELS 와 같이 두 갈래로 본다 —
      #   MUST 창구가 실제로 짚는 자리. 표본 40종목에서 90~100% 였다. 무너지면 실패시킨다.
      #   SOFT 서식이 다른 문서에서 못 찾을 수 있는 자리(요약정보 78%·제1부 60%).
      #        못 찾으면 그 종목만 비고, 빈칸은 설계상 안전하다. 적어만 둔다.
      - name: 쪽 지도 점검
        run: |
          node -e "
          const g={}; new Function('window', require('fs').readFileSync('data/fund-doc-pages.js','utf8'))(g);
          const D=g.FUND_DOC_PAGES, keys=D.anchors.map(a=>a.key), rows=Object.values(D.rows), n=rows.length;
          if (!n) { console.log('::error::쪽 지도가 한 건도 없습니다'); process.exit(1); }
          const pct=k=>100*rows.filter(r=>r[keys.indexOf(k)+1]).length/n;
          const MUST=['object','target','strategy','risk','trade','fee','tax'];
          const SOFT=['summary','part1','part2','manager'];
          const what=k=>(D.anchors.find(a=>a.key===k)||{}).what||k;
          let bad=0;
          console.log('쪽 지도 '+n+'건');
          console.log('[필수 — 창구가 짚는 자리]');
          for (const k of MUST) {
            const p=pct(k);
            console.log('  '+what(k).padEnd(22)+p.toFixed(0)+'%');
            if (p < 85) { console.log('::error::'+what(k)+' 가 '+p.toFixed(0)+'% 뿐입니다 — 제목 규칙이 깨졌습니다'); bad++; }
          }
          console.log('[보조 — 못 찾으면 그 종목만 빈칸]');
          for (const k of SOFT) console.log('  '+what(k).padEnd(22)+pct(k).toFixed(0)+'%');
          if (bad) process.exit(1);
          console.log('필수 자리 모두 85% 이상 — 담습니다');
          "

      # 단일 파일은 여기서 만들지 않는다 (fund-catalog.yml 의 같은 자리 설명 참고).
      - name: 결과 커밋
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A data/fund-prospectus.js data/fund-doc-pages.js
          if [ -z "$(git diff --cached --name-only)" ]; then
            echo '변경 없음'; exit 0
          fi
          git commit -m "chore(fund): 투자설명서 판독 결과·쪽 지도 갱신"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push 거절 — 원격 변경을 받아 재시도 ($i/5)"
            git pull --rebase --autostash origin "${{ github.ref_name }}" || exit 1
          done
          echo '5회 시도 후에도 push 실패'; exit 1

name: ELS 공시 원문 수집

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/els-**'
    paths:
      - 'scripts/fetch_prospectus.mjs'
      - '.github/workflows/els-prospectus-probe.yml'
      # 자동 예약이 API 없이 수집을 거는 통로. els-weekly.yml 설명 참고.
      - 'tools/discovery/prospectus-request.txt'

permissions:
  contents: write

# els-weekly.yml 과 같은 그룹. 사유는 그쪽 주석 참고.
concurrency:
  group: els-collect
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      # ref 를 주지 않으면 push 이벤트에서 detached HEAD 로 떨어져 아래 git push 가
      # "not currently on a branch" 로 죽는다.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/fetch_prospectus.mjs
      - name: 추출 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/discovery/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore(els): 공시 원문 추출 결과 갱신"
            # 같은 브랜치에 목록 수집이 끼면 push 가 거절된다. 받아 얹고 다시 민다.
            for i in 1 2 3 4 5; do
              if git push; then exit 0; fi
              echo "push 거절 — 원격 변경을 받아 재시도 ($i/5)"
              git pull --rebase --autostash origin "${{ github.ref_name }}" || exit 1
            done
            echo "5회 시도 후에도 push 실패"
            exit 1
          fi

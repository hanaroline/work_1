name: ELS 공시 원문 수집

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/els-**'
    paths:
      - 'scripts/fetch_prospectus.mjs'
      - '.github/workflows/els-prospectus-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/fetch_prospectus.mjs
      - name: 추출 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/discovery/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore(els): 공시 원문 추출 결과 갱신"
            git push
          fi

name: 시장일지 — KIS 수급 시각 재기

# **16:00 에 기관 종목별 수급을 받을 수 있는가**를 가리려고 하루를 재는 판이다.
#
# 네이버는 못 준다. 2026-09-21 에 여섯 번 재어 확인했다 — 11:51·16:07·16:52·
# 18:07·19:26 까지 기관 칸이 전 거래일이었고 23:45 에야 당일 확정치가 들어왔다.
#
# 한국투자증권 오픈API 에는 **가집계·추정집계** 계열이 따로 있다. HTS 가 장중과
# 마감 직후에 보여 주는 숫자다. 이름만 보면 될 것 같지만 이름을 믿지 않는다 —
# 거래일 하루 동안 시각별로 재서 곡선을 만들고, 그 곡선이 답을 준다.
#
# 세션은 KIS 에 못 붙는다(9443 비표준 포트를 이그레스 프록시가 막는다).
# 러너만 붙을 수 있으므로 여기서 재고 저장소에 남긴다.
#
# 하루 재면 끝나는 판이다. 답이 나오면 이 워크플로는 지우거나 예약을 끈다.

on:
  schedule:
    # 마감 전후를 촘촘히, 저녁은 성기게. 모두 KST 기준.
    - cron: '20 6 * * 1-5'   # 15:20 — 장 끝나기 10분 전 (견줄 바탕)
    - cron: '35 6 * * 1-5'   # 15:35 — 마감 직후
    - cron: '50 6 * * 1-5'   # 15:50
    - cron: '0 7 * * 1-5'    # 16:00 — **이 판이 묻는 시각**
    - cron: '30 7 * * 1-5'   # 16:30
    - cron: '30 8 * * 1-5'   # 17:30
    - cron: '30 10 * * 1-5'  # 19:30 — 네이버가 아직 못 채우던 때
    - cron: '0 14 * * 1-5'   # 23:00 — 네이버가 채운 뒤 (확정치와 견준다)
  push:
    paths:
      - 'data/journal/KIS_PROBE'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: journal-kis-timing-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 앱키 확인
        run: |
          if [ -z "${{ secrets.KIS_APP_KEY }}" ] || [ -z "${{ secrets.KIS_APP_SECRET }}" ]; then
            echo "::error::KIS_APP_KEY / KIS_APP_SECRET 이 저장소 Secrets 에 없습니다."
            exit 1
          fi

      - name: 재기
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ENV: ${{ vars.KIS_ENV || 'vps' }}
          KIS_TOKEN_CACHE: ${{ runner.temp }}/kis-token.json
        run: |
          # 예약에서 온 것이면 그 시각을 이름표로 단다. 곡선을 읽을 때
          # 「어느 판이 무엇을 봤나」가 한눈에 들어와야 한다.
          L=$(TZ=Asia/Seoul date '+%H:%M')
          python3 scripts/probe_journal_kis.py --label "$L"

      - name: 커밋
        if: always()
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/journal/kis-timing.json 2>/dev/null || true
          if git diff --staged --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "KIS 수급 시각 재기 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          BR="${GITHUB_REF_NAME}"
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:$BR"; then echo "밀어 넣음 (시도 $i)"; exit 0; fi
            # 되받기가 아니라 합치기로 받는다 — market-journal.yml 에 적은 까닭과
            # 같다. 되받기는 앞선 **병합 커밋**을 다시 펴다가 충돌을 낸다.
            git pull --no-rebase --no-edit origin "$BR" || { git merge --abort || true; \
              echo "::error::합치기 충돌"; exit 1; }
            sleep $((i * 5))
          done
          echo "::error::다섯 번 밀어 봤지만 모두 거절됐습니다"
          exit 1

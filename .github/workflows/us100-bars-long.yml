name: 미국 일봉 긴 판 수집 (백테스트용)

# 매매 타이밍 백테스트가 읽는 **8해치** 일봉을 받는다.
#
# 화면이 읽는 `data/us100/chart/` 는 2해치(`range=2y`)다. 그것으로 앞뒤를 나누면
# 검증구간이 아홉 달 반밖에 안 되고, 겪은 장세가 하나다. 실제로 미국주식만
# 검증구간 초과수익이 음수(-0.64%p · 472 거래)로 나와 판에 「보류」가 붙었다.
# 다른 네 시장은 모두 양수다.
#
# **화면용 2해치를 늘리지 않는다.** 화면은 그것을 쓰지도 않는데 날마다 열 배를
# 지고 다닐 이유가 없다. 백테스트만 읽는 긴 판을 따로 두고 주 1 회 받는다.
#
# 같은 데이터 브랜치(us100-data)의 `bars8y/` 에 올린다. 날마다 도는 수집이
# 이것을 지우지 않도록 publish_us100_data.sh 의 KEEP_FILES 에 넣어 두었다.

on:
  schedule:
    # 토요일 아침(KST) — 미국 장이 쉬는 날이라 마지막 봉이 금요일로 굳어 있다.
    - cron: '0 22 * * 5'          # 금 22:00 UTC = 토 07:00 KST

  workflow_dispatch:
    inputs:
      years:
        description: '몇 해치 (비우면 지금 파일과 같은 해치)'
        required: false
        default: ''
      allow_shrink:
        description: '예전보다 짧게 와도 쓴다 (이력이 줄어든다)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: us100-bars-long
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 100 종목에 한 번씩만 두드리므로 평소 3~4 분이면 끝난다. 야후가 느린 날을
    # 견디게 넉넉히 둔다 — 끝나는 즉시 잡이 끝나므로 평소 비용은 그대로다.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 지금 있는 긴 판을 먼저 깐다
        # **받기 전에 깔아야 한다.** 수집기는 예전 판과 견주어 「미끄러진 것」과
        # 「잘린 것」을 가르는데, 견줄 것이 없으면 무엇이 와도 그대로 쓴다.
        run: |
          if git fetch --quiet origin '+refs/heads/us100-data:refs/remotes/origin/us100-data' 2>/dev/null; then
            mkdir -p data/us100
            git archive origin/us100-data 2>/dev/null \
              | tar -x -C /tmp --wildcards 'data/us100/bars8y/*' 2>/dev/null || true
            if [ -d /tmp/data/us100/bars8y ]; then
              cp -a /tmp/data/us100/bars8y data/us100/
              echo "지금 있는 것: $(ls data/us100/bars8y | wc -l) 개 파일"
              python3 -c "import json;d=json.load(open('data/us100/bars8y/_meta.json',encoding='utf-8'));print('받은때 %s · %d해치 · %d 봉 · %s ~ %s'%(d['generated_at_kst'],d['years_requested'],d['bars'],d['from'],d['to']))" || true
            else
              echo '처음 받는 판이다 — 견줄 예전 것이 없다'
            fi
          else
            echo 'us100-data 가지가 아직 없다'
          fi

      - name: 8해치 일봉 받기
        # --years 를 비우면 0 이 되고, 0 은 「지금 파일과 같은 해치」다. 숫자를
        # 기본값으로 박아 두면 단추를 그냥 누른 사람이 이력을 줄인다 — ETF 에서
        # 실제로 그렇게 79,575 봉이 45,383 봉이 됐다.
        run: |
          python3 scripts/fetch_us_bars_long.py \
            --years "${{ github.event.inputs.years || '0' }}" \
            ${{ github.event.inputs.allow_shrink == 'true' && '--allow-shrink' || '' }}

      - name: 받은 것을 검산한다
        run: |
          python3 - <<'PY' | tee /tmp/us-bars.txt
          import json, os, sys
          D = 'data/us100/bars8y'
          m = json.load(open(os.path.join(D, '_meta.json'), encoding='utf-8'))
          bad = []
          n = 0
          for name in sorted(os.listdir(D)):
              if name.startswith('_') or not name.endswith('.json'):
                  continue
              d = json.load(open(os.path.join(D, name), encoding='utf-8'))
              s = d['daily']
              n += 1
              # 날짜가 오름차순인가 — 뒤섞이면 지표가 통째로 엉뚱해진다
              if s['d'] != sorted(s['d']):
                  bad.append('%s 날짜가 오름차순이 아님' % name)
              if len(set(s['d'])) != len(s['d']):
                  bad.append('%s 같은 날이 두 번' % name)
              for k in ('o', 'h', 'l', 'c', 'v'):
                  if len(s[k]) != len(s['d']):
                      bad.append('%s %s 길이가 날짜와 다름' % (name, k))
              for i, c in enumerate(s['c']):
                  if c is None or c <= 0 or s['h'][i] < s['l'][i]:
                      bad.append('%s %s 봉이 이상함' % (name, s['d'][i]))
                      break
          print('종목 %d · 봉 %d · %s ~ %s · %d해치'
                % (n, m['bars'], m['from'], m['to'], m['years_requested']))
          print('온전히 받음 %d · 못 받음 %d · 짧음 %d · 미끄러짐 %d · 잘림 %d'
                % (m['coverage']['got'], m['coverage']['failed'], m['coverage']['short'],
                   m['coverage']['slid'], m['coverage']['shrank']))
          if bad:
              print('\n어긋난 자리 %d 곳' % len(bad))
              for b in bad[:10]:
                  print('  !! ' + b)
              sys.exit(1)
          print('\n봉의 모양 — 어긋남 없음')
          PY

      - name: 데이터 브랜치에 올리기
        # PUBLISH_FILES 에 bars8y 만 넣는다 — 이번 실행이 만든 것은 그것뿐이고,
        # 나머지(chart·latest.json·quotes.json)는 브랜치에 있는 것이 그대로 남는다.
        env:
          COMMIT_LABEL: 긴일봉
          PUBLISH_FILES: bars8y
        run: bash scripts/publish_us100_data.sh

      - name: 요약
        if: always()
        continue-on-error: true
        run: |
          {
            echo '### 미국 일봉 긴 판'
            echo '```'
            cat /tmp/us-bars.txt 2>/dev/null || echo '(검산이 돌지 못했습니다)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

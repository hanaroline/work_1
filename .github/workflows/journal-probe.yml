name: 시장일지 원천 관찰

# 시장일지는 지수가 아니라 **종목 순위**가 본문이다 — 기관·외국인 매수상위,
# 거래대금 상위, 거래량 급증, 신고가, ETF 순위. 그 값을 주는 주소를
# 짐작하지 않고 눈으로 본 뒤에 수집기를 붙인다.
# (내력은 scripts/probe_limit_xhr.mjs 머리말 — 주소를 다섯 바퀴 찍어서
#  맞히려다 전부 빗나간 적이 있다.)
#
# 손으로 발동하거나, data/journal/PROBE 를 건드려 밀어 넣으면 돈다.
# 세션에는 Actions 쓰기 권한이 없어 workflow_dispatch 를 API 로 부르지
# 못하지만 git push 는 된다 — 시세 수집과 같은 방식이다.

on:
  push:
    paths:
      - 'data/journal/PROBE'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: journal-probe-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 평문 요청이 먼저다 — 이것으로 풀리면 브라우저를 띄울 이유가 없다.
      - name: 후보 주소 확인 (브라우저 없이)
        continue-on-error: true
        run: python3 scripts/probe_journal_api.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 브라우저 준비
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium

      - name: 순위 화면이 부르는 주소 관찰
        continue-on-error: true
        run: node scripts/probe_journal_xhr.mjs

      # 1차에서 남은 자리(기관·외국인 종목별 순매수)를 마저 본다.
      - name: 종목별 수급 화면 관찰 (2차)
        continue-on-error: true
        run: node scripts/probe_journal_xhr2.mjs

      - name: 커밋
        if: always()
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/journal/raw || true
          if git diff --staged --quiet; then
            echo "남긴 것 없음"
            exit 0
          fi
          git commit -m "시장일지 원천 관찰 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          # 관찰 기록은 「이번에 본 것」이라 두 판을 섞을 일이 없다.
          # 늦게 본 쪽이 맞으므로 남의 것 위에 우리 것을 그대로 얹는다.
          BR="${GITHUB_REF_NAME}"
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:$BR"; then echo "밀어 넣음 (시도 $i)"; exit 0; fi
            git fetch origin "$BR" || exit 1
            git reset --soft "origin/$BR"
            git add -A data/journal/raw || true
            if git diff --staged --quiet; then
              echo "먼저 올라온 것과 같다 — 남길 것 없음"
              exit 0
            fi
            git commit -m "시장일지 원천 관찰 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            sleep $((i * 5))
          done
          echo "::error::다섯 번 밀어 봤지만 모두 거절됐습니다"
          exit 1

name: probe pe fill (temporary)
on:
  push:
    branches: [claude/value-leaders-map]
    paths: [scripts/probe_pe_fill.py, .github/workflows/probe-pe-fill.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 scripts/probe_pe_fill.py

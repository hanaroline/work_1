name: 국내 ETF 장기 일봉 수집 (한국투자증권)

# 기대수익률의 「장기 실적」 방식이 자료가 모자라 반쪽이었다.
#
# proposal_cma.py 는 자산군별 기대수익률을 두 길로 낸다 — ①빌딩블록과 ②장기 실적.
# 그런데 ②가 쓰는 원화 프록시(data/etf/prices.json)에 **해외채권과 대체는 5 해를
# 채우는 종목이 아예 없어** 여섯 군 가운데 둘을 비워 둘 수밖에 없었다.
#
# 달러 표시 ETF 로 메우면 그 값은 환율이 빠진 달러 투자자의 수익률이지 한국
# 고객의 수익률이 아니다. 그래서 국내 상장(원화) ETF 를 KIS 로 직접 받는다.
#
# 클로드 세션에서는 KIS 에 못 붙는다 — 9443·29443 은 이그레스 프록시가 비-443
# 포트를 지원하지 않고, 443 은 CONNECT 403 이다. 그래서 러너 몫이다.
#
# 종목은 손으로 적지 않는다. 유니버스가 이미 검증해 둔 코드에서 **노출 군마다
# 규모 순**으로 고른다(scripts/fetch_kr_etf_kis.py 의 candidates). 손으로 적으면
# 코드를 틀리기 쉽고 — 해외 ETF 때 거래소를 틀려 국채 세 종이 빈 응답으로
# 조용히 빠진 적이 있다 — 유니버스가 바뀌어도 안 따라온다.
#
# **필요한 Secrets** — KIS_APP_KEY / KIS_APP_SECRET

on:
  workflow_dispatch:
    inputs:
      years:
        description: '몇 해치 (기본 10)'
        required: false
        default: '10'
      per_class:
        description: '노출 군마다 몇 종목 (기본 6)'
        required: false
        default: '6'
      env:
        description: '어느 앱키로 (vps=모의, prod=실전)'
        required: false
        default: 'vps'
        type: choice
        options: ['vps', 'prod']

permissions:
  contents: write

concurrency:
  group: kr-etf-kis-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 종목당 10 해면 호출이 스무 번쯤이고, 모의투자는 초당 한 건으로 제한된다.
    # 30 종 × 20 번 × 1.1 초 ≈ 11 분. 넉넉히 준다.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 앱키가 들어 있는지 먼저 본다
        run: |
          if [ -z "${{ secrets.KIS_APP_KEY }}" ] || [ -z "${{ secrets.KIS_APP_SECRET }}" ]; then
            echo "::error::KIS_APP_KEY / KIS_APP_SECRET 이 저장소 Secrets 에 없습니다."
            exit 1
          fi

      # 후보를 유니버스에서 고르므로 유니버스가 먼저 있어야 한다.
      - name: 상품 유니버스 먼저 모으기
        run: |
          git fetch origin us100-data kr100-data claude/fund-search-tool --depth 1
          python3 scripts/build_proposal_universe.py

      - name: 국내 ETF 장기 일봉 받기
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_TOKEN_CACHE: ${{ runner.temp }}/kis-token.json
        run: |
          python3 scripts/fetch_kr_etf_kis.py \
            --env "${{ inputs.env || 'vps' }}" \
            --years "${{ inputs.years || '10' }}" \
            --per-class "${{ inputs.per_class || '6' }}"

      # 받은 일봉으로 기대수익률을 다시 낸다. 자료만 커밋해 두면 cma.json 이
      # 옛날 「원화 프록시 없음」을 그대로 들고 있어 아무것도 안 달라진다.
      - name: 기대수익률 다시 셈하기
        run: python3 scripts/proposal_cma.py --save

      - name: 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/proposal || true
          if git diff --cached --quiet; then
            echo "바뀐 것이 없다 — 커밋 생략"
            exit 0
          fi
          git commit -m "data(proposal): 국내 ETF 장기 일봉 수집 ($(date -u +%Y-%m-%d\ %H:%M))"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push 거절 — 원격 변경을 받아 재시도 ($i/5)"
            git pull --rebase origin "${{ github.ref_name }}" || exit 1
          done
          exit 1

      # 요약은 수집기가 data/proposal/kr_etf_report.md 로 적어 둔다.
      # 여기서 파이썬 heredoc 을 쓰면 YAML 들여쓰기가 깨진다.
      - name: 요약
        if: always()
        run: |
          {
            echo "### 국내 ETF 장기 일봉 수집"
            echo ""
            if [ -f data/proposal/kr_etf_report.md ]; then
              cat data/proposal/kr_etf_report.md
            else
              echo "산출물이 없습니다 — 수집 단계 로그를 보세요."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

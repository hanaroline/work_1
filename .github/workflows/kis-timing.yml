name: 매매 타이밍 갱신 (전략빌더 10종)

# 한국투자증권 전략빌더 기본 전략 10종으로 오늘의 매수·청산·관찰 자리를 다시
# 내어 data/kis_timing/latest.json 에 커밋한다.
#
# **시세 수집 뒤에 돌아야 한다.** 먹는 것은 네 갈래다.
#   국내주식 ← data/prices_naver/kr100.json  (「국내 일봉 네이버 판 수집」이 채운다)
#   미국주식 ← us100-data 가지               (「미국 100대 기업 시세 수집」이 채운다)
#   국내ETF  ← data/etf/prices.json          (「자산배분 ETF 신호」가 채운다)
#   해외ETF  ← 같은 파일
#
# **ETF 봉은 예약으로 자라지 않는다.** 「자산배분 ETF 신호」에는 예약이 없고 단추로만
# 돈다(그 파일 주석의 결정이다). 그래서 ETF 쪽 신호는 마지막으로 그 단추를 누른
# 날의 봉으로 난다. 그것이 흠으로 보이지 않도록 산출물이 종목마다 asof 를 적고,
# 시장 거래일보다 사흘 넘게 뒤처지면 stale 로 표시한다 — 화면이 그대로 보여 준다.
#
# **백테스트는 여기서 돌리지 않는다.** signals-backtest.yml 이 세워 둔 규율을 그대로
# 따른다 — 성적이 날마다 조용히 바뀌면, 어제 「+3.85%p」를 보고 판단한 사람과 오늘
# 「+3.11%p」를 보는 사람이 서로 다른 자료를 쓰게 된다. 게다가 합의에 넣을 전략을
# 고르는 것도 그 성적이라, 성적이 흔들리면 **멤버가 날마다 바뀐다.** 전략을 고치거나
# 비용 가정을 바꿨을 때만 손으로 돌린다(kis-timing-backtest.yml).

on:
  schedule:
    # 22:00 KST = 13:00 UTC 평일 — 국내 일봉의 마지막 수집(21:40 KST)보다 뒤.
    - cron: '0 13 * * 1-5'
    # 08:00 KST = 23:00 UTC — 미국 장 마감 수집(21:30·22:30 UTC)보다 뒤.
    #   화~토(UTC)로 두는 것은 미국 장이 월~금에 서기 때문이다.
    - cron: '0 23 * * 2-6'

  # **시세가 들어오면 곧바로 따라 돈다.**
  #
  # 아래 push 방아쇠에 자료 파일을 적어 두어도 연결되지 않는다 — GITHUB_TOKEN 이
  # 만든 커밋은 다른 워크플로를 부르지 않기 때문이다(재귀 실행을 막으려는 깃허브
  # 규칙. signals.yml·fund-weekly.yml 주석에도 같은 말이 있다). workflow_run 은
  # 앞 워크플로가 **끝났다는 사실**에 걸리는 것이라 그 규칙에 걸리지 않는다.
  workflow_run:
    workflows:
      - 국내 일봉 네이버 판 수집
      - 미국 100대 기업 시세 수집
      - 자산배분 ETF 신호
      - 해외 ETF 곁 목록 수집 (매매 타이밍)
    types: [completed]
    branches: [main]

  push:
    branches: [main]
    paths:
      - 'scripts/kis_strategy_lib.py'
      - 'scripts/kis_timing_data.py'
      - 'scripts/build_kis_timing.py'
      - 'data/kis_timing/backtest.json'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kis-timing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # workflow_run 은 앞 워크플로가 **실패했을 때도** 발동한다(types: [completed]).
    # 시세 수집이 넘어졌는데 세팅을 새로 내면 낡은 봉으로 셈한 판을 「방금 갱신함」
    # 으로 덮어쓰게 된다. 성공했을 때만 잇는다. 예약·수동 실행은 그대로 돈다.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 미국 주식 일봉은 기본 가지에 없다. actions/checkout 이 만드는 작업본은
      # 원격 refspec 이 main 하나뿐이라, refspec 을 손으로 적지 않으면
      # origin/us100-data 원격추적이 서지 않는다 — 수집 대본이
      # `git show origin/us100-data:...` 로 읽으므로 거기서 죽는다.
      - name: 미국 주식 일봉 가지 받기
        run: |
          for i in 1 2 3 4; do
            if git fetch --depth 1 origin \
                 '+refs/heads/us100-data:refs/remotes/origin/us100-data'; then
              git rev-parse --verify origin/us100-data >/dev/null
              echo "받음 (시도 $i)"; exit 0
            fi
            echo "실패 — 다시 시도한다 ($i/4)"; sleep $((i * i * 2))
          done
          echo "::error::us100-data 가지를 받지 못했습니다"
          exit 1

      # 성적표가 없으면 합의 멤버를 고를 수 없다. 조용히 빈 판을 내는 대신 멈춘다.
      - name: 성적표가 있는가
        run: |
          if [ ! -f data/kis_timing/backtest.json ]; then
            echo "::error::data/kis_timing/backtest.json 이 없습니다 — 먼저 「매매 타이밍 백테스트」를 돌리십시오"
            exit 1
          fi

      - name: 오늘의 세팅 셈하기
        run: python3 scripts/build_kis_timing.py

      # **검산이 산출물을 막는다.** 어긋난 수가 실린 판을 커밋하지 않는다.
      - name: 재검산
        run: |
          python3 scripts/verify_kis_timing.py | tee /tmp/verify-kis.txt
          code=${PIPESTATUS[0]}
          {
            echo '### 전략빌더 10종 재검산'
            echo '```'
            cat /tmp/verify-kis.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: 커밋
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/kis_timing
          if git diff --staged --quiet; then
            echo "변경 없음 — 봉이 그대로라 세팅도 그대로입니다"
            exit 0
          fi
          git commit -m "매매 타이밍 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"

          for i in 1 2 3 4 5; do
            if git push; then
              echo "밀어 넣음 (시도 $i)"; exit 0
            fi
            echo "거절됨 — 되받아 다시 시도한다 ($i/5)"
            if ! git pull --rebase --no-edit origin main; then
              git rebase --abort || true
              echo "::error::되받기 충돌 — 손으로 확인하십시오"
              exit 1
            fi
            sleep $((i * 5))
          done
          echo "::error::다섯 번 밀어 봤지만 모두 거절됐습니다"
          exit 1

      - name: 요약
        if: always()
        run: |
          if [ -f data/kis_timing/latest.json ]; then
            python3 - <<'PY'
          import json
          d = json.load(open('data/kis_timing/latest.json', encoding='utf-8'))
          k = d['rule']['k']
          for mk, m in d['markets'].items():
              buy, sell = len(m['buy']), len(m['sell'])
              names = ', '.join(p['name'] for p in m['buy'][:4]) or '없음'
              print("::notice::%s (%s 기준) — 합의 매수 %d [%s] · 합의 청산 %d · 관찰 %d"
                    % (m['label'], m['asof'], buy, names, sell, len(m['watch_buy'])))
              if not m['members']:
                  print("::warning::%s — 검증을 통과한 전략이 없어 합의를 내지 못합니다"
                        % m['label'])
              if m['stale']:
                  print("::warning::%s — 일봉이 뒤처진 종목 %d 종 (%s)"
                        % (m['label'], len(m['stale']),
                           ', '.join('%s %s' % (s['name'], s['asof']) for s in m['stale'][:4])))
          print("::notice::합의 문턱 K=%d · 손절 %s%%" % (k, d['rule']['stop_loss_pct']))
          PY
          fi

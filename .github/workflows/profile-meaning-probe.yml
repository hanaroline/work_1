name: 투자자성향 설명문 탐색

# 「성향의 의미」 는 미스터리쇼핑 배점 항목인데(성향명만 말하면 미인정) 담당자가 준
# 위험도 분류표에는 등급 대응만 있고 설명문이 없다. 회사 홈페이지에 있는지 러너에서
# 찾아본다 — 업무용PC 와 이 세션에서는 securities.miraeasset.com 이 막혀 있다.

# 결론(2026-09-07) — 공개 화면에는 유형별 설명문이 없다. 위험도 분류표와
# 투자권유시행세칙에 다섯 유형 이름은 있으나 등급 대응과 분류 근거뿐이고,
# 확인서 화면은 로그인 앞에서 막힌다. 설명문은 사내 전산의
# 「투자자성향 결과별 안내사항」 화면에 있고, 담당자에게 받아 넣었다.
# 회사가 문구를 고쳤는지 되짚을 때만 손으로 돌린다.
#
# push 트리거는 등록 전 dispatch 가 404 로 거절될 때 쓰려고 뒀던 것이라 뗀다.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 탐색
        run: node scripts/probe_profile_meaning.mjs

name: 배포본 재빌드 (단일 파일)

# 창구가 여는 것은 sales-script-expl-standalone.html **한 파일**이다.
# 데이터(data/*.js)가 아무리 새것이어도 이 파일을 다시 만들지 않으면 갱신은
# 창구에 닿지 않는다. 그 마지막 한 칸이 여기다.
#
# 왜 수집 워크플로마다 넣지 않나
#   다섯이 저마다 8MB 짜리 산출물을 만들어 같은 브랜치에 밀면 리베이스가 부딪힌다.
#   데이터가 다 갱신된 뒤 하루 한 번, 한 곳에서만 만든다.

on:
  workflow_dispatch:
  # 월요일 일괄 갱신(weekly-refresh.yml)의 마지막 단계로도 불린다
  workflow_call:
  schedule:
    # 매일 10:30 KST (01:30 UTC) — 그날 마지막 수집인 펀드 설명서 판독(10:10) 뒤.
    # 먼저 돌면 어제 데이터로 만든 파일을 올리게 된다.
    - cron: '30 1 * * *'

permissions:
  contents: write

concurrency:
  group: build-standalone-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 껍데기는 sales-script.html 한 벌만 고치는 규칙이다. 누가 전용판을
      # 직접 손대 두 벌이 어긋났으면 여기서 원래대로 돌아온다.
      - name: 전용판 화면 다시 만들기
        run: node scripts/make_expl_source.mjs

      - name: 배포본 빌드
        run: node scripts/build_sales_script.mjs sales-script-expl-standalone.html --src sales-script-expl.html

      # 데이터가 통째로 들어가는 파일이다. 빈 파일이나 반쪽짜리를 커밋하면
      # 창구가 아침에 빈 화면을 연다 — 크기와 내용으로 먼저 걸러 낸다.
      - name: 산출물 점검
        run: |
          f=sales-script-expl-standalone.html
          sz=$(wc -c < "$f")
          echo "크기: $((sz / 1024 / 1024)) MB ($sz 바이트)"
          if [ "$sz" -lt 3000000 ]; then
            echo "::error::배포본이 $sz 바이트뿐입니다 — 데이터가 빠졌습니다. 커밋하지 않습니다."
            exit 1
          fi
          for k in FUND_CATALOG ELS_DATA FUND_PROSPECTUS; do
            grep -q "$k" "$f" || { echo "::error::$k 가 안 들어갔습니다"; exit 1; }
          done

      - name: 결과 커밋
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A sales-script-expl.html sales-script-expl-standalone.html
          if [ -z "$(git diff --cached --name-only)" ]; then
            echo '변경 없음 — 데이터가 그대로라 배포본도 그대로입니다'; exit 0
          fi
          git commit -m "chore(script): 갱신된 데이터로 배포본 재빌드 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push 거절 — 원격 변경을 받아 재시도 ($i/5)"
            git pull --rebase --autostash origin "${{ github.ref_name }}" || exit 1
          done
          echo '5회 시도 후에도 push 실패'; exit 1

      - name: 담긴 값 적기
        if: always()
        run: |
          {
            echo "### 배포본에 담긴 값"
            echo ""
            node -e '
              const g = {};
              const load = (p) => new Function("window", require("fs").readFileSync(p, "utf8"))(g);
              load("data/els.js"); load("data/fund-catalog.js"); load("data/fund-prospectus.js");
              console.log("- ELS·DLS 상품 " + g.ELS_DATA.products.length + "건 (기준 " + (g.ELS_DATA.updatedAt || "?") + ")");
              console.log("- 펀드 " + g.FUND_CATALOG.items.length + "건 (기준 " + (g.FUND_CATALOG.updatedAt || "?") + ")");
              console.log("- 펀드 설명서 판독 " + Object.keys(g.FUND_PROSPECTUS.items).length + "건");
            ' || echo '- (건수 집계 실패)'
          } >> "$GITHUB_STEP_SUMMARY"

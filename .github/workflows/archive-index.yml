name: 자료실 목록 갱신

# 자료실 목록은 자료실.html 안에 박혀 있다. 브라우저가 로컬 폴더를 읽지 못해
# 그렇게 만들었는데, 그 대가로 자료가 늘어도 목록은 그대로다.
# 브리핑·시세는 매일 자동으로 쌓이므로 사람이 갱신을 기억해야 하는 구조는
# 반드시 낡는다. 그래서 자료가 바뀌면 여기서 목록을 다시 만든다.

on:
  push:
    branches: [main]
    paths:
      - 'docs/briefings/**'
      - 'data/market/**'
      - 'data/*.js'
      - 'scripts/**'
      - 'index.html'
      - 'standalone.html'
      - 'README.md'
      - 'docs/briefing-playbook.md'
      - '부서자료실/분류.json'
      - '부서자료실/README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-index
  cancel-in-progress: false

jobs:
  reindex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 목록 갱신
        working-directory: 부서자료실
        run: python _목록갱신.py

      - name: 링크 검증
        working-directory: 부서자료실
        # 끊긴 링크가 있으면 커밋하지 않고 실패시킨다.
        run: |
          python - <<'PY'
          import json, os, re, sys
          from urllib.parse import unquote

          html = open('자료실.html', encoding='utf-8').read()
          m = re.search(r'window\.ARCHIVE = (\{.*?\});\n/\* ARCHIVE:END', html, re.S)
          if not m:
              sys.exit('ARCHIVE 블록을 찾지 못했습니다')

          data = json.loads(m.group(1))
          bad = [f['path']
                 for c in data['categories']
                 for f in c['files']
                 if not os.path.isfile(unquote(f['path']))]
          total = sum(len(c['files']) for c in data['categories'])

          for p in bad:
              print(f'::error::끊긴 링크 — {unquote(p)}')
          if bad:
              sys.exit(1)
          print(f'::notice::자료 {total}건, 끊긴 링크 없음')
          PY

      - name: 커밋
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add 부서자료실/자료실.html
          if git diff --staged --quiet; then
            echo "목록 변경 없음"
          else
            # 트리거 경로에 자료실.html 이 없으므로 이 커밋은 자신을 다시 부르지 않는다.
            git commit -m "자료실 목록 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            git push
          fi

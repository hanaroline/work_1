name: 채권 원천 탐색 (조사)

# 채권은 펀드·ELS 와 달리 수집 원천이 없어, 민평금리·민평단가·발행회사 재무정보를
# 창구에서 종목마다 손으로 넣어야 한다. 자동으로 끌어올 길이 있는지 먼저 확인한다.
# 개발 PC 는 외부 접속이 막혀 있어 러너에서 두드려 보고 로그로 결과를 본다.
# 저장소에 아무것도 쓰지 않는다.

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/complete-sales-script-**'
    paths:
      - 'scripts/probe_bond_sources.mjs'
      - 'scripts/probe_bond_pages.mjs'
      - 'scripts/probe_bond_menu.mjs'
      - 'scripts/probe_bond_list.mjs'
      - '.github/workflows/bond-probe.yml'

permissions:
  contents: read

concurrency:
  group: bond-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 1·2차 탐색(probe_bond_sources · probe_bond_pages)은 결과를 얻었다.
      # 필요할 때 손으로 돌린다 — 매번 다시 두드릴 이유가 없다.

      # frameset·WebSquare 화면은 주소를 짐작할 수 없다 — 브라우저로 열고
      # 화면이 스스로 부르는 요청을 적어 둔다. 그것이 곧 데이터 주소다.
      - name: Playwright 설치
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      # 3차에서 메뉴가 실제 주소를 알려 주었다 —
      #   장외채권 /hks/hks4036/r01.do · 외화채권 /hks/hks4054/v03.do
      #   채권금리 /hkr/hkr1003/n12.do  (모두 로그인 불필요)
      - name: 채권 화면 열어 목록·설명서 잡기
        run: node scripts/probe_bond_list.mjs

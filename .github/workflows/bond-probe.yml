name: 채권 원천 탐색 (조사)

# 채권은 펀드·ELS 와 달리 수집 원천이 없어, 민평금리·민평단가·발행회사 재무정보를
# 창구에서 종목마다 손으로 넣어야 한다. 자동으로 끌어올 길이 있는지 먼저 확인한다.
# 개발 PC 는 외부 접속이 막혀 있어 러너에서 두드려 보고 로그로 결과를 본다.
# 저장소에 아무것도 쓰지 않는다.

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/complete-sales-script-**'
    paths:
      - 'scripts/probe_bond_sources.mjs'
      - 'scripts/probe_bond_pages.mjs'
      - 'scripts/probe_bond_menu.mjs'
      - 'scripts/probe_bond_list.mjs'
      - 'scripts/probe_bond_html.mjs'
      - 'scripts/probe_bond_docs.mjs'
      - 'scripts/probe_bond_docs.py'
      - '.github/workflows/bond-probe.yml'

permissions:
  contents: read

concurrency:
  group: bond-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 1·2차 탐색(probe_bond_sources · probe_bond_pages)은 결과를 얻었다.
      # 필요할 때 손으로 돌린다 — 매번 다시 두드릴 이유가 없다.

      # 4차에서 확인했다 — 장외채권 화면은 서버가 표를 그려 내려주므로
      # 브라우저가 필요 없다. 표 구조와 설명서 게시판만 보면 수집기를 쓸 수 있다.
      # (앞선 탐색 스크립트들은 필요할 때 손으로 돌린다)
      # 6차까지 종목값(발행일·만기일·위험등급·매매단가·세후수익률)은 받았다.
      # 남은 것은 설명서 문구 — 위험등급의 의미·신용등급의 정의·매매수수료·중도매도.
      # 종목마다 다르지 않으므로 설명서를 한 번 찾아 두면 전 종목이 채워진다.
      # pdf.js 는 이 설명서 PDF 들의 글자표를 못 푼다 (6쪽에서 15자).
      # pymupdf 는 같은 파일에서 9,145자를 읽는다 — 그래서 파이썬으로 읽는다.
      - name: PDF 판독기 설치
        run: pip install --quiet pymupdf

      - name: 설명서 PDF 를 읽어 무슨 문서인지 가려내기
        run: python3 scripts/probe_bond_docs.py

name: 해외 반도체 소부장 시세 정찰 (임시)
on:
  push:
    branches: [claude/semi-global]
    paths: [scripts/probe_semi_global.py, .github/workflows/semi-global-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/probe_semi_global.py

name: ETF 원천 탐색 (조사)

# 브리핑 세션은 이그레스 정책 때문에 KRX·네이버·야후에 직접 못 붙는다
# (CONNECT 403). 러너는 그 정책 밖이므로 여기서 대신 찔러 보고 결과를
# 저장소에 커밋한다. 수집기는 이 결과를 보고 쓴다.
#
# 수집기를 고치는 동안 반복해서 돌게 되므로 push 로도 발동시킨다.
# (세션 토큰에는 Actions 쓰기 권한이 없어 workflow_dispatch 를 API 로
#  부르지 못한다. 대신 파일을 푸시하면 여기가 돈다.)

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/etf-**'
    paths:
      - 'scripts/probe_etf_sources*.mjs'
      - 'scripts/probe_etf_dividends.mjs'
      - 'scripts/verify_etf_price_series.mjs'
      - '.github/workflows/etf-probe.yml'

permissions:
  contents: write

concurrency:
  group: etf-probe-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 탐색 실패는 잡을 실패시키지 않는다. 못 붙은 칸도 결과의 일부다.
      - name: 탐색 실행 (1차)
        continue-on-error: true
        run: node scripts/probe_etf_sources.mjs

      - name: 탐색 실행 (2차 — 1차에서 남은 구멍)
        continue-on-error: true
        if: hashFiles('scripts/probe_etf_sources2.mjs') != ''
        run: node scripts/probe_etf_sources2.mjs

      # 분배금 이력 원천 찾기. 네이버 화면이 실제로 무엇을 부르는지 보려면
      # 브라우저가 있어야 한다 — 경로를 찍어 맞히는 것보다 확실하다.
      - name: 브라우저 설치 (화면 관찰용)
        if: hashFiles('scripts/probe_etf_dividends.mjs') != ''
        run: |
          npm i -D playwright@1.56.1 --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: 탐색 실행 (분배금 이력)
        continue-on-error: true
        if: hashFiles('scripts/probe_etf_dividends.mjs') != ''
        run: node scripts/probe_etf_dividends.mjs

      # 야후 시장가와 네이버 시장가가 왜 다른지 — 숫자가 아니라 원가격을 받아
      # 되짚는다. 화면 값을 고치지 않고 판정만 한다.
      - name: 되짚기 실행 (시장가 계열)
        continue-on-error: true
        if: hashFiles('scripts/verify_etf_price_series.mjs') != ''
        run: node scripts/verify_etf_price_series.mjs

      - name: 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etf-probe
          path: |
            tools/discovery/etf_probe*
            tools/discovery/etf_dividend_probe.*
            tools/discovery/etf_price_series.*
            tools/discovery/naver_etf_analysis.json
          retention-days: 7

      - name: 결과 커밋
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f tools/discovery/etf_probe.json ] || [ -f tools/discovery/etf_dividend_probe.json ]; then
            git add tools/discovery/etf_probe* || true
            git add tools/discovery/etf_dividend_probe.* 2>/dev/null || true
            git add tools/discovery/etf_price_series.* 2>/dev/null || true
            git add tools/discovery/naver_etf_analysis.json 2>/dev/null || true
            git commit -m "chore(etf): 원천 탐색 결과 갱신" || echo "변경 없음"
            git push || echo "푸시 실패 (무시)"
          fi

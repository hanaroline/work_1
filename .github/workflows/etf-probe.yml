name: ETF 원천 탐색 (조사)

# 브리핑 세션은 이그레스 정책 때문에 KRX·네이버·야후에 직접 못 붙는다
# (CONNECT 403). 러너는 그 정책 밖이므로 여기서 대신 찔러 보고 결과를
# 저장소에 커밋한다. 수집기는 이 결과를 보고 쓴다.
#
# 수집기를 고치는 동안 반복해서 돌게 되므로 push 로도 발동시킨다.
# (세션 토큰에는 Actions 쓰기 권한이 없어 workflow_dispatch 를 API 로
#  부르지 못한다. 대신 파일을 푸시하면 여기가 돈다.)

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/etf-**'
    paths:
      - 'scripts/probe_etf_sources*.mjs'
      - 'scripts/probe_etf_dividends.mjs'
      - 'scripts/verify_etf_price_series.mjs'
      - 'scripts/verify_etf_audit.mjs'
      - 'scripts/probe_fund_sources*.mjs'
      - 'scripts/probe_fund_naver*.mjs'
      - '.github/workflows/etf-probe.yml'

permissions:
  contents: write

concurrency:
  group: etf-probe-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 탐색은 막힌 곳을 일부러 찌르는 일이라 응답이 영영 안 오기도 한다.
      # 한 단계가 매달리면 뒤의 단계가 통째로 못 돈다 — 실제로 2차 탐색이
      # 13분 넘게 멈춰 그 뒤의 되짚기가 시작조차 못 했다. 그래서 단계마다
      # 시간을 끊고, **지금 답이 필요한 것을 앞에 둔다.**

      # 감사에서 나온 의심을 원자료로 되짚는다. 지금 답이 필요한 것이라 맨 앞에
      # 둔다 — 총수익률이 +1837% 로 찍힌 원인과, 그게 몇 종목에 퍼졌는지.
      - name: 되짚기 실행 (감사 — 분배·분할·기준)
        continue-on-error: true
        timeout-minutes: 25
        if: hashFiles('scripts/verify_etf_audit.mjs') != ''
        run: node scripts/verify_etf_audit.mjs

      # 야후 시장가와 네이버 시장가가 왜 다른지 — 숫자가 아니라 원가격을 받아
      # 되짚는다. 화면 값을 고치지 않고 판정만 한다.
      - name: 되짚기 실행 (시장가 계열)
        continue-on-error: true
        timeout-minutes: 8
        if: hashFiles('scripts/verify_etf_price_series.mjs') != ''
        run: node scripts/verify_etf_price_series.mjs

      - name: 브라우저 설치
        continue-on-error: true
        timeout-minutes: 6
        run: |
          npm i -D playwright@1.56.1 --no-audit --no-fund
          npx playwright install --with-deps chromium

      # 펀드 원천 — 네이버가 stock.naver.com 으로 옮겨간 것을 확인한 뒤로는
      # 이쪽 하나만 본다. 앞서 금투협을 여섯 차례 판 것은 "네이버 펀드가
      # 없어졌다" 는 오판에서 나왔고, 그 결과는 tools/discovery/fund_probe*.md
      # 에 남아 있다. 다시 돌릴 이유가 없으므로 워크플로에서 뺀다.
      - name: 탐색 실행 (펀드 원천 — 네이버)
        continue-on-error: true
        timeout-minutes: 14
        if: hashFiles('scripts/probe_fund_sources7.mjs') != ''
        run: node scripts/probe_fund_sources7.mjs

      # 남은 두 가지 — 목록을 어디서 받나, 보유종목이 채워지는 펀드가 있나.
      - name: 탐색 실행 (네이버 펀드 목록·보유종목)
        continue-on-error: true
        timeout-minutes: 14
        if: hashFiles('scripts/probe_fund_naver.mjs') != ''
        run: node scripts/probe_fund_naver.mjs

      # 만들 수 있는 것과 없는 것을 확정한다. 목록 수익률이 상세와 다른
      # 것으로 보여, 그것부터 가른다.
      - name: 탐색 실행 (네이버 펀드 — 규모·계열·채움비율)
        continue-on-error: true
        timeout-minutes: 20
        if: hashFiles('scripts/probe_fund_naver2.mjs') != ''
        run: node scripts/probe_fund_naver2.mjs

      # 탐색 실패는 잡을 실패시키지 않는다. 못 붙은 칸도 결과의 일부다.
      - name: 탐색 실행 (1차)
        continue-on-error: true
        timeout-minutes: 5
        run: node scripts/probe_etf_sources.mjs

      - name: 탐색 실행 (2차 — 1차에서 남은 구멍)
        continue-on-error: true
        timeout-minutes: 5
        if: hashFiles('scripts/probe_etf_sources2.mjs') != ''
        run: node scripts/probe_etf_sources2.mjs

      # 분배금 이력 원천 찾기. 네이버 화면이 실제로 무엇을 부르는지 보려면
      # 브라우저가 있어야 한다 — 경로를 찍어 맞히는 것보다 확실하다.
      - name: 브라우저 설치 (화면 관찰용)
        continue-on-error: true
        timeout-minutes: 6
        if: hashFiles('scripts/probe_etf_dividends.mjs') != ''
        run: |
          npm i -D playwright@1.56.1 --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: 탐색 실행 (분배금 이력)
        continue-on-error: true
        timeout-minutes: 8
        if: hashFiles('scripts/probe_etf_dividends.mjs') != ''
        run: node scripts/probe_etf_dividends.mjs

      - name: 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etf-probe
          path: |
            tools/discovery/etf_probe*
            tools/discovery/etf_dividend_probe.*
            tools/discovery/etf_price_series.*
            tools/discovery/etf_audit*
            tools/discovery/fund_probe*
            tools/discovery/fund_naver*
            tools/discovery/naver_etf_analysis.json
          retention-days: 7

      - name: 결과 커밋
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f tools/discovery/etf_probe.json ] || [ -f tools/discovery/etf_dividend_probe.json ]; then
            git add tools/discovery/etf_probe* || true
            git add tools/discovery/etf_dividend_probe.* 2>/dev/null || true
            git add tools/discovery/etf_price_series.* 2>/dev/null || true
            git add tools/discovery/etf_audit* 2>/dev/null || true
            git add tools/discovery/fund_probe* 2>/dev/null || true
            git add tools/discovery/fund_naver* 2>/dev/null || true
            git add tools/discovery/naver_etf_analysis.json 2>/dev/null || true
            git commit -m "chore(etf): 원천 탐색 결과 갱신" || echo "변경 없음"
            git push || echo "푸시 실패 (무시)"
          fi

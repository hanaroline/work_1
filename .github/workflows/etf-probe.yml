name: ETF 원천 탐색 (조사)

# 브리핑 세션은 이그레스 정책 때문에 KRX·네이버·야후에 직접 못 붙는다
# (CONNECT 403). 러너는 그 정책 밖이므로 여기서 대신 찔러 보고 결과를
# 저장소에 커밋한다. 수집기는 이 결과를 보고 쓴다.
#
# 수집기를 고치는 동안 반복해서 돌게 되므로 push 로도 발동시킨다.
# (세션 토큰에는 Actions 쓰기 권한이 없어 workflow_dispatch 를 API 로
#  부르지 못한다. 대신 파일을 푸시하면 여기가 돈다.)

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/etf-**'
    paths:
      - 'scripts/probe_etf_sources*.mjs'
      - 'scripts/probe_etf_dividends.mjs'
      - 'scripts/verify_etf_price_series.mjs'
      - 'scripts/probe_fund_sources*.mjs'
      - '.github/workflows/etf-probe.yml'

permissions:
  contents: write

concurrency:
  group: etf-probe-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 탐색은 막힌 곳을 일부러 찌르는 일이라 응답이 영영 안 오기도 한다.
      # 한 단계가 매달리면 뒤의 단계가 통째로 못 돈다 — 실제로 2차 탐색이
      # 13분 넘게 멈춰 그 뒤의 되짚기가 시작조차 못 했다. 그래서 단계마다
      # 시간을 끊고, **지금 답이 필요한 것을 앞에 둔다.**

      # 야후 시장가와 네이버 시장가가 왜 다른지 — 숫자가 아니라 원가격을 받아
      # 되짚는다. 화면 값을 고치지 않고 판정만 한다.
      - name: 되짚기 실행 (시장가 계열)
        continue-on-error: true
        timeout-minutes: 8
        if: hashFiles('scripts/verify_etf_price_series.mjs') != ''
        run: node scripts/verify_etf_price_series.mjs

      # 펀드 원천 찾기. ETF 는 네이버 etfAnalysis 하나로 됐는데, 펀드에도
      # 그런 자리가 있는지는 확인 전이다. 없으면 화면의 본체가 없다.
      - name: 탐색 실행 (펀드 원천)
        continue-on-error: true
        timeout-minutes: 8
        if: hashFiles('scripts/probe_fund_sources.mjs') != ''
        run: node scripts/probe_fund_sources.mjs

      # 2차는 브라우저가 필요하다 — 화면이 실제로 무엇을 부르는지 봐야 한다.
      - name: 브라우저 설치
        continue-on-error: true
        timeout-minutes: 6
        if: hashFiles('scripts/probe_fund_sources2.mjs') != ''
        run: |
          npm i -D playwright@1.56.1 --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: 탐색 실행 (펀드 원천 2차 — 화면 관찰)
        continue-on-error: true
        timeout-minutes: 10
        if: hashFiles('scripts/probe_fund_sources2.mjs') != ''
        run: node scripts/probe_fund_sources2.mjs

      # 3차는 브라우저가 필요 없다 — 레이아웃 xml 에 호출 정의가 적혀 있다.
      - name: 탐색 실행 (펀드 원천 3차 — 금투협 호출 정의)
        continue-on-error: true
        timeout-minutes: 10
        if: hashFiles('scripts/probe_fund_sources3.mjs') != ''
        run: node scripts/probe_fund_sources3.mjs

      # 4차 — 화면에서 조회를 눌러 진짜 호출을 잡는다. 3차가 엔드포인트를
      # 확인했으니 이제 이름만 알면 된다.
      - name: 탐색 실행 (펀드 원천 4차 — 조회 눌러 잡기)
        continue-on-error: true
        timeout-minutes: 12
        if: hashFiles('scripts/probe_fund_sources4.mjs') != ''
        run: node scripts/probe_fund_sources4.mjs

      # 5차 — 4차에서 경로를 지어냈던 것이 드러났다. 메뉴에서 받아 온다.
      - name: 탐색 실행 (펀드 원천 5차 — 메뉴에서 경로 얻기)
        continue-on-error: true
        timeout-minutes: 12
        if: hashFiles('scripts/probe_fund_sources5.mjs') != ''
        run: node scripts/probe_fund_sources5.mjs

      # 6차 — 마지막 관문. 펀드별 보유종목을 주는 화면이 있는가.
      - name: 탐색 실행 (펀드 원천 6차 — 보유종목 확인)
        continue-on-error: true
        timeout-minutes: 14
        if: hashFiles('scripts/probe_fund_sources6.mjs') != ''
        run: node scripts/probe_fund_sources6.mjs

      # 탐색 실패는 잡을 실패시키지 않는다. 못 붙은 칸도 결과의 일부다.
      - name: 탐색 실행 (1차)
        continue-on-error: true
        timeout-minutes: 5
        run: node scripts/probe_etf_sources.mjs

      - name: 탐색 실행 (2차 — 1차에서 남은 구멍)
        continue-on-error: true
        timeout-minutes: 5
        if: hashFiles('scripts/probe_etf_sources2.mjs') != ''
        run: node scripts/probe_etf_sources2.mjs

      # 분배금 이력 원천 찾기. 네이버 화면이 실제로 무엇을 부르는지 보려면
      # 브라우저가 있어야 한다 — 경로를 찍어 맞히는 것보다 확실하다.
      - name: 브라우저 설치 (화면 관찰용)
        continue-on-error: true
        timeout-minutes: 6
        if: hashFiles('scripts/probe_etf_dividends.mjs') != ''
        run: |
          npm i -D playwright@1.56.1 --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: 탐색 실행 (분배금 이력)
        continue-on-error: true
        timeout-minutes: 8
        if: hashFiles('scripts/probe_etf_dividends.mjs') != ''
        run: node scripts/probe_etf_dividends.mjs

      - name: 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etf-probe
          path: |
            tools/discovery/etf_probe*
            tools/discovery/etf_dividend_probe.*
            tools/discovery/etf_price_series.*
            tools/discovery/fund_probe*
            tools/discovery/naver_etf_analysis.json
          retention-days: 7

      - name: 결과 커밋
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f tools/discovery/etf_probe.json ] || [ -f tools/discovery/etf_dividend_probe.json ]; then
            git add tools/discovery/etf_probe* || true
            git add tools/discovery/etf_dividend_probe.* 2>/dev/null || true
            git add tools/discovery/etf_price_series.* 2>/dev/null || true
            git add tools/discovery/fund_probe* 2>/dev/null || true
            git add tools/discovery/naver_etf_analysis.json 2>/dev/null || true
            git commit -m "chore(etf): 원천 탐색 결과 갱신" || echo "변경 없음"
            git push || echo "푸시 실패 (무시)"
          fi

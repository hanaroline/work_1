name: 증시 일정 수집

# `market-calendar.html` 이 읽는 data/calendar/latest.json 을 만든다.
#
# 세션(Claude)은 이그레스 정책 때문에 federalreserve.gov·bok.or.kr·bls.gov 에 못 붙는다.
# 러너는 그 정책 밖에서 도니 여기서 공식 페이지를 받아 seed 의 날짜를 official 로 올린다.
#
# 주 1회로 잡은 이유: 캘린더는 매일 바뀌는 자료가 아니다. 중앙은행 일정은 1년에 한 번
# 공표되고 학회 일정도 그렇다. 매일 돌리면 main 에 276KB 짜리 차이만 쌓인다.
# 지금 당장 돌려야 하면 data/calendar/REFRESH 를 한 줄 고쳐 push 한다.
#
# 판이 둘이라 자동 갱신도 둘로 나뉜다.
#   · 인터넷판  — latest.json 을 main 에 되돌려 놓으면 화면을 다시 열 때 최신이 된다.
#   · 오프라인판 — 파일 자체가 데이터를 품고 있어 스스로 갱신될 수 없다. 대신 매주
#                  새로 만들어 calendar-data 브랜치에 올린다. 주소가 고정이므로
#                  그 자리에서 받아 업무용 PC 에 다시 넣으면 된다.
#
# 주의: schedule 이벤트는 기본 브랜치(main)의 워크플로만 발동한다. 작업 브랜치에서는
# 아래 push 트리거나 수동 실행으로 돌린다.

on:
  schedule:
    # 월요일 10:00 KST 부터 한 시간 간격으로 여덟 번(01~08 UTC = 10~17시 KST).
    #
    # cron 은 UTC 로만 읽힌다(타임존을 지정할 수 없다). KST 는 UTC+9 이고 서머타임이
    # 없으므로 9시간을 빼면 끝이다 — 월요일 10:00 − 9h = 같은 월요일 01:00.
    #
    # **여덟 번인 이유 — 예약 하나로는 10시에 오지 않았다.** 여기는 오래 `0 1 * * 1`
    # 한 줄이었는데, 2026-09-14 와 09-21 두 주 연속으로 그 슬롯이 05:38 / 05:46 UTC
    # (14:38 / 14:46 KST)에야 배달됐다. 4시간 40분씩, 두 번 다 같은 폭으로 밀렸다.
    # 같은 시간대(00~02 UTC)에 이 저장소의 다른 워크플로는 1~5분 안에 들어오고 있으니
    # 저장소가 통째로 막힌 것이 아니라, 주 1회짜리 슬롯이 뒤로 밀리는 것이다.
    # 깃허브 문서도 부하가 높으면 예약이 밀리거나 아예 빠질 수 있다고 적어 둔다.
    #
    # 그래서 **여러 번 부르고, 이번 주에 이미 돈 판이 있으면 스스로 건너뛴다**
    # (아래 "이번 주에 이미 돌았는지 본다" 단계). 먼저 도착한 하나가 일을 하고
    # 나머지는 체크아웃도 하지 않는 10초짜리 빈 판으로 끝난다.
    - cron: '0 1-8 * * 1'

  # 10시 **전후**에 실제로 닿게 하는 길. 예약만으로는 위에서 본 대로 오후에 밀린다.
  #
  # 이 저장소에서 자주 발동하는 워크플로가 끝날 때마다 이 판을 불러 본다. 월요일
  # 10:00 KST 를 지나 처음 끝나는 판이 이 수집을 깨우고, 나머지는 가드에서 바로 끝난다.
  #
  #   증권사 리포트 수집        `10 1 * * 1-5` 슬롯이 곧 10:10 KST 다 — 10시에 가장 가깝다
  #   국내 100대 기업 가격 갱신   `*/10 0-6 * * 1-5` — 평일 오전에 10분마다. 하나쯤은 온다
  #   시세 수집                주말과 이른 아침을 메운다
  #
  # 왜 셋이나 무는가 — 하나로는 10시에 못 붙는다. kr100-weekly 가 먼저 이 방식을
  # 쓰고 있는데, 가격 갱신·시세 수집 둘만 물린 2026-09-21 에는 10:00 을 지나 처음
  # 끝난 판이 11:37 KST 였다(97분 뒤). 10시 직후에 끝나는 리포트 수집을 더해 그 틈을
  # 메운다.
  #
  # 값으로 치르는 것: 이 셋이 끝날 때마다 빈 판이 하나 뜬다(하루 쉰 번 안팎, 각
  # 10초). 체크아웃도 하지 않으므로 청구는 잡당 1분으로 올림된 만큼이다.
  workflow_run:
    workflows:
      - '증권사 리포트 수집'
      - '국내 100대 기업 가격 갱신'
      - '시세 수집'
    types: [completed]

  # 세션·사람이 직접 부르는 길. 세션 토큰에는 Actions 쓰기 권한이 없어
  # workflow_dispatch 를 API 로 부르지 못하지만(403), git push 는 된다.
  push:
    paths:
      - 'data/calendar/REFRESH'
      - 'data/calendar/seed/**'
      - 'scripts/fetch_calendar.py'
      - 'scripts/build_calendar.py'
      - 'scripts/check_calendar.py'
      - 'scripts/inline_calendar.py'
      # 화면을 고친 날에도 돈다. 그러지 않으면 다음 월요일까지 오프라인판만
      # 옛 화면을 담은 채 배포 자리에 남는다.
      - 'market-calendar.html'
      - '.github/workflows/calendar-data.yml'

  workflow_dispatch:

permissions:
  contents: write
  actions: read                     # 이번 주에 이미 돌았는지 실행 기록에서 확인한다

concurrency:
  group: calendar-data-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 이번 주에 이미 돌았는지 본다
        # 저절로 불리는 길이 둘(월요일 여덟 슬롯 · 다른 워크플로가 끝날 때마다)이라
        # 한 주에 수백 번 불린다. **먼저 도착한 하나만 일하고** 나머지는 여기서 끝난다
        # — 체크아웃도 파이썬 설치도 하지 않는 10초짜리 빈 판이다.
        #
        # 월요일 10:00 KST 전에는 돌지 않는다. 그 전에 불려도 여기서 끝나므로, 한 주의
        # 첫 수집은 언제나 월요일 10시를 지나서 생긴다.
        #
        # 월요일이 통째로 빠진 주에는 그 주의 다음 기회가 일을 한다. 목표는 10시
        # 전후지만 **한 주를 통째로 거르는 것보다 늦게라도 도는 편이 낫다.**
        # 사람이 부른 판(수동 실행·push)은 이 가름을 거치지 않고 언제나 돈다.
        id: once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "${{ github.event_name }}" in
            schedule|workflow_run) : ;;                 # 저절로 불린 판 — 아래에서 가린다
            *)                                          # 사람이 부른 판 — 언제나 돈다
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "사람이 부른 실행이다 — 그대로 돈다 (${{ github.event_name }})"
              exit 0 ;;
          esac
          python3 - <<'PY'
          import datetime, json, os, urllib.request

          def decide():
              repo = os.environ['GITHUB_REPOSITORY']
              me = int(os.environ['GITHUB_RUN_ID'])
              url = ("https://api.github.com/repos/%s/actions/workflows/calendar-data.yml/runs"
                     "?status=success&per_page=30" % repo)
              req = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + os.environ['GH_TOKEN'],
                  "Accept": "application/vnd.github+json", "User-Agent": "calendar-data"})
              now = datetime.datetime.now(datetime.timezone.utc)
              # 이번 주 월요일 00:00 UTC = 월요일 09:00 KST. 여기에 한 시간을 더하면
              # 월요일 10:00 KST 다 — 그때부터가 이번 주의 갱신 자리다.
              monday = (now - datetime.timedelta(days=now.weekday())).replace(
                  hour=0, minute=0, second=0, microsecond=0)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      runs = json.load(r).get('workflow_runs') or []
              except Exception as e:                      # noqa: BLE001
                  # 기록을 못 읽었다고 그 주를 건너뛰면 안 된다 — 모르면 돈다.
                  print('::warning::실행 기록을 읽지 못했다 — 그대로 돈다 (%s)' % e)
                  return True
              # 저절로 불린 판만 센다 — 사람이 손으로 돌린 판이 그 주의 자동 갱신을
              # 대신했다고 보지 않는다. main 에서 돈 판만 센다(작업 브랜치의 중간 판은
              # 배포 자리에 올라가지 않으므로 그 주의 갱신이 됐다고 볼 수 없다).
              done = [x for x in runs
                      if x['id'] != me
                      and x['event'] in ('schedule', 'workflow_run')
                      and x['head_branch'] == 'main'
                      and datetime.datetime.fromisoformat(
                          x['run_started_at'].replace('Z', '+00:00')) >= monday]
              if done:
                  print('::notice::이번 주 예약 판이 이미 돌았다 (%s) — 건너뛴다 %s'
                        % (done[0]['run_started_at'], done[0]['html_url']))
                  return False
              if now < monday + datetime.timedelta(hours=1):
                  print('아직 월요일 10:00 KST 전이다 — 이번 주 갱신은 그때부터다')
                  return False
              print('이번 주 첫 자동 판이다 — 월요일 %s 이후 저절로 돈 판이 없다'
                    % monday.strftime('%m-%d %H:%M UTC'))
              return True

          # 사람이 읽을 문장은 로그로, 판정만 GITHUB_OUTPUT 으로 보낸다.
          # (설명까지 그 파일에 흘리면 key=value 가 아니어서 파싱이 깨진다.)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('run=%s\n' % ('true' if decide() else 'false'))
          PY

      - uses: actions/checkout@v4
        if: steps.once.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.once.outputs.run == 'true'
        with:
          python-version: '3.12'

      - name: 파서 먼저 검증한다
        if: steps.once.outputs.run == 'true'
        # 수집 전에 모의 응답으로 파서를 본다. 파서가 깨진 채로 수집하면 seed 만
        # 흔들어 놓는다(실패하면 반영은 안 되지만, 그 사실을 여기서 먼저 알고 싶다).
        run: python scripts/check_calendar.py --only parsers

      - name: 실적발표일 스냅샷 받아 두기
        if: steps.once.outputs.run == 'true'
        # kr100/us100 의 실물은 데이터 브랜치에 있고 코드 브랜치에는 안내 파일만 있다.
        # 있으면 빌더가 실적 일정까지 담고, 없으면 화면이 브라우저에서 직접 받는다.
        continue-on-error: true
        run: |
          for pair in "kr100 kr100-data" "us100 us100-data"; do
            set -- $pair
            dir="$1"; branch="$2"
            if git fetch --quiet origin "+refs/heads/$branch:refs/remotes/origin/$branch" 2>/dev/null; then
              git show "origin/$branch:data/$dir/latest.json" > "data/$dir/latest.json" || true
              echo "$dir 스냅샷 받음"
            else
              echo "$dir 데이터 브랜치가 없다 — 실적 일정은 브라우저가 직접 받는다"
            fi
          done

      - name: 발표기관 원문에서 확정 날짜 받기
        if: steps.once.outputs.run == 'true'
        # 한 경로가 막혀도 나머지는 간다. 실패는 fetch-report.json 에 남는다.
        #
        # FRED_API_KEY 는 저장소 시크릿에 넣으면 켜진다(없으면 그 경로만 건너뛴다).
        # BLS 가 러너 IP 에 403 을 주므로, 미국 CPI·고용상황의 확정 발표일은 지금 이 길로만
        # 들어온다. 스크립트가 os.environ 에서 읽으므로 여기서 넘겨주지 않으면 시크릿을
        # 넣어도 쓰이지 않는다.
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch_calendar.py

      - name: 산출물 검사
        if: steps.once.outputs.run == 'true'
        run: python scripts/check_calendar.py --only data

      - name: 오프라인 단일 파일 만들기
        if: steps.once.outputs.run == 'true'
        # 인터넷이 막힌 업무용 PC 용. file:// 로 열린 페이지는 옆에 있는 json 도
        # CORS 로 못 읽으므로 데이터를 HTML 안에 심어 둔다. main 에는 커밋하지 않는다
        # (매번 500KB 가 통째로 바뀐다) — 아래 `오프라인판 배포` 가 데이터 브랜치로 보낸다.
        run: python scripts/inline_calendar.py

      - name: 수집 결과 요약
        if: always() && steps.once.outputs.run == 'true'
        continue-on-error: true
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          try:
              rep = json.load(open('data/calendar/fetch-report.json', encoding='utf-8'))
          except Exception as e:
              print('수집 보고서를 읽지 못했다 — %s' % e); raise SystemExit(0)
          s = rep.get('summary', {})
          print('## 증시 일정 수집\n')
          print('경로 %s개 중 **%s개 성공**, %s개 실패 · %s\n'
                % (s.get('sources'), s.get('ok'), s.get('failed'), rep.get('ranAt')))
          print('| 경로 | 결과 | 건수 | 메모 |')
          print('|---|---|---|---|')
          for name, v in rep.get('sources', {}).items():
              note = (v.get('why') or '; '.join(v.get('changes') or []) or '').replace('|', '/')
              print('| `%s` | %s | %s | %s |'
                    % (name, '성공' if v.get('ok') else '실패', v.get('count', '-'), note[:240]))
          try:
              cal = json.load(open('data/calendar/latest.json', encoding='utf-8'))
          except Exception:
              raise SystemExit(0)
          c = cal.get('counts', {})
          print('\n담긴 일정 **%s건** — %s' % (c.get('total'),
                ' · '.join('%s %s' % (k, v) for k, v in c.items()
                           if k != 'total' and isinstance(v, int) and v)))
          print('\n확정도 — %s' % ' · '.join('%s %s' % kv for kv in (c.get('confirmed') or {}).items() if kv[1]))
          gaps = cal.get('gaps') or []
          if gaps:
              print('\n### 아직 비어 있는 곳\n')
              for g in gaps:
                  print('- %s' % g)
          PY
          python - <<'PY'
          import json
          try:
              rep = json.load(open('data/calendar/fetch-report.json', encoding='utf-8'))
          except Exception:
              raise SystemExit(0)
          bad = [k for k, v in rep.get('sources', {}).items() if not v.get('ok')]
          if bad:
              print('::warning::원문을 못 받은 경로 — ' + ', '.join(bad))
          PY

      - name: 돌린 브랜치에 커밋
        if: steps.once.outputs.run == 'true'
        # 돌린 그 브랜치에 되돌려 놓는다. 처음에는 main 일 때만 커밋했는데, 그러면 작업
        # 브랜치에서 돌린 수집 결과가 아무 데도 남지 않았다(Artifacts 는 14일 뒤 사라진다).
        # 이 워크플로의 push 트리거 자체가 작업 브랜치용이므로 앞뒤가 맞지 않았다.
        #
        # 실적 스냅샷은 이 판이 만든 것이 아니므로 커밋하지 않는다(데이터 브랜치가 원본).
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- data/kr100/latest.json data/us100/latest.json 2>/dev/null || true
          git add data/calendar/latest.json data/calendar/fetch-report.json data/calendar/seed
          if git diff --cached --quiet; then
            echo "바뀐 것이 없다"
          else
            git commit -m "증시 일정 수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            # 네 번을 다 밀어 보고도 안 되면 **조용히 넘어가지 않는다.**
            # 예전에는 고리가 그냥 끝나 잡이 초록으로 남았고, 그러면 수집분이
            # 사라진 것을 아무도 모른다. 2026-09-11 시세 수집이 같은 자리에서
            # 밀려 그날 장마감 판을 제때 못 냈는데, 그때는 잡이 빨갛게 죽어
            # 원인을 찾을 수 있었다. 초록으로 사라지는 쪽이 더 나쁘다.
            ok=0
            for i in 1 2 3 4; do
              if git push origin "HEAD:${{ github.ref_name }}"; then ok=1; break; fi
              echo "push 실패 — $((2**i))초 뒤 다시"
              sleep $((2**i))
              git pull --rebase origin "${{ github.ref_name }}" || true
            done
            [ "$ok" = 1 ] || { echo "::error::일정 수집분을 밀어넣지 못했다"; exit 1; }
          fi

      - name: 오프라인판 배포
        # 업무용 PC 에 넣을 파일을 **고정 주소**에 둔다. Artifacts 는 14일 뒤 사라지고
        # 로그인과 zip 풀기가 필요해서, 매주 받아 다시 배포하는 용도로는 번거로웠다.
        #
        #   https://raw.githubusercontent.com/hanaroline/work_1/calendar-data/data/calendar/market-calendar-offline.html
        #
        # main 에서 돌 때만 올린다. 이 주소는 사람이 받아 가는 자리이므로 작업 브랜치의
        # 중간 판이 덮어쓰면 안 된다(작업 브랜치는 아래 Artifacts 로 확인한다).
        if: github.ref_name == 'main' && steps.once.outputs.run == 'true'
        run: |
          cp market-calendar-offline.html data/calendar/
          bash scripts/publish_calendar_data.sh

      - uses: actions/upload-artifact@v4
        if: always() && steps.once.outputs.run == 'true'
        with:
          name: calendar-data
          path: |
            data/calendar/latest.json
            data/calendar/fetch-report.json
            market-calendar-offline.html
          retention-days: 14
          if-no-files-found: warn

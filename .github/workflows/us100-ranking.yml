name: 미국 100대 기업 목록 점검

# 대상 목록(us-top100.html 의 COMPANIES)이 지금 시가총액 상위 100 과 얼마나 어긋났는지
# 확인해 **후보만 알려 준다**. 목록을 자동으로 갈아치우지는 않는다 — 새 종목의 한글명·
# 기업 개요를 사람이 채워야 화면이 비지 않기 때문이다(scripts/check_us100_ranking.py).
#
# 왜 전체 수집(us100-data.yml)과 떼어 두나
#   점검에 필요한 것은 이미 데이터 브랜치에 있는 latest.json(우리 목록의 시총)과
#   S&P 500 구성종목·시총뿐이다. 8분 걸리는 전체 수집에 매달아 두면, 수집이 느려지거나
#   실패한 날에는 점검도 함께 못 돈다. 1~2분이면 끝나는 일이라 따로 돌린다.

on:
  schedule:
    - cron: '0 22 * * 2-6'          # 미국 정규장 마감 뒤(전체 수집 다음)

  push:
    paths:
      - 'scripts/check_us100_ranking.py'
      - '.github/workflows/us100-ranking.yml'
      - 'data/us100/RANK_REFRESH'

  workflow_dispatch:

permissions:
  contents: write
  issues: write                      # 갱신 후보를 이슈 하나에 적어 둔다(같은 글을 갱신)

concurrency:
  group: us100-ranking-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 데이터 브랜치에서 최신 스냅샷 받기
        # 우리 목록의 시총은 최근 수집분에서 읽는다(요청을 아끼고, 같은 판의 값으로 순위를 매긴다)
        run: |
          mkdir -p data/us100
          if git fetch --quiet origin "+refs/heads/us100-data:refs/remotes/origin/us100-data" 2>/dev/null; then
            git show origin/us100-data:data/us100/latest.json > data/us100/latest.json || true
          fi
          python - <<'PY'
          import json, os
          p = 'data/us100/latest.json'
          if os.path.exists(p) and os.path.getsize(p) > 1000:
              d = json.load(open(p, encoding='utf-8'))
              print('스냅샷 %s · %d종목' % (d.get('fetchedAt'), len(d.get('companies') or {})))
          else:
              print('::warning::스냅샷이 없다 — 우리 목록의 시총은 일괄 조회로 대신한다')
          PY

      - name: 목록 점검
        env:
          US100_RANK_ISSUE: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_us100_ranking.py

      - name: 데이터 브랜치에 올리기
        env:
          COMMIT_LABEL: 목록점검
          PUBLISH_FILES: ranking.json
        run: bash scripts/publish_us100_data.sh

name: 펀드 원천 검산 (조사)

# 이 저장소의 세션은 이그레스 정책 때문에 네이버에 직접 못 붙는다
# (CONNECT 403). 러너는 그 정책 밖이므로 여기서 대신 찔러 보고 결과를
# 저장소에 커밋한다. 화면과 수집기는 이 결과를 보고 쓴다.
#
# 검산을 고치는 동안 반복해서 돌게 되므로 push 로도 발동시킨다.
# (세션 토큰에 Actions 쓰기 권한이 없어 workflow_dispatch 를 API 로 부르지
#  못한다. 대신 파일을 푸시하면 여기가 돈다.)

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/fund-**'
    paths:
      - 'scripts/verify_fund_returns.mjs'
      - 'scripts/probe_fund_*.mjs'
      - 'scripts/probe_kofia_*.mjs'
      - '.github/workflows/fund-probe.yml'

permissions:
  contents: write

concurrency:
  group: fund-probe-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 지금 답이 필요한 것 하나다 — 목록·상세에 실린 244.9% 가 기간수익률인가,
      # 설정 이후 누적인가. 여기서 계열의 뜻이 갈린다.
      #
      # continue-on-error 를 쓰지 않는다. 이 단계가 죽으면 화면을 만들 근거가
      # 없으므로 잡도 같이 실패해야 한다 — 0초 만에 success 로 찍히는 것을
      # ETF 세션에서 두 번 겪었다.
      - name: 검산 실행 (기간수익률 계열)
        timeout-minutes: 25
        # 결과가 저장소에 남았다. 다시 볼 일이 있으면 수동 실행으로 돌린다.
        if: github.event_name == 'workflow_dispatch' && hashFiles('scripts/verify_fund_returns.mjs') != ''
        run: node scripts/verify_fund_returns.mjs

      # 1차에서 "원천 값 = 원천 계열" 임이 갈렸다. 남은 것은 계열 자체의
      # 계단이다 — 실물을 찍어 보고, 몇 종목이나 되는지 센다.
      - name: 검산 실행 2차 (계단의 실물·규모)
        timeout-minutes: 25
        # 결과가 저장소에 남았다. 다시 볼 일이 있으면 수동 실행으로 돌린다.
        if: github.event_name == 'workflow_dispatch' && hashFiles('scripts/verify_fund_returns2.mjs') != ''
        run: node scripts/verify_fund_returns2.mjs

      # 2차의 탐지 규칙이 계단 하나를 놓쳤다(주말이 낀 3.147배). 고친 규칙이
      # 무엇을 잡고 무엇을 놓치는지 700종목에서 센다. 이 결과가 수집기의
      # 방어선을 정하므로, 여기가 죽으면 잡도 같이 실패해야 한다.
      - name: 검산 실행 3차 (계단 탐지 규칙 검증)
        timeout-minutes: 30
        # 결과가 저장소에 남았다. 다시 볼 일이 있으면 수동 실행으로 돌린다.
        if: github.event_name == 'workflow_dispatch' && hashFiles('scripts/verify_fund_returns3.mjs') != ''
        run: node scripts/verify_fund_returns3.mjs

      # 3차가 잡은 21종목 중 18종목은 원천 앞뒤가 멀쩡했고 계단이 아래로 났다
      # (결산·분배로 보인다). 계단이 있다고 무조건 비우면 멀쩡한 값을 버린다.
      # 네이버가 그 계단을 보정하는지 실물로 가른다.
      - name: 검산 실행 4차 (네이버가 계단을 보정하는가)
        timeout-minutes: 20
        # 결과가 저장소에 남았다. 다시 볼 일이 있으면 수동 실행으로 돌린다.
        if: github.event_name == 'workflow_dispatch' && hashFiles('scripts/verify_fund_returns4.mjs') != ''
        run: node scripts/verify_fund_returns4.mjs

      # 첫 전수 수집에서 감사가 39건을 잡아 커밋을 막았다. 8개 펀드에 몰려
      # 있는데, ETF 에서 처음 잡은 7,252건 중 대부분이 규칙의 잘못이었으므로
      # 고치기 전에 실물을 본다.
      - name: 검산 실행 5차 (필드의 뜻·이상 레코드)
        timeout-minutes: 25
        # 결과가 저장소에 남았다. 다시 볼 일이 있으면 수동 실행으로 돌린다.
        if: github.event_name == 'workflow_dispatch' && hashFiles('scripts/verify_fund_fields.mjs') != ''
        run: node scripts/verify_fund_fields.mjs

      # 화면 시험이 걸렸다 — 원천이 비중을 정확히 0 으로 주는 펀드가 있다.
      # 진짜 0 인지 "모름" 인지 갈려야 화면에 무엇을 찍을지 정해진다.
      - name: 검산 실행 6차 (비중 0 은 0 인가 모름인가)
        timeout-minutes: 20
        # 결과가 저장소에 남았다. 다시 볼 일이 있으면 수동 실행으로 돌린다.
        if: github.event_name == 'workflow_dispatch' && hashFiles('scripts/verify_fund_zero_weight.mjs') != ''
        run: node scripts/verify_fund_zero_weight.mjs

      # 사용자가 준 주소가 클래스 코드였다 — 우리 화면이 못 여는 코드다.
      # 클래스가 부모와 다른 상품인지, 목록에 섞여 한 펀드가 둘로 세어지고
      # 있는지를 실물로 가른다. 여기서 화면을 어떻게 고칠지가 갈린다.
      - name: 검산 실행 8차 (클래스 코드로 화면이 열리는가)
        timeout-minutes: 25
        # 결과가 저장소에 남았다. 다시 볼 일이 있으면 수동 실행으로 돌린다.
        if: github.event_name == 'workflow_dispatch' && hashFiles('scripts/probe_fund_class_page.mjs') != ''
        run: |
          npm i -D playwright@1.56.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
          node scripts/probe_fund_class_page.mjs

      # 8차가 남긴 세 물음. 클래스 화면이 빈칸으로 찍힌 것이 내가 일찍 찍은
      # 탓인지 화면이 반쪽인지, 유형평균이 정말 응답에 없는지, 매매 기준일·
      # 수수료가 어느 자리에 있는지. 8차는 요약만 남겨 답을 못 했다.
      - name: 검산 실행 9차 (클래스 화면·유형평균·안 싣는 항목)
        timeout-minutes: 20
        # 결과가 저장소에 남았다. 다시 볼 일이 있으면 수동 실행으로 돌린다.
        if: github.event_name == 'workflow_dispatch' && hashFiles('scripts/probe_fund_class_page2.mjs') != ''
        run: |
          npm i -D playwright@1.56.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
          node scripts/probe_fund_class_page2.mjs

      # 사용자가 제로인(FUND DOCTOR) 화면을 하나 더 주었다. 네이버가 아닌
      # 세 번째 출처다 — 수익률·위험지표가 2차 출처 단독 근거로 남아 있는
      # 자리를 메울 수 있는지 본다. robots 가 막으면 거기서 멈춘다.
      - name: 검산 실행 10차 (제로인이 세 번째 출처가 되는가)
        timeout-minutes: 20
        # 결과가 저장소에 남았다. 다시 볼 일이 있으면 수동 실행으로 돌린다.
        if: github.event_name == 'workflow_dispatch' && hashFiles('scripts/probe_fund_funddoctor.mjs') != ''
        run: |
          npm i -D playwright@1.56.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
          node scripts/probe_fund_funddoctor.mjs

      # 사용자가 미래에셋증권 펀드 화면을 보여 주었다. 거기 있는데 우리에게
      # 없는 것 — 업종구성, 보유종목 기준일, 자산구분, 보수 내역, 수수료.
      # 네이버 탭 셋 중 우리는 첫 탭만 봤다. 나머지 둘을 연다.
      - name: 검산 실행 11차 (안 열어 본 탭 둘)
        timeout-minutes: 25
        if: github.event_name == 'workflow_dispatch' && hashFiles('scripts/probe_fund_tabs.mjs') != ''
        run: |
          npm i -D playwright@1.56.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
          node scripts/probe_fund_tabs.mjs

      # 11차는 `allocationsSectors` 라는 열쇠 이름만 남기고 본문은 잘렸다.
      # 그 상태로 모양을 짐작해 수집기에 넣었다가 3,196개 전부 빈칸이 났다.
      # 이번엔 본문을 통째로 찍어 놓고 모양과 분모를 읽는다. 브라우저는
      # 필요 없다 — 주소를 이미 안다.
      - name: 검산 실행 12차 (업종구성의 모양)
        timeout-minutes: 15
        if: hashFiles('scripts/probe_fund_sectors.mjs') != ''
        run: node scripts/probe_fund_sectors.mjs

      # 사용자가 "ETF 처럼 3개월 자금유입 상위" 를 물었다. 펀드에는 그 값이
      # 원천에 없다 — ETF 는 네이버가 `cumulativeNetInflowList` 로 얹어 주지만
      # 펀드 응답 다섯 갈래 어디에도 그 항목이 없었다.
      #
      # 대신 **설정원본의 차이**가 곧 순유입이다(407종목으로 확인한 항등식:
      # 순자산 = 설정원본 × 기준가/1000). 문제는 과거 설정원본이 없다는 것.
      # 지금부터 쌓으면 3개월을 기다려야 한다.
      #
      # 금투협 펀드 요약 팝업에 `standardDt`(기준일자) 인자가 있다. 이것이
      # 실제로 먹으면 소급해서 한 번에 채울 수 있다. **인자를 받아 준다는 것과
      # 값이 바뀐다는 것은 다르다** — 그래서 인자를 받는지로 판정하지 않는다.
      #
      # 첫 판은 "판정 보류" 로 끝났는데 원천이 아니라 규칙이 틀려서였다.
      # 본문의 날짜꼴 문자열을 바꾸는 방식이었는데, 실제 기준일 칸은
      # `<standardDt></standardDt>` 로 **비어 있었다** — 바꿀 토큰이 없었다.
      # 빈 칸은 지우는 게 아니라 채우는 것이다.
      #
      # 고친 판정 근거: 응답이 `<standardDt>20260828</standardDt>` 로 **서버가
      # 실제로 쓴 기준일을 되돌려준다.** 우리가 부른 날짜가 되돌아오면 존중,
      # 최신일로 되돌아오면 무시다. 값이 같은지로 보지 않는다 — 그 펀드가
      # 정말 안 움직였을 수도 있기 때문이다.
      - name: 검산 실행 13차 (금투협 소급 설정원본이 되는가)
        timeout-minutes: 30
        # 결과가 저장소에 남았다. 다시 볼 일이 있으면 수동 실행으로 돌린다.
        if: github.event_name == 'workflow_dispatch' && hashFiles('scripts/probe_fund_kofia_flow.mjs') != ''
        run: |
          npm i -D playwright@1.56.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
          node scripts/probe_fund_kofia_flow.mjs

      # 같은 물음의 다른 갈래 — 금투협 공식 오픈API 로 받을 수 있는가.
      # 세션에서는 openapi.kofia.or.kr 이 막혀(EGRESS_BLOCKED) 이용안내를
      # 열지 못한다. 신청 절차를 검색 요약만 보고 적으면 지어내는 것이 된다.
      # 러너가 원문을 받아 저장소에 남긴다.
      - name: 검산 실행 14차 (금투협 오픈API 이용안내 원문)
        timeout-minutes: 10
        continue-on-error: true
        # 결과가 저장소에 남았다. 다시 볼 일이 있으면 수동 실행으로 돌린다.
        if: github.event_name == 'workflow_dispatch' && hashFiles('scripts/probe_kofia_openapi_docs.mjs') != ''
        run: node scripts/probe_kofia_openapi_docs.mjs

      # 14차가 금투협 오픈API 는 펀드를 안 준다는 것을 원문으로 밝혔다
      # ("Do-not-call, 금융투자 교육원의 학습 진도 및 현황 데이터"). 그러면
      # 다른 데는 어디인가. 후보 목록을 기억으로 적으면 또 틀린다 — 목록
      # 화면 원문을 받아 온다. 13차 다음에 두는 것은 브라우저가 이미
      # 깔려 있기 때문이다.
      - name: 검산 실행 15차 (펀드 API 를 주는 다른 기관 목록 원문)
        timeout-minutes: 20
        continue-on-error: true
        # 결과가 저장소에 남았다. 다시 볼 일이 있으면 수동 실행으로 돌린다.
        if: github.event_name == 'workflow_dispatch' && hashFiles('scripts/probe_fund_api_catalogs.mjs') != ''
        run: |
          npm i -D playwright@1.56.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
          node scripts/probe_fund_api_catalogs.mjs

      # 15차가 공공데이터포털에서 이름이 그럴듯한 것을 셋 찾았다:
      #   집합투자증권 설정, 환매 및 인수도대금 현황
      #   증권관리현황 ; 집합투자증권 잔고현황
      #   금융위원회_펀드상품 판매현황정보 (키워드: 판매, 잔액)
      # 이름은 근거가 아니다. 상세 화면을 열어 **출력 항목**을 본다.
      # 표준코드·기준일자·설정원본(좌수)이 셋 다 있어야 쓸 수 있다.
      # 합계 통계거나 분기 자료거나 오늘치만 주면 못 쓴다.
      # 20차에서 넉 줄을 다 열었다. 결과가 저장소에 남았으므로 자동으로는
      # 안 돌린다 — 다시 돌리면 성공한 결과가 실패 결과로 덮인다.
      - name: 검산 실행 16차 (후보가 펀드별 일별 설정원본을 주는가)
        timeout-minutes: 25
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' && hashFiles('scripts/probe_fund_api_detail.mjs') != ''
        run: |
          npm i -D playwright@1.56.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
          node scripts/probe_fund_api_detail.mjs

      # 20차가 연 넉 줄은 전부 **연계데이터**였다. 포털은 항목도 파일도
      # 안 들고 바깥 주소만 걸어 둔다(전체 행 `-`, 확장자 빈칸). 그러니
      # 포털 화면으로는 판정을 못 한다. 실물이 있는 광주 쪽을 연다.
      # 21차가 넷 다 200 으로 받아 왔고 판정이 끝났다(→ fund_sources_verdict.md).
      # 16차와 같은 이유로 자동으로는 안 돌린다 — 다시 돌려서 한 번이라도
      # 못 받으면 끝난 판정이 빈 표로 덮인다.
      - name: 검산 실행 21차 (광주 연계 4건이 무엇을 주는가)
        timeout-minutes: 20
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' && hashFiles('scripts/probe_fund_gwangju.mjs') != ''
        run: |
          npm i -D playwright@1.56.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
          node scripts/probe_fund_gwangju.mjs

      # 앞선 탐침이 오픈API 서비스 목록을 머리글까지만 받아 왔다. 그걸 근거로
      # "펀드 API 는 없다" 고 적었는데 그건 **못 읽은 것이지 없는 것이 아니다.**
      # 목록을 JS 로 채우는 화면이므로 브라우저로 열어 렌더 뒤에 읽는다.
      # 22차가 목록 AJAX 두 건이 방화벽에 막힌 것을 잡았다. 결과가 저장소에
      # 남았으므로 자동으로는 안 돌린다 - 다시 돌리면 잡아 둔 증거가 덮인다.
      - name: 검산 실행 22차 (금투협 오픈API 가 실제로 무엇을 주는가)
        timeout-minutes: 20
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' && hashFiles('scripts/probe_kofia_openapi_list.mjs') != ''
        run: |
          npm i -D playwright@1.56.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
          node scripts/probe_kofia_openapi_list.mjs

      # 막힌 요청은 http:// 로 나갔고 메인은 https:// 였다. 스킴만 바꿔 한 번
      # 더 연다. 또 막히면 확인 실패로 닫는다 - 더 두드리지 않는다.
      # 23차도 3건 중 2건이 막혔다. https 로도 안 된다. 확인 실패로 닫는다 -
      # 더 두드리지 않는다. 결과가 남았으므로 자동으로는 안 돌린다.
      - name: 검산 실행 23차 (오픈API 목록, https 로 한 번 더)
        timeout-minutes: 15
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' && hashFiles('scripts/probe_kofia_openapi_list2.mjs') != ''
        run: |
          npm i -D playwright@1.56.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
          node scripts/probe_kofia_openapi_list2.mjs

      # 24차. 앞의 것들과 성격이 다르다 — 원천을 찾는 탐침이 아니라 **이미
      # 만든 화면의 숫자를 1차 출처와 맞춰 보는 재검증**이다. 안에서만 도는
      # 감사(audit_fund_data.mjs)는 오류 0으로 통과하지만, 그건 바깥에 안
      # 붙는다. 수집기가 통째로 밀린 값을 받아 왔다면 안에서는 완벽히 일관된다.
      #
      # 결과가 아직 저장소에 없으므로 이번에는 push 로도 돌게 둔다.
      # (세션에 Actions 쓰기 권한이 없어 수동 실행을 부르지 못한다.)
      # 결과가 남은 뒤에는 위 단계들처럼 workflow_dispatch 로 잠근다.
      - name: 재검증 24차 (화면의 숫자 vs 금투협 전자공시, 전수)
        timeout-minutes: 45
        # 결과가 들어왔으므로 잠근다. push 로 다시 돌면 증거가 덮인다.
        # 판정은 tools/discovery/fund_verify_verdict.md 에 따로 남겼다.
        if: github.event_name == 'workflow_dispatch' && hashFiles('scripts/probe_fund_verify_kofia.mjs') != ''
        run: node scripts/probe_fund_verify_kofia.mjs

      - name: 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fund-probe
          path: |
            tools/discovery/fund_returns_verify*.*
            tools/discovery/fund_fields_verify.*
            tools/discovery/fund_zero_weight.*
            tools/discovery/fund_class_probe.*
            tools/discovery/fund_class_page_*.png
            tools/discovery/fund_class_probe2.*
            tools/discovery/fund_class_page2_*.png
            tools/discovery/fund_funddoctor.*
            tools/discovery/fund_tabs.*
            tools/discovery/fund_sectors.*
            tools/discovery/fund_kofia_flow.*
            tools/discovery/kofia_openapi_docs.md
            tools/discovery/fund_api_catalogs.md
            tools/discovery/fund_api_detail.md
            tools/discovery/fund_gwangju.md
            tools/discovery/kofia_openapi_list.md
            tools/discovery/kofia_openapi_list2.md
            tools/discovery/fund_verify_kofia.*
          retention-days: 7

      - name: 결과 커밋
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/discovery/fund_returns_verify*.* 2>/dev/null || true
          git add tools/discovery/fund_fields_verify.* 2>/dev/null || true
          git add tools/discovery/fund_zero_weight.* 2>/dev/null || true
          git add tools/discovery/fund_class_probe.* 2>/dev/null || true
          git add tools/discovery/fund_class_page_*.png 2>/dev/null || true
          git add tools/discovery/fund_class_probe2.* 2>/dev/null || true
          git add tools/discovery/fund_class_page2_*.png 2>/dev/null || true
          git add tools/discovery/fund_funddoctor.* 2>/dev/null || true
          git add tools/discovery/fund_tabs.* 2>/dev/null || true
          git add tools/discovery/fund_sectors.* 2>/dev/null || true
          git add tools/discovery/fund_kofia_flow.* 2>/dev/null || true
          git add tools/discovery/kofia_openapi_docs.md 2>/dev/null || true
          git add tools/discovery/fund_api_catalogs.md 2>/dev/null || true
          git add tools/discovery/fund_api_detail.md 2>/dev/null || true
          git add tools/discovery/fund_gwangju.md 2>/dev/null || true
          git add tools/discovery/kofia_openapi_list.md 2>/dev/null || true
          git add tools/discovery/kofia_openapi_list2.md 2>/dev/null || true
          git add tools/discovery/fund_verify_kofia.* 2>/dev/null || true
          git commit -m "chore(fund): 원천 조사 결과 갱신" || echo "변경 없음"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push || echo "푸시 실패 (무시)"

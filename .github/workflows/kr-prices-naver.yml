name: 국내 일봉 네이버 판 수집

# **아직 기준을 바꾸는 워크플로가 아니다.** 야후 일봉과 맞대 볼 두 번째 자료를
# 받아 두는 자리다.
#
# 왜 필요한가 — 이 도구의 지표는 전부 야후 일봉으로 셈하는데, 수급 검산에서 두
# 출처가 종가를 다르게 본다는 것이 드러났다. 2026-09-17 삼성전자는 야후 252,500
# (-0.39%) · 네이버 256,000(+0.99%) 으로 **하루 등락의 부호가 뒤집혔다.** 어느 쪽이
# 맞는지는 한쪽 자료만으로 가릴 수 없어서 네이버 일봉을 따로 받아 잰다.
#
# 수급 자료(data/flows/kr100.json)의 종가를 쓰지 않는 까닭 — 거기에는 시·고·저·거래량이
# 없다. ATR·ADX·스토캐스틱·MFI·OBV·매물대가 전부 그것들을 쓴다. 네이버 종가에 야후
# 고저를 붙이면 종가가 고저 범위를 벗어난 봉이 나온다(실제로 그런 건이 있었다).
#
# 예약을 아직 안 건다. 먼저 손으로 돌려 **세 길 가운데 무엇이 살아 있는지**와
# **야후와 얼마나 갈리는지**를 본 뒤에 정한다. 쓰지도 않을 자료를 날마다 받으면서
# 네이버를 백 번씩 두드릴 까닭이 없다.

on:
  # **임시 방아쇠 — main 에 들어가면 지운다.**
  # workflow_dispatch 는 파일이 기본 가지에 있어야 단추가 생긴다(없으면 404). 그런데
  # 세 길 가운데 무엇이 살아 있는지는 **살아 있는 응답에 대고 돌려 봐야** 알 수 있고,
  # 모르는 채로 main 에 넣을 수는 없다. 수급 수집기 때 쓴 것과 같은 방식이다.
  push:
    branches:
      - 'claude/**'
    paths:
      - 'scripts/fetch_kr_prices_naver.py'
      - 'scripts/verify_kr_prices_naver.py'
      - '.github/workflows/kr-prices-naver.yml'

  workflow_dispatch:
    inputs:
      limit:
        description: '몇 종목만 (0 이면 전부). 처음에는 5 쯤으로 길부터 확인'
        required: false
        default: '5'
      years:
        description: '몇 해치'
        required: false
        default: '2'

permissions:
  contents: write

concurrency:
  group: kr-prices-naver
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 맞대 볼 야후 일봉
      - name: 종목 일봉 가지 받기
        run: |
          for i in 1 2 3 4; do
            git fetch --depth 1 origin \
              '+refs/heads/kr100-data:refs/remotes/origin/kr100-data' && exit 0
            sleep $((i * i * 2))
          done
          echo "::error::kr100-data 가지를 받지 못했습니다"; exit 1

      # 파서가 **가정한 꼴**을 제대로 읽는지, 말이 안 되는 봉을 거르는지.
      # 살아 있는 응답을 보기 전에 이것부터 통과해야 한다.
      - name: 자체 시험 (네트워크 없이)
        run: python3 scripts/check_kr_prices_naver.py

      - name: 네이버 일봉 받기
        run: |
          python3 scripts/fetch_kr_prices_naver.py \
            --limit "${{ github.event.inputs.limit || '5' }}" \
            --years "${{ github.event.inputs.years || '2' }}"

      # **검산이 막았을 때도 받은 것을 내보낸다.** 막힌 자료를 못 보면 무엇이
      # 어긋났는지 가릴 수 없다 — 수급 수집기에서 그것 때문에 한 번 더 돌려야 했다.
      - name: 받은 것 내보내기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kr-prices-naver-raw
          path: |
            data/prices_naver/kr100.json
            data/prices_naver/verify.txt
          if-no-files-found: warn

      - name: 재검산 — 야후와 맞대 보기
        run: python3 scripts/verify_kr_prices_naver.py

      - name: 커밋
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/prices_naver
          if git diff --staged --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "네이버 일봉 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          BR="${GITHUB_REF_NAME}"
          for i in 1 2 3 4 5; do
            git push origin "HEAD:refs/heads/$BR" && exit 0
            git pull --rebase --no-edit origin "$BR" || { git rebase --abort || true; \
              echo "::error::되받기 충돌 — 손으로 확인하십시오"; exit 1; }
            sleep $((i * 5))
          done
          echo "::error::다섯 번 밀어 봤지만 모두 거절됐습니다"; exit 1

      - name: 요약
        if: always()
        run: |
          if [ -f data/prices_naver/kr100.json ]; then
            python3 - <<'PY'
          import json
          d = json.load(open('data/prices_naver/kr100.json', encoding='utf-8'))
          c, r = d['coverage'], d.get('routes_used') or {}
          print("::notice::종목 %d · 날짜 %d (%s ~ %s) · 못 받음 %d · 길 %s"
                % (c['stocks'], c['days'], c['from'], c['to'], c['failed'],
                   json.dumps(r, ensure_ascii=False)))
          if not r:
              print("::error::세 길 가운데 살아 있는 것이 하나도 없습니다")
          PY
          fi
          if [ -f data/prices_naver/verify.txt ]; then
            sed -n '1,40p' data/prices_naver/verify.txt >> "$GITHUB_STEP_SUMMARY"
          fi

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>데이터센터 밸류체인 종목 맵 (단일 파일)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange: #F58220; --orange-active: #CB6015; --orange-soft: #FAB072;
      --blue: #043B72;
      --canvas: #FFFFFF; --soft: #ECEFF4; --subtle: #F7F8FA;
      --hairline: #CDCECB; --hairline-soft: #E5E4E1;
      --ink: #1A1A1A; --body: #3D3D3D; --muted: #6C6C6C; --muted-soft: #84888B;
      --up: #C62828; --down: #043B72; --success: #2E8540;
      --font-kr: 'Spoqa Han Sans Neo', 'Noto Sans KR', sans-serif;
      --font-en: 'Inter', 'Aptos', 'Segoe UI', system-ui, sans-serif;
      --font-num: 'Inter', 'SF Mono', monospace;
      --space-block: 56px; --space-content: 28px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--canvas); color: var(--body);
      font-family: var(--font-kr); font-size: 19px; line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    html[lang="en"] body { font-family: var(--font-en); }
    h1, h2, h3 { color: var(--ink); margin: 0; }
    a { color: var(--blue); text-decoration: none; border-bottom: 1px solid var(--hairline); }
    a:hover { color: var(--orange-active); border-bottom-color: var(--orange); }
    .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

    .page { max-width: 1360px; margin: 0 auto; padding: 0 32px; }

    /* ---------- 헤더 ---------- */
    .head { padding-top: 34px; padding-bottom: 22px; }
    .head-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 19px; }
    .kicker {
      font-family: var(--font-en); font-size: 14px; font-weight: 600; letter-spacing: 1.2px;
      color: var(--orange-active); text-transform: uppercase;
    }
    h1 { font-size: 34px; font-weight: 700; letter-spacing: -.3px; line-height: 1.25; margin-top: 10px; }
    .lead { font-size: 19px; color: var(--body); max-width: 74ch; margin: 14px 0 0; }
    .metarow {
      margin-top: 19px; padding-top: 14px; border-top: 1px solid var(--hairline-soft);
      font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 22px;
    }

    /* ---------- 한/영 토글 ---------- */
    .lang-toggle {
      display: inline-flex; border: 1px solid var(--hairline); border-radius: 2px;
      background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.06); overflow: hidden; flex: none;
    }
    .lang-toggle button {
      font-family: var(--font-en); font-size: 14px; font-weight: 500; letter-spacing: .5px;
      padding: 10px 17px; border: 0; background: #fff; color: var(--muted); cursor: pointer;
    }
    .lang-toggle button + button { border-left: 1px solid var(--hairline); }
    .lang-toggle button:hover:not(.on) { background: var(--subtle); color: var(--ink); }
    .lang-toggle button.on { background: var(--orange); color: #fff; }

    /* ---------- 컨트롤 ---------- */
    .controls {
      position: sticky; top: 0; z-index: 30; background: #fff;
      border-bottom: 1px solid var(--hairline-soft); padding-top: 12px; padding-bottom: 12px;
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
    }
    .seg { display: inline-flex; border: 1px solid var(--hairline); border-radius: 2px; overflow: hidden; }
    .seg button {
      font-size: 15px; font-family: inherit; padding: 8px 15px; border: 0; background: #fff;
      color: var(--muted); cursor: pointer; white-space: nowrap;
    }
    .seg button + button { border-left: 1px solid var(--hairline); }
    .seg button:hover:not(.on) { background: var(--subtle); color: var(--ink); }
    .seg button.on { background: var(--orange); color: #fff; font-weight: 500; }
    .searchwrap { position: relative; flex: 1 1 260px; min-width: 200px; max-width: 380px; }
    .searchwrap input {
      width: 100%; font-family: inherit; font-size: 16px; padding: 9px 13px;
      border: 1px solid var(--hairline); border-radius: 2px; background: #fff; color: var(--ink);
    }
    .searchwrap input:focus { outline: 2px solid var(--orange); outline-offset: -1px; border-color: transparent; }
    .legend { margin-left: auto; display: flex; gap: 16px; font-size: 14px; color: var(--muted); align-items: center; }
    .legend i { display: inline-block; width: 3px; height: 15px; margin-right: 7px; vertical-align: -2px; }
    .legend i.l { background: var(--orange); } .legend i.m { background: var(--hairline); }

    /* ---------- 레이아웃 ---------- */
    .layout { display: block; padding-top: var(--space-content); padding-bottom: 80px; }
    @media (min-width: 1200px) {
      .layout { display: grid; grid-template-columns: minmax(0, 1fr) 396px; gap: 38px; align-items: start; }
      /* 표·카드 보기에서 선택된 종목이 없으면 상세 칸을 접고 표에 폭을 준다 */
      .layout.wide { grid-template-columns: minmax(0, 1fr); }
      .layout.wide .panel { display: none; }
    }

    /* ---------- 단계 카드 ---------- */
    .stage { margin-bottom: 46px; }
    .stage-rule { height: 1px; background: var(--orange); }
    .stage-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
    .stage-no {
      font-family: var(--font-en); font-size: 14px; font-weight: 700; color: var(--orange-active);
      letter-spacing: 1px; padding-top: 4px;
    }
    .stage h2 { font-size: 26px; font-weight: 700; letter-spacing: -.2px; }
    .stage-driver { font-size: 14px; color: var(--muted); margin-left: auto; }
    .stage-desc { font-size: 17px; color: var(--body); margin: 8px 0 19px; max-width: 88ch; }
    .stage-grid { display: grid; gap: 19px; }
    @media (min-width: 760px) { .stage-grid.two { grid-template-columns: 1fr 1fr; gap: 28px; } }
    .grp-h {
      font-size: 14px; font-weight: 700; letter-spacing: .6px; color: var(--muted);
      text-transform: uppercase; font-family: var(--font-en);
      padding-bottom: 7px; border-bottom: 1px solid var(--hairline-soft); margin-bottom: 12px;
      display: flex; gap: 8px; align-items: center;
    }
    .grp-h .cnt { color: var(--muted-soft); font-weight: 500; font-family: var(--font-num); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      font-family: inherit; text-align: left; cursor: pointer;
      background: #fff; border: 1px solid var(--hairline-soft); border-left: 3px solid var(--hairline);
      border-radius: 2px; padding: 9px 13px;
      flex: 1 1 190px; min-width: 0; max-width: 340px;
      display: flex; flex-direction: column; gap: 1px;
    }
    .chip.large { border-left-color: var(--orange); }
    .chip:hover { background: var(--subtle); border-color: var(--hairline); }
    .chip:focus-visible { outline: 2px solid var(--orange); outline-offset: 1px; }
    .chip .cn { font-size: 17px; font-weight: 700; color: var(--ink); letter-spacing: -.2px; }
    .chip .cm { font-size: 13px; color: var(--muted-soft); font-family: var(--font-num); }
    .chip .cp { font-size: 13px; color: var(--muted); }
    .chip.on { background: var(--blue); border-color: var(--blue); border-left-color: var(--orange); }
    .chip.on .cn, .chip.on .cm, .chip.on .cp { color: #fff; }
    .empty { font-size: 15px; color: var(--muted-soft); padding: 6px 0 2px; }

    /* ---------- 상세 패널 ---------- */
    .panel {
      background: #fff; border: 1px solid var(--hairline); border-radius: 4px;
      padding: 0; overflow: hidden;
    }
    @media (min-width: 1200px) {
      .panel { position: sticky; top: 74px; max-height: calc(100vh - 96px); display: flex; flex-direction: column; }
      .panel-body { overflow-y: auto; }
      .panel-close { display: none; }
    }
    @media (max-width: 1199px) {
      .panel {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; border-radius: 0;
        border-left: 0; border-right: 0; border-bottom: 0; max-height: 86vh;
        display: none; flex-direction: column; box-shadow: 0 -4px 24px rgba(0,0,0,.14);
      }
      .panel.open { display: flex; }
      .panel-body { overflow-y: auto; -webkit-overflow-scrolling: touch; }
      .backdrop { position: fixed; inset: 0; background: rgba(26,26,26,.34); z-index: 55; display: none; }
      .backdrop.open { display: block; }
    }
    .panel-top {
      background: var(--blue); color: #fff; padding: 19px 22px 17px; position: relative; flex: none;
    }
    .panel-top .pn { font-size: 24px; font-weight: 700; color: #fff; letter-spacing: -.3px; line-height: 1.3; }
    .panel-top .pe { font-size: 14px; color: rgba(255,255,255,.78); font-family: var(--font-en); margin-top: 2px; }
    .panel-top .ptags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .ptag {
      font-size: 13px; font-weight: 500; padding: 3px 9px; border-radius: 2px;
      background: rgba(255,255,255,.14); color: #fff; font-family: var(--font-num);
    }
    .ptag.tier { background: var(--orange); font-family: inherit; }
    .panel-close {
      position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,.16); color: #fff;
      border: 0; border-radius: 2px; font-size: 18px; line-height: 1; padding: 7px 11px; cursor: pointer;
      font-family: var(--font-en);
    }
    .panel-close:hover { background: rgba(255,255,255,.3); }
    .panel-body { padding: 19px 22px 26px; }
    .pblock { margin-bottom: 22px; }
    .pblock:last-child { margin-bottom: 0; }
    .plabel {
      font-size: 13px; font-weight: 700; letter-spacing: .7px; text-transform: uppercase;
      color: var(--muted); font-family: var(--font-en); margin-bottom: 7px;
      padding-bottom: 5px; border-bottom: 1px solid var(--orange-soft);
    }
    .ptext { font-size: 17px; color: var(--body); line-height: 1.6; }
    .ptext strong { color: var(--ink); }
    .plist { margin: 0; padding-left: 18px; font-size: 16px; color: var(--body); line-height: 1.6; }
    .plist li { margin-bottom: 7px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      font-size: 14px; padding: 4px 10px; border-radius: 2px;
      background: var(--soft); color: var(--ink);
    }
    .quote { display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap; }
    .quote .qp { font-size: 30px; font-weight: 700; color: var(--ink); line-height: 1.1; }
    .quote .qc { font-size: 16px; font-weight: 600; }
    .quote .qc.up { color: var(--up); } .quote .qc.dn { color: var(--down); } .quote .qc.fl { color: var(--muted); }
    .qnote { font-size: 13px; color: var(--muted-soft); margin-top: 6px; }
    .peer { display: flex; flex-wrap: wrap; gap: 6px; }
    .peer button {
      font-family: inherit; font-size: 15px; padding: 5px 11px; cursor: pointer;
      background: #fff; border: 1px solid var(--hairline); border-radius: 2px; color: var(--body);
    }
    .peer button:hover { border-color: var(--orange); color: var(--ink); }
    .plinks { display: flex; flex-direction: column; gap: 8px; }
    .btn-primary {
      display: inline-block; background: var(--orange); color: #fff; border: 0; border-radius: 2px;
      font-family: inherit; font-size: 16px; font-weight: 500; padding: 10px 19px; cursor: pointer;
      text-align: center; text-decoration: none;
    }
    .btn-primary:hover { background: var(--orange-active); color: #fff; }
    .btn-ghost {
      display: inline-block; background: #fff; color: var(--body); border: 1px solid var(--hairline);
      border-radius: 2px; font-family: inherit; font-size: 15px; padding: 9px 17px; cursor: pointer;
      text-align: center; text-decoration: none;
    }
    .btn-ghost:hover { border-color: var(--orange); color: var(--ink); }
    .linkbtn {
      background: none; border: 0; border-bottom: 1px solid var(--orange); color: var(--orange-active);
      font-family: inherit; font-size: 13px; padding: 0; cursor: pointer;
    }
    .hint { padding: 46px 22px; text-align: center; color: var(--muted); font-size: 17px; }

    /* ---------- KPI · 데이터 출처 ---------- */
    .kpi {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px;
      background: var(--hairline-soft); border: 1px solid var(--hairline-soft);
      margin: 22px 0 0;
    }
    .kpi-cell { background: #fff; padding: 14px 16px 12px; }
    .kpi-label { font-size: 14px; font-weight: 500; color: var(--muted); }
    .kpi-value { font-size: 30px; font-weight: 700; line-height: 1.1; color: var(--ink); margin-top: 4px; white-space: nowrap; }
    .kpi-value.o { color: var(--orange-active); } .kpi-value.b { color: var(--blue); }
    .kpi-value.u { color: var(--up); } .kpi-value.d { color: var(--down); }
    .kpi-unit { font-size: 15px; font-weight: 500; color: var(--muted); margin-left: 3px; }
    .prov { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .prov-item {
      display: flex; align-items: center; gap: 7px; font-size: 14px; line-height: 1.35;
      border: 1px solid var(--hairline-soft); border-radius: 2px; padding: 5px 10px; background: #fff;
    }
    .prov-item b { font-weight: 600; color: var(--ink); }
    .prov-item .dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 7px; background: var(--muted-soft); }
    .prov-item.ok { border-color: #B6D7BE; background: #F4FAF5; } .prov-item.ok .dot { background: var(--success); }
    .prov-item.bad { border-color: #EBC3C3; background: #FDF6F6; } .prov-item.bad .dot { background: var(--up); }
    .prog { font-size: 14px; color: var(--muted); font-family: var(--font-num); }

    /* ---------- 표 보기 ---------- */
    .twrap { overflow-x: auto; border: 1px solid var(--hairline); border-top: 0; }
    table.data { width: 100%; border-collapse: collapse; font-size: 15px; min-width: 1080px; }
    table.data th, table.data td {
      border-bottom: 1px solid var(--hairline-soft); padding: 9px 11px; text-align: left; vertical-align: middle;
    }
    table.data thead th {
      background: var(--orange-soft); color: var(--ink); font-weight: 700; font-size: 14px;
      white-space: nowrap; border-bottom: 1px solid var(--hairline); position: sticky; top: 0; z-index: 2; cursor: pointer;
    }
    table.data thead th.plain { cursor: default; }
    table.data thead th:hover:not(.plain) { background: #F7A75C; }
    table.data thead th .ar { font-family: var(--font-num); font-size: 12px; margin-left: 3px; }
    table.data tbody tr:hover { background: var(--subtle); }
    table.data tbody tr.on { background: #FEF6EF; }
    table.data th.n, table.data td.n { text-align: right; }
    table.data td.n { font-family: var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
    table.data td.c { text-align: center; }
    .pname {
      display: block; background: none; border: 0; padding: 0; text-align: left; cursor: pointer;
      font-family: inherit; font-size: 16px; font-weight: 700; color: var(--ink); line-height: 1.3;
    }
    .pname:hover { color: var(--orange-active); }
    .psub { font-size: 12px; color: var(--muted); font-family: var(--font-num); margin-top: 2px; }
    .badge {
      display: inline-block; border: 1px solid var(--hairline); border-radius: 2px;
      padding: 1px 6px; font-size: 12px; color: var(--muted); white-space: nowrap;
    }
    .badge.lg { border-color: var(--orange-soft); background: #FEF6EF; color: var(--orange-active); }
    .up { color: var(--up); font-weight: 600; } .dn { color: var(--down); font-weight: 600; }
    .fl { color: var(--muted); }
    .star-btn { border: 0; background: none; cursor: pointer; font-size: 17px; color: var(--hairline); padding: 2px 3px; line-height: 1; }
    .star-btn:hover { color: var(--orange-soft); }
    .star-btn.on { color: var(--orange); }
    .cbox { width: 16px; height: 16px; accent-color: var(--orange); cursor: pointer; }
    .sk { display: block; }
    .wait { color: var(--muted-soft); font-family: var(--font-num); }

    /* ---------- 카드 보기 ---------- */
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 14px; }
    .card { border: 1px solid var(--hairline); border-radius: 4px; border-left: 3px solid var(--hairline); padding: 14px 16px; background: #fff; }
    .card.large { border-left-color: var(--orange); }
    .card.on { background: #FEF6EF; border-color: var(--orange); }
    .card-top { display: flex; gap: 8px; align-items: flex-start; }
    .card-metrics {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
      margin-top: 11px; border-top: 1px solid var(--hairline-soft); padding-top: 10px;
    }
    .card-metrics div { min-width: 0; }
    .card-metrics dt { font-size: 12px; color: var(--muted); }
    .card-metrics dd {
      margin: 2px 0 0; font-size: 17px; font-weight: 700; color: var(--ink);
      font-family: var(--font-num); font-variant-numeric: tabular-nums;
    }
    .card-foot { display: flex; align-items: center; gap: 8px; margin-top: 10px; }

    /* ---------- 상세: 지표 그리드 · 표 · 차트 ---------- */
    .mgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--hairline-soft); border: 1px solid var(--hairline-soft); }
    .mcell { background: #fff; padding: 10px 12px; }
    .mcell dt { font-size: 12px; color: var(--muted); }
    .mcell dd {
      margin: 3px 0 0; font-size: 19px; font-weight: 700; color: var(--ink);
      font-family: var(--font-num); font-variant-numeric: tabular-nums; line-height: 1.2;
    }
    .mcell dd.sm { font-size: 16px; }
    .mcell dd.up { color: var(--up); } .mcell dd.dn { color: var(--down); }
    table.kv { width: 100%; border-collapse: collapse; font-size: 15px; }
    table.kv th {
      text-align: left; font-weight: 500; color: var(--muted); width: 46%;
      padding: 7px 10px; border-bottom: 1px solid var(--hairline-soft); background: var(--subtle);
    }
    table.kv td {
      padding: 7px 10px; border-bottom: 1px solid var(--hairline-soft); color: var(--ink);
      text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums;
    }
    .gradebar { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; margin: 4px 0 6px; }
    .gradebar div {
      height: 24px; border-radius: 1px; background: var(--soft); display: grid; place-items: center;
      font-size: 12px; color: var(--muted); font-family: var(--font-num);
    }
    .gradebar div.on { color: #fff; font-weight: 700; }
    .gradebar div.on.g1 { background: #C62828; } .gradebar div.on.g2 { background: var(--orange-active); }
    .gradebar div.on.g3 { background: var(--orange); } .gradebar div.on.g4 { background: #0086B8; }
    .gradebar div.on.g5 { background: var(--blue); } .gradebar div.on.g6 { background: var(--muted-soft); }
    .gnote { font-size: 14px; color: var(--muted); }
    .chartbox { border: 1px solid var(--hairline-soft); background: var(--subtle); border-radius: 2px; padding: 10px; }
    .clegend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 7px; font-size: 13px; color: var(--body); }
    .clegend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 6px; }
    .rangebar { height: 8px; background: var(--soft); border-radius: 1px; position: relative; margin: 8px 0 5px; }
    .rangebar span { position: absolute; top: -3px; width: 3px; height: 14px; background: var(--orange); }
    .rangenote { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-family: var(--font-num); }

    /* ---------- 비교함 ---------- */
    .tray {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 62; background: #fff;
      border-top: 1px solid var(--orange); box-shadow: 0 -4px 16px rgba(0,0,0,.08); display: none;
    }
    .tray.open { display: block; }
    .tray-in { display: flex; align-items: center; gap: 12px; padding: 11px 32px; max-width: 1360px; margin: 0 auto; }
    .tray-title { font-size: 15px; font-weight: 700; color: var(--ink); white-space: nowrap; }
    .tray-items { display: flex; gap: 8px; flex: 1; overflow-x: auto; }
    .tray-item {
      display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--hairline);
      border-radius: 2px; padding: 5px 10px; font-size: 14px; white-space: nowrap; background: var(--subtle);
    }
    .tray-item button { border: 0; background: none; padding: 0; color: var(--muted); font-size: 15px; cursor: pointer; }
    .tray-item button:hover { color: var(--up); }
    table.cmp { width: 100%; border-collapse: collapse; font-size: 15px; min-width: 620px; }
    table.cmp th, table.cmp td { border: 1px solid var(--hairline-soft); padding: 8px 11px; vertical-align: top; }
    table.cmp thead th { background: var(--orange-soft); color: var(--ink); font-size: 14px; text-align: left; }
    table.cmp thead th:first-child { width: 160px; }
    table.cmp tbody th { background: var(--subtle); text-align: left; font-weight: 500; color: var(--muted); white-space: nowrap; }
    table.cmp td { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
    table.cmp td.best { background: #FEF6EF; font-weight: 700; color: var(--ink); }
    .cmpwrap { overflow: auto; flex: 1; }

    /* ---------- 진단 오버레이 ---------- */
    .overlay {
      position: fixed; inset: 0; z-index: 80; background: rgba(26,26,26,.5);

    /* ================= 시세 조회 =================

     * AllOrigins 의 get?callback= 응답은 { contents: "<원문>" } 형태다. */
    var JSONP_SEQ = 0;
    var JSONP_WRAPPERS = [
      { name: "JSONP(allorigins)", w: function (u, cb) {

    function jsonpText(url, wrapper) {
      return new Promise(function (res, rej) {
        var cb = "__dcjsonp" + (++JSONP_SEQ);

        function cleanup() {

    var DIAG = [];       // { tag, url, via, ok, info } — 최근 시도 기록(진단 창에서 확인)
    var DIAG_TAG = "";   // 현재 조회 중인 종목·용도 라벨
    function diagPush(e, tag) {

    function withTimeout(p, ms) {

        var timer = setTimeout(function () { rej(new Error("timeout " + ms + "ms")); }, ms);
        p.then(function (v) { clearTimeout(timer); res(v); }, function (e) { clearTimeout(timer); rej(e); });
      });

    /* validate(text): 유효하지 않으면 throw → 그 경로는 탈락(프록시 에러 페이지가 이기지 못하게) */
    function fetchVia(url, validate) {
      var busted = url + (url.indexOf("?") >= 0 ? "&" : "?") + "_ts=" + Date.now();
      var tag = DIAG_TAG;   // 비동기 응답이 도착할 때는 전역 태그가 바뀌어 있으므로 여기서 붙잡아 둔다
      function record(name, txt) {
        var out = validate(txt);

        return out;
      }
      function fail(name, e) {
        diagPush({ url: url, via: name, ok: false, info: String((e && e.message) || e) }, tag);
        throw e;
      }

          .then(function (txt) { return record(jp.name, txt); })

        return withTimeout(
          fetch(p.w(busted), { headers: { Accept: "application/json, text/plain, */*" }, cache: "no-store" })
            .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
            .then(function (txt) { return record(p.name, txt); })

      return new Promise(function (res, rej) {
        var left = attempts.length, err;
        attempts.forEach(function (p) { p.then(res, function (e) { err = e; if (--left === 0) rej(err); }); });

    function fetchJson(url) {

    var NAVER = "https://m.stock.naver.com/api/stock/";
    /* 네이버 basic: 등락폭은 절대값이므로 방향 코드(하락=4·5)로 부호를 보정 */
    function parseNaverBasic(d) {
      var price = n(d && d.closePrice);
      if (price == null) throw new Error("naver: no price");
      var chg = n(d.compareToPreviousClosePrice);
      var pct = n(d.fluctuationsRatio);
      var cmp = d.compareToPreviousPrice || {};
      var dir = String(cmp.code || cmp.text || d.risefall || "");
      if (/하락|down|▼/.test(dir) || /^[45]/.test(dir)) {

        var b = n(rows[1] && (rows[1].closePrice || rows[1].closeVal));
        if (a == null) throw new Error("naver price: empty");
        return { price: a, chg: b != null ? a - b : null, pct: b ? ((a - b) / b) * 100 : null, cur: "KRW", src: "네이버 일별시세" };

    }
    /* 네이버 실시간 폴링 엔드포인트 — rf 코드로 방향 판정(4·5 = 하락) */
    function quoteNaverPolling(code) {
      return fetchJson("https://polling.finance.naver.com/api/realtime/domestic/stock/" + code).then(function (d) {
        var r = d && ((d.datas && d.datas[0]) || (d.result && d.result.areas && d.result.areas[0] &&
          d.result.areas[0].datas && d.result.areas[0].datas[0]));

    /* Stooq(무료 CSV) — 최후 폴백. KR은 {code}.kr, 미국은 {ticker}.us */

    function fmtPrice(v, cur) {

    /* ================= 종목별 지표 =================

     * 라벨(한글 항목명)까지 훑는 관용적 파서를 쓴다. 못 찾은 값은 화면에 "-"로 남는다.
     */
    var RF = 3.0;          // 샤프지수 계산에 쓰는 무위험수익률(연 %) — 표기용 고정값
    var MET = {};          // id -> 지표 객체

    function ymd(d) {
      function p(x) { return x < 10 ? "0" + x : "" + x; }

    /* 네이버 siseJson 은 작은따옴표를 쓰는 느슨한 배열 표기라 JSON.parse 전에 손질한다 */
    function fetchLoose(url) {
      return fetchVia(url, function (txt) {
        var s = txt.replace(/^﻿/, "").trim();

        if (i < 0) throw new Error("not array");
        var j = JSON.parse(s.slice(i).replace(/'/g, '"').replace(/,\s*(?=[\]}])/g, ""));

      });

    /* ---- 시계열(최근 12개월 일별 종가) ---- */
    function seriesNaver(code) {
      var end = new Date(), start = new Date(end.getTime() - 400 * 864e5);
      return fetchLoose("https://api.finance.naver.com/siseJson.naver?symbol=" + encodeURIComponent(code) +
        "&requestType=1&startTime=" + ymd(start) + "&endTime=" + ymd(end) + "&timeframe=day").then(function (rows) {
        var out = [];
        rows.forEach(function (r) {

    /* ---- 시계열 → 지표 ---- */
    function retOver(s, ms) {

      var last = s[s.length - 1];
      if (last.t - s[0].t < ms * 0.75) return null;   // 기간이 부족하면 값을 만들지 않는다
      var target = last.t - ms, base = null;

      if (!base) base = s[0];

    function statsOf(s) {

    /* ---- 스파크라인 · 라인차트 (라이브러리 없이 인라인 SVG) ---- */

        [t("kpiAvg"), avg == null ? DASH : fmtPct(avg, 2), "", avg == null ? "" : avg < 0 ? "d" : "u"],
        [t("kpiWatch"), String(state.watch.length), t("unitCnt"), "b"]
      ];
      els.kpi.innerHTML = cells.map(function (c) {
        return '<div class="kpi-cell"><dt class="kpi-label">' + esc(c[0]) + "</dt>" +

    function provStat(rows, get) {
      var loaded = rows.filter(function (c) { return MET[c.id]; });
      if (!loaded.length) return "idle";
      var have = loaded.filter(function (c) { return get(MET[c.id]) != null; }).length;
      if (!have) return "fail";
      return have === loaded.length ? "ok" : "part";
    }
    function renderProv() {
      var rows = visibleList();
      var items = [
        [t("provQuote"), t("provSrcQuote"), provStat(rows, function (m) { return m.price; })],
        [t("provSeries"), t("provSrcSeries"), provStat(rows, function (m) { return m.vol; })],
        [t("provFund"), t("provSrcFund"), provStat(rows, function (m) { return m.cap != null ? m.cap : m.per; })]
      ];
      els.prov.innerHTML = items.map(function (it) {
        var cls = it[2] === "ok" ? "ok" : it[2] === "fail" ? "bad" : "";
        var label = it[2] === "ok" ? t("provOk") : it[2] === "fail" ? t("provFail")
          : it[2] === "part" ? t("provPart") : t("provIdle");
        return '<span class="prov-item ' + cls + '"><span class="dot"></span>' +
          "<b>" + esc(it[0]) + "</b> " + esc(label) + ' <span style="color:var(--muted)">· ' + esc(it[1]) + "</span></span>";
      }).join("");

    /* ================= 표 · 카드 보기 ================= */
    var SORTS = ["default", "chg", "1m", "3m", "1y", "cap", "per", "dvr", "vol", "name"];
    var SORT_KEY = { chg: "pct", "1m": "r1m", "3m": "r3m", "1y": "r1y", per: "per", dvr: "dvr", vol: "vol" };
    function stageIndex(c) {
      var first = (c.stages || [])[0];
      for (var i = 0; i < STAGES.length; i++) if (STAGES[i].id === first) return i;
      return 99;
    }
    function sortedList() {
      var rows = visibleList().slice();
      var s = state.sort;
      if (s === "default") {
        rows.sort(function (a, b) {
          return stageIndex(a) - stageIndex(b) ||
            (isKR(a) === isKR(b) ? 0 : isKR(a) ? -1 : 1) ||
            (a.tier === b.tier ? 0 : a.tier === "대형" ? -1 : 1) ||
            L(a, "name").localeCompare(L(b, "name"));
        });
        return rows;
      }
      if (s === "name") {
        rows.sort(function (a, b) { return L(a, "name").localeCompare(L(b, "name")); });
        return rows;
      }
      var asc = s === "per" || s === "vol";
      var key = s === "cap" ? null : SORT_KEY[s];
      rows.sort(function (a, b) {
        var va = s === "cap" ? capKrw(MET[a.id]) : (MET[a.id] ? MET[a.id][key] : null);
        var vb = s === "cap" ? capKrw(MET[b.id]) : (MET[b.id] ? MET[b.id][key] : null);
        if (va == null && vb == null) return stageIndex(a) - stageIndex(b);
        if (va == null) return 1;      // 값이 없는 종목은 항상 뒤로
        if (vb == null) return -1;
        return asc ? va - vb : vb - va;
      });
      return rows;
    }

    function stageCell(c) {

    var TABLE_COLS = [
      { id: "watch", label: "colWatch", cls: "c", plain: true, r: starHtml },

          return m ? esc(fmtPrice(m.price, m.cur)) : '<span class="wait">·</span>'; } },
      { id: "chg", label: "colChg", cls: "n", sort: "chg", r: function (c, m) { return chgCell(m); } },
      { id: "trend", label: "colTrend", cls: "c", plain: true, r: function (c, m) {
          return m && m.spark ? sparkSvg(m.spark, 92, 26) : '<span class="wait">·</span>'; } },
      { id: "r1m", label: "col1m", cls: "n", sort: "1m", r: function (c, m) { return retCell(m, "r1m"); } },
      { id: "r3m", label: "col3m", cls: "n", sort: "3m", r: function (c, m) { return retCell(m, "r3m"); } },
      { id: "r1y", label: "col1y", cls: "n", sort: "1y", r: function (c, m) { return retCell(m, "r1y"); } },
      { id: "cap", label: "colCap", cls: "n", sort: "cap", r: function (c, m) {
          return m ? esc(fmtCap(m.cap, m.cur, m.capTxt)) : '<span class="wait">·</span>'; } },
      { id: "per", label: "colPer", cls: "n", sort: "per", r: function (c, m) { return m ? fmtPlain(m.per) : "·"; } },
      { id: "pbr", label: "colPbr", cls: "n", plain: true, r: function (c, m) { return m ? fmtPlain(m.pbr) : "·"; } },
      { id: "dvr", label: "colDvr", cls: "n", sort: "dvr", r: function (c, m) {
          return !m ? '<span class="wait">·</span>' : m.dvr != null ? m.dvr.toFixed(2) + "%" : DASH; } },
      { id: "vol", label: "colVol", cls: "n", sort: "vol", r: function (c, m) {
          return !m ? '<span class="wait">·</span>' : m.vol != null ? m.vol.toFixed(1) + "%" : DASH; } },
      { id: "cmp", label: "colCmp", cls: "c", plain: true, r: cmpHtml }
    ];

    function renderTable(rows) {
      var head = TABLE_COLS.map(function (col) {
        var on = col.sort && state.sort === col.sort;
        return '<th class="' + (col.cls === "n" ? "n " : "") + (col.plain ? "plain" : "") + '"' +
          (col.sort ? ' data-sort="' + col.sort + '"' : "") + ">" + esc(t(col.label)) +
          (on ? '<span class="ar">▼</span>' : "") + "</th>";
      }).join("");
      var body = rows.map(function (c) {
        var m = MET[c.id];
        return '<tr' + (state.sel === c.id ? ' class="on"' : "") + ' data-row="' + esc(c.id) + '">' +
          TABLE_COLS.map(function (col) {
            return "<td" + (col.cls ? ' class="' + col.cls + '"' : "") + ">" + col.r(c, m) + "</td>";
          }).join("") + "</tr>";
      }).join("");
      return '<div class="twrap"><table class="data"><thead><tr>' + head + "</tr></thead><tbody>" +
        body + "</tbody></table></div>";
    }

    function renderCards(rows) {
      return '<div class="cards">' + rows.map(function (c) {
        var m = MET[c.id];
        return '<div class="card ' + (c.tier === "대형" ? "large" : "mid") + (state.sel === c.id ? " on" : "") + '">' +
          '<div class="card-top"><div style="flex:1;min-width:0">' + nameCell(c) +
            '<div style="margin-top:5px"><span class="badge">' + esc(stageNames(c)[0] || DASH) + "</span></div>" +
          "</div>" + starHtml(c) + "</div>" +
          '<dl class="card-metrics">' +
            "<div><dt>" + esc(t("colPrice")) + "</dt><dd>" + (m ? esc(fmtPrice(m.price, m.cur)) : "·") + "</dd></div>" +
            "<div><dt>" + esc(t("colChg")) + "</dt><dd>" + chgCell(m) + "</dd></div>" +
            "<div><dt>" + esc(t("col1y")) + "</dt><dd>" + retCell(m, "r1y") + "</dd></div>" +
          "</dl>" +
          '<div class="card-foot">' + (m && m.spark ? sparkSvg(m.spark, 130, 26) : "") +
            '<button class="btn-ghost" style="margin-left:auto;font-size:14px;padding:6px 12px" data-select="' +
              esc(c.id) + '">' + esc(t("lbKey")) + "</button>" +

    function renderBody() {
      if (state.view === "map") { renderMap(); return; }
      var rows = sortedList();
      if (!rows.length) {
        els.map.innerHTML = '<p class="empty" style="font-size:17px;padding:40px 0;">' + esc(t("noResult")) + "</p>";
        return;
      }
      els.map.innerHTML = state.view === "table" ? renderTable(rows) : renderCards(rows);
    }

    /* ================= 관심종목 · 비교함 ================= */
    function toggleWatch(id) {
      var i = state.watch.indexOf(id);
      if (i >= 0) state.watch.splice(i, 1); else state.watch.push(id);
      try { localStorage.setItem("dcWatch", JSON.stringify(state.watch)); } catch (e) {}
      renderBody(); renderKpi();
      if (state.sel) renderPanelChrome();
    }
    function toggleCmp(id) {
      var i = state.cmp.indexOf(id);
      if (i >= 0) state.cmp.splice(i, 1);
      else {
        if (state.cmp.length >= 4) state.cmp.shift();
        state.cmp.push(id);
        var c = BY_ID[id];
        if (c) enqueue([c]);
      }
      renderBody(); renderTray();
      if (state.sel) renderPanelChrome();
    }
    function renderTray() {
      els.tray.classList.toggle("open", state.cmp.length > 0);
      els.trayItems.innerHTML = state.cmp.map(function (id) {
        var c = BY_ID[id];
        return '<span class="tray-item">' + esc(c ? L(c, "name") : id) +
          '<button data-drop="' + esc(id) + '" aria-label="' + esc(t("cmpClear")) + '">&times;</button></span>';
      }).join("");
    }
    var CMP_ROWS = [
      { label: "colPrice", txt: function (m) { return fmtPrice(m.price, m.cur); } },
      { label: "colChg", v: "pct", best: "max", txt: function (m) { return fmtPct(m.pct, 2); } },
      { label: "col1m", v: "r1m", best: "max", txt: function (m) { return fmtPct(m.r1m); } },
      { label: "col3m", v: "r3m", best: "max", txt: function (m) { return fmtPct(m.r3m); } },
      { label: "col6m", v: "r6m", best: "max", txt: function (m) { return fmtPct(m.r6m); } },
      { label: "col1y", v: "r1y", best: "max", txt: function (m) { return fmtPct(m.r1y); } },
      { label: "rExcess", v: "excess", best: "max", txt: function (m) { return fmtPct(m.excess); } },
      { label: "colCap", txt: function (m) { return fmtCap(m.cap, m.cur, m.capTxt); } },
      { label: "colPer", v: "per", best: "min", txt: function (m) { return fmtPlain(m.per); } },
      { label: "colPbr", v: "pbr", best: "min", txt: function (m) { return fmtPlain(m.pbr); } },
      { label: "colDvr", v: "dvr", best: "max", txt: function (m) { return m.dvr == null ? DASH : m.dvr.toFixed(2) + "%"; } },
      { label: "riskVol", v: "vol", best: "min", txt: function (m) { return m.vol == null ? DASH : m.vol.toFixed(1) + "%"; } },
      { label: "riskSharpe", v: "sharpe", best: "max", txt: function (m) { return fmtPlain(m.sharpe); } },
      { label: "riskMdd", v: "mdd", best: "max", txt: function (m) { return m.mdd == null ? DASH : m.mdd.toFixed(1) + "%"; } },
      { label: "mHi52", txt: function (m) { return fmtPrice(m.hi52, m.cur); } },
      { label: "mLo52", txt: function (m) { return fmtPrice(m.lo52, m.cur); } }
    ];
    function openCmp() {
      var list = state.cmp.map(function (id) { return BY_ID[id]; }).filter(Boolean);
      var box = document.getElementById("cmpBody");
      if (list.length < 2) {
        box.innerHTML = '<p class="ptext" style="padding:22px 2px">' + esc(t("cmpNeed")) + "</p>";
      } else {
        var head = "<tr><th>" + esc(t("cmpItem")) + "</th>" + list.map(function (c) {
          return "<th>" + esc(L(c, "name")) + '<br><span class="badge">' + esc(c.tk) + "</span></th>";
        }).join("") + "</tr>";
        var body = CMP_ROWS.map(function (row) {
          var vals = list.map(function (c) { return MET[c.id] || {}; });
          var best = null;
          if (row.v) {
            vals.forEach(function (m) {
              var v = m[row.v];
              if (v == null) return;
              if (best == null) best = v;
              else best = row.best === "min" ? Math.min(best, v) : Math.max(best, v);
            });
          }
          return "<tr><th>" + esc(t(row.label)) + "</th>" + vals.map(function (m) {
            var isBest = row.v && best != null && m[row.v] === best && vals.length > 1;
            return '<td class="' + (isBest ? "best" : "") + '">' + esc(row.txt(m)) + "</td>";
          }).join("") + "</tr>";
        }).join("");
        box.innerHTML = '<table class="cmp"><thead>' + head + "</thead><tbody>" + body + "</tbody></table>";
      }
      document.getElementById("cmpOverlay").style.display = "flex";
    }

    /* ================= CSV 저장 ================= */
    function csvCell(v) {
      if (typeof v === "number") v = Math.round(v * 100) / 100;   // 표시용 소수 2자리
      var s = v == null ? "" : String(v);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }
    function saveCsv() {
      var rows = sortedList();
      var head = [t("colStage"), state.lang === "en" ? "Region" : "지역", t("colName"),
        state.lang === "en" ? "Name (EN)" : "영문명", "Ticker", state.lang === "en" ? "Market" : "시장",
        t("colTier"), t("colPrice"), state.lang === "en" ? "Currency" : "통화", t("mChg"), t("colChg"),
        t("col1m"), t("col3m"), t("col6m"), t("col1y"), t("rExcess"), t("colCap"), t("colPer"), t("colPbr"),
        t("colDvr"), t("riskVol"), t("riskSharpe"), t("riskMdd"), t("mHi52"), t("mLo52"), t("mVolu"),
        state.lang === "en" ? "Source" : "데이터 출처"];
      var lines = [head.map(csvCell).join(",")];
      rows.forEach(function (c) {
        var m = MET[c.id] || {};
        lines.push([
          stageNames(c).join(" / "), isKR(c) ? t("regKr") : t("regOv"), L(c, "name"), c.nameEn, c.tk, c.mkt,
          tierLabel(c), m.price, m.cur, m.chg, m.pct, m.r1m, m.r3m, m.r6m, m.r1y, m.excess,
          m.cap != null ? m.cap : m.capTxt, m.per, m.pbr, m.dvr, m.vol, m.sharpe, m.mdd, m.hi52, m.lo52, m.volu,
          [m.srcQuote, m.srcSeries, m.srcFund].filter(Boolean).join(" / ")
        ].map(csvCell).join(","));
      });
      var blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8;" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "datacenter-value-chain-" + ymd(new Date()) + ".csv";
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.parentNode.removeChild(a); }, 0);
    }
    /* 상세 패널의 시세 · 핵심지표 · 추이 · 위험 블록을 한 번의 지표 조회로 모두 채운다 */
    function loadDetail(c) {
      var q = document.getElementById("quoteBox");
      if (!q) return;
      q.innerHTML = '<div class="qnote">' + esc(t("loading")) + "</div>";
      ["keyBox", "perfBox", "riskBox"].forEach(function (id) {
        var b = document.getElementById(id);
        if (b) b.innerHTML = '<div class="qnote">' + esc(t("metLoading")) + "</div>";
      });
      loadMetrics(c).then(function (m) {
        if (state.sel !== c.id) return;
        fillDetail(c, m);
        renderKpi(); renderProv();
        if (state.view !== "map") renderBody();
      });
    }
    function fillDetail(c, m) {
      var q = document.getElementById("quoteBox");
      if (!q) return;
      /* --- 시세 --- */
      if (!m || m.price == null) {
        q.innerHTML = '<div class="qnote">' + esc(t("quoteFail")) + " " +
          '<button class="linkbtn" id="diagOpen2">' + esc(t("diagBtn")) + "</button></div>";
        var b0 = document.getElementById("diagOpen2");
        if (b0) b0.addEventListener("click", openDiag);
      } else {
        var sign = m.chg == null ? "" : m.chg > 0 ? "+" : "";
        var chgTxt = m.chg == null ? "" : sign + fmtPrice(m.chg, m.cur) +
          (m.pct != null ? " (" + sign + m.pct.toFixed(2) + "%)" : "");
        q.innerHTML =
          '<div class="quote"><span class="qp num">' + esc(fmtPrice(m.price, m.cur)) + "</span>" +
          (chgTxt ? '<span class="qc num ' + signCls(m.chg) + '">' + esc(chgTxt) + "</span>" : "") + "</div>" +
          '<div class="qnote">' + esc(m.srcQuote || m.srcSeries || "") + " · " +
            esc(t("quoteVia")) + " " + esc(fmtTime(new Date(m.at))) + "</div>";
      }
      /* --- 핵심지표 --- */
      var key = document.getElementById("keyBox");
      if (key) {
        var cells = [
          [t("mPrice"), fmtPrice(m && m.price, m && m.cur), ""],
          [t("mChg"), m && m.pct != null ? fmtPct(m.pct, 2) : DASH, m ? signCls(m.pct) : ""],
          [t("mCap"), m ? fmtCap(m.cap, m.cur, m.capTxt) : DASH, "sm"],
          [t("mPer"), m ? fmtPlain(m.per) : DASH, ""],
          [t("mPbr"), m ? fmtPlain(m.pbr) : DASH, ""],
          [t("mDvr"), m && m.dvr != null ? m.dvr.toFixed(2) + "%" : DASH, ""],
          [t("mHi52"), fmtPrice(m && m.hi52, m && m.cur), "sm"],
          [t("mLo52"), fmtPrice(m && m.lo52, m && m.cur), "sm"],
          [t("mVolu"), m ? fmtVolume(m.volu) : DASH, "sm"]
        ];
        var html = '<dl class="mgrid">' + cells.map(function (x) {
          return '<div class="mcell"><dt>' + esc(x[0]) + '</dt><dd class="' + x[2] + '">' + esc(x[1]) + "</dd></div>";
        }).join("") + "</dl>";
        if (m && m.price != null && m.hi52 != null && m.lo52 != null && m.hi52 > m.lo52) {
          var pos = Math.max(0, Math.min(1, (m.price - m.lo52) / (m.hi52 - m.lo52)));
          html += '<div style="margin-top:12px"><div class="qnote" style="margin:0 0 2px">' + esc(t("mRange")) +
            " · " + (pos * 100).toFixed(0) + '%</div><div class="rangebar"><span style="left:calc(' +
            (pos * 100).toFixed(1) + '% - 1px)"></span></div><div class="rangenote"><span>' +
            esc(fmtPrice(m.lo52, m.cur)) + "</span><span>" + esc(fmtPrice(m.hi52, m.cur)) + "</span></div></div>";
        }
        key.innerHTML = html;
      }
      /* --- 수익률 · 추이 --- */
      var perf = document.getElementById("perfBox");
      if (perf) {
        if (m && m.full && m.full.length > 2) {
          var sets = [{ name: L(c, "name"), color: "#F58220", data: rebase(m.full.map(function (p) { return p.c; })) }];
          if (m.benchFull) sets.push({ name: m.benchName, color: "#043B72", dash: true,
            data: rebase(m.benchFull.map(function (p) { return p.c; })) });
          var rows = [["r1m", m.r1m], ["r3m", m.r3m], ["r6m", m.r6m], ["r1y", m.r1y], ["rExcess", m.excess]];
          perf.innerHTML =
            '<div class="chartbox">' + lineChartSvg(sets, 340, 168) + "</div>" +
            '<div class="clegend">' + sets.map(function (s) {
              return '<span><i style="background:' + s.color + '"></i>' + esc(s.name) + "</span>";
            }).join("") + "</div>" +
            '<table class="kv" style="margin-top:12px">' + rows.map(function (r) {
              return "<tr><th>" + esc(t(r[0])) + '</th><td class="' + signCls(r[1]) + '">' + esc(fmtPct(r[1])) + "</td></tr>";
            }).join("") + "</table>" +
            '<p class="qnote">' + esc(t("perfNote")) + "</p>";
        } else {
          perf.innerHTML = '<div class="qnote">' + esc(t("metFail")) + "</div>";
        }
      }
      /* --- 변동성 · 위험 --- */
      var risk = document.getElementById("riskBox");
      if (risk) {
        var g = m ? volGrade(m.vol) : null;
        var bar = "";
        for (var i = 1; i <= 6; i++) bar += '<div class="' + (i === g ? "on g" + i : "") + '">' + i + "</div>";
        risk.innerHTML =
          '<div class="gradebar">' + bar + "</div>" +
          '<p class="gnote">' + esc(g ? t("g" + g) : DASH) + "</p>" +
          '<table class="kv" style="margin-top:10px">' +
            "<tr><th>" + esc(t("riskVol")) + "</th><td>" + (m && m.vol != null ? m.vol.toFixed(1) + "%" : DASH) + "</td></tr>" +
            "<tr><th>" + esc(t("riskSharpe")) + "</th><td>" + (m ? fmtPlain(m.sharpe) : DASH) + "</td></tr>" +
            "<tr><th>" + esc(t("riskMdd")) + '</th><td class="dn">' + (m && m.mdd != null ? m.mdd.toFixed(1) + "%" : DASH) + "</td></tr>" +
          "</table>" +
          '<p class="qnote">' + esc(t("gradeNote")) + "</p>";
      }
    }

    /* ================= 시세 진단 ================= */
    function diagText() {
      var c = state.sel ? BY_ID[state.sel] : null;
      var L2 = [];
      L2.push("=== 시세 조회 진단 ===");
      L2.push("종목: " + (c ? c.name + " (" + c.tk + " / " + c.mkt + ", ysym=" + c.ysym + ")" : "-"));
      L2.push("시각: " + fmtTime(new Date()));
      L2.push("페이지 프로토콜: " + location.protocol + (LOCAL_PROXY ? " (로컬 프록시 경로 사용 가능)" : " (file:// — 로컬 프록시 사용 불가)"));
      L2.push("User-Agent: " + navigator.userAgent);
      L2.push("온라인 상태: " + navigator.onLine);
      L2.push("");
      L2.push("--- 시도 기록 " + DIAG.length + "건 (소스별 × 경로별) ---");
      DIAG.forEach(function (d, i) {
        L2.push("[" + (i + 1) + "] " + (d.ok ? "OK  " : "FAIL") + " via " + d.via + (d.tag ? "  — " + d.tag : ""));
        L2.push("     " + d.url);
        L2.push("     " + d.info);
      });
      if (!DIAG.length) L2.push("(기록 없음 — 종목을 클릭해 시세를 한 번 조회한 뒤 다시 확인하세요)");
      L2.push("");
      L2.push("[경로 설명]");
      L2.push("JSONP(...)  : <script> 태그로 불러오는 CORS 우회 경로. HTML 파일만 열었을 때(file://) 동작하는 경로.");
      L2.push("직접 호출    : 시세 API를 그대로 호출. 대상 서버가 CORS 를 허용해야 성공.");
      L2.push("공개 프록시  : codetabs / corsproxy.io / allorigins 등이 대신 호출.");
      L2.push("로컬 프록시  : serve.py 로 접속했을 때만 사용 가능(가장 확실).");
      L2.push("");
      L2.push("[대응 방법]");
      L2.push("1) JSONP 경로가 FAIL 이면 api.allorigins.win 접근이 막힌 것 — 방화벽/보안장비 정책 확인");
      L2.push("2) 모든 경로가 FAIL 이면 m.stock.naver.com · query1.finance.yahoo.com 접근 자체가 차단된 상태");
      L2.push("3) 파일 단독 실행이 아니어도 된다면: python3 serve.py 실행 후 http://localhost:8000/datacenter.html");
      L2.push("   (HTTPS_PROXY=http://사내프록시:포트 python3 serve.py 로 사내 프록시 경유 가능)");
      return L2.join("\n");
    }
    function openDiag() {
      var ov = document.getElementById("diagOverlay");
      document.getElementById("diagText").value = diagText();
      ov.style.display = "flex";
    }

    /* ================= 상세 패널 ================= */
    function stageNames(c) {
      return (c.stages || []).map(function (id) {
        var st = STAGES.filter(function (s) { return s.id === id; })[0];
        return st ? st.no + " " + L(st, "name") : id;
      });
    }
    function peersOf(c) {
      var first = (c.stages || [])[0];
      return ALL.filter(function (o) {
        return o.id !== c.id && (o.stages || []).indexOf(first) >= 0 &&
          (state.region === "all" || (state.region === "KR" ? isKR(o) : !isKR(o)));
      }).slice(0, 8);
    }
    function renderPanel() {
      var c = state.sel ? BY_ID[state.sel] : null;
      if (!c) {
        els.panel.innerHTML =
          '<div class="hint"><span class="hb">' + esc(t("hintTitle")) + "</span>" +
          "<span>" + esc(t("hintBody")) + "</span></div>";
        els.panel.classList.remove("open");
        els.backdrop.classList.remove("open");
        return;
      }
      var links = "";
      if (isKR(c)) {
        links += '<a class="btn-primary" href="standalone.html?code=' + esc(c.id) + '">' + esc(t("openReport")) + "</a>";
        links += '<a class="btn-ghost" target="_blank" rel="noopener" href="https://finance.naver.com/item/main.naver?code=' +
          esc(c.id) + '">' + esc(t("naver")) + "</a>";
      }
      links += '<a class="btn-ghost" target="_blank" rel="noopener" href="https://finance.yahoo.com/quote/' +
        encodeURIComponent(c.ysym) + '">' + esc(t("yahoo")) + "</a>";

      els.panel.innerHTML =
        '<div class="panel-top">' +
          '<button class="panel-close" id="panelClose" aria-label="' + esc(t("close")) + '">&times;</button>' +
          '<div class="pn">' + esc(L(c, "name")) + "</div>" +
          '<div class="pe">' + esc(state.lang === "en" ? c.name : c.nameEn) + "</div>" +
          '<div class="ptags">' +
            '<span class="ptag tier">' + esc(tierLabel(c)) + "</span>" +
            '<span class="ptag">' + esc(c.tk) + "</span>" +
            '<span class="ptag">' + esc(c.mkt) + "</span>" +
          "</div>" +
        "</div>" +
        '<div class="panel-body">' +
          '<div class="pblock"><div class="plabel">' + esc(t("lbQuote")) + "</div>" +
            '<div id="quoteBox"></div></div>' +
          '<div class="pblock"><div class="plabel">' + esc(t("lbKey")) + "</div>" +
            '<div id="keyBox"></div></div>' +
          '<div class="pblock"><div class="plabel">' + esc(t("lbPerf")) + "</div>" +
            '<div id="perfBox"></div></div>' +
          '<div class="pblock"><div class="plabel">' + esc(t("lbRisk")) + "</div>" +
            '<div id="riskBox"></div></div>' +
          '<div class="pblock"><div class="plabel">' + esc(t("lbPos")) + "</div>" +
            '<div class="ptext"><strong>' + esc(L(c, "pos")) + "</strong></div></div>" +
          '<div class="pblock"><div class="plabel">' + esc(t("lbSum")) + "</div>" +
            '<div class="ptext">' + esc(L(c, "sum")) + "</div></div>" +
          '<div class="pblock"><div class="plabel">' + esc(t("lbPts")) + "</div>" +
            "<ul class=\"plist\">" + (L(c, "pts") || []).map(function (x) {
              return "<li>" + esc(x) + "</li>";
            }).join("") + "</ul></div>" +
          '<div class="pblock"><div class="plabel">' + esc(t("lbProd")) + "</div>" +
            '<div class="tags">' + (L(c, "prod") || []).map(function (x) {
              return '<span class="tag">' + esc(x) + "</span>";
            }).join("") + "</div></div>" +
          '<div class="pblock"><div class="plabel">' + esc(t("lbEdge")) + "</div>" +
            '<div class="ptext">' + esc(L(c, "edge")) + "</div></div>" +
          '<div class="pblock"><div class="plabel">' + esc(t("lbStage")) + "</div>" +
            '<div class="tags">' + stageNames(c).map(function (x) {
              return '<span class="tag">' + esc(x) + "</span>";
            }).join("") + "</div></div>" +
          '<div class="pblock"><div class="plabel">' + esc(t("lbPeer")) + "</div>" +
            '<div class="peer">' + peersOf(c).map(function (o) {
              return '<button data-id="' + esc(o.id) + '">' + esc(L(o, "name")) + "</button>";
            }).join("") + "</div></div>" +
          '<div class="pblock"><div class="plabel">' + esc(t("lbLink")) + "</div>" +
            '<div class="plinks">' +
              '<div style="display:flex;gap:8px">' +
                '<button class="btn-ghost" id="pWatch" style="flex:1"></button>' +
                '<button class="btn-ghost" id="pCmp" style="flex:1"></button>' +
              "</div>" + links + "</div></div>" +
        "</div>";

      els.panel.classList.add("open");
      els.backdrop.classList.add("open");
      document.getElementById("panelClose").addEventListener("click", function () { select(null); });
      els.panel.querySelectorAll(".peer button").forEach(function (b) {
        b.addEventListener("click", function () { select(b.getAttribute("data-id")); });
      });
      document.getElementById("pWatch").addEventListener("click", function () { toggleWatch(c.id); });
      document.getElementById("pCmp").addEventListener("click", function () { toggleCmp(c.id); });
      renderPanelChrome();
      if (MET[c.id]) fillDetail(c, MET[c.id]); else loadDetail(c);
    }
    /* 관심·비교 버튼 라벨만 갱신(패널 전체를 다시 그리지 않는다) */
    function renderPanelChrome() {
      var w = document.getElementById("pWatch"), m = document.getElementById("pCmp");
      if (!w || !m || !state.sel) return;
      var onW = state.watch.indexOf(state.sel) >= 0;
      w.textContent = onW ? t("watchOn") : t("watchOff");
      w.style.borderColor = onW ? "var(--orange)" : "";
      m.textContent = state.cmp.indexOf(state.sel) >= 0 ? t("cmpIn") : t("cmpAdd");
    }

    function select(id) {
      state.sel = id && BY_ID[id] ? id : null;
      var lay = document.querySelector(".layout");
      if (lay) lay.classList.toggle("wide", state.view !== "map" && !state.sel);
      renderBody();
      renderPanel();
      if (state.sel) {
        if (history.replaceState) history.replaceState(null, "", "#" + state.sel);
        var body = els.panel.querySelector(".panel-body");
        if (body) body.scrollTop = 0;
      } else if (history.replaceState) {
        history.replaceState(null, "", location.pathname + location.search);
      }
    }

    /* ================= 언어 · 필터 ================= */
    function applyLang() {
      document.documentElement.setAttribute("lang", state.lang);
      document.title = t("docTitle");
      els.langKo.classList.toggle("on", state.lang === "ko");
      els.langEn.classList.toggle("on", state.lang === "en");
      els.langKo.setAttribute("aria-checked", String(state.lang === "ko"));
      els.langEn.setAttribute("aria-checked", String(state.lang === "en"));
      document.querySelectorAll("[data-i18n]").forEach(function (el) {
        var key = el.getAttribute("data-i18n");
        if (I18N[state.lang][key] != null) el.textContent = I18N[state.lang][key];
      });
      els.q.placeholder = t("search");
      els.sortSel.innerHTML = SORTS.map(function (s) {
        var key = "sort" + s.charAt(0).toUpperCase() + s.slice(1);
        return '<option value="' + s + '"' + (s === state.sort ? " selected" : "") + ">" + esc(t(key)) + "</option>";
      }).join("");
      els.sortSel.setAttribute("aria-label", t("sortLabel"));
      try { localStorage.setItem("dcLang", state.lang); } catch (e) {}
      renderMeta(); renderAll(); renderPanel();
    }
    function renderAll() {
      els.sortSel.style.display = state.view === "map" ? "none" : "";
      var lay = document.querySelector(".layout");
      if (lay) lay.classList.toggle("wide", state.view !== "map" && !state.sel);
      renderBody(); renderKpi(); renderProv(); renderTray(); renderProg();
    }

    document.addEventListener("click", function (e) {
      var chip = e.target.closest ? e.target.closest(".chip") : null;
      if (chip) { select(chip.getAttribute("data-id")); }
    });
    /* 표·카드 보기 안의 관심(★) · 비교(체크박스) · 종목명 클릭 */
    els.map.addEventListener("click", function (e) {
      if (!e.target.closest) return;
      var st = e.target.closest(".star-btn");
      if (st) { e.stopPropagation(); toggleWatch(st.getAttribute("data-id")); return; }
      var cb = e.target.closest(".cbox");
      if (cb) { e.stopPropagation(); toggleCmp(cb.getAttribute("data-id")); return; }
      var nm = e.target.closest("[data-select]");
      if (nm) { e.stopPropagation(); select(nm.getAttribute("data-select")); return; }
      var th = e.target.closest("th[data-sort]");
      if (th) {
        state.sort = th.getAttribute("data-sort");
        els.sortSel.value = state.sort;
        renderBody();
      }
    });
    document.getElementById("viewSeg").addEventListener("click", function (e) {
      var b = e.target.closest("button[data-view]"); if (!b) return;
      state.view = b.getAttribute("data-view");
      this.querySelectorAll("button").forEach(function (x) { x.classList.toggle("on", x === b); });
      renderAll();
      if (state.view !== "map") enqueue(sortedList());
    });
    document.getElementById("regionSeg").addEventListener("click", function (e) {
      var b = e.target.closest("button[data-region]"); if (!b) return;
      state.region = b.getAttribute("data-region");
      this.querySelectorAll("button").forEach(function (x) { x.classList.toggle("on", x === b); });
      renderAll();
      if (state.view !== "map") enqueue(sortedList());
    });
    document.getElementById("tierSeg").addEventListener("click", function (e) {
      var b = e.target.closest("button[data-tier]"); if (!b) return;
      state.tier = b.getAttribute("data-tier");
      this.querySelectorAll("button").forEach(function (x) { x.classList.toggle("on", x === b); });
      renderAll();
      if (state.view !== "map") enqueue(sortedList());
    });
    els.sortSel.addEventListener("change", function () { state.sort = this.value; renderBody(); });
    els.loadBtn.addEventListener("click", function () {
      if (QUEUE.length + RUNNING > 0) { stopQueue(); return; }
      enqueue(state.view === "map" ? visibleList() : sortedList());
    });
    document.getElementById("csvBtn").addEventListener("click", saveCsv);
    document.getElementById("printBtn").addEventListener("click", function () { window.print(); });
    document.getElementById("trayClear").addEventListener("click", function () {
      state.cmp = []; renderTray(); renderBody(); renderPanelChrome();
    });
    document.getElementById("trayGo").addEventListener("click", openCmp);
    els.trayItems.addEventListener("click", function (e) {
      var b = e.target.closest("button[data-drop]"); if (!b) return;
      toggleCmp(b.getAttribute("data-drop"));
    });
    document.getElementById("cmpClose").addEventListener("click", function () {
      document.getElementById("cmpOverlay").style.display = "none";
    });
    document.getElementById("cmpOverlay").addEventListener("click", function (e) {
      if (e.target === this) this.style.display = "none";
    });
    els.q.addEventListener("input", function () {
      state.q = this.value.trim();
      renderAll();
    });
    els.langKo.addEventListener("click", function () { state.lang = "ko"; applyLang(); });
    els.langEn.addEventListener("click", function () { state.lang = "en"; applyLang(); });
    els.backdrop.addEventListener("click", function () { select(null); });
    document.getElementById("diagBtn").addEventListener("click", openDiag);
    document.getElementById("diagClose").addEventListener("click", function () {
      document.getElementById("diagOverlay").style.display = "none";
    });
    document.getElementById("diagOverlay").addEventListener("click", function (e) {
      if (e.target === this) this.style.display = "none";
    });
    document.getElementById("diagCopy").addEventListener("click", function () {
      var ta = document.getElementById("diagText"), btn = this;
      ta.focus(); ta.select();
      var done = function () { btn.textContent = t("diagCopied"); setTimeout(function () { btn.textContent = t("diagCopy"); }, 1500); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(ta.value).then(done, function () { try { document.execCommand("copy"); done(); } catch (e) {} });
      } else { try { document.execCommand("copy"); done(); } catch (e) {} }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key !== "Escape") return;
      var cm = document.getElementById("cmpOverlay");
      if (cm.style.display === "flex") { cm.style.display = "none"; return; }
      var ov = document.getElementById("diagOverlay");
      if (ov.style.display === "flex") { ov.style.display = "none"; return; }
      if (state.sel) select(null);
    });

    /* ================= 초기화 ================= */
    applyLang();
    var initial = (location.hash || "").replace(/^#/, "");
    if (initial && BY_ID[initial]) select(initial);
  })();
  </script>
</body>
</html>

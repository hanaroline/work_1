<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>완전판매 스크립트 자동완성 시스템</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#F58220; --orange-dk:#CB6015; --orange-soft:#FAB072;
  --blue:#043B72; --gray-hl:#D7D7D7;
  --canvas:#FFFFFF; --soft:#ECEFF4; --subtle:#F7F8FA;
  --hair:#CDCECB; --hair-soft:#E5E4E1;
  --ink:#1A1A1A; --body:#3D3D3D; --muted:#6C6C6C; --muted2:#84888B;
  --ok:#2E8540; --warn:#D4A017; --err:#C62828;
  --font:'Spoqa Han Sans Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  --num:'Inter','SF Mono',monospace;
  --sidebar:360px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);color:var(--body);background:var(--canvas);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

/* ---------- Top bar ---------- */
.topbar{display:flex;align-items:center;gap:16px;padding:12px 22px;border-bottom:1px solid var(--hair);position:sticky;top:0;background:#fff;z-index:40}
.brand{font-weight:700;font-size:18px;color:var(--ink);letter-spacing:-.3px;white-space:nowrap}
.brand span{color:var(--orange)}
.brand small{display:block;font-size:11px;font-weight:400;color:var(--muted2);letter-spacing:.2px}
.topbar .sp{flex:1}
.tbtn{padding:8px 14px;border:1px solid var(--hair);background:#fff;border-radius:2px;cursor:pointer;font-size:14px;font-weight:500;color:var(--body);white-space:nowrap}
.tbtn:hover{background:var(--subtle);color:var(--ink)}
.tbtn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.tbtn.primary:hover{background:var(--orange-dk)}
.tbtn:disabled{opacity:.4;cursor:not-allowed}
.timer{font-family:var(--num);font-size:15px;font-weight:600;padding:7px 12px;border:1px solid var(--hair);border-radius:2px;min-width:104px;text-align:center;background:#fff}
.timer.warn{border-color:var(--warn);color:var(--warn)}
.timer.over{border-color:var(--err);color:var(--err);background:#fdf3f3}

/* ---------- Layout ---------- */
.wrap{display:flex;align-items:flex-start;min-height:calc(100vh - 58px)}
.side{width:var(--sidebar);flex:none;border-right:1px solid var(--hair);padding:20px;position:sticky;top:58px;max-height:calc(100vh - 58px);overflow-y:auto;background:var(--subtle)}
.main{flex:1;min-width:0;padding:24px 30px 90px}
@media(max-width:1080px){.wrap{display:block}.side{width:auto;position:static;max-height:none;border-right:0;border-bottom:1px solid var(--hair)}.main{padding:20px}}
@media(max-width:760px){
  .topbar{flex-wrap:wrap;gap:8px;padding:10px 14px;position:static}
  .brand{font-size:16px;flex:1 1 100%}
  .topbar .sp{display:none}
  .timer{min-width:84px;padding:6px 8px;font-size:14px}
  .tbtn{padding:7px 10px;font-size:13px}
  .main{padding:16px 14px 70px}
  .pr-body{padding:22px 18px 130px}
  .pr-body .say{font-size:22px;line-height:1.8}
  .summary{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
  .stat .v2{font-size:28px}
}

/* ---------- Sidebar form ---------- */
.fgroup{margin-bottom:22px}
.flabel{font-size:12px;font-weight:700;color:var(--ink);letter-spacing:.4px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.flabel .req{color:var(--orange)}
.hint{font-size:12px;color:var(--muted2);line-height:1.5;margin-top:6px}
select,input[type=text],input[type=number],textarea{width:100%;padding:9px 10px;border:1px solid var(--hair);border-radius:2px;background:#fff}
select:focus,input:focus,textarea:focus{outline:2px solid var(--orange);outline-offset:-1px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;padding:8px 6px;border:1px solid var(--hair);background:#fff;border-radius:2px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:700}
.chk{display:flex;align-items:flex-start;gap:8px;padding:6px 0;font-size:14px;cursor:pointer}
.chk input{margin-top:3px;accent-color:var(--orange);width:16px;height:16px;flex:none}
.rule{height:1px;background:var(--orange);margin:26px 0 12px}
.sidenote{font-size:12px;color:var(--muted2);border-left:2px solid var(--hair);padding-left:10px;margin-top:14px;line-height:1.6}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--hair);margin-bottom:20px;flex-wrap:wrap}
.tabs button{padding:10px 16px;border:0;background:transparent;cursor:pointer;font-size:15px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--ink);font-weight:700;border-bottom-color:var(--orange)}
.tabs .cnt{font-family:var(--num);font-size:12px;color:var(--muted2);margin-left:5px}

/* ---------- Cards / sections ---------- */
.card{border:1px solid var(--hair);border-radius:4px;background:#fff;margin-bottom:14px;overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--subtle);border-bottom:1px solid var(--hair-soft);cursor:pointer;user-select:none}
.card-h:hover{background:#f1f2f5}
.card-b{padding:16px 18px}
.no{font-family:var(--num);font-weight:700;font-size:13px;color:#fff;background:var(--blue);width:26px;height:26px;flex:none;border-radius:2px;display:flex;align-items:center;justify-content:center}
.no.plus{background:var(--ok)} .no.minus{background:var(--err)}
.ttl{font-size:16px;font-weight:700;color:var(--ink);flex:1;min-width:0;line-height:1.4}
.pts{font-family:var(--num);font-size:13px;font-weight:700;padding:3px 8px;border-radius:2px;background:var(--gray-hl);color:var(--ink);white-space:nowrap}
.pts.plus{background:#e3f1e6;color:var(--ok)} .pts.minus{background:#fbe9e9;color:var(--err)}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:2px;letter-spacing:.3px;white-space:nowrap}
.tag.sec{background:var(--soft);color:var(--blue)}
.tag.crit{background:#fbe9e9;color:var(--err)}
.caret{color:var(--muted2);font-size:12px;flex:none}

/* ---------- Script body ---------- */
.say{font-size:17px;line-height:1.85;color:var(--ink);margin:0 0 14px;white-space:pre-wrap;word-break:keep-all}
.act{font-size:14px;color:var(--blue);background:var(--soft);border-left:3px solid var(--blue);padding:8px 12px;margin:0 0 14px;white-space:pre-wrap;border-radius:0 2px 2px 0}
.note{font-size:13px;color:var(--muted);background:var(--subtle);border:1px dashed var(--hair);padding:8px 12px;margin:0 0 14px;white-space:pre-wrap;border-radius:2px}
.warnbox{font-size:14px;color:#8a1f1f;background:#fdf3f3;border-left:3px solid var(--err);padding:9px 12px;margin:0 0 14px;white-space:pre-wrap;border-radius:0 2px 2px 0}
.v{background:#fff5eb;border-bottom:1.5px solid var(--orange);padding:0 3px;font-weight:600;color:var(--ink);cursor:pointer;border-radius:2px 2px 0 0}
.v:hover{background:#ffe9d4}
.v.miss{background:#fbe9e9;border-bottom:1.5px solid var(--err);color:var(--err);font-weight:700;cursor:pointer}
.v.miss::before{content:'\25B6 확인필요: ';font-size:.85em}

/* ---------- Checkpoints ---------- */
.cps{margin:0 0 14px;padding:12px 14px;background:var(--subtle);border:1px solid var(--hair-soft);border-radius:2px}
.cps h4{margin:0 0 8px;font-size:13px;font-weight:700;color:var(--blue);letter-spacing:.3px}
.cps label{display:flex;align-items:flex-start;gap:8px;padding:4px 0;font-size:14px;cursor:pointer;line-height:1.5}
.cps input{margin-top:3px;accent-color:var(--orange);width:16px;height:16px;flex:none}
.cps label.done{color:var(--muted2);text-decoration:line-through;text-decoration-color:var(--hair)}
.scorebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--hair-soft);font-size:13px}
.scorebar b{font-family:var(--num);font-size:16px;color:var(--orange)}
.bands{margin-top:8px;font-size:12px;color:var(--muted2);line-height:1.7}
.bands code{font-family:var(--num);font-weight:700;color:var(--body)}

/* ---------- Tables ---------- */
table{width:100%;border-collapse:collapse;font-size:14px;border:1px solid var(--hair)}
th{background:var(--orange-soft);color:var(--ink);font-weight:700;text-align:left;padding:9px 10px;border:1px solid var(--hair-soft);font-size:13px}
td{padding:9px 10px;border:1px solid var(--hair-soft);vertical-align:top}
tr:hover td{background:var(--subtle)}
td.n{font-family:var(--num);text-align:right;font-variant-numeric:tabular-nums}
td.hl{background:var(--gray-hl);font-weight:700}
.tscroll{overflow-x:auto;margin-bottom:16px}

/* ---------- Prospectus panel ---------- */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.pf{border:1px solid var(--hair-soft);border-radius:2px;padding:10px 12px;background:#fff}
.pf.miss{border-color:var(--err);background:#fdf6f6}
.pf .k{font-size:11px;font-weight:700;color:var(--muted2);letter-spacing:.3px;display:flex;justify-content:space-between;gap:6px;margin-bottom:5px}
.src{font-size:10px;padding:1px 5px;border-radius:2px;font-weight:700;white-space:nowrap;display:inline-block}
.src.auto{background:#e3f1e6;color:var(--ok)}
.src.man{background:#fff3e0;color:var(--orange-dk)}
.src.no{background:#fbe9e9;color:var(--err)}
.pf input{border:0;border-bottom:1px solid var(--hair);border-radius:0;padding:3px 0;font-size:14px;font-weight:600;color:var(--ink)}
.pf .h{font-size:11px;color:var(--muted2);margin-top:4px;line-height:1.4}

/* ---------- Banner ---------- */
.banner{border:1px solid var(--orange);border-left:4px solid var(--orange);background:#fffaf5;padding:12px 16px;border-radius:2px;margin-bottom:18px;font-size:14px;line-height:1.65;color:var(--body)}
.banner b{color:var(--orange-dk)}
.banner.blue{border-color:var(--blue);border-left-color:var(--blue);background:#f4f7fa}
.banner.blue b{color:var(--blue)}

/* ---------- Score summary ---------- */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{border:1px solid var(--hair);border-radius:4px;padding:14px 16px;background:#fff}
.stat .l{font-size:12px;font-weight:500;color:var(--muted2);letter-spacing:.5px}
.stat .v2{font-family:var(--num);font-size:34px;font-weight:700;line-height:1.1;color:var(--ink);margin-top:4px}
.stat .v2.o{color:var(--orange)} .stat .v2.b{color:var(--blue)} .stat .v2.r{color:var(--err)} .stat .v2.g{color:var(--ok)}
.stat .s{font-size:12px;color:var(--muted2);margin-top:2px}
.bar{height:8px;background:var(--soft);border-radius:2px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--orange)}

/* ---------- Prompter ---------- */
#prompter{position:fixed;inset:0;background:#fff;z-index:100;display:none;flex-direction:column}
#prompter.on{display:flex}
.pr-top{display:flex;align-items:center;gap:14px;padding:12px 24px;border-bottom:1px solid var(--hair);flex-wrap:wrap}
.pr-body{flex:1;overflow-y:auto;padding:32px 6vw 120px;max-width:1100px;margin:0 auto;width:100%}
.pr-body .say{font-size:27px;line-height:1.95}
.pr-body .act{font-size:19px;padding:12px 16px}
.pr-body .note{font-size:17px}
.pr-body .warnbox{font-size:19px}
.pr-body .cps label{font-size:19px}
.pr-body .cps input{width:22px;height:22px}
.pr-h{display:flex;align-items:center;gap:12px;margin-bottom:22px;padding-bottom:12px;border-bottom:2px solid var(--orange)}
.pr-h .ttl{font-size:24px}
.pr-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--hair);padding:12px 24px;display:flex;align-items:center;gap:14px;justify-content:center}
.pr-nav .tbtn{padding:12px 26px;font-size:16px}
.pgbar{height:4px;background:var(--soft)}
.pgbar i{display:block;height:100%;background:var(--orange);transition:width .2s}

/* ---------- Misc ---------- */
.empty{text-align:center;padding:70px 20px;color:var(--muted2)}
.empty h3{color:var(--ink);font-size:22px;margin:0 0 8px}
.kbd{font-family:var(--num);font-size:11px;border:1px solid var(--hair);border-bottom-width:2px;border-radius:3px;padding:1px 5px;background:var(--subtle);color:var(--muted)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:2px;background:var(--soft);color:var(--blue);margin-left:6px}
.badge.live{background:#e3f1e6;color:var(--ok)}
.badge.sample{background:#fff3e0;color:var(--orange-dk)}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--hair);font-size:12px;color:var(--muted2);line-height:1.7}

@media print{
  .topbar,.side,.tabs,.pr-nav,#prompter,.noprint{display:none!important}
  .main{padding:0}
  body{font-size:11pt}
  .say{font-size:12pt;line-height:1.5}
  .card{page-break-inside:avoid;border-color:#999}
  .card-h{background:#eee!important}
}
</style>
</head>
<body>

<div class="topbar noprint">
  <div class="brand">완전판매 스크립트 <span>자동완성</span><small>미스터리쇼퍼 대응 · 금융소비자보호 판매프로세스</small></div>
  <div class="sp"></div>
  <div class="timer" id="timer">00:00</div>
  <button class="tbtn" id="btnTimer">상담 시작</button>
  <button class="tbtn" id="btnPrint">인쇄 / PDF</button>
  <button class="tbtn primary" id="btnPrompter">읽기 모드 ▶</button>
</div>

<div class="wrap">
  <aside class="side noprint" id="side"></aside>
  <main class="main">
    <div class="tabs" id="tabs"></div>
    <div id="view"></div>
  </main>
</div>

<div id="prompter">
  <div class="pr-top">
    <div class="brand" style="font-size:15px">읽기 모드</div>
    <div class="sp" style="flex:1"></div>
    <div class="timer" id="timer2">00:00</div>
    <span id="prPos" class="num" style="font-weight:600"></span>
    <button class="tbtn" id="btnExitPr">닫기 ✕</button>
  </div>
  <div class="pgbar"><i id="prBar" style="width:0"></i></div>
  <div class="pr-body" id="prBody"></div>
  <div class="pr-nav">
    <button class="tbtn" id="prPrev">◀ 이전</button>
    <span style="font-size:13px;color:var(--muted2)"><span class="kbd">←</span> <span class="kbd">→</span> 이동 · <span class="kbd">Space</span> 다음</span>
    <button class="tbtn primary" id="prNext">다음 ▶</button>
  </div>
</div>

<script src="vendor/pdf.min.js"></script>
<script src="data/els.js"></script>
<script src="data/sales-script-data.js"></script>
<script src="data/sales-script-sheets.js"></script>
<script src="data/sales-script-sheets2.js"></script>
<script src="data/sales-script-sheets3.js"></script>
<script src="js/sales-script-prospectus.js"></script>
<script src="js/sales-script-app.js"></script>
</body>
</html>

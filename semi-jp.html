<style>
:root{
  --orange:#F58220; --orange-act:#CB6015; --orange-soft:#FAB072; --blue:#043B72;
  --hl:#D7D7D7; --canvas:#FFFFFF; --soft:#ECEFF4; --subtle:#F7F8FA;
  --hair:#CDCECB; --hair-soft:#E5E4E1; --ink:#1A1A1A; --body:#3D3D3D; --muted:#6C6C6C; --muted2:#84888B;
  --eq:#1F2733; --etc:#043B72; --mat:#E9EAEC; --svc:#2F64A8;
  --font-kr:'Spoqa Han Sans Neo','Noto Sans KR','Noto Sans JP','Noto Sans SC',sans-serif;
  --font-en:'Inter','Aptos','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--canvas);color:var(--body);font-size:17px;line-height:1.6}
html[lang="ko"] body{font-family:var(--font-kr)}
html[lang="en"] body{font-family:var(--font-en)}
.page{max-width:1240px;margin:0 auto;padding:0 28px}
@media (max-width:768px){.page{padding:0 16px}}
a{color:var(--blue)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:28px 0 0}
.tag{display:inline-block;border:1px solid #C62828;color:#C62828;font-size:13px;padding:3px 10px;border-radius:2px;margin-bottom:14px}
h1{font-size:34px;line-height:1.25;letter-spacing:-.3px;color:var(--ink);margin:0 0 8px;font-weight:700}
.lead{font-size:18px;color:var(--body);margin:0;max-width:820px}
@media (max-width:768px){h1{font-size:26px}.lead{font-size:16px}}
.lang{display:inline-flex;border:1px solid var(--hair);border-radius:2px;box-shadow:0 2px 8px rgba(0,0,0,.06);overflow:hidden;flex:none}
@media (max-width:640px){.top{display:block;position:relative}.top .lang{position:absolute;top:28px;right:0}.top .tag{margin-bottom:24px}}
.lang button{border:0;background:#fff;color:var(--muted);font-family:var(--font-en);font-size:14px;font-weight:500;letter-spacing:.5px;padding:9px 17px}
.lang button+button{border-left:1px solid var(--hair)}
.lang button:hover{background:var(--subtle);color:var(--ink)}
.lang button[aria-checked="true"]{background:var(--orange);color:#fff}

.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--hair);margin:28px 0 0}
.stat{padding:16px 20px}
.stat+.stat{border-left:1px solid var(--hair-soft)}
.stat .l{font-size:14px;font-weight:500;color:var(--muted);letter-spacing:.3px}
.stat .v{font-family:var(--font-en);font-size:34px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.2}
.stat .v.o{color:var(--orange)}.stat .v.b{color:var(--blue)}
@media (max-width:768px){.stats{grid-template-columns:repeat(2,1fr)}.stat:nth-child(3){border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--hair-soft)}.stat .v{font-size:28px}}

/* section */
.section{margin-top:64px}
.rule{height:1px;background:var(--orange);margin-bottom:16px}
h2{font-size:26px;font-weight:700;color:var(--ink);margin:0 0 6px;line-height:1.3}
.sub{color:var(--muted);font-size:15px;margin:0 0 20px}
@media (max-width:768px){.section{margin-top:44px}h2{font-size:22px}}

/* toolbar */
.toolbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--hair-soft);padding:12px 0;margin-top:28px}
@media (max-width:640px){.toolbar{position:static}}
.trow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.trow+.trow{margin-top:10px}
.search{flex:1 1 280px;display:flex;align-items:center;border:1px solid var(--hair);border-radius:2px;background:#fff}
.search input{flex:1;border:0;outline:0;font:inherit;font-size:16px;padding:9px 12px;min-width:0;background:transparent}
.search .cnt{font-size:13px;color:var(--muted);padding:0 12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.grp .gl{font-size:13px;color:var(--muted);margin-right:2px}
.chip{border:1px solid var(--hair);background:#fff;color:var(--body);font-size:14px;padding:5px 11px;border-radius:2px;line-height:1.3}
.chip:hover{background:var(--subtle);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.view[aria-pressed="true"]{background:var(--orange);border-color:var(--orange)}
.reset{border:0;background:none;color:var(--muted);font-size:14px;text-decoration:underline;padding:4px}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.sw.eq{background:var(--eq)}.sw.etc{background:var(--etc)}.sw.mat{background:var(--mat);border:1px solid var(--hair)}.sw.svc{background:var(--svc)}

/* map */
.stage{margin-top:28px}
.stage h3{font-size:20px;color:var(--ink);margin:0 0 12px;font-weight:700;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.stage h3 small{font-size:14px;color:var(--muted);font-weight:400}
.cols{display:grid;grid-template-columns:repeat(var(--n,7),minmax(0,1fr));gap:10px}
@media (max-width:1100px){.cols{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:720px){.cols{grid-template-columns:repeat(2,minmax(0,1fr))}}
.col{display:flex;flex-direction:column;gap:7px;min-width:0}
.colh{background:var(--orange);color:#fff;border:0;border-radius:4px;font-size:15px;font-weight:700;padding:10px 6px;text-align:center;line-height:1.25;min-height:46px}
.colh:hover{background:var(--orange-act)}
.colh .n{display:block;font-family:var(--font-en);font-size:12px;font-weight:500;opacity:.9}
.co{border:0;border-radius:4px;font-size:14.5px;font-weight:500;padding:9px 6px;text-align:center;line-height:1.25;transition:opacity .15s;word-break:keep-all}
.co.eq{background:var(--eq);color:#fff}
.co.etc{background:var(--etc);color:#fff}
.co.svc{background:var(--svc);color:#fff}
.co.mat{background:var(--mat);color:var(--ink)}
.co:hover{outline:2px solid var(--orange);outline-offset:-2px}
.co.dim{opacity:.16}
.co.hit{box-shadow:inset 0 0 0 2px var(--orange)}
.co .hb{display:inline-block;font-family:var(--font-en);font-size:10px;font-weight:700;letter-spacing:.3px;margin-left:4px;padding:0 3px;border-radius:2px;background:var(--orange);color:#fff;vertical-align:1px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:12px}

/* table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--hair);margin-top:20px}
table{border-collapse:collapse;width:100%;font-size:14.5px;min-width:900px}
th{background:var(--orange-soft);color:var(--ink);font-weight:700;text-align:left;padding:9px 10px;white-space:nowrap;cursor:pointer;user-select:none;position:relative}
th[aria-sort="ascending"]::after{content:" ▲";font-size:10px}
th[aria-sort="descending"]::after{content:" ▼";font-size:10px}
td{border-top:1px solid var(--hair-soft);padding:9px 10px;vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--subtle)}
td.num{font-family:var(--font-en);font-variant-numeric:tabular-nums;white-space:nowrap}
td.nm{font-weight:700;color:var(--ink);white-space:nowrap}
.pill{display:inline-block;font-size:12px;padding:1px 7px;border-radius:2px;margin:1px 3px 1px 0;white-space:nowrap;border:1px solid var(--hair);color:var(--body);background:#fff}
.pill.t-eq{background:var(--eq);border-color:var(--eq);color:#fff}
.pill.t-etc{background:var(--etc);border-color:var(--etc);color:#fff}
.pill.t-svc{background:var(--svc);border-color:var(--svc);color:#fff}
.pill.t-mat{background:var(--mat);border-color:var(--hair)}
.pill.tg{border-color:var(--orange);color:var(--orange-act)}
.unv{color:var(--muted2);font-size:11px;margin-left:2px}

/* process cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{border:1px solid var(--hair);border-radius:4px;padding:16px 18px;background:#fff}
.card h4{margin:0 0 4px;font-size:17px;color:var(--ink);display:flex;justify-content:space-between;gap:8px}
.card h4 span{font-family:var(--font-en);font-size:12px;font-weight:600;color:var(--orange-act);white-space:nowrap}
.card p{margin:6px 0;font-size:14.5px;line-height:1.6}
.card .w{background:var(--subtle);border-left:2px solid var(--orange);padding:8px 10px;font-size:14px}
.card .w b{color:var(--ink)}
.card .mini{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.mini button{border:1px solid var(--hair);background:#fff;font-size:12.5px;padding:2px 7px;border-radius:2px;color:var(--body)}
.mini button:hover{border-color:var(--orange);color:var(--ink)}

.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px;margin:0 0 20px}
.flow .st{border:1px solid var(--hair);padding:5px 10px;border-radius:2px;background:#fff}
.flow .st.f{border-color:var(--orange-soft)}
.flow .ar{color:var(--muted2)}
.flow .div{font-weight:700;color:var(--blue);padding:0 4px}

/* baskets */
.baskets{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.bk{border:1px solid var(--hair);border-radius:4px;padding:16px 18px}
.bk h4{margin:0 0 4px;font-size:17px;color:var(--ink)}
.bk p{margin:0 0 10px;font-size:14px;color:var(--muted)}

.multi td:first-child{white-space:nowrap}

.note{font-size:13.5px;color:var(--muted);line-height:1.7;margin:0}
.note li{margin-bottom:4px}
footer{margin:64px 0 40px;border-top:1px solid var(--hair);padding-top:16px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(26,26,26,.35);z-index:40;display:none}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,100%);background:#fff;z-index:50;transform:translateX(100%);transition:transform .2s ease;overflow-y:auto;border-left:1px solid var(--hair);box-shadow:-4px 0 24px rgba(0,0,0,.08)}
.drawer.on{transform:none}
.dh{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--hair-soft);padding:18px 22px 14px;z-index:1}
.dh .x{position:absolute;right:14px;top:12px;border:1px solid var(--hair);background:#fff;border-radius:2px;width:36px;height:36px;font-size:20px;line-height:1;color:var(--muted)}
.dh .x:hover{color:var(--ink);background:var(--subtle)}
.dh h3{margin:0;font-size:26px;color:var(--ink);line-height:1.25;padding-right:44px}
.dh .en{font-family:'Inter',var(--font-kr);color:var(--muted);font-size:14px}
.dh .meta{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.db{padding:6px 22px 30px}
.db h5{font-size:14px;color:var(--orange-act);letter-spacing:.3px;margin:20px 0 6px;font-weight:700}
.db .one{font-size:17px;color:var(--ink);font-weight:500;margin:14px 0 0;line-height:1.55}
.db ul{margin:0;padding-left:18px}
.db li{margin-bottom:5px;font-size:15.5px}
.db .peers{display:flex;flex-wrap:wrap;gap:6px}
.db .peers .pl{font-size:13px;color:var(--muted);width:100%;margin-top:4px}
.db .links{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.btn{display:inline-block;background:var(--orange);color:#fff;text-decoration:none;font-size:15px;font-weight:500;padding:9px 16px;border-radius:2px}
.btn:hover{background:var(--orange-act)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--hair)}
.btn.ghost:hover{background:var(--subtle)}
.db .mg{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--hair);border-radius:2px;margin-top:4px}
.db .mg>div{padding:8px 10px;border-right:1px solid var(--hair-soft);border-bottom:1px solid var(--hair-soft);min-width:0}
.db .mg>div:nth-child(3n){border-right:0}
.db .mg .l{font-size:12px;color:var(--muted);line-height:1.3}
.db .mg .v{font-family:var(--font-en);font-variant-numeric:tabular-nums;font-size:16px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.db .mg .v small{font-size:12px;font-weight:500;margin-left:4px}
.up{color:#C62828!important}.dn{color:var(--blue)!important}
.db .pos{margin-top:10px;font-size:12.5px;color:var(--muted)}
.db .pos .bar{position:relative;height:6px;background:var(--soft);border-radius:1px;margin:6px 0 4px}
.db .pos .bar i{position:absolute;top:-4px;width:2px;height:14px;background:var(--orange)}
.db .pos .ends{display:flex;justify-content:space-between;font-family:var(--font-en);font-variant-numeric:tabular-nums}
.db .src{font-size:12px;color:var(--muted2);margin:6px 0 0;line-height:1.5}
.db .empty{font-size:14px;color:var(--muted);background:var(--subtle);padding:10px 12px;margin:4px 0 0}
.xp{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:2px;white-space:nowrap;border:1px solid var(--hair)}
.xp.d{background:var(--orange);border-color:var(--orange);color:#fff}
.xp.i{background:#fff;border-color:var(--orange-soft);color:var(--orange-act)}
.xp.l{background:var(--subtle);color:var(--muted)}
.db .xrow{display:flex;gap:8px;align-items:baseline;font-size:15px}
.db .pt{width:100%;min-width:0;font-size:13px;margin-top:4px}
.db .pt th{font-size:12px;padding:5px 6px;cursor:default}
.db .pt td{padding:5px 6px;white-space:nowrap}
.db .pt td.n{text-align:right;font-family:var(--font-en);font-variant-numeric:tabular-nums}
.db .pt tr.me td{background:var(--hl);font-weight:700}
.db .ptw{overflow-x:auto}
td.r,th.r{text-align:right}
@media (max-width:480px){.db .mg{grid-template-columns:repeat(2,1fr)}.db .mg>div:nth-child(3n){border-right:1px solid var(--hair-soft)}.db .mg>div:nth-child(2n){border-right:0}}
.db .warn{font-size:13px;color:var(--muted);margin-top:16px;border-top:1px solid var(--hair-soft);padding-top:10px}
.hidden{display:none!important}

@media print{
  .lang,.toolbar,.drawer,.scrim{display:none!important}
  body{font-size:11pt}.page{max-width:100%;padding:0}
  .section{margin-top:24px;page-break-inside:auto}
  .stage,.card,.bk,table{page-break-inside:avoid}
  .co.dim{opacity:1}
}
.dh .en{font-family:'Inter','Noto Sans JP',var(--font-kr)}
</style>
</head>

  lead:`${COLS.length} process steps in manufacturing order, with the ${_N} Japan-listed materials, parts, equipment and design companies placed in each. Click a company for details.`,
  ph:'Search company, code or keyword (e.g., HBM, cleaning, 8035)',filing:'Nikkei company info',code:'Code',
  warn:'Descriptions, risks and events are qualitative summaries from public information. Figures other than market metrics (revenue, share, etc.) are not included; check each company\'s securities report and earnings releases.',
  mSrc:'Sources: Yahoo Finance (price, market cap, PER, PBR, EPS, BPS, dividend yield); returns and 52-week range computed from Yahoo daily closes. Prices in JPY. A dash (–) means the value was not retrieved.',
  mNone:'Metrics have not been collected yet. They fill in automatically after each Tokyo trading day\'s close.',
  won:v=>`JPY ${v}`,eok:v=>capEn(v,'JPY '),
  notes:[...NOTE_COMMON.en.slice(0,-1),
   'Coverage: Japan-headquartered companies listed on the Tokyo Stock Exchange. The detail panel\'s second line also shows the Japanese name.',
   'Large groups where chips are only part of the business—such as FUJIFILM, Canon, Nikon, Ajinomoto and Dai Nippon Printing—are included where they are well known in that step. Price and market cap are for the whole company.',
   'Tekscend Photomask (429A) has a short trading history, so its 1M/3M/YTD returns and 52-week range may be blank or cover a shorter period.',
   NOTE_COMMON.en[NOTE_COMMON.en.length-1]]}
});
</script>
<script>
(function(){
let lang='ko';
try{const s=localStorage.getItem(CFG.lsKey);if(s==='en'||s==='ko')lang=s}catch(e){}
const st={q:'',stage:'all',types:new Set(),tags:new Set(),col:null,view:'map',sort:{k:null,dir:1}};
const T=k=>I18N[lang][k];
const L=(o,k)=>lang==='en'?(o[k+'e']||o[k]):o[k];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);

/* 기업별 소속 칸 */
const where={};
for(const col of COLS){for(const [n,t] of MEMBERS[col.id]){(where[n]=where[n]||[]).push({col,t});}}
const names=Object.keys(where);
names.forEach(n=>{if(!CO[n])console.warn('missing',n)});
const nm=n=>lang==='en'?CO[n].e:n;
const typesOf=n=>[...new Set(where[n].map(w=>w.t))];
const stagesOf=n=>[...new Set(where[n].map(w=>w.col.st))];

/* 시장 지표(수집기가 window.SEMI_METRICS 에 넣음)와 투자 체크(EXTRA) */
const MET=(window.SEMI_METRICS&&window.SEMI_METRICS.co)||null;
const mt=n=>(MET&&MET[n])||null;
const X=n=>EXTRA[n]||null;
const DASH='–';
const fNum=(v,d=0)=>v==null?DASH:Number(v).toLocaleString(lang==='en'?'en-US':'ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d});
const fPct=(v,d=2)=>v==null?DASH:(v>0?'+':'')+fNum(v,d)+'%';
const cls=v=>v==null||v===0?'':v>0?'up':'dn';
const fX=v=>v==null?DASH:fNum(v,2)+T('times');
const fCap=v=>v==null?DASH:T('eok')(v);
const fWon=v=>v==null?DASH:T('won')(Number(v).toLocaleString(lang==='en'?'en-US':'ko-KR',{minimumFractionDigits:CFG.pxmin,maximumFractionDigits:CFG.pxd}));
const xBadge=n=>{const x=X(n);return x?`<span class="xp ${x.x}">${T('x')[x.x]}</span>`:''};
const XORD={d:0,i:1,l:2};
const NUMK=new Set(['mcap','per','pbr','r1m','rytd','pos52']);
const byNull=(x,y,d)=>x==null&&y==null?0:x==null?1:y==null?-1:(x>y?1:x<y?-1:0)*d;

function matches(n){
  const c=CO[n];
  if(st.stage!=='all'&&!stagesOf(n).includes(st.stage))return false;
  if(st.col&&!where[n].some(w=>w.col.id===st.col))return false;
  if(st.types.size&&!typesOf(n).some(t=>st.types.has(t)))return false;
  if(st.tags.size&&![...st.tags].every(t=>c.tg.includes(t)))return false;
  if(st.q){
    const q=st.q.toLowerCase().replace(/\s+/g,'');
    const hay=[n,c.e,c.l,c.y,c.c,c.s,c.se,...c.b,...c.be,...c.p,...c.pe,c.cu,c.cue,...c.tg.map(t=>TAGS[t].ko+TAGS[t].en),...(X(n)?[X(n).xn,X(n).xne,...X(n).r,...X(n).re,...X(n).ev,...X(n).eve]:[]),...where[n].map(w=>w.col.ko+w.col.en)].join(' ').toLowerCase().replace(/\s+/g,'');
    if(!hay.includes(q))return false;
  }
  return true;
}
const filtering=()=>st.q||st.stage!=='all'||st.types.size||st.tags.size||st.col;

function renderStatic(){
  document.documentElement.lang=lang;
  document.title=T('docTitle');
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=T(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>el.placeholder=T(el.dataset.i18nPh));
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-checked',b.dataset.lang===lang));
  const nF=names.filter(n=>stagesOf(n).includes('F')).length, nB=names.filter(n=>stagesOf(n).includes('B')).length;
  $('#stats').innerHTML=[[T('stCo'),names.length,''],[T('stF'),nF,'o'],[T('stB'),nB,'b'],[T('stP'),COLS.length,'']]
    .map(([l,v,c])=>`<div class="stat"><div class="l">${l}</div><div class="v ${c}">${v}</div></div>`).join('');
  // filters
  $('#fStage').innerHTML=`<span class="gl">${T('stage')}</span>`+['all','F','B'].map(s=>`<button class="chip" data-stage="${s}" aria-pressed="${st.stage===s}">${T(s)}</button>`).join('');
  $('#fType').innerHTML=`<span class="gl">${T('type')}</span>`+Object.entries(TYPES).map(([k,v])=>`<button class="chip" data-type="${k}" aria-pressed="${st.types.has(k)}"><span class="sw ${k}"></span>${v[lang]}</button>`).join('');
  $('#fTag').innerHTML=`<span class="gl">${T('theme')}</span>`+Object.entries(TAGS).map(([k,v])=>`<button class="chip" data-tag="${k}" aria-pressed="${st.tags.has(k)}">${v[lang]}</button>`).join('');
  // flow & cards
  $('#flow').innerHTML=COLS.map((c,i)=>(i&&COLS[i-1].st!==c.st?`<span class="div">|</span>`:i?`<span class="ar">→</span>`:'')+`<span class="st ${c.st==='F'?'f':''}">${esc(lang==='en'?c.en:c.ko)}</span>`).join('');
  $('#cards').innerHTML=COLS.map(c=>`<article class="card" id="p-${c.id}">
    <h4>${esc(lang==='en'?c.en:c.ko)}<span>${T(c.st)} · ${T('cnt')(MEMBERS[c.id].length)}</span></h4>
    <p>${esc(L(c,'d'))}</p>
    <p class="w"><b>${T('watch')}</b> — ${esc(L(c,'w'))}</p>
    <div class="mini">${MEMBERS[c.id].map(([n])=>`<button data-co="${esc(n)}">${esc(nm(n))}</button>`).join('')}</div>
  </article>`).join('');
  $('#baskets').innerHTML=BASKETS.map(b=>{const list=names.filter(n=>CO[n].tg.includes(b.tag));
    return `<div class="bk"><h4>${esc(lang==='en'?b.en:b.ko)} <span class="pill">${T('cnt')(list.length)}</span></h4><p>${esc(L(b,'d'))}</p>
    <div class="mini">${list.map(n=>`<button data-co="${esc(n)}">${esc(nm(n))}</button>`).join('')}</div></div>`}).join('');
  // multi
  const multi=names.filter(n=>where[n].length>1);
  $('#multiTbl thead').innerHTML=`<tr><th>${T('co')}</th><th>${T('where')}</th><th>${T('summ')}</th></tr>`;
  $('#multiTbl tbody').innerHTML=multi.map(n=>`<tr data-co="${esc(n)}"><td class="nm">${esc(nm(n))}</td><td>${where[n].map(w=>`<span class="pill t-${w.t}">${esc(lang==='en'?w.col.en:w.col.ko)}</span>`).join('')}</td><td>${esc(L(CO[n],'s'))}</td></tr>`).join('');
  $('#notes').innerHTML=T('notes').map(x=>`<li>${esc(x)}</li>`).join('');
}

function codeHtml(n){const c=CO[n];if(!c.c)return `<span class="unv">${T('unlisted')}</span>`;return esc(c.c)+(c.v?'':'<span class="unv" title="'+esc(T('unv'))+'">†</span>');}

function renderMap(){
  let shown=0;const seen=new Set();
  const stageHtml=s=>`<div class="stage"><h3>${T(s)}<small>${T(s==='F'?'fsub':'bsub')}</small></h3><div class="cols" style="--n:${COLS.filter(c=>c.st===s).length}">${
    COLS.filter(c=>c.st===s).map(c=>`<div class="col"><button class="colh" data-col="${c.id}" aria-pressed="${st.col===c.id}">${esc(lang==='en'?c.en:c.ko)}<span class="n">${MEMBERS[c.id].length}</span></button>${
      MEMBERS[c.id].map(([n,t])=>{const m=matches(n);if(m&&!seen.has(n)){seen.add(n);shown++;}
        const hbm=CO[n].tg.includes('hbm')?'<span class="hb">HBM</span>':'';
        return `<button class="co ${t} ${m?(filtering()?'hit':''):'dim'}" data-co="${esc(n)}" title="${esc(L(CO[n],'s'))}">${esc(nm(n))}${hbm}</button>`}).join('')
    }</div>`).join('')}</div></div>`;
  $('#mapView').innerHTML=stageHtml('F')+stageHtml('B')+`<div class="legend">${Object.entries(TYPES).map(([k,v])=>`<span><span class="sw ${k}"></span>${v[lang]}</span>`).join('')}<span><span class="hb" style="display:inline-block;font-family:var(--font-en);font-size:10px;font-weight:700;padding:0 3px;border-radius:2px;background:var(--orange);color:#fff">HBM</span> ${lang==='en'?'HBM-related':'HBM 연관'}</span></div>`;
  return shown;
}

function renderTable(){
  const rows=names.filter(matches).map(n=>({n,c:CO[n],w:where[n]}));
  const k=st.sort.k,d=st.sort.dir;
  const mv=f=>r=>{const m=mt(r.n);return m?m[f]??null:null};
  const key={co:r=>nm(r.n),code:r=>r.c.c||'zzz',mkt:r=>r.c.m,stage:r=>stagesOf(r.n).join(),proc:r=>COLS.indexOf(r.w[0].col),type:r=>typesOf(r.n)[0],
    mcap:mv('mcap'),per:mv('per'),pbr:mv('pbr'),r1m:mv('r1m'),rytd:mv('rytd'),pos52:mv('pos52'),x:r=>X(r.n)?XORD[X(r.n).x]:null};
  if(k)rows.sort((a,b)=>byNull(key[k](a),key[k](b),d));
  else rows.sort((a,b)=>COLS.indexOf(a.w[0].col)-COLS.indexOf(b.w[0].col));
  const H=[['co',T('co')],['code',T('code')],['mkt',T('mkt')],['proc',T('proc')],['type',T('type')],
    ['mcap',T('cMcap'),'r'],['per',T('cPer'),'r'],['pbr',T('cPbr'),'r'],['r1m',T('c1m'),'r'],['rytd',T('cYtd'),'r'],['pos52',T('c52'),'r'],['x',T('cX')],
    [null,T('summ')],[null,T('tg')]];
  $('#tbl thead').innerHTML='<tr>'+H.map(([k2,l,c2])=>`<th ${c2?`class="${c2}" `:''}${k2?`data-sort="${k2}" aria-sort="${st.sort.k===k2?(d>0?'ascending':'descending'):'none'}"`:''}>${l}</th>`).join('')+'</tr>';
  $('#tbl tbody').innerHTML=rows.map(r=>`<tr data-co="${esc(r.n)}">
    <td class="nm">${esc(nm(r.n))}</td><td class="num">${codeHtml(r.n)}</td><td>${esc(r.c.m==='비상장'?T('unlisted'):r.c.m)}</td>
    <td>${r.w.map(w=>`<span class="pill">${esc(lang==='en'?w.col.en:w.col.ko)}</span>`).join('')}</td>
    <td>${typesOf(r.n).map(t=>`<span class="pill t-${t}">${TYPES[t][lang]}</span>`).join('')}</td>
    ${(m=>`<td class="num r">${fCap(m.mcap)}</td><td class="num r">${fX(m.per)}</td><td class="num r">${fX(m.pbr)}</td><td class="num r ${cls(m.r1m)}">${fPct(m.r1m,1)}</td><td class="num r ${cls(m.rytd)}">${fPct(m.rytd,1)}</td><td class="num r">${m.pos52==null?DASH:fNum(m.pos52)+'%'}</td>`)(mt(r.n)||{})}
    <td>${xBadge(r.n)}</td>
    <td>${esc(L(r.c,'s'))}</td>
    <td>${r.c.tg.map(t=>`<span class="pill tg">${TAGS[t][lang]}</span>`).join('')}</td></tr>`).join('');
  return rows.length;
}

function render(){
  const n=st.view==='map'?renderMap():renderTable();
  if(st.view==='map')renderTable(); // 표도 미리 갱신(인쇄 대비)
  $('#cnt').textContent=T('cnt')(n)+' / '+names.length;
  $('#mapView').classList.toggle('hidden',st.view!=='map');
  $('#tableView').classList.toggle('hidden',st.view!=='table');
  document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===st.view));
  document.querySelectorAll('[data-stage]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.stage===st.stage));
  document.querySelectorAll('[data-type]').forEach(b=>b.setAttribute('aria-pressed',st.types.has(b.dataset.type)));
  document.querySelectorAll('[data-tag]').forEach(b=>b.setAttribute('aria-pressed',st.tags.has(b.dataset.tag)));
}

function metricsHtml(n){
  const c=CO[n],h=`<h5>${T('mT')}</h5>`;
  if(!c.c)return h+`<p class="empty">${T('mUnl')}</p>`;
  if(!MET)return h+`<p class="empty">${T('mNone')}</p>`;
  const src=`<p class="src">${esc(T('mAsof')(window.SEMI_METRICS.asOf||DASH,window.SEMI_METRICS.intraday?window.SEMI_METRICS.generated:''))} · ${esc(T('mSrc'))}</p>`;
  const m=mt(n);
  if(!m||(m.price==null&&m.mcap==null&&m.r1m==null))return h+`<p class="empty">${T('mNoCo')}</p>`+src;
  const cell=(l,v,k='')=>`<div><div class="l">${l}</div><div class="v ${k}">${v}</div></div>`;
  const price=fWon(m.price)+(m.chgPct==null?'':`<small class="${cls(m.chgPct)}">${fPct(m.chgPct)}</small>`);
  const grid=[cell(T('mPrice'),price),cell(T('mCap'),fCap(m.mcap)),cell(T('mFrgn'),m.dy==null?DASH:fNum(m.dy,2)+'%'),
    cell(T('mPer'),fX(m.per)),cell(T('mPbr'),fX(m.pbr)),cell(T('mListed'),esc(CFG.slot(m,n)||DASH)),
    cell(T('mEps'),fWon(m.eps)),cell(T('mBps'),fWon(m.bps)),cell(T('c52'),m.pos52==null?DASH:fNum(m.pos52,1)+'%'),
    cell(T('m1m'),fPct(m.r1m),cls(m.r1m)),cell(T('m3m'),fPct(m.r3m),cls(m.r3m)),cell(T('mYtd'),fPct(m.rytd),cls(m.rytd))].join('');
  const pos=m.hi52!=null&&m.lo52!=null&&m.pos52!=null?`<div class="pos">${T('m52')}<div class="bar" role="img" aria-label="${fNum(m.pos52,1)}%"><i style="left:calc(${m.pos52}% - 1px)"></i></div><div class="ends"><span>${fWon(m.lo52)}</span><span>${fWon(m.hi52)}</span></div></div>`:'';
  return h+`<div class="mg">${grid}</div>${pos}${src}`;
}
function peerTable(n){
  if(!MET)return '';
  return where[n].map(w=>{
    const list=MEMBERS[w.col.id].map(([p])=>p).filter(p=>CO[p].c).sort((a,b)=>byNull((mt(a)||{}).mcap,(mt(b)||{}).mcap,-1));
    if(list.length<2)return '';
    const rows=list.map(p=>{const m=mt(p)||{};return `<tr data-co="${esc(p)}" class="${p===n?'me':''}"><td>${esc(nm(p))}</td><td class="n">${fCap(m.mcap)}</td><td class="n">${fX(m.per)}</td><td class="n">${fX(m.pbr)}</td><td class="n ${cls(m.r1m)}">${fPct(m.r1m,1)}</td><td class="n ${cls(m.rytd)}">${fPct(m.rytd,1)}</td><td class="n">${m.pos52==null?DASH:fNum(m.pos52)+'%'}</td></tr>`}).join('');
    return `<div class="pl" style="font-size:13px;color:var(--muted);margin-top:6px">${esc(lang==='en'?w.col.en:w.col.ko)}</div><div class="ptw"><table class="pt"><thead><tr><th>${T('co')}</th><th class="r">${T('cMcap')}</th><th class="r">${T('cPer')}</th><th class="r">${T('cPbr')}</th><th class="r">${T('c1m')}</th><th class="r">${T('cYtd')}</th><th class="r">${T('c52')}</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }).join('');
}

let lastFocus=null,openName=null;
function openCo(n){
  const c=CO[n];if(!c)return;openName=n;
  lastFocus=document.activeElement;
  $('#dName').textContent=nm(n);
  $('#dEn').textContent=lang==='en'?(c.l&&c.l!==c.e?c.l:''):[c.e,c.l&&c.l!==c.e?c.l:''].filter(Boolean).join(' · ');
  $('#dMeta').innerHTML=`<span class="pill">${c.c?codeHtml(n):T('unlisted')}</span>`+(c.m&&c.m!=='비상장'?`<span class="pill">${c.m}</span>`:'')+
    typesOf(n).map(t=>`<span class="pill t-${t}">${TYPES[t][lang]}</span>`).join('')+
    where[n].map(w=>`<span class="pill">${T(w.col.st)} · ${esc(lang==='en'?w.col.en:w.col.ko)}</span>`).join('');
  const peers=where[n].map(w=>`<div class="pl">${esc(lang==='en'?w.col.en:w.col.ko)}</div>`+MEMBERS[w.col.id].filter(([p])=>p!==n).map(([p])=>`<button class="chip" data-co="${esc(p)}">${esc(nm(p))}</button>`).join('')).join('');
  const links=c.c?CFG.links(c,n,T,esc):'';
  const cu=L(c,'cu');
  const x=X(n),pt=peerTable(n);
  $('#dBody').innerHTML=`<p class="one">${esc(L(c,'s'))}</p>
    ${x?`<h5>${T('xT')}</h5><div class="xrow">${xBadge(n)}<span>${esc(L(x,'xn'))}</span></div>`:''}
    ${metricsHtml(n)}
    <h5>${T('biz')}</h5><ul>${L(c,'b').map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    <h5>${T('pt')}</h5><ul>${L(c,'p').map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    ${x?`<h5>${T('rT')}</h5><ul>${L(x,'r').map(v=>`<li>${esc(v)}</li>`).join('')}</ul><h5>${T('evT')}</h5><ul>${L(x,'ev').map(v=>`<li>${esc(v)}</li>`).join('')}</ul>`:''}
    ${cu?`<h5>${T('cu')}</h5><p style="margin:0">${esc(cu)}</p>`:''}
    ${c.tg.length?`<h5>${T('tg')}</h5><div>${c.tg.map(t=>`<button class="chip" data-tagjump="${t}">${TAGS[t][lang]}</button>`).join(' ')}</div>`:''}
    ${pt?`<h5>${T('ptT')}</h5>${pt}`:''}
    <h5>${T('peers')}</h5><div class="peers">${peers}</div>
    <div class="links">${links}</div>
    ${c.c&&!c.v?`<p class="warn">† ${esc(T('unv'))}</p>`:''}
    <p class="warn">${esc(T('warn'))}</p>`;
  $('#drawer').classList.add('on');$('#drawer').setAttribute('aria-hidden','false');$('#scrim').classList.add('on');
  $('#drawer').scrollTop=0;$('#dClose').focus();
}
function closeCo(){openName=null;$('#drawer').classList.remove('on');$('#drawer').setAttribute('aria-hidden','true');$('#scrim').classList.remove('on');if(lastFocus)lastFocus.focus();}

document.addEventListener('click',e=>{
  const t=e.target.closest('button,tr[data-co],th[data-sort]');if(!t)return;
  if(t.dataset.lang){lang=t.dataset.lang;try{localStorage.setItem(CFG.lsKey,lang)}catch(_){}
    renderStatic();render();if(openName)openCo(openName);return;}
  if(t.dataset.co){openCo(t.dataset.co);return;}
  if(t.dataset.tagjump){st.tags=new Set([t.dataset.tagjump]);closeCo();render();$('#toolbar').scrollIntoView({behavior:'smooth'});return;}
  if(t.dataset.view){st.view=t.dataset.view;render();return;}
  if(t.dataset.stage){st.stage=t.dataset.stage;st.col=null;render();return;}
  if(t.dataset.type){st.types.has(t.dataset.type)?st.types.delete(t.dataset.type):st.types.add(t.dataset.type);render();return;}
  if(t.dataset.tag){st.tags.has(t.dataset.tag)?st.tags.delete(t.dataset.tag):st.tags.add(t.dataset.tag);render();return;}
  if(t.dataset.col){st.col=st.col===t.dataset.col?null:t.dataset.col;render();return;}
  if(t.dataset.sort){const k=t.dataset.sort;st.sort=st.sort.k===k?{k,dir:-st.sort.dir}:{k,dir:NUMK.has(k)?-1:1};renderTable();return;}
  if(t.id==='reset'){st.q='';$('#q').value='';st.stage='all';st.types.clear();st.tags.clear();st.col=null;render();return;}
  if(t.id==='dClose'){closeCo();return;}
});
// 공정 해설 카드 제목 → 그 공정만 걸러 맵으로
document.addEventListener('click',e=>{const h=e.target.closest('.card h4');if(!h)return;const id=h.parentElement.id.slice(2);st.col=id;st.view='map';render();$('#toolbar').scrollIntoView({behavior:'smooth'});});
$('#scrim').addEventListener('click',closeCo);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&openName)closeCo();if(e.key==='Enter'&&e.target.matches('tr[data-co]'))openCo(e.target.dataset.co);});
$('#q').addEventListener('input',e=>{st.q=e.target.value.trim();render();});

renderStatic();render();
})();
</script>
</body>
</html>

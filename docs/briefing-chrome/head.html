/* ============ base ============ */

/* ============ shell / sidenav ============ */
.shell{display:block}
@media (min-width:1080px){

/* 오른쪽 상세 패널은 걷어냈다. 상세는 어느 화면에서나 제자리에서 펼쳐진다 —
   화면 폭에 따라 같은 클릭이 다르게 동작하면 읽는 사람이 두 가지를 배워야 하고,
   패널 자리를 만드느라 1400~1620px 구간에서 표의 설명 열까지 접혀 있었다.
   넓은 화면에서는 본문 칸만 조금 넓힌다. */
@media (min-width:1400px){ .page.wide{max-width:1320px} }
.detail-title{display:none}

/* ============ topbar / hero ============ */
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:19px;padding-top:24px}
.chip{display:inline-block;font-size:14px;letter-spacing:.6px;font-weight:500;color:var(--muted);
  border:1px solid var(--hairline);padding:4px 10px;border-radius:2px}
.topbar-actions{display:flex;align-items:center;gap:10px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.lang-toggle{display:inline-flex;border:1px solid var(--hairline);border-radius:2px;overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.06);flex:none;background:var(--card)}
.lang-toggle button{font-family:var(--font-en);font-size:14px;font-weight:500;letter-spacing:.5px;
  padding:10px 17px;border:0;background:var(--card);color:var(--muted);cursor:pointer;line-height:1}
.lang-toggle button + button{border-left:1px solid var(--hairline)}
.lang-toggle button:hover:not([aria-checked="true"]){background:var(--surface-subtle);color:var(--ink)}
.lang-toggle button[aria-checked="true"]{background:var(--primary);color:var(--on-primary)}
.lang-toggle button:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
.expand-all,.print-btn{font-family:var(--font-kr);font-size:14px;font-weight:500;letter-spacing:.3px;
  padding:9px 15px;border-radius:2px;cursor:pointer;white-space:nowrap;line-height:1.2}
html[lang="en"] .expand-all,html[lang="en"] .print-btn{font-family:var(--font-en)}
.expand-all{border:1px solid var(--hairline);background:var(--card);color:var(--muted)}
.expand-all:hover{background:var(--surface-subtle);color:var(--ink)}
.expand-all:focus-visible,.print-btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.print-btn{border:1px solid var(--primary);background:var(--primary);color:var(--on-primary)}
.print-btn:hover{background:var(--primary-active);border-color:var(--primary-active)}
.print-btn.alt{background:var(--card);color:var(--primary-active)}
.print-btn.alt:hover{background:var(--surface-subtle);border-color:var(--primary-active)}
.expand-all .lbl-collapse{display:none}
.expand-all[aria-pressed="true"] .lbl-expand{display:none}
.expand-all[aria-pressed="true"] .lbl-collapse{display:inline}
@media (max-width:680px){ .topbar{flex-wrap:wrap} .topbar-actions{width:100%;row-gap:10px} }

.hero{margin-top:28px;padding-bottom:var(--space-block);border-bottom:1px solid var(--hairline-soft)}
.hero-kicker{font-size:16px;font-weight:500;letter-spacing:.6px;color:var(--primary-active);margin:0 0 14px}
.hero h1{font-size:46px;font-weight:700;line-height:1.16;letter-spacing:-.5px;color:var(--ink);

.hero-lede{font-size:21px;line-height:1.6;color:var(--body);margin:0;max-width:62em}
.hero-meta{margin-top:19px;font-size:14px;letter-spacing:.2px;color:var(--muted-soft)}
@media (max-width:768px){ .hero h1{font-size:31px} .hero-lede{font-size:19px} }
.tone{display:inline-block;font-size:14px;font-weight:500;letter-spacing:.4px;padding:4px 10px;

.tone.risk-off{background:var(--up)} .tone.risk-on{background:var(--success)}
.tone.mixed{background:var(--warning);color:#2A2000}
:root[data-theme="dark"] .tone.risk-off,:root[data-theme="dark"] .tone.risk-on{color:#12151A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tone.risk-off,
  :root:not([data-theme="light"]) .tone.risk-on{color:#12151A}}

/* ============ sections ============ */
.section{margin-top:var(--space-section)}

.sec-num{font-family:var(--font-num);font-size:14px;font-weight:600;letter-spacing:1.2px;
  color:var(--primary);display:block;margin-bottom:4px}
.section-title{font-size:26px;font-weight:700;color:var(--ink);margin:0 0 var(--space-content)}
@media (max-width:768px){ .section-title{font-size:22px} }
.section h3{font-size:22px;font-weight:600;color:var(--ink);margin:var(--space-block) 0 var(--space-tight)}
@media (max-width:768px){ .section h3{font-size:19px} }
.section h3:first-of-type{margin-top:0}
.section p{margin:0 0 var(--space-content);max-width:62em}
.lede{font-size:19px;color:var(--ink);font-weight:500;line-height:1.6}
.sub{font-size:17px;line-height:1.55;color:var(--muted)}

.section ul.plain{margin:0 0 var(--space-content);padding-left:22px}
.section ul.plain li{margin-bottom:10px}

/* ============ keypoints ============ */
.keypoints{list-style:none;margin:0;padding:0;counter-reset:kp}
.keypoints > li{counter-increment:kp;position:relative;padding:19px 0 19px 52px;
  border-bottom:1px solid var(--hairline-soft)}
.keypoints > li:first-child{border-top:1px solid var(--hairline-soft)}
.keypoints > li::before{content:counter(kp,decimal-leading-zero);position:absolute;left:0;top:21px;
  font-family:var(--font-num);font-size:16px;font-weight:700;color:var(--primary);letter-spacing:.6px}

/* ============ stat cards ============ */
.stat-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;
  background:var(--card);border:1px solid var(--hairline)}
@media (max-width:1279px){ .stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:560px){ .stat-grid{grid-template-columns:minmax(0,1fr)} }
.stat{background:var(--card);padding:22px 20px;box-shadow:0 0 0 1px var(--hairline-soft)}
@media (max-width:1279px){ .stat-grid > .stat:nth-child(5):last-child{grid-column:1/-1} }
.stat-grid.six{grid-template-columns:repeat(3,minmax(0,1fr))}
.stat-grid.eight{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1279px){ .stat-grid.eight{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:560px){ .stat-grid.eight{grid-template-columns:minmax(0,1fr)} }
@media (max-width:1023px){ .stat-grid.six{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:560px){ .stat-grid.six{grid-template-columns:minmax(0,1fr)} }
.stat-label{font-size:15px;font-weight:500;letter-spacing:.6px;line-height:1.2;color:var(--muted);margin:0 0 10px}
.stat-value{font-family:var(--font-num);font-size:31px;font-weight:700;line-height:1;letter-spacing:-.6px;color:var(--ink)}
.stat-value.sm{font-size:22px;letter-spacing:-.2px}
.stat-chg{font-size:14px;line-height:1.4;margin-top:10px;font-family:var(--font-num)}
.stat-chg.up{color:var(--up)} .stat-chg.down{color:var(--down)} .stat-chg.flat{color:var(--muted-soft)}
.stat-note{font-size:13px;line-height:1.4;color:var(--muted-soft);margin-top:8px;font-family:var(--font-kr)}
.stat-note .down{color:var(--down)} .stat-note .up{color:var(--up)}
html[lang="en"] .stat-note{font-family:var(--font-en)}

/* ============ tables ============ */
.table-wrap{overflow-x:auto;border:1px solid var(--hairline);margin:0 0 var(--space-content);-webkit-overflow-scrolling:touch}
table.data{width:100%;border-collapse:collapse;font-size:16px;min-width:560px}
table.data caption{caption-side:top;text-align:left;font-size:14px;color:var(--muted-soft);padding:0 0 10px}
table.data th,table.data td{padding:11px 13px;border-bottom:1px solid var(--hairline-soft);text-align:left;vertical-align:top;line-height:1.5}
table.data.compact th,table.data.compact td{padding:8px 11px}
table.data thead th{background:var(--primary-soft);color:var(--ink);font-size:15px;font-weight:700;white-space:nowrap}
table.data tbody tr:hover{background:var(--surface-subtle)}
table.data tbody th{font-weight:600;color:var(--ink);white-space:nowrap}
table.data td.n,table.data th.n{text-align:right;font-family:var(--font-num);white-space:nowrap}
table.data td.tick,table.data th.tick{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:.3px;color:var(--muted);white-space:nowrap}
table.data td.wh,table.data th.wh{white-space:nowrap;color:var(--muted);font-size:14px}
table.data td.up,table.data .up{color:var(--up)} table.data td.down,table.data .down{color:var(--down)}
table.data .na{color:var(--muted-soft)}
table.data tr.hl > td,table.data tr.hl > th{background:var(--hl-row)}
table.data tr.hl:hover > td,table.data tr.hl:hover > th{background:var(--hl-row)}
table.data tr.base > td,table.data tr.base > th{background:var(--surface-subtle);
  border-bottom:2px solid var(--hairline)}
table.data tr.base > *:first-child{box-shadow:inset 3px 0 0 var(--secondary)}
table.data tr.sum > td,table.data tr.sum > th{background:var(--surface-subtle);
  border-top:2px solid var(--hairline);font-weight:600}
table.data tr.sum > *:first-child{box-shadow:inset 3px 0 0 var(--primary)}
table.data.compact{min-width:420px;font-size:15px}
/* 좁은 화면: 표를 화면 안에 넣는다. min-width 를 두면 등락률 열이 잘린다 */
@media (max-width:680px){
  table.data,table.data.compact{min-width:0;font-size:14px}
  table.data th,table.data td,
  table.data.compact th,table.data.compact td{padding:7px 8px}
  table.data thead th,table.data tbody th{white-space:normal;word-break:keep-all;overflow-wrap:anywhere}
  table.data td{overflow-wrap:anywhere}
  /* 숫자는 공백에서만 접는다. 값 한가운데가 끊기면 읽을 수 없다 */
  table.data td.n,table.data th.n{white-space:normal;overflow-wrap:normal;word-break:keep-all}
  table.data thead th{font-size:13px}
  /* 좁은 화면에서 뺄 수 있는 보조 열 */
  table.data .opt{display:none}
  /* 기본 .vf 정의가 뒤쪽에 있어 같은 우선순위로는 진다 */
  table.data .vf{font-size:10px;padding:1px 5px;letter-spacing:.2px;white-space:normal;overflow-wrap:normal;word-break:keep-all}
}
@media (max-width:400px){
  table.data,table.data.compact{font-size:13px}
  table.data th,table.data td,
  table.data.compact th,table.data.compact td{padding:6px 6px}
}
table.data th.note{min-width:190px}
table.data td.sparkcell{width:132px;color:var(--primary);line-height:0}
.spark{display:block;overflow:visible}
@media (max-width:680px){table.data .sparkcell{display:none}}
table.data td.note{font-size:14px;line-height:1.45;color:var(--muted);white-space:normal;min-width:190px;max-width:340px}
@media (max-width:680px){table.data .note{display:none}}

/* 긴 경로·파일명이 좁은 화면을 넘지 않게 한다 */
code{overflow-wrap:anywhere;word-break:break-word}

/* 증권사 인용 칸은 이 표의 본론이다. 넓게 잡는다. */
table.data td.say{min-width:300px;line-height:1.55}
@media (max-width:560px){ table.data td.say{min-width:0} }
table.data td.say a{white-space:nowrap}

/* 등락 사유 — 회사 한 줄 설명과 같은 칸에 있지만 성격이 다르다.
   설명은 바뀌지 않는 것, 사유는 그날의 것이다. */
table.data .why{display:block;margin-top:4px;padding-left:9px;color:var(--body);
  border-left:2px solid var(--primary);line-height:1.45}
table.data .why .vf{margin-left:4px}

/* 기간 수익률 열(.perf) 과 설명 열(.note) 은 함께 설 자리가 없다.
   본문 칸은 아무리 넓어도 ~1000px 이다. 그래서 둘 중 하나만 세운다.
     1620px 위   설명 + 기간 수익률
     860~1620px  설명을 접고 숫자를 남긴다 (숫자가 표의 본론이다)
     860px 아래  기간 수익률도 접는다 */
table.data .perf{padding-left:8px;padding-right:8px}
@media (max-width:860px){ table.data .perf{display:none} }
table.data.compact .perf{padding-left:5px;padding-right:5px}

/* ============ verification flags ============ */
.vf{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.4px;padding:2px 7px;
  border-radius:2px;border:1px solid var(--hairline);color:var(--muted);background:var(--card);
  white-space:nowrap;font-family:var(--font-en);vertical-align:1px}
.vf.ok{border-color:var(--success);color:var(--vf-ok-fg);background:var(--vf-ok-bg)}
.vf.solo{border-color:var(--warning);color:var(--vf-warn-fg);background:var(--vf-warn-bg)}
.vf.bad{border-color:var(--up);color:var(--vf-bad-fg);background:var(--vf-bad-bg)}
.vf.none{border-color:var(--hairline);color:var(--muted-soft);background:var(--surface-subtle)}
.vf.new{border-color:var(--primary);color:var(--primary-active);background:var(--vf-warn-bg)}

/* ============ bars ============ */
.bars{display:grid;gap:10px;margin:0 0 var(--space-content)}
.bar-row{display:grid;grid-template-columns:minmax(96px,168px) 1fr 74px;align-items:center;gap:14px;font-size:16px}
.bar-name{color:var(--body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{position:relative;height:20px;background:var(--surface-subtle);border:1px solid var(--hairline-soft)}
.bar-track .zero{position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--hairline)}
.bar-fill{position:absolute;top:3px;bottom:3px}
.bar-fill.up{background:var(--up);left:50%}
.bar-fill.down{background:var(--down)}
.bar-val{text-align:right;font-family:var(--font-num);font-size:16px}
.bar-val.up{color:var(--up)} .bar-val.down{color:var(--down)} .bar-val.flat{color:var(--muted-soft)}

/* ============ house views ============ */
.views{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;
  background:var(--card);border:1px solid var(--hairline);margin-bottom:var(--space-content)}
@media (max-width:1023px){ .views{grid-template-columns:minmax(0,1fr)} }
.view{background:var(--card);padding:22px 20px;box-shadow:0 0 0 1px var(--hairline-soft)}
.view-firm{font-size:16px;font-weight:700;letter-spacing:.3px;color:var(--primary-active);margin:0 0 4px}
.view-who{font-size:14px;color:var(--muted-soft);margin:0 0 12px}
.view-who.num{font-size:15px;color:var(--ink);letter-spacing:-.1px}
.view-body{font-size:16px;line-height:1.55;margin:0;color:var(--body)}
.view-stance{display:inline-block;margin-top:12px;font-size:13px;font-weight:500;letter-spacing:.4px;
  padding:3px 9px;border-radius:2px;border:1px solid var(--hairline);color:var(--muted)}
.view-stance.bull{border-color:var(--up);color:var(--up)}
.view-stance.bear{border-color:var(--down);color:var(--down)}
.view-stance.neutral{border-color:var(--muted-soft);color:var(--muted)}

/* ============ callouts ============ */
.callout{background:var(--callout-bg);color:var(--callout-fg);border-radius:4px;padding:34px;margin:0 0 var(--space-content)}
.callout h3{color:var(--callout-fg);margin:0 0 14px;font-size:22px;font-weight:700}
.callout p,.callout li{color:var(--callout-fg)}
.callout p{font-size:17px;line-height:1.6;max-width:none}
.callout p:last-child{margin-bottom:0}
.callout ul{margin:0;padding-left:22px}
.callout li{margin-bottom:10px;font-size:17px;line-height:1.55}
.callout li:last-child{margin-bottom:0}
.callout a{color:var(--callout-fg);border-bottom-color:var(--callout-rule)}
.callout a:hover{color:var(--callout-fg);border-bottom-color:var(--callout-fg)}
.soft-card{background:var(--surface-soft);border-radius:4px;padding:24px 26px;margin:0 0 var(--space-content)}
.soft-card h4{margin:0 0 10px;font-size:19px;font-weight:700;color:var(--ink)}
.soft-card p:last-child,.soft-card ul:last-child{margin-bottom:0}
.soft-card.warn{background:var(--vf-warn-bg);border-left:3px solid var(--warning)}

/* ============ risks / qa ============ */
.risks{list-style:none;margin:0;padding:0}
.risks > li{padding:14px 0 14px 22px;border-bottom:1px solid var(--hairline-soft);position:relative;
  font-size:17px;line-height:1.55}
.risks > li::before{content:"";position:absolute;left:0;top:24px;width:10px;height:1px;background:var(--primary)}
.qa{margin:0}
.qa .exp{border-bottom:1px solid var(--hairline-soft);padding:19px 0}
.qa .exp:first-child{border-top:1px solid var(--hairline-soft)}
.qa .exp > summary{font-size:19px;font-weight:700;color:var(--ink)}
.qa .exp > summary .exp-mark{top:2px}
.disc{font-size:14px;color:var(--muted-soft);margin-top:14px;padding-top:10px;
  border-top:1px solid var(--hairline-soft);line-height:1.5}

/* ============ sources / footer ============ */
.sources{list-style:none;margin:0;padding:0;font-size:14px;line-height:1.5;columns:2;column-gap:38px}
@media (max-width:768px){ .sources{columns:1} }
.sources li{margin-bottom:10px;break-inside:avoid}
.sources .pub{color:var(--muted-soft)}
footer.foot{margin-top:var(--space-section);padding:28px 0 56px;border-top:1px solid var(--primary);
  font-size:14px;color:var(--muted-soft)}
footer.foot p{margin:0 0 8px;max-width:none}

/* ============ drilldown ============ */
.exp > summary{cursor:pointer;list-style:none;display:block;position:relative;padding-right:34px}
.exp > summary::-webkit-details-marker{display:none}
.exp > summary::marker{content:""}
.exp > summary:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
.exp-mark{position:absolute;right:0;top:0;width:22px;height:22px;flex:none;
  border:1px solid var(--hairline);border-radius:2px;background:var(--card);
  font-family:var(--font-num);font-size:15px;font-weight:700;line-height:20px;text-align:center;color:var(--primary-active)}
.exp > summary:hover .exp-mark{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.exp[open] > summary .exp-mark::after{content:"\2212"}
.exp:not([open]) > summary .exp-mark::after{content:"+"}
.detail{margin-top:19px;padding:19px 22px;background:var(--surface-subtle);
  border-left:2px solid var(--primary);border-radius:0 2px 2px 0}
.detail > p{font-size:16px;line-height:1.6;margin:0 0 14px;max-width:62em}
.detail > p:last-child{margin-bottom:0}
.detail dl{margin:0 0 14px}
.detail dl:last-child{margin-bottom:0}
.detail dt{font-size:13px;font-weight:500;letter-spacing:.4px;color:var(--muted);margin-top:12px}
.detail dt:first-child{margin-top:0}
.detail dd{margin:2px 0 0;font-size:16px;line-height:1.5;color:var(--ink)}
.detail dd.n{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:0}
.detail-links{margin:14px 0 0;padding:0;list-style:none;font-size:14px;line-height:1.5}
.detail-links li{margin-bottom:6px}
.detail-links li::before{content:"\2192";color:var(--primary);margin-right:8px}
.detail-label{display:block;font-size:13px;font-weight:500;letter-spacing:.5px;color:var(--primary-active);margin-bottom:10px}
.keypoints > li > .exp > summary,.risks > li > .exp > summary{padding-right:34px}
details.stat > summary,details.view > summary{padding-right:34px}
details.stat > summary .exp-mark,details.view > summary .exp-mark{top:-2px}
table.data tr.clickable{cursor:pointer}
table.data tr.clickable > *:first-child{padding-left:34px;position:relative}
table.data tr.clickable > *:first-child::before{content:"+";position:absolute;left:13px;top:11px;
  font-family:var(--font-num);font-size:15px;font-weight:700;color:var(--primary-active)}
table.data tr.clickable[aria-expanded="true"] > *:first-child::before{content:"\2212"}
table.data tr.clickable:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
table.data tr.detail-row > td{background:var(--surface-subtle);padding:0}
table.data tr.detail-row:hover > td{background:var(--surface-subtle)}
table.data tr.detail-row .detail{margin:0;border-radius:0}
table.data tr.detail-row[hidden]{display:none}

/* ============ i18n ============ */
[data-lang-en]{display:none}
html[lang="en"] [data-lang-ko]{display:none}
html[lang="en"] [data-lang-en]{display:revert}

@media (prefers-reduced-motion:reduce){ *{scroll-behavior:auto!important} }

    --vf-warn-bg:#FCF7E8;--vf-warn-fg:#8A6A0D;--vf-ok-bg:#F0F7F1;--vf-ok-fg:#1F5C2C;

  .detail dt,.detail dd{margin:0!important;font-size:9.5pt}
  .detail{padding:10px 12px;margin-top:10px;background:#FFF;border-left:2px solid #999;break-inside:avoid}

  body{font-size:11pt;line-height:1.4;color:#000;background:#FFF}

  .section{margin-top:28px}
  .hero h1{font-size:24pt} .hero-lede{font-size:12pt} .section-title{font-size:15pt}
  .stat-grid,.views{break-inside:avoid;grid-template-columns:repeat(3,minmax(0,1fr))}
  .section-rule,.section-title,h3{break-after:avoid}
  table,.stat,.view,.callout,.soft-card{break-inside:avoid}

}
/* 인쇄: 설명은 접고 기간 수익률은 세운다 — 종이 폭이 ~700px 이다 */
@media print{
  table.data .perf{display:table-cell!important;padding-left:5px;padding-right:5px}
  table.data{font-size:8pt}
}

/* 설명은 「접히는 열」이 아니라 이름 아래 붙는 줄이다. 열로 두면 좁은 화면과
   인쇄에서 통째로 사라진다 — 8월 15일 판에서 실제로 그렇게 사라졌다. */
table.data .sub{display:block;margin-top:3px;font-size:13px;font-weight:400;
  line-height:1.45;color:var(--muted);white-space:normal;word-break:keep-all;
  overflow-wrap:anywhere;max-width:330px}
@media (min-width:521px){ table.data tbody th.hasnote{min-width:150px} }
@media (max-width:520px){ table.data .sub{font-size:12px;max-width:180px} }
@media (max-width:400px){ table.data .sub{max-width:150px} }
/* 340px 은 아직 쓰이는 폭이다(갤럭시 폴드 접은 화면). 여기서는 여백을 더 줄인다. */
/* 껍데기의 `table.data.compact th{padding:6px}` 가 클래스 두 개라 더 세다.
   compact 도 같이 적어야 이긴다. */
@media (max-width:360px){ table.data th,table.data td,
  table.data.compact th,table.data.compact td{padding-left:4px;padding-right:4px}
  table.data .sub{max-width:120px} }
@media print{ table.data .sub{display:block!important;font-size:7.5pt;max-width:none} }

/* 기간 수익률은 860px 아래에서 열이 접힌다. 접힌 자리를 이름 밑의 줄이 받는다
   — 폰에서 기간 추이가 통째로 사라지면 안 된다. 열과 줄 중 한 벌만 보인다. */
table.data .perfline{display:none}
@media (max-width:860px){
  table.data .perfline{display:block;margin-top:4px;font-size:12px;font-weight:400;
    line-height:1.5;color:var(--muted);white-space:normal;word-break:keep-all;
    overflow-wrap:anywhere;max-width:330px}
  /* 이름과 값이 줄바꿈으로 갈라지면 「1개월」과 「-5.1%」가 다른 줄에 놓인다.
     한 쌍은 붙여 두고 쌍과 쌍 사이에서만 넘긴다. */
  table.data .perfline .p{white-space:nowrap}
  table.data .perfline .k{opacity:.72;margin-right:1px}
  table.data .perfline .up{color:var(--up)}
  table.data .perfline .down{color:var(--down)}
  table.data .perfline .na{opacity:.45}
  table.data .perfline i{font-style:normal;opacity:.35;padding:0 4px}
}
@media (max-width:520px){ table.data .perfline{font-size:11px;max-width:180px} }
@media (max-width:400px){ table.data .perfline{max-width:150px} }
@media (max-width:360px){ table.data .perfline{max-width:120px} }
/* 인쇄는 종이 폭이 ~700px 이지만 기간 열을 세워 두었다. 줄은 접는다. */
@media print{ table.data .perfline{display:none!important} }

/* 인쇄: 긴 블록을 통째로 붙들면 앞 쪽에 큰 빈칸이 남는다. 쪽을 넘겨 잇되
   줄은 쪼개지 않고 머리행을 되풀이한다. 짧은 것만 종전대로 붙든다. */
@media print{
  table.data{break-inside:auto!important}
  table.data thead{display:table-header-group}
  table.data tr{break-inside:avoid;break-after:auto}
  table.data caption{break-after:avoid}
  table.data.keep{break-inside:avoid!important}
  .soft-card,.callout,.exp{break-inside:auto!important}
  .soft-card.keep,.callout.keep{break-inside:avoid!important}
  .stat,.view{break-inside:avoid}
  p,li,dd{orphans:3;widows:3}
  /* 제목만 남고 내용이 다음 쪽으로 넘어가는 것을 막는다. 절 번호도 포함한다
     — 빼면 「01」 한 글자만 앞 쪽에 남는다. 실제로 그렇게 나왔다. */
  h3,h4,.section-title,.section-rule,.sec-num{break-after:avoid}
  /* 그리드는 쪽을 넘기면 **빈 칸 자리를 남긴다** — 크로미움이 다음 쪽으로 간
     칸의 자리를 앞 쪽에 그대로 잡아 둔다. 표와 달리 쪼개면 더 나빠진다.
     대신 인쇄에서 열을 늘려 낮게 만들어 통째로 들어가게 한다. */
  .stat-grid{break-inside:avoid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important}
  /* 글이 긴 카드(하우스 시각·지역별 요약)는 인쇄에서 열로 세우면 칸이 좁아
     세로로 길어지고, 한 줄이 통째로 다음 쪽에 밀린다. 종이에서는 한 칸씩
     가로로 눕히는 편이 짧고 잘 흐른다. */
  .views{display:block!important}
  .views > *{margin-bottom:9px;break-inside:avoid}
  .views > *:last-child{margin-bottom:0}
  /* 글이 긴 카드는 통째로 붙들면 앞 쪽이 절반 비어 버린다 — 8/18 판 28쪽이
     하우스 시각 카드 하나 때문에 47.6% 비었다. 쪽을 넘겨 잇게 둔다.
     **`.views` 자체에 avoid 를 걸어 두면 안 된다** — 그 한 줄이 아래 규칙을
     전부 덮어 실제로 47.6% 가 그대로 남았다. 블록으로 눕혔으니 붙들 이유도 없다. */
  .views{break-inside:auto!important}
  .views > .view{break-inside:auto}
  .views > .view > h4{break-after:avoid}
  /* 숫자 카드는 짧으므로 격자를 유지한다. 한 줄에 들어가면 쪽을 넘겨도 안전하다. */
  .stat-grid.flow{break-inside:auto!important}
  /* 꼬리말 세 줄만 마지막 쪽에 남는 것을 막는다 */
  footer.foot{break-before:avoid;break-inside:avoid}
  /* 여백을 조금씩 줄인다 — 쪽 머리에 남는 여백은 그대로 빈칸이고, 첫 쪽에서는
     52px 이 모자라 첫 절의 지표 카드가 통째로 2쪽으로 밀려나 있었다. */
  .section{margin-top:16px}
  .section-title{margin-bottom:10px}
  .hero{margin-top:6px;padding-bottom:8px}
  .hero h1{margin-bottom:10px}
}

@media (min-width:861px) and (max-width:1199px){

  table.data .perfline .p{white-space:nowrap}
  table.data .perfline .k{opacity:.72;margin-right:1px}
  table.data .perfline .up{color:var(--up)}

/* 340px 에서 추이 표가 2px 넘쳤다 — 열이 여덟이라 여백을 한 치수 더 줄인다. */
@media (max-width:360px){
  table.data.compact th,table.data.compact td{padding-left:3px;padding-right:3px;font-size:11px}
}
